          <article class="doc-page">
            <header class="doc-hero">

              <h1>Slider <code>st-slider</code></h1>
              <p class="doc-lead">滑块：内部透明原生 range 承载拖拽与键盘。min / max / step 转发原生属性，value 是运行时状态（el.value 读写，初始值用 default-value），input 拖动中实时派发、change 松手时派发。</p>
              <div class="doc-links">
                <a href="../index.html">组件目录</a>
                <a href="https://github.com/ofajs/senti-ui/blob/main/packages/slider/README.md" target="_blank" rel="noreferrer">GitHub README <iconify-icon icon="mdi:open-in-new"></iconify-icon></a>
              </div>
            </header>

            <section class="doc-section">
              <h2>基础用法与实时回显</h2>
              <p class="doc-section-lead">默认范围 0–100、步进 1。初始值写 default-value，用户拖动时在 on:input 里把最新值写回页面 data；数值气泡会在拖动或聚焦时出现在拇指上方。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>default-value + on:input</code></div>
                <div class="demo-stage block">
                  <st-slider default-value="64" on:input="onVolume"></st-slider>
                  <st-slider default-value="40"></st-slider>
                  <span class="demo-note">受控滑块 volume = {{volume}} · 第二个滑块只给初始值，不绑定状态</span>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码</summary>
                <pre><code>&lt;st-slider default-value="64" on:input="onVolume"&gt;&lt;/st-slider&gt;
&lt;span&gt;volume = {{volume}}&lt;/span&gt;

&lt;script&gt;
  export default async () =&gt; ({
    data: { volume: "64" },
    proto: {
      onVolume(e) {
        this.volume = e.target.value;
      },
    },
  });
&lt;/script&gt;</code></pre>
              </details>
            </section>

            <section class="doc-section">
              <h2>min / max / step</h2>
              <p class="doc-section-lead">三个属性原样转发给内部 input[type=range]，可传小数步进。初始值仍用 default-value；范围不一致时记得让初始值落在区间内。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>min / max / step</code></div>
                <div class="demo-stage block">
                  <st-slider min="0" max="10" step="2" default-value="4" on:input="onTemp"></st-slider>
                  <st-slider min="50" max="150" step="10" default-value="80" on:input="onPrice"></st-slider>
                  <st-slider min="0" max="1" step="0.05" default-value="0.5" on:input="onOpacity"></st-slider>
                  <span class="demo-note">温度 {{temp}}（0–10，步进 2）· 价格 ¥{{price}}（50–150，步进 10）· 透明度 {{opacity}}（0–1，步进 0.05）</span>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码</summary>
                <pre><code>&lt;st-slider min="0" max="10" step="2" default-value="4" on:input="onTemp"&gt;&lt;/st-slider&gt;
&lt;st-slider min="50" max="150" step="10" default-value="80" on:input="onPrice"&gt;&lt;/st-slider&gt;
&lt;st-slider min="0" max="1" step="0.05" default-value="0.5" on:input="onOpacity"&gt;&lt;/st-slider&gt;

&lt;script&gt;
  export default async () =&gt; ({
    data: { temp: "4", price: "80", opacity: "0.5" },
    proto: {
      onTemp(e) { this.temp = e.target.value; },
      onPrice(e) { this.price = e.target.value; },
      onOpacity(e) { this.opacity = e.target.value; },
    },
  });
&lt;/script&gt;</code></pre>
              </details>
            </section>

            <section class="doc-section">
              <h2>原生 form（name / reset）</h2>
              <p class="doc-section-lead">st-slider 通过内部不可见的原生 range 代理参与原生表单：name 决定 FormData 字段名，提交时取当前 value，reset 回到 default-value（缺省时回到 min）。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>name / FormData / reset</code></div>
                <div class="demo-stage block">
                  <form on:submit="onSliderForm">
                    <st-slider name="volume" default-value="40"></st-slider>
                    <div style="display: flex; gap: 8px; margin-top: 12px;">
                      <st-button type="submit">提交</st-button>
                      <st-button variant="text" type="reset">重置</st-button>
                    </div>
                  </form>
                  <span class="demo-note">FormData volume：{{formVolume}}</span>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码</summary>
                <pre><code>&lt;form on:submit="onSliderForm"&gt;
  &lt;st-slider name="volume" default-value="40"&gt;&lt;/st-slider&gt;
  &lt;st-button type="submit"&gt;提交&lt;/st-button&gt;
  &lt;st-button variant="text" type="reset"&gt;重置&lt;/st-button&gt;
&lt;/form&gt;

onSliderForm(e) {
  e.preventDefault();
  this.formVolume = new FormData(e.target).get("volume");
}</code></pre>
              </details>
            </section>

            <section class="doc-section">
              <h2>input 与 change 的区别</h2>
              <p class="doc-section-lead">拖动过程中每个变化都派发 input（适合实时预览），松手或键盘提交时派发一次 change（适合提交表单、触发表单校验）。两者都是 bubbles + composed。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>on:input / on:change</code></div>
                <div class="demo-stage">
                  <st-slider default-value="50" on:input="onDrag" on:change="onDragDone"></st-slider>
                  <span class="demo-note">拖动中的值 {{dragValue}} · 最近一次提交 {{commitValue}}（松手 / 键盘提交时更新）</span>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码（实时预览 + 提交）</summary>
                <pre><code>&lt;st-slider default-value="50" on:input="preview" on:change="commit"&gt;&lt;/st-slider&gt;

&lt;script&gt;
  export default async () =&gt; ({
    data: { value: "50" },
    proto: {
      preview(e) {
        this.value = e.target.value;   // 拖动中实时更新
      },
      commit(e) {
        console.log("提交", e.target.value); // 松手 / 键盘提交
      },
    },
  });
&lt;/script&gt;</code></pre>
              </details>
            </section>

            <section class="doc-section">
              <h2>color 语义与尺寸</h2>
              <p class="doc-section-lead">color 接受 M3 角色名或 color 工具里的自定义变量名，联动激活轨道、拇指与数值气泡。尺寸类默认值全用 em：改宿主 font-size 全面板等比缩放，也可以直接设 width。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>color / font-size</code></div>
                <div class="demo-stage grid">
                  <div class="demo-cell">
                    <span class="demo-label">error</span>

                  </div>
                  <div class="demo-cell">

                    <st-slider color="success" default-value="70"></st-slider>
                  </div>
                  <div class="demo-cell">
                    <span class="demo-label">tertiary</span>
                    <st-slider color="tertiary" default-value="50"></st-slider>
                  </div>
                  <div class="demo-cell">
                    <span class="demo-label">font-size: 12px</span>
                    <st-slider style="font-size: 12px;" default-value="45"></st-slider>
                  </div>
                </div>
              </div>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>attr:color</code></div>
                <div class="demo-stage">
                  <st-slider attr:color="sliderColor" default-value="60" style="width: 240px;"></st-slider>
                  <st-button variant="outlined" on:click="sliderColor = 'primary'">primary</st-button>
                  <st-button variant="outlined" on:click="sliderColor = 'error'">error</st-button>
                  <st-button variant="outlined" on:click="sliderColor = 'success'">success</st-button>
                  <span class="demo-note">当前 color = {{sliderColor}}</span>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码</summary>
                <pre><code>&lt;st-slider color="error" default-value="30"&gt;&lt;/st-slider&gt;
&lt;st-slider style="font-size: 12px;" default-value="45"&gt;&lt;/st-slider&gt;

&lt;!-- color 是标签属性，可以随数据切换 --&gt;
&lt;st-slider attr:color="sliderColor" default-value="60"&gt;&lt;/st-slider&gt;</code></pre>
              </details>
            </section>

            <section class="doc-section">
              <h2>受控值：el.value 读写</h2>
              <p class="doc-section-lead">value 是运行时状态，不是标签属性：JS 里用 el.value 读或写，页面里用 <code>this.shadow.$("#id")</code> 取到组件实例。初始值仍用 default-value；attr("value") / setAttribute("value") 不会生效。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>el.value</code></div>
                <div class="demo-stage">
                  <st-slider id="doc-level" default-value="30" on:input="onLevel"></st-slider>
                  <div class="row">
                    <st-button variant="outlined" on:click="setLevel(80)">设为 80</st-button>
                    <st-button variant="outlined" on:click="setLevel(20)">设为 20</st-button>
                    <st-button variant="text" on:click="readLevel">读取 value</st-button>
                  </div>
                  <span class="demo-note">level = {{level}} · 读取结果：{{readResult}}</span>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码（程序化写入）</summary>
                <pre><code>&lt;st-slider id="level" default-value="30" on:input="onLevel"&gt;&lt;/st-slider&gt;
&lt;st-button on:click="setLevel(80)"&gt;设为 80&lt;/st-button&gt;

&lt;script&gt;
  export default async () =&gt; ({
    data: { level: "30" },
    proto: {
      onLevel(e) { this.level = e.target.value; },
      setLevel(v) {
        this.shadow.$("#level").value = v; // 运行时状态，不是 attr
        this.level = String(v);
      },
    },
  });
&lt;/script&gt;</code></pre>
              </details>
            </section>

            <section class="doc-section">
              <h2>disabled 与键盘</h2>
              <p class="doc-section-lead">disabled 阻断拖拽与键盘并降到 0.38 透明度。可用时 Tab 聚焦（焦圈画在拇指上）、←/→ 步进、Home/End 跳到两端；键盘操作同样会派发 input 与 change。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>disabled / keyboard</code></div>
                <div class="demo-stage block">
                  <st-slider disabled default-value="65"></st-slider>
                  <st-slider default-value="35"></st-slider>
                  <span class="demo-note">上：disabled；下：Tab 聚焦后按 ←/→ 或 Home/End 试试。</span>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码</summary>
                <pre><code>&lt;st-slider disabled default-value="65"&gt;&lt;/st-slider&gt;
&lt;st-slider default-value="35"&gt;&lt;/st-slider&gt;</code></pre>
              </details>
            </section>

            <div class="doc-cols">
              <div class="doc-block">
                <h3>属性</h3>
                <table class="api">
                  <thead><tr><th>属性</th><th>类型</th><th>默认</th><th>说明</th></tr></thead>
                  <tbody>
                    <tr><td><code>min / max / step</code></td><td>number</td><td>0 / 100 / 1</td><td>取值范围与步进，转发内部原生 range</td></tr>
                    <tr><td><code>default-value</code></td><td>string</td><td>无</td><td>初始值，attached 时读取一次</td></tr>
                    <tr><td><code>color</code></td><td>M3 角色名 / 自定义变量名</td><td>primary</td><td>激活轨道、拇指与数值气泡的角色色</td></tr>
                    <tr><td><code>disabled</code></td><td>boolean</td><td>无</td><td>0.38 透明度、阻断拖拽与键盘</td></tr>
                    <tr><td><code>name</code></td><td>string</td><td>无</td><td>表单字段名，提交到 <code>FormData</code></td></tr>
                    <tr><td><code>form</code></td><td>string</td><td>无</td><td>关联到指定 id 的 form</td></tr>
                    <tr><td><code>required</code></td><td>boolean</td><td>无</td><td>转发给原生 range；range 始终有值，不产生 invalid</td></tr>
                    <tr><td><code>value</code></td><td>运行时状态（ofa data）</td><td>0</td><td><code>el.value</code> 读写；不是标签属性，初始值用 default-value</td></tr>
                  </tbody>
                </table>
              </div>
              <div class="doc-block">
                <h3>插槽 / 事件 / 注意</h3>
                <ul class="api-list">
                  <li>插槽：无。视觉全部由组件内部绘制。</li>
                  <li>事件：<code>input</code>（拖动中实时）/ <code>change</code>（松手、键盘提交），均 bubbles + composed。</li>
                  <li>表单：<code>name</code> / <code>form</code> 生效，提交取当前 value，<code>reset</code> 回到 <code>default-value</code> / <code>min</code>。</li>
                  <li>键盘：Tab 聚焦、←/→ 步进、Home / End 到两端；焦点环画在拇指上。</li>
                  <li>默认尺寸 <code>13.571em × 2.857em</code>（190×40px 触控高度），轨道两端各内缩拇指半径，数值气泡在拖动/聚焦时显示。</li>
                  <li>不要用 <code>attr:value</code> / <code>setAttribute("value")</code> 控制值；JS 读写一律走 <code>el.value</code>。</li>
                </ul>
              </div>
            </div>

      <script>
        export const parent = "./layout.html";

        export default async () => ({
          data: {
            volume: "64",
            temp: "4",
            price: "80",
            opacity: "0.5",
            dragValue: "50",
            commitValue: "50",
            sliderColor: "primary",
            level: "30",
            readResult: "（未读取）",
            formVolume: "（未提交）",
          },
          proto: {
            onSliderForm(e) {
              e.preventDefault();
              this.formVolume = new FormData(e.target).get("volume");
            },
            onVolume(e) {
              this.volume = e.target.value;
            },
            onTemp(e) {
              this.temp = e.target.value;
            },
            onPrice(e) {
              this.price = e.target.value;
            },
            onOpacity(e) {
              this.opacity = e.target.value;
            },
            onDrag(e) {
              this.dragValue = e.target.value;
            },
            onDragDone(e) {
              this.commitValue = e.target.value;
            },
            onLevel(e) {
              this.level = e.target.value;
            },
            setLevel(v) {
              this.shadow.$("#doc-level").value = v;
              this.level = String(v);
            },
            readLevel() {
              this.readResult = this.shadow.$("#doc-level").value;
            },
          },
        });
      </script>
    </template>
