<!--
  st-dialog — Senti-UI 对话框组件（基于 ofa.js）
  语义属性：open（显示）/ auto-close（点击遮罩或 Escape 关闭）
  结构：宿主为全屏遮罩层（grid 居中），面板在 shadow 内（part="panel"），见 README.md
-->
<template component>
  <style>
    /* 坑 #20：:host 内嵌 :not() 不生效，用"默认隐藏 + 正向启用"的反向逻辑。
       closing 是 JS 短暂添加的过渡态：open 移除后保留 250ms 播完退出动画再隐藏 */
    :host { display: none; }
    :host([open]),
    :host([closing]) {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      box-sizing: border-box;
      padding: 1.43em;
      font-size: 14px;
      font-family: inherit;
    }

    /* 轻磨砂遮罩（M3 scrim 基色 + 轻度 backdrop blur），不随主题配色变化，故不走角色变量 */
    .scrim {
      position: absolute;
      inset: 0;
      /* 轻磨砂遮罩：M3 scrim（黑 @ 28%）+ 轻度 backdrop 磨砂（一点点，不抢内容戏），
         模糊半径用 em 随 font-size 缩放 */
      background: rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      opacity: 0;
    }

    /* M3 emphasized 动效：进入 fade + scale(0.9) 上移入场 300ms，
       退出 fade + scale(0.95) 收缩 200ms（均为 M3 emphasized 曲线）。
       用 animation 而非 transition：display none→grid 切换时 animation 自动重播 */
    :host([open]) .scrim {
      animation: st-dlg-scrim-in 0.25s ease forwards;
    }
    :host([closing]) .scrim {
      animation: st-dlg-scrim-out 0.2s ease forwards;
    }
    :host([open]) .panel {
      animation: st-dlg-in 0.3s cubic-bezier(0.2, 0, 0, 1) forwards;
    }
    :host([closing]) .panel {
      animation: st-dlg-out 0.2s cubic-bezier(0.2, 0, 0, 1) forwards;
    }
    @keyframes st-dlg-scrim-in { to { opacity: 1; } }
    @keyframes st-dlg-scrim-out { from { opacity: 1; } }
    @keyframes st-dlg-in {
      from { opacity: 0; transform: scale(0.9) translateY(-1.14em); }
      to { opacity: 1; transform: none; }
    }
    @keyframes st-dlg-out {
      from { opacity: 1; }
      to { opacity: 0; transform: scale(0.95) translateY(-0.57em); }
    }
    @media (prefers-reduced-motion: reduce) {
      :host([open]) .scrim,
      :host([closing]) .scrim,
      :host([open]) .panel,
      :host([closing]) .panel {
        animation-duration: 0.01ms;
      }
    }

    /* 面板：视觉默认值全用 em（随 font-size 等比缩放）。
       外部定制宽高/圆角/底色用原生 ::part(panel) 选择器（见 README） */
    .panel {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 1.14em;
      box-sizing: border-box;
      width: min(34.29em, 100%); /* 480px @ 14px，M3 对话框最大宽度 */
      max-height: 100%;
      padding: 1.43em;
      border-radius: 1.714em; /* 24px，M3 extra-large 圆角 */
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      /* M3 elevation level 3 常量 */
      box-shadow: 0 1em 2.857em -0.714em rgba(0, 0, 0, 0.3);
    }
    /* 焦点由面板内部可交互元素承载（各自有 focus ring），容器本身不画圈 */
    .panel:focus { outline: none; }

    ::slotted([slot="headline"]) {
      margin: 0;
      font-size: 1.143em; /* 16px */
      font-weight: 500;
      line-height: 1.4;
    }

    /* 内容区超高时内部滚动，headline / actions 固定 */
    .body {
      overflow: auto;
      min-height: 0;
      line-height: 1.7;
      color: var(--md-sys-color-on-surface-variant);
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.571em;
    }

    l-m { display: none; }
  </style>

  <div class="scrim"></div>
  <div class="panel" part="panel" tabindex="-1">
    <div class="headline"><slot name="headline"></slot></div>
    <div class="body"><slot></slot></div>
    <div class="actions"><slot name="actions"></slot></div>
  </div>

  <script>
    import "../color/st-init.js";
    export default async () => ({
      tag: "st-dialog",
      attrs: {
        autoClose: null,
      },
      data: {
        // open 是运行时状态（data，非标签属性）：内部交互关闭（auto-close）改 this.open，
        // 经 sync:open 双向绑定自动回写上层；外部也可用 setAttribute/removeAttribute
        // （ready 里的属性观察器会同步进 data）。CSS 显隐仍由宿主 open 属性驱动（watch 反射）
        open: false,
      },
      watch: {
        open() {
          const ele = this.ele;
          const isOpen = this.open === true;
          // data → 属性反射（供 :host([open]) CSS 选择器）
          if (isOpen) ele.setAttribute("open", "");
          else ele.removeAttribute("open");

          clearTimeout(this._closingTimer);
          if (isOpen) {
            // 打开：撤掉残留的退出过渡态，焦点移到面板容器（tabindex=-1），
            // 键盘用户随后可 Tab 进内部控件
            this._wasOpen = true;
            ele.removeAttribute("closing");
            const panel = ele.shadowRoot.querySelector(".panel");
            // watch 异步触发，等面板可见后再聚焦
            requestAnimationFrame(() => panel.focus());
          } else if (this._wasOpen) {
            // 关闭：短暂保留 closing 态播完退出动画（200ms），再彻底隐藏。
            // data watch 初始化也会以初始值 false 触发一次，用 _wasOpen 区分（坑 #27）
            this._wasOpen = false;
            ele.setAttribute("closing", "");
            this._closingTimer = setTimeout(() => ele.removeAttribute("closing"), 250);
          }
        },
      },
      ready() {
        const ele = this.ele;
        const sr = ele.shadowRoot;

        // 属性 → data 兼容路径：标签裸属性 / 外部 setAttribute 同样有效
        // （值一致时 data 不变化，不会与 watch 的反射形成循环）
        if (ele.hasAttribute("open")) this.open = true;
        this._attrObserver = new MutationObserver(() => {
          const attrOpen = ele.hasAttribute("open");
          if (attrOpen !== (this.open === true)) this.open = attrOpen;
        });
        this._attrObserver.observe(ele, { attributes: true, attributeFilter: ["open"] });

        // headline / actions 未分发内容时隐藏对应区块，避免空区块参与 gap 布局
        ["headline", "actions"].forEach((name) => {
          const slot = sr.querySelector(`slot[name="${name}"]`);
          const wrap = slot.parentElement;
          const sync = () => {
            const has = slot.assignedNodes().length > 0;
            wrap.style.display = has ? "" : "none";
          };
          slot.addEventListener("slotchange", sync);
          sync();
        });

        // 点击遮罩关闭（受 auto-close 约束）
        sr.querySelector(".scrim").addEventListener("click", () => this.closeSelf());

        // Escape 关闭（受 auto-close 约束）
        this._onKeydown = (e) => {
          if (e.key === "Escape") this.closeSelf();
        };
        document.addEventListener("keydown", this._onKeydown);
      },
      detached() {
        document.removeEventListener("keydown", this._onKeydown);
        clearTimeout(this._closingTimer);
        this._attrObserver?.disconnect();
      },
      proto: {
        // 关闭（仅在 auto-close 时允许交互触发），并派发 close 事件供外部监听。
        // 改 this.open（data）：sync:open 的上层绑定自动同步
        closeSelf() {
          if (this.autoClose === null || this.open !== true) return;
          this.open = false;
          this.ele.dispatchEvent(new Event("close", { bubbles: true, composed: true }));
        },
      },
    });
  </script>
</template>
