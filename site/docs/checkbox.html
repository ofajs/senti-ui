          <article class="doc-page">
            <header class="doc-hero">
              <p class="doc-kicker">表单 · 5 / 22</p>
              <h1>Checkbox <code>st-checkbox</code></h1>
              <p class="doc-lead">复选框：选中 / 不确定 / 禁用 / 语义色。checked 与 indeterminate 都是标签属性，ofa 页面用 attr: 绑定；点击文字也能切换，Space 键盘可用。</p>
              <div class="doc-links">
                <a href="../index.html">组件目录</a>
                <a href="https://github.com/ofajs/senti-ui/blob/main/packages/checkbox/README.md" target="_blank" rel="noreferrer">GitHub README <iconify-icon icon="mdi:open-in-new"></iconify-icon></a>
              </div>
            </header>

            <section class="doc-section">
              <h2>基础状态</h2>
              <p class="doc-section-lead">无属性为未选中，<code>checked</code> 为选中，<code>indeterminate</code> 显示横线表示部分选中。indeterminate 只是视觉与语义状态，用户点击后会退出并变成选中；没有标签内容时文字区自动隐藏。</p>
              <div class="demo">
                <div class="demo-top">
                  <span class="live"><i></i>{{codeView.demo1 ? 'CODE' : 'LIVE'}}</span>
                  <div class="demo-top-actions">
                    <code>st-checkbox</code>
                    <st-button class="demo-code-toggle" variant="text" on:click="toggleCode('demo1')">
                      <iconify-icon slot="prefix" attr:icon="codeView.demo1 ? 'mdi:eye-outline' : 'mdi:code-tags'"></iconify-icon>
                      {{codeView.demo1 ? '查看示例' : '查看代码'}}
                    </st-button>
                  </div>
                </div>
                <div class="demo-stage" attr:hidden="codeView.demo1">
                  <st-checkbox>未选中</st-checkbox>
                  <st-checkbox checked>已选中</st-checkbox>
                  <st-checkbox indeterminate>不确定态</st-checkbox>
                  <st-checkbox></st-checkbox>
                </div>

                <st-code class="demo-code" attr:hidden="!codeView.demo1" lang="html" :code="demo1Code"></st-code>
              </div>
            </section>

            <section class="doc-section">
              <h2>color 语义色</h2>
              <p class="doc-section-lead"><code>color</code> 同时作用于选中态底色、描边和对勾色，适合表达错误、成功等业务状态。它只影响选中态；未选中时边框恒为 on-surface-variant。</p>
              <div class="demo">
                <div class="demo-top">
                  <span class="live"><i></i>{{codeView.demo2 ? 'CODE' : 'LIVE'}}</span>
                  <div class="demo-top-actions">
                    <code>color</code>
                    <st-button class="demo-code-toggle" variant="text" on:click="toggleCode('demo2')">
                      <iconify-icon slot="prefix" attr:icon="codeView.demo2 ? 'mdi:eye-outline' : 'mdi:code-tags'"></iconify-icon>
                      {{codeView.demo2 ? '查看示例' : '查看代码'}}
                    </st-button>
                  </div>
                </div>
                <div class="demo-stage" attr:hidden="codeView.demo2">
                  <st-checkbox color="error" checked>错误色</st-checkbox>
                  <st-checkbox color="success" checked>成功色</st-checkbox>
                  <st-checkbox color="tertiary" checked>三级色</st-checkbox>
                  <st-checkbox color="error" indeterminate>错误 + 不确定</st-checkbox>
                </div>

                <st-code class="demo-code" attr:hidden="!codeView.demo2" lang="html" :code="demo2Code"></st-code>
              </div>
            </section>

            <section class="doc-section">
              <h2>disabled 组合</h2>
              <p class="doc-section-lead">disabled 阻断点击与键盘，并降低到 0.38 透明度。它可与 checked、indeterminate 任意组合，用来展示不可修改的已选结果或半选结果。</p>
              <div class="demo">
                <div class="demo-top">
                  <span class="live"><i></i>{{codeView.demo3 ? 'CODE' : 'LIVE'}}</span>
                  <div class="demo-top-actions">
                    <code>disabled</code>
                    <st-button class="demo-code-toggle" variant="text" on:click="toggleCode('demo3')">
                      <iconify-icon slot="prefix" attr:icon="codeView.demo3 ? 'mdi:eye-outline' : 'mdi:code-tags'"></iconify-icon>
                      {{codeView.demo3 ? '查看示例' : '查看代码'}}
                    </st-button>
                  </div>
                </div>
                <div class="demo-stage" attr:hidden="codeView.demo3">
                  <st-checkbox disabled>禁用未选</st-checkbox>
                  <st-checkbox disabled checked>禁用已选</st-checkbox>
                  <st-checkbox disabled indeterminate>禁用半选</st-checkbox>
                </div>

                <st-code class="demo-code" attr:hidden="!codeView.demo3" lang="html" :code="demo3Code"></st-code>
              </div>
            </section>

            <section class="doc-section">
              <h2>分组多选与受控绑定</h2>
              <p class="doc-section-lead">每个选项的 checked 绑定到独立 data 字段，change 时把 <code>hasAttribute("checked")</code> 写回即可。标签文字属于点击热区，不需要再包 label；汇总文本由 getter 计算，不必额外维护一份状态。</p>
              <div class="demo">
                <div class="demo-top">
                  <span class="live"><i></i>{{codeView.demo4 ? 'CODE' : 'LIVE'}}</span>
                  <div class="demo-top-actions">
                    <code>attr:checked / on:change</code>
                    <st-button class="demo-code-toggle" variant="text" on:click="toggleCode('demo4')">
                      <iconify-icon slot="prefix" attr:icon="codeView.demo4 ? 'mdi:eye-outline' : 'mdi:code-tags'"></iconify-icon>
                      {{codeView.demo4 ? '查看示例' : '查看代码'}}
                    </st-button>
                  </div>
                </div>
                <div class="demo-stage block" attr:hidden="codeView.demo4">
                  <div class="row">
                    <st-checkbox attr:checked="apple" on:change="onApple">苹果</st-checkbox>
                    <st-checkbox attr:checked="banana" on:change="onBanana">香蕉</st-checkbox>
                    <st-checkbox attr:checked="grape" on:change="onGrape">葡萄</st-checkbox>
                  </div>
                  <span class="demo-note">已选：{{fruitSummary}}</span>
                </div>

                <st-code class="demo-code" attr:hidden="!codeView.demo4" lang="html" :code="demo4Code"></st-code>
              </div>
            </section>

            <section class="doc-section">
              <h2>全选与 indeterminate</h2>
              <p class="doc-section-lead">父级复选框同时绑定 checked 与 indeterminate：全选时 checked，部分选中时 indeterminate，全不选时两者都为 false。子项变化后重算父级，父级点击则统一写入三个子项。</p>
              <div class="demo">
                <div class="demo-top">
                  <span class="live"><i></i>{{codeView.demo5 ? 'CODE' : 'LIVE'}}</span>
                  <div class="demo-top-actions">
                    <code>全选 / 半选</code>
                    <st-button class="demo-code-toggle" variant="text" on:click="toggleCode('demo5')">
                      <iconify-icon slot="prefix" attr:icon="codeView.demo5 ? 'mdi:eye-outline' : 'mdi:code-tags'"></iconify-icon>
                      {{codeView.demo5 ? '查看示例' : '查看代码'}}
                    </st-button>
                  </div>
                </div>
                <div class="demo-stage block" attr:hidden="codeView.demo5">
                  <div class="row">
                    <st-checkbox attr:checked="allChecked" attr:indeterminate="allIndeterminate" on:change="toggleAll">全选</st-checkbox>
                  </div>
                  <div class="row">
                    <st-checkbox attr:checked="a" on:change="onA">选项 A</st-checkbox>
                    <st-checkbox attr:checked="b" on:change="onB">选项 B</st-checkbox>
                    <st-checkbox attr:checked="c" on:change="onC">选项 C</st-checkbox>
                  </div>
                  <span class="demo-note">状态：{{allChecked ? '已全选' : (allIndeterminate ? '部分选中' : '未选择')}} · 已选 {{checkedCount}} / 3</span>
                </div>

                <st-code class="demo-code" attr:hidden="!codeView.demo5" lang="html" :code="demo5Code"></st-code>
              </div>
            </section>

            <section class="doc-section">
              <h2>尺寸与 change 事件</h2>
              <p class="doc-section-lead">默认尺寸基于 em，改宿主 <code>font-size</code> 会同时缩放方框、对勾和文字间距。change 只在用户切换时派发，事件里读取属性即可得到最新状态。</p>
              <div class="demo">
                <div class="demo-top">
                  <span class="live"><i></i>{{codeView.demo6 ? 'CODE' : 'LIVE'}}</span>
                  <div class="demo-top-actions">
                    <code>font-size / change</code>
                    <st-button class="demo-code-toggle" variant="text" on:click="toggleCode('demo6')">
                      <iconify-icon slot="prefix" attr:icon="codeView.demo6 ? 'mdi:eye-outline' : 'mdi:code-tags'"></iconify-icon>
                      {{codeView.demo6 ? '查看示例' : '查看代码'}}
                    </st-button>
                  </div>
                </div>
                <div class="demo-stage grid" attr:hidden="codeView.demo6">
                  <div class="demo-cell">
                    <span class="demo-label">12px</span>
                    <st-checkbox style="font-size: 12px;" checked>小号</st-checkbox>
                  </div>
                  <div class="demo-cell">
                    <span class="demo-label">14px（默认）</span>
                    <st-checkbox checked>默认</st-checkbox>
                  </div>
                  <div class="demo-cell">
                    <span class="demo-label">20px</span>
                    <st-checkbox style="font-size: 20px;" checked>大号</st-checkbox>
                  </div>
                  <div class="demo-cell">
                    <span class="demo-label">change 计数</span>
                    <st-checkbox on:change="count += 1">点我</st-checkbox>
                  </div>
                </div>
                <span class="demo-note" style="grid-column: 1 / -1;">change 已触发 {{count}} 次</span>

                <st-code class="demo-code" attr:hidden="!codeView.demo6" lang="html" :code="demo6Code"></st-code>
              </div>
            </section>

            <div class="doc-cols">
              <div class="doc-block">
                <h3>属性</h3>
                <table class="api">
                  <thead><tr><th>属性</th><th>类型</th><th>默认</th><th>说明</th></tr></thead>
                  <tbody>
                    <tr><td><code>checked</code></td><td>boolean</td><td>无</td><td>选中态；点击自动同步</td></tr>
                    <tr><td><code>indeterminate</code></td><td>boolean</td><td>无</td><td>不确定态；用户点击后退出并变为选中</td></tr>
                    <tr><td><code>disabled</code></td><td>boolean</td><td>无</td><td>0.38 透明度，阻断交互</td></tr>
                    <tr><td><code>color</code></td><td>M3 角色名 / 自定义变量名</td><td>无</td><td>选中态底色 / 对勾色</td></tr>
                  </tbody>
                </table>
              </div>
              <div class="doc-block">
                <h3>插槽 / 事件 / 注意</h3>
                <ul class="api-list">
                  <li>插槽：默认插槽是标签文字；内容为空时文字区自动隐藏。</li>
                  <li>事件：<code>change</code>（bubbles + composed），触发时宿主属性已同步。</li>
                  <li>布尔属性用 <code>attr:checked="expr"</code> / <code>attr:indeterminate="expr"</code>；不要用 <code>:checked</code>。</li>
                  <li><code>color</code> 只影响选中态；未选中边框恒为 on-surface-variant。</li>
                  <li>交互由内部透明原生 checkbox 承载：点文字可切换，Space 可切换。</li>
                </ul>
              </div>
            </div>

            <nav class="doc-pager" aria-label="上下篇">
              <a class="pager-link" olink href="./select.html"><span>上一页</span><iconify-icon icon="mdi:arrow-left"></iconify-icon> Select</a><a class="pager-link pager-next" olink href="./switch.html"><span>下一页</span>Switch <iconify-icon icon="mdi:arrow-right"></iconify-icon></a>
            </nav>
          </article>
      <script>
        export const parent = "./layout.html";

        export default async () => ({
          data: {
            codeView: { demo1: false, demo2: false, demo3: false, demo4: false, demo5: false, demo6: false },
            demo1Code: "<st-checkbox>未选中</st-checkbox>\n                  <st-checkbox checked>已选中</st-checkbox>\n                  <st-checkbox indeterminate>不确定态</st-checkbox>\n                  <st-checkbox></st-checkbox>",
            demo2Code: "<st-checkbox color=\"error\" checked>错误色</st-checkbox>\n                  <st-checkbox color=\"success\" checked>成功色</st-checkbox>\n                  <st-checkbox color=\"tertiary\" checked>三级色</st-checkbox>\n                  <st-checkbox color=\"error\" indeterminate>错误 + 不确定</st-checkbox>",
            demo3Code: "<st-checkbox disabled>禁用未选</st-checkbox>\n                  <st-checkbox disabled checked>禁用已选</st-checkbox>\n                  <st-checkbox disabled indeterminate>禁用半选</st-checkbox>",
            demo4Code: "<div class=\"row\">\n                    <st-checkbox attr:checked=\"apple\" on:change=\"onApple\">苹果</st-checkbox>\n                    <st-checkbox attr:checked=\"banana\" on:change=\"onBanana\">香蕉</st-checkbox>\n                    <st-checkbox attr:checked=\"grape\" on:change=\"onGrape\">葡萄</st-checkbox>\n                  </div>\n                  <span class=\"demo-note\">已选：{{fruitSummary}}</span>",
            demo5Code: "<div class=\"row\">\n                    <st-checkbox attr:checked=\"allChecked\" attr:indeterminate=\"allIndeterminate\" on:change=\"toggleAll\">全选</st-checkbox>\n                  </div>\n                  <div class=\"row\">\n                    <st-checkbox attr:checked=\"a\" on:change=\"onA\">选项 A</st-checkbox>\n                    <st-checkbox attr:checked=\"b\" on:change=\"onB\">选项 B</st-checkbox>\n                    <st-checkbox attr:checked=\"c\" on:change=\"onC\">选项 C</st-checkbox>\n                  </div>\n                  <span class=\"demo-note\">状态：{{allChecked ? '已全选' : (allIndeterminate ? '部分选中' : '未选择')}} · 已选 {{checkedCount}} / 3</span>",
            demo6Code: "<div class=\"demo-cell\">\n                    <span class=\"demo-label\">12px</span>\n                    <st-checkbox style=\"font-size: 12px;\" checked>小号</st-checkbox>\n                  </div>\n                  <div class=\"demo-cell\">\n                    <span class=\"demo-label\">14px（默认）</span>\n                    <st-checkbox checked>默认</st-checkbox>\n                  </div>\n                  <div class=\"demo-cell\">\n                    <span class=\"demo-label\">20px</span>\n                    <st-checkbox style=\"font-size: 20px;\" checked>大号</st-checkbox>\n                  </div>\n                  <div class=\"demo-cell\">\n                    <span class=\"demo-label\">change 计数</span>\n                    <st-checkbox on:change=\"count += 1\">点我</st-checkbox>\n                  </div>",
            apple: true,
            banana: false,
            grape: false,
            a: false,
            b: true,
            c: false,
            allChecked: false,
            allIndeterminate: true,
            count: 0,
          },
          proto: {
            toggleCode(key) {
              this.codeView[key] = !this.codeView[key];
            },
            get fruitSummary() {
              const picked = [this.apple && "苹果", this.banana && "香蕉", this.grape && "葡萄"].filter(Boolean);
              return picked.length ? picked.join("、") : "（未选择）";
            },
            get checkedCount() {
              return [this.a, this.b, this.c].filter(Boolean).length;
            },
            onApple(e) { this.apple = e.target.hasAttribute("checked"); },
            onBanana(e) { this.banana = e.target.hasAttribute("checked"); },
            onGrape(e) { this.grape = e.target.hasAttribute("checked"); },
            onA(e) { this.a = e.target.hasAttribute("checked"); this.syncAll(); },
            onB(e) { this.b = e.target.hasAttribute("checked"); this.syncAll(); },
            onC(e) { this.c = e.target.hasAttribute("checked"); this.syncAll(); },
            syncAll() {
              const n = this.checkedCount;
              this.allChecked = n === 3;
              this.allIndeterminate = n > 0 && n < 3;
            },
            toggleAll(e) {
              const on = e.target.hasAttribute("checked");
              this.a = on;
              this.b = on;
              this.c = on;
              this.allChecked = on;
              this.allIndeterminate = false;
            },
          },
        });
      </script>
    </template>
  </o-app>

  <script type="module">

    import contextMenu from "../../packages/menu/context-menu.js";
    window.__site = Object.assign(window.__site || {}, { setThemeMode, getThemeMode, setSkin, getSkin, alert, confirm, prompt, toast, contextMenu });
    window.__siteReady = true;
  </script>
