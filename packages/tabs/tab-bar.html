<!--
  st-tab-bar — Senti-UI 标签栏组件（基于 ofa.js）
  子项为 light DOM 的 st-tab-item（active 属性标记当前项，由外部切换）；
  底部指示条自动动画跟随 active 项，见 README.md
-->
<template component>
  <style>
    :host {
      position: relative;
      display: flex;
      align-items: center;
      font-size: var(--st-font-size, 14px);
      font-family: var(--st-font, inherit);
      border-bottom: var(--st-border-width, 1px) solid
        var(--st-tabs-border, var(--md-sys-color-outline-variant));
    }

    .indicator {
      position: absolute;
      bottom: 0;
      height: var(--st-tabs-indicator-height, 0.143em);
      border-radius: var(--st-tabs-indicator-radius, 0);
      width: 0;
      background: var(--st-accent, var(--md-sys-color-primary));
      transition:
        left var(--st-motion-duration-slow, 0.3s) var(--st-motion-easing, cubic-bezier(0.2, 0, 0, 1)),
        width var(--st-motion-duration-slow, 0.3s) var(--st-motion-easing, cubic-bezier(0.2, 0, 0, 1));
    }
    .indicator.not-animate { transition: none !important; }

    l-m { display: none; }
  </style>

  <l-m src="./tab-item.html"></l-m>
  <slot></slot>
  <div class="indicator not-animate"></div>

  <script>
    import "../color/st-color-init.js";
    import { getDeepActiveElement } from "../a11y/a11y.js";
    export default async () => ({
      tag: "st-tab-bar",
      proto: {
        // 定位指示条到 active 项（30ms 合并连续切换）
        updateIndicator() {
          if (this._timer) return;
          this._timer = setTimeout(() => {
            this._timer = null;
            const ele = this.ele;
            const items = ele.querySelectorAll("st-tab-item");
            const active = Array.from(items).find((it) => it.hasAttribute("active"));
            const indicator = ele.shadowRoot.querySelector(".indicator");
            if (!active) {
              indicator.style.opacity = "0";
              return;
            }
            // 用布局坐标而不是 getBoundingClientRect：后者含祖先 transform，
            // 在对话框/入场动画容器里会量到错误位置（坑 #41）
            if (!active.offsetWidth) {
              indicator.style.opacity = "0";
              return;
            }
            indicator.style.opacity = "1";
            indicator.style.left = active.offsetLeft + "px";
            indicator.style.width = active.offsetWidth + "px";
          }, 30);
        },
      },
      ready() {
        const ele = this.ele;
        queueMicrotask(() => {
          ele.setAttribute("role", "tablist");
          ele.setAttribute("aria-orientation", "horizontal");
        });
        // 子项 active 变化（属性监听，跨组件不依赖 ofa 实例方法）
        this._itemObserver = new MutationObserver(() => this.updateIndicator());
        const observeItems = () => {
          ele.querySelectorAll("st-tab-item").forEach((it) => {
            this._itemObserver.observe(it, { attributes: true, attributeFilter: ["active"] });
          });
        };
        observeItems();
        // 子项增删跟随
        this._childObserver = new MutationObserver(observeItems);
        this._childObserver.observe(ele, { childList: true });
        this.updateIndicator();

        // WAI-ARIA tabs 键盘模型：←/→ 在可用标签间移动并激活
        this._onKeydown = (e) => {
          const keys = ["ArrowLeft", "ArrowRight", "Home", "End"];
          if (!keys.includes(e.key)) return;
          const items = [...ele.querySelectorAll("st-tab-item")].filter(
            (item) => !item.hasAttribute("disabled")
          );
          if (!items.length) return;
          const active = items.find((item) => item.hasAttribute("active")) || items[0];
          const focused = getDeepActiveElement();
          const focusedItem =
            focused?.closest?.("st-tab-item") || focused?.getRootNode?.()?.host;
          let index = items.includes(focusedItem) ? items.indexOf(focusedItem) : items.indexOf(active);
          if (e.key === "Home") index = 0;
          else if (e.key === "End") index = items.length - 1;
          else if (e.key === "ArrowRight") index = (index + 1) % items.length;
          else index = (index - 1 + items.length) % items.length;
          const target = items[index];
          e.preventDefault();
          const native = target.shadowRoot?.querySelector(".native");
          if (!native) return;
          native.focus();
          native.click();
        };
        ele.addEventListener("keydown", this._onKeydown);

        // 首次定位不做动画，之后开启
        setTimeout(() => {
          ele.shadowRoot.querySelector(".indicator")?.classList.remove("not-animate");
        }, 100);
      },
      attached() {
        // 尺寸变化时瞬时重定位（不带动画）
        this._resizeObserver = new ResizeObserver(() => {
          const indicator = this.ele.shadowRoot.querySelector(".indicator");
          indicator.classList.add("not-animate");
          this.updateIndicator();
          clearTimeout(this._resizeTimer);
          this._resizeTimer = setTimeout(() => indicator.classList.remove("not-animate"), 50);
        });
        this._resizeObserver.observe(this.ele);
      },
      detached() {
        this._itemObserver?.disconnect();
        this._childObserver?.disconnect();
        this._resizeObserver?.disconnect();
        this.ele.removeEventListener("keydown", this._onKeydown);
      },
    });
  </script>
</template>
