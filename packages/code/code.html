<!--
  st-code — Senti-UI 代码展示组件（基于 ofa.js）
  语义属性：lang（html / js / ts / css / less / sass）/ title（文件名或标题）/ code（代码字符串）
  安全：只从 <template> / <textarea> 或 code 运行时数据读取源码；渲染结果全部转义为文本节点
-->
<template component>
  <style>
    :host {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      box-sizing: border-box;
      font-size: 14px;
      font-family: var(--st-font, inherit);
      color: var(--md-sys-color-on-surface);
    }

    /* 默认只有代码本身：无边框、无阴影、无底色、无浏览器顶栏。
       加 frame 属性后才出现窗口外壳（圆点 / 标题 / 复制）。 */
    .shell {
      box-sizing: border-box;
      overflow: visible;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }
    :host([frame]) .shell {
      overflow: hidden;
      border: 1px solid var(--st-code-border, transparent);
      border-radius: var(--st-code-radius, var(--st-radius-md, 0.857em));
      background: var(--st-code-bg, var(--md-sys-color-surface-container-highest));
      box-shadow: var(--st-code-shadow, var(--st-shadow-1, none));
      -webkit-backdrop-filter: var(--st-code-backdrop-filter, none);
      backdrop-filter: var(--st-code-backdrop-filter, none);
    }

    .head {
      display: none;
      align-items: center;
      gap: 0.714em;
      min-height: 2.429em;
      padding: 0.429em 0.857em;
      box-sizing: border-box;
      background: var(--st-code-header-bg, var(--md-sys-color-surface-container-high));
      border-bottom: 1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 55%, transparent);
    }
    :host([frame]) .head { display: flex; }

    .dots {
      display: inline-flex;
      gap: 0.286em;
      flex: none;
    }
    .dots i {
      width: 0.571em;
      height: 0.571em;
      border-radius: 50%;
      background: color-mix(in srgb, var(--md-sys-color-on-surface-variant) 45%, transparent);
    }

    .title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.786em;
      letter-spacing: 0.02em;
      color: var(--md-sys-color-on-surface-variant);
    }

    .copy {
      all: unset;
      flex: none;
      box-sizing: border-box;
      padding: 0.286em 0.643em;
      border-radius: var(--st-radius-xs, 0.286em);
      cursor: pointer;
      font-size: 0.786em;
      line-height: 1.4;
      color: var(--md-sys-color-primary);
      transition: background-color var(--st-motion-duration, 0.15s) ease;
    }
    .copy:hover { background: color-mix(in srgb, currentColor 8%, transparent); }
    .copy:focus-visible {
      outline: var(--st-focus-ring-width, 2px) var(--st-focus-ring-style, solid)
        var(--st-focus-ring-color, var(--md-sys-color-on-surface));
      outline-offset: 1px;
    }

    .body {
      max-height: var(--st-code-max-height, none);
      overflow: auto;
      overscroll-behavior: contain;
      padding: 0;
      box-sizing: border-box;
    }
    :host([frame]) .body { padding: var(--st-code-padding, 1em); }

    pre {
      margin: 0;
      font-family: var(--st-code-font, ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace);
      font-size: var(--st-code-font-size, 0.857em);
      line-height: var(--st-code-line-height, 1.65);
      color: var(--md-sys-color-on-surface);
      tab-size: 2;
      white-space: pre;
    }
    code {
      font-family: inherit;
      font-size: inherit;
    }

    /* 语法配色全部来自 M3 角色，不写死颜色 */
    .tk-keyword,
    .tk-tag,
    .tk-atrule,
    .tk-selector { color: var(--md-sys-color-primary); }
    .tk-string,
    .tk-entity { color: var(--md-sys-color-success, var(--md-sys-color-tertiary)); }
    .tk-number,
    .tk-color,
    .tk-variable,
    .tk-type { color: var(--md-sys-color-tertiary); }
    .tk-comment { color: var(--md-sys-color-on-surface-variant); font-style: italic; }
    .tk-function,
    .tk-attr,
    .tk-property { color: var(--md-sys-color-secondary); }
    .tk-punct { color: var(--md-sys-color-on-surface-variant); }


    @media (prefers-reduced-motion: reduce) {
      :host,
      :host * {
        animation-delay: 0s !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    l-m { display: none; }
  </style>

  <div class="shell" part="shell">
    <div class="head" part="header">
      <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="title" part="title"></span>
      <button class="copy" type="button" part="copy" aria-label="复制代码">复制</button>
    </div>
    <div class="body" part="body">
      <pre part="pre"><code part="code"></code></pre>
    </div>
  </div>

  <script>
    import "../color/st-color-init.js";
    import beautifier from "./vendor/beautifier.mjs";
    import { normalizeLang, langLabel, highlight } from "./highlight.js";

    // js-beautify（MIT）随组件 vendored，格式化为同步执行；失败时保留 dedent 原文。
    function formatCode(beautifier, code, lang) {
      const common = {
        indent_size: 2,
        indent_char: " ",
        end_with_newline: false,
        preserve_newlines: true,
        max_preserve_newlines: 2,
        wrap_line_length: 0,
      };
      if (lang === "html") {
        return beautifier.html(code, {
          ...common,
          content_unformatted: ["pre", "textarea"],
          indent_scripts: "normal",
        });
      }
      if (lang === "js" || lang === "ts") {
        return beautifier.js(code, { ...common, brace_style: "collapse" });
      }
      return beautifier.css(code, common);
    }

    function dedent(text) {
      const lines = String(text).replace(/\r\n?/g, "\n").replace(/\t/g, "  ").split("\n");
      while (lines.length && !lines[0].trim()) lines.shift();
      while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
      const indents = lines
        .filter((line) => line.trim())
        .map((line) => (/^ */.exec(line) || [""])[0].length);
      const min = indents.length ? Math.min(...indents) : 0;
      return lines.map((line) => line.slice(min)).join("\n");
    }

    export default async () => ({
      tag: "st-code",
      attrs: {
        lang: "html",
        title: null,
        format: "auto",
        frame: null,
      },
      data: {
        // code 是运行时数据（非标签属性）：页面用 :code="..." 绑定或 el.code = ...
        code: null,
      },
      watch: {
        lang() { this.render?.(); },
        title() { this.render?.(); },
        code() { this.render?.(); },
        format() { this.render?.(); },
      },
      ready() {
        const ele = this.ele;
        const sr = ele.shadowRoot;
        const codeEl = sr.querySelector("code");
        const titleEl = sr.querySelector(".title");
        const copyBtn = sr.querySelector(".copy");
        let copyTimer = null;

        // 宿主 code property 映射到 ofa data；不写回 attribute（用户要求）
        const initialCode = ele.code;
        Object.defineProperty(ele, "code", {
          configurable: true,
          get: () => this.code,
          set: (v) => { this.code = v == null ? null : String(v); },
        });
        if (initialCode !== undefined && this.code === null) this.code = initialCode;

        const sourceArea = ele.querySelector(":scope > textarea");
        if (sourceArea) sourceArea.hidden = true;

        this.render = () => {
          const template = ele.querySelector("template");
          const sourceArea = ele.querySelector(":scope > textarea");
          let raw = "";
          if (this.code !== null && this.code !== undefined) {
            raw = this.code;
          } else if (sourceArea) {
            // textarea 是 RCDATA：内部标签不会被解析，<script> 不会执行。
            // 适合不想写 <template>、也不想手动转义 < > 的场景。
            raw = sourceArea.value;
          } else if (template) {
            // 带标签的 HTML 代码用 innerHTML 保留标签；纯文本（JS/CSS）用 textContent。
            // 两者都只读字符串，不插入 DOM，因此 <script> 不会执行。
            raw = template.content.querySelector("*")
              ? template.innerHTML
              : template.content.textContent;
          } else if (ele.children.length === 0) {
            raw = ele.textContent;
          }
          const lang = normalizeLang(this.lang);
          let source = dedent(raw);
          // Sass 是缩进语法，交给 beautifier 会把层级压平，只做去公共缩进。
          if (String(this.format).toLowerCase() !== "off" && lang !== "sass" && source.trim()) {
            try {
              source = formatCode(beautifier, source, lang) || source;
            } catch (_) {
              // 格式化失败时保留 dedent 结果
            }
          }
          this._raw = source;
          titleEl.textContent = this.title || langLabel(lang);
          codeEl.innerHTML = highlight(source, lang);
          copyBtn.removeAttribute("data-copied");
          copyBtn.textContent = "复制";
        };

        this.render();
        this._observer = new MutationObserver(() => this.render());
        this._observer.observe(ele, { childList: true, subtree: true });
        const template = ele.querySelector("template");
        if (template) {
          this._templateObserver = new MutationObserver(() => this.render());
          this._templateObserver.observe(template.content, {
            childList: true,
            subtree: true,
            characterData: true,
          });
        }

        const fallbackCopy = () => {
          const ta = document.createElement("textarea");
          ta.value = this._raw;
          ta.setAttribute("readonly", "");
          ta.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0;";
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand("copy"); } catch (_) { /* ignore */ }
          ta.remove();
        };

        copyBtn.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(this._raw);
          } catch (_) {
            fallbackCopy();
          }
          copyBtn.dataset.copied = "true";
          copyBtn.textContent = "已复制";
          clearTimeout(copyTimer);
          copyTimer = setTimeout(() => {
            copyBtn.removeAttribute("data-copied");
            copyBtn.textContent = "复制";
          }, 1600);
          ele.dispatchEvent(new Event("copy", { bubbles: true, composed: true }));
        });

        this._cleanup = () => {
          this._observer?.disconnect();
          this._templateObserver?.disconnect();
          clearTimeout(copyTimer);
        };
      },
      detached() {
        this._cleanup?.();
      },
    });
  </script>
</template>
