<!-- st-dialog 验收页，由同目录 index.html 通过 <o-page> 加载 -->
<template page>
  <style>
    :host { display: grid; gap: 24px; padding: 40px; align-content: start; }
    section { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    h3 { margin: 0; font-size: 14px; color: var(--md-sys-color-on-surface-variant); width: 100%; }
    /* 面板定制：原生 ::part() 选择器 */
    st-dialog.wide::part(panel) { width: min(40em, 100%); border-radius: 1em; }
    st-dialog.fullscreen::part(panel) {
      width: 100%; height: 100%; max-height: 100%; border-radius: 0;
      background: var(--md-sys-color-surface);
    }
  </style>

  <section>
    <h3>基础用法</h3>
    <st-button variant="outlined" on:click="openDlg('basic')">打开基础对话框</st-button>
    <st-button variant="outlined" on:click="openDlg('auto')">打开 auto-close 对话框</st-button>
  </section>

  <section>
    <h3>定制（::part(panel)，auto-close 关闭后可再打开）</h3>
    <st-button variant="outlined" on:click="openDlg('wide')">Wide 圆角 14px</st-button>
    <st-button variant="outlined" on:click="openDlg('fs')">Fullscreen</st-button>
    <st-button variant="outlined" on:click="openDlg('small')">font-size 12px（全面板等比缩小）</st-button>
  </section>

  <p style="margin:0; font-size:14px; color: var(--md-sys-color-on-surface-variant);">
    close 事件计数：<span class="code" style="font-family: ui-monospace, monospace;">{{closeCount}}</span>
    （点遮罩 / Escape 关闭 +1）
  </p>

  <st-dialog sync:open="openState.basic">
    <h2 slot="headline">基础对话框</h2>
    <p>没有 auto-close：点击遮罩与 Escape 都不会关闭，只能用下面的按钮。</p>
    <div slot="actions">
      <st-button variant="text" on:click="closeDlg('basic')">知道了</st-button>
    </div>
  </st-dialog>

  <st-dialog sync:open="openState.auto" auto-close on:close="onAutoClose">
    <h2 slot="headline">auto-close 对话框</h2>
    <p>点击遮罩或按 Escape 试试，关闭时会派发 close 事件。</p>
    <div slot="actions">
      <st-button variant="text">取消</st-button>
      <st-button>确定</st-button>
    </div>
  </st-dialog>

  <st-dialog class="wide" sync:open="openState.wide" auto-close on:close="onAutoClose">
    <h2 slot="headline">Wide 定制面板</h2>
    <p>width: min(40em, 100%)、border-radius: 1em —— 全部通过原生 ::part(panel) 选择器覆盖。</p>
  </st-dialog>

  <st-dialog class="fullscreen" sync:open="openState.fs" auto-close on:close="onAutoClose">
    <h2 slot="headline">Fullscreen</h2>
    <p>width/height 100%、无圆角，正文区超高时内部滚动。</p>
    <o-fill :value="lines"><p>{{$data}}</p></o-fill>
  </st-dialog>

  <st-dialog sync:open="openState.small" auto-close on:close="onAutoClose" style="font-size: 12px;">
    <h2 slot="headline">12px 缩放</h2>
    <p>宿主 font-size: 12px，面板 padding/圆角/宽度全部等比缩小。</p>
    <div slot="actions">
      <st-button variant="text">关闭</st-button>
    </div>
  </st-dialog>

  <section>
    <h3>聚焦与键盘</h3>
    <p style="margin:0; font-size:13px; color: var(--md-sys-color-on-surface-variant); width:100%;">
      打开后焦点自动移入面板容器，<span class="code" style="font-family: ui-monospace, monospace;">Tab</span> 进入内部控件；<span class="code" style="font-family: ui-monospace, monospace;">Escape</span> 关闭（需 auto-close）；多个对话框同时打开时 Escape 各管各的
    </p>
  </section>

  <section>
    <h3>命令式工具（alert / confirm / prompt，JS 导入调用，用完即毁）</h3>
    <st-button variant="outlined" on:click="runAlert">alert</st-button>
    <st-button variant="outlined" on:click="runConfirm">confirm（危险色确认）</st-button>
    <st-button variant="outlined" on:click="runPrompt">prompt</st-button>
    <span class="code" style="font-size:13px; color: var(--md-sys-color-on-surface-variant);">返回值：{{utilResult}}</span>
    <p style="margin:0; font-size:13px; color: var(--md-sys-color-on-surface-variant); width:100%;">
      引入：<span class="code">import stAlert from "/packages/dialog/alert.js"</span>（confirm / prompt 同理）；
      遮罩点击 / Escape = 取消（alert → null，confirm → null，prompt → null）
    </p>
  </section>

  <script>
    export default async () => ({
      data: {
        closeCount: 0,
        utilResult: "（未调用）",
        openState: { basic: false, auto: false, wide: false, fs: false, small: false },
        lines: Array.from({ length: 20 }, (_, i) => i + 1),
      },
      proto: {
        openDlg(name) {
          this.openState[name] = true;
        },
        closeDlg(name) {
          this.openState[name] = false;
        },
        onAutoClose() {
          this.closeCount += 1;
        },
        async runAlert() {
          if (!window.__stDialogUtilsReady) return;
          const ok = await window.stAlert({ title: "操作成功", message: "密码已重置，请使用新密码登录。", ok: "知道了" });
          this.utilResult = "alert → " + ok;
        },
        async runConfirm() {
          if (!window.__stDialogUtilsReady) return;
          const ok = await window.stConfirm({ title: "确认删除", message: "确定要删除用户 bob 吗？此操作不可撤销。", yes: "删除", cancel: "取消", color: "error" });
          this.utilResult = "confirm → " + ok;
        },
        async runPrompt() {
          if (!window.__stDialogUtilsReady) return;
          const val = await window.stPrompt({ title: "重置密码", message: "为用户 bob 设置新密码（至少 4 位）", placeholder: "请输入新密码" });
          this.utilResult = "prompt → " + JSON.stringify(val);
        },
      },
    });
  </script>
</template>
