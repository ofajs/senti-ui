              <h1>Menu <code>st-menu</code></h1>
              <p class="doc-lead">下拉菜单：trigger 插槽放触发器，菜单项写在 light DOM 的 st-menu-item 里。面板 fixed 定位自动翻转，点外部 / Escape / 选中后关闭；支持分隔线、禁用项、prefix / suffix、多级子菜单、右键 openAt 与命令式 contextMenu。</p>

                <h3>属性</h3>
                <table class="api">
                  <thead><tr><th>属性</th><th>类型</th><th>默认</th><th>说明</th></tr></thead>
                  <tbody>
                    <tr><td><code>align</code></td><td>"left" | "right"</td><td>"right"</td><td>面板与触发器的水平对齐</td></tr>
                    <tr><td><code>keep-open</code></td><td>boolean（st-menu）</td><td>无</td><td>点击菜单项后不自动关闭，用于多选 / 勾选菜单</td></tr>
                    <tr><td><code>open</code></td><td>运行时状态（ofa data）</td><td>false</td><td>开合状态；页面里用 <code>sync:open="key"</code> 绑定</td></tr>
                    <tr><td><code>disabled</code></td><td>boolean（st-menu-item）</td><td>无</td><td>禁用菜单项：0.38 透明度、阻断点击</td></tr>
                    <tr><td><code>checkable</code></td><td>boolean（st-menu-item）</td><td>无</td><td>可勾选项：显示勾选位、<code>menuitemcheckbox</code> + <code>aria-checked</code></td></tr>
                    <tr><td><code>selected</code></td><td>boolean（st-menu-item）</td><td>无</td><td>勾选状态；点击 checkable 项自动切换并派发 change</td></tr>
                  </tbody>
                </table>
              </div>
              <div class="doc-block">
                <h3>插槽 / 事件 / 注意</h3>
                <ul class="api-list">
                  <li>插槽：<code>trigger</code> 放触发器；st-menu-item 支持 <code>prefix</code> / 默认文字 / <code>suffix</code> / <code>sub-menu</code>；分隔线用原生 <code>&lt;hr&gt;</code>。</li>
                  <li>事件：<code>open</code> / <code>close</code>（bubbles + composed）；<code>change</code>（checkable 项切换）；菜单项 click 正常冒泡，面板随后自动关闭（<code>keep-open</code> 时保持打开）。</li>
                  <li>关闭：选中任意层级、点击面板外部、Escape；多级菜单的 Escape 从最内层逐次向外（<code>keep-open</code> 时点项不关闭）。</li>
                  <li>命令式：<code>contextMenu(e, items)</code> 返回叶子项 id；<code>contextMenu.longPress(el, items, onSelect)</code> 支持触屏长按。</li>
                  <li>面板默认 <code>min-width: 6em</code>、padding / 圆角 <code>0.286em / 0.857em</code>、<code>max-height: 80vh</code>（内部滚动），宽度由内容决定。</li>
                </ul>
              </div>

            codeView: { demo1: false, demo2: false, demo3: false, demo4: false, demo5: false, demo6: false, demo7: false },
            demo1Code: "<st-menu>\n                    <st-button slot=\"trigger\" variant=\"outlined\">操作菜单 ▾</st-button>\n                    <st-menu-item on:click=\"pick('编辑')\"><span slot=\"prefix\">✏️</span>编辑<span slot=\"suffix\">⌘E</span></st-menu-item>\n                    <st-menu-item on:click=\"pick('复制')\"><span slot=\"prefix\">📋</span>复制<span slot=\"suffix\">⌘C</span></st-menu-item>\n                    <hr />\n                    <st-menu-item disabled><span slot=\"prefix\">🗑</span>删除（禁用）</st-menu-item>\n                    <st-menu-item on:click=\"pick('关于')\">关于</st-menu-item>\n                  </st-menu>\n                  <span class=\"demo-note\">最近选择：{{lastPick}}</span>",
            demo2Code: "<st-menu sync:open=\"menuOpen\" on:open=\"onMenuOpen\" on:close=\"onMenuClose\">\n                    <st-button slot=\"trigger\" variant=\"outlined\">右对齐菜单 ▾</st-button>\n                    <st-menu-item on:click=\"pick('选项一')\">选项一</st-menu-item>\n                    <st-menu-item on:click=\"pick('选项二')\">选项二</st-menu-item>\n                  </st-menu>\n                  <st-menu align=\"left\" on:open=\"onMenuOpen\" on:close=\"onMenuClose\">\n                    <st-button slot=\"trigger\" variant=\"text\">左对齐菜单 ▾</st-button>\n                    <st-menu-item on:click=\"pick('左 A')\">选项 A</st-menu-item>\n                    <st-menu-item on:click=\"pick('左 B')\">选项 B</st-menu-item>\n                  </st-menu>\n                  <span class=\"demo-note\">menuOpen = {{menuOpen}} · 当前打开中的菜单 {{openCount}} 个</span>",
            demo3Code: "<st-menu>\n                    <st-button slot=\"trigger\" variant=\"outlined\">导出菜单 ▾</st-button>\n                    <st-menu-item on:click=\"pick('新建文档')\"><span slot=\"prefix\">📄</span>新建文档</st-menu-item>\n                    <st-menu-item>\n                      <span slot=\"prefix\">🗂</span>导出为\n                      <st-menu slot=\"sub-menu\">\n                        <st-menu-item on:click=\"pick('导出 PDF')\">PDF</st-menu-item>\n                        <st-menu-item on:click=\"pick('导出 Markdown')\">Markdown</st-menu-item>\n                        <st-menu-item on:click=\"pick('导出 PNG')\">PNG 图片</st-menu-item>\n                      </st-menu>\n                    </st-menu-item>\n                    <hr />\n                    <st-menu-item disabled><span slot=\"prefix\">🗑</span>删除（禁用）</st-menu-item>\n                  </st-menu>\n                  <span class=\"demo-note\">最近选择：{{lastPick}}</span>",
            demo4Code: "<st-menu keep-open on:change=\"onCheck\">\n                    <st-button slot=\"trigger\" variant=\"outlined\">视图 ▾</st-button>\n                    <st-menu-item checkable selected>网格</st-menu-item>\n                    <st-menu-item checkable>列表</st-menu-item>\n                    <st-menu-item checkable>紧凑</st-menu-item>\n                  </st-menu>\n                  <span class=\"demo-note\">最后变更：{{checkPick}}</span>",
            demo5Code: "<div class=\"ctx-mini\" on:contextmenu=\"onCtx\">在这个区域点击右键（靠边时会自动翻转）</div>\n                  <st-menu id=\"doc-ctx-menu\">\n                    <st-menu-item on:click=\"pick('剪切')\"><span slot=\"prefix\">✂️</span>剪切</st-menu-item>\n                    <st-menu-item on:click=\"pick('复制')\"><span slot=\"prefix\">📋</span>复制</st-menu-item>\n                    <st-menu-item on:click=\"pick('粘贴')\"><span slot=\"prefix\">📌</span>粘贴</st-menu-item>\n                    <hr />\n                    <st-menu-item on:click=\"pick('刷新')\"><span slot=\"prefix\">🔄</span>刷新</st-menu-item>\n                  </st-menu>\n                  <span class=\"demo-note\">最近选择：{{lastPick}}</span>",
            demo6Code: "<div class=\"ctx-mini\" on:contextmenu=\"onCmdCtx\">右键这个区域：菜单由 JS 数组生成，含分隔线与子菜单</div>\n                  <span class=\"demo-note\">返回值：{{cmdPick}}</span>",
            demo7Code: "<st-button variant=\"outlined\" on:click=\"dlgMenu = true\">在对话框里打开菜单</st-button>\n                  <span class=\"demo-note\">最近选择：{{lastPick}} · Escape 先关菜单，再关对话框（需 auto-close）</span>",
            lastPick: "（无）",
            checkPick: "（未操作）",
            menuOpen: false,
            openCount: 0,
            cmdPick: "（未调用）",
            dlgMenu: false,
          },
          proto: {
            toggleCode(key) {
              this.codeView[key] = !this.codeView[key];
            },
            pick(label) {
              this.lastPick = label;
            },
            onCheck(e) {
              const label = e.target.textContent.trim();
              this.checkPick = `${label}：${e.target.hasAttribute("selected") ? "选中" : "取消"}`;
            },
            onMenuOpen() {
              this.openCount += 1;
            },
            onMenuClose() {
              this.openCount -= 1;
            },
            onCtx(e) {
              e.preventDefault();
              this.shadow.$("#doc-ctx-menu").openAt(e.clientX, e.clientY);
            },
            async onCmdCtx(e) {
              e.preventDefault();
              if (!window.__site) return;
              const id = await window.__site.contextMenu(e, [
                { id: "cut", label: "剪切", prefix: "✂️" },
                { id: "copy", label: "复制", prefix: "📋", suffix: "⌘C" },
                { id: "paste", label: "粘贴", prefix: "📌" },
                { separator: true },
                {
                  id: "sort",
                  label: "排序",
                  children: [
                    { id: "sort-name", label: "按名称" },
                    { id: "sort-size", label: "按大小" },
                  ],
                },
                { separator: true },
                { id: "del", label: "删除", prefix: "🗑", disabled: true },
              ]);
              this.cmdPick = id === null ? "null（点空白取消）" : JSON.stringify(id);
            },
          },
        });
      </script>
    </template>
  </o-app>

  <script type="module">
    import { setThemeMode, getThemeMode } from "../../packages/color/st-theme-mode.js";
    import { setSkin, getSkin } from "../../packages/skin/st-skin.js";
    import alert from "../../packages/dialog/alert.js";
    import confirm from "../../packages/dialog/confirm.js";
    import prompt from "../../packages/dialog/prompt.js";
    import toast from "../../packages/snackbar/toast.js";
    import contextMenu from "../../packages/menu/context-menu.js";
    window.__site = Object.assign(window.__site || {}, { setThemeMode, getThemeMode, setSkin, getSkin, alert, confirm, prompt, toast, contextMenu });
    window.__siteReady = true;
  </script>
</body>
</html>
