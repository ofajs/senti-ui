            <header class="doc-hero">
              <p class="doc-kicker">辅助 · 19 / 22</p>
              <h1>Collapse <code>st-collapse</code></h1>
              <p class="doc-lead">只做一件事：把 hide 变成高度 0，展开时高度跟随内容（ResizeObserver）。没有内置标题、箭头或折叠组，触发源与内容排版全部由你组合；默认展开，写 hide 才收起。</p>
              <div class="doc-links">
                <a href="../index.html">组件目录</a>
                <a href="https://github.com/ofajs/senti-ui/blob/main/packages/collapse/README.md" target="_blank" rel="noreferrer">GitHub README <iconify-icon icon="mdi:open-in-new"></iconify-icon></a>
              </div>
            </header>

            <section class="doc-section">
              <h2>基础展开 / 收起</h2>
              <p class="doc-section-lead">唯一的语义属性是 hide。模板里用 attr:hide 绑定一个布尔值，点击按钮改 data 即可切换；展开与收起各 0.3s，走 M3 emphasized 高度动画。不写 hide 就是默认展开。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>attr:hide</code></div>
                <div class="demo-stage block" style="gap: 14px;">
                  <div class="row">
                    <st-button on:click="collapsed = !collapsed">{{collapsed ? "展开详情" : "收起详情"}}</st-button>
                    <st-button variant="outlined" on:click="collapsed = false">全部展开</st-button>
                  </div>
                  <st-collapse attr:hide="collapsed" style="width: 100%; max-width: 480px; border: 1px solid var(--md-sys-color-outline-variant); border-radius: 14px;">
                    <div style="padding: 14px 16px; color: var(--md-sys-color-on-surface-variant); font-size: 12.5px; line-height: 1.75;">
                      <p style="margin: 0 0 8px; color: var(--md-sys-color-on-surface); font-weight: 600;">折叠容器本身没有外观</p>
                      <p style="margin: 0;">圆角、描边、内边距都由这段内容自己声明。组件只负责量高与过渡，不会向内容注入任何样式。</p>
                    </div>
                  </st-collapse>
                  <span class="demo-note">当前：{{collapsed ? "已收起（存在 hide）" : "已展开（没有 hide）"}}</span>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码</summary>
                <pre><code>&lt;st-collapse attr:hide="collapsed"&gt;
  &lt;div&gt;折叠内容&lt;/div&gt;
&lt;/st-collapse&gt;

&lt;st-button on:click="collapsed = !collapsed"&gt;展开 / 收起&lt;/st-button&gt;</code></pre>
              </details>
            </section>

            <section class="doc-section">
              <h2>内容高度自动跟随</h2>
              <p class="doc-section-lead">保持展开时，内容高度变化由 ResizeObserver 捕捉并瞬时更新——这是为了嵌套折叠时外层不会追赶内层动画。图片加载、列表增删、异步文案变长都不需要手动测量。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>ResizeObserver</code></div>
                <div class="demo-stage block" style="gap: 14px;">
                  <st-collapse style="width: 100%; max-width: 480px; border: 1px solid var(--md-sys-color-outline-variant); border-radius: 14px;">
                    <div style="padding: 14px 16px; color: var(--md-sys-color-on-surface-variant); font-size: 12.5px; line-height: 1.75;">
                      <p style="margin: 0; color: var(--md-sys-color-on-surface); font-weight: 600;">为什么折叠容器里总能显示完整内容？</p>
                      <p style="margin: 6px 0 0;">内容始终在 DOM 里，高度由里向外测量。下面的补充说明出现时，容器高度已经跟着变高，不需要重新打开。</p>
                      <p style="margin: 8px 0 0;">{{detailText}}</p>
                    </div>
                  </st-collapse>
                  <st-button variant="outlined" on:click="detail = !detail">{{detail ? "移除补充内容" : "插入一段补充内容"}}</st-button>
                  <span class="demo-note">内容高度变化是瞬时的（无过渡）；只有切换 hide 才有 0.3s 动画。</span>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码（内容动态变化）</summary>
                <pre><code>&lt;st-collapse&gt;
  &lt;div&gt;基础说明&lt;/div&gt;
  &lt;!-- 异步插入的段落：高度由 ResizeObserver 自动跟随 --&gt;
  &lt;p&gt;补充内容&lt;/p&gt;
&lt;/st-collapse&gt;</code></pre>
              </details>
            </section>

                      </button>
                      <st-collapse attr:hide="openSection !== 2">
                        <div style="padding: 12px 16px 14px; color: var(--md-sys-color-on-surface-variant); font-size: 12.5px; line-height: 1.75;">不会，收起只是高度 0 + overflow hidden。需要条件渲染请在外部用数据控制内容，组件不负责销毁。</div>
                      </st-collapse>
                    </div>
                  </div>
                  <span class="demo-note">当前展开：{{openSection === -1 ? "全部收起" : "第 " + (openSection + 1) + " 项"}}</span>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码（单选手风琴）</summary>

&lt;st-collapse attr:hide="openSection !== 0"&gt;答案一&lt;/st-collapse&gt;

&lt;st-button variant="text" on:click="toggleSection(1)"&gt;问题二&lt;/st-button&gt;

            <section class="doc-section">

                <h3>属性</h3>
                <table class="api">
                  <thead><tr><th>属性</th><th>类型</th><th>默认</th><th>说明</th></tr></thead>
                  <tbody>
                    <tr><td><code>hide</code></td><td>boolean</td><td>无（展开）</td><td>收起为高度 0 + overflow hidden；移除即展开</td></tr>
                    <tr><td><code>style</code></td><td>原生 CSS</td><td>无</td><td>圆角/描边/宽度直接写宿主；高度由组件接管</td></tr>
                  </tbody>
                </table>
              </div>
              <div class="doc-block">
                <h3>插槽 / 事件 / 注意</h3>
                <ul class="api-list">
                  <li>插槽：只有默认插槽，内容完全透传；标题、箭头、触发按钮由使用者自备。</li>
                  <li>事件：无自定义事件；切换 <code>hide</code> 只播放高度动画，不派发 open/close。</li>
                  <li>动画：切换 <code>hide</code> 为 0.3s <code>cubic-bezier(0.2, 0, 0, 1)</code>；内容尺寸变化瞬时跟随（ResizeObserver）。</li>
                  <li>没有 <code>disabled</code>、<code>multiple</code>、<code>accordion</code> 等属性；禁用交互请禁用触发源。</li>
                  <li>收起时内容仍在 DOM 中；需要条件渲染或懒加载，在外部用数据控制内容。</li>
                  <li>嵌套折叠可直接组合；外层会逐帧跟随内层高度，不需要手动调用刷新。</li>
                </ul>
              </div>
