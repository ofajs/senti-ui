<!--
  st-split-button — Senti-UI 分裂按钮（基于 ofa.js）
  主操作区 + 下拉箭头区：点主区触发主操作（click 冒泡），点箭头展开菜单（slot="menu"，放 st-menu-item）。
  语义属性：variant(filled|outlined|text) / color(M3 角色名) / disabled / menu-align(left|right)
  open 为运行时状态（data）：ofa 页面用 sync:open 双向绑定，见 README.md
-->
<template component>
  <style>
    :host {
      position: relative;
      display: inline-flex;
      vertical-align: middle;
      align-items: stretch;
      box-sizing: border-box;
      height: var(--st-height, 2.857em); /* 40px，与 st-button 一致 */
      min-width: var(--st-split-min-width, 9.5em);
      border-radius: var(--st-control-radius, 1.429em);
      border: var(--st-border-width, 1px) solid transparent;
      font-size: var(--st-font-size, 14px);
      font-family: var(--st-font, inherit);
      font-weight: 500;
      letter-spacing: var(--st-letter-spacing, normal);
      background-color: var(--st-split-bg, var(--md-sys-color-primary));
      color: var(--st-split-fg, var(--md-sys-color-on-primary));
      border-color: var(--st-split-border, transparent);
      box-shadow: var(--st-shadow, none);
      -webkit-backdrop-filter: var(--st-backdrop-filter, none);
      backdrop-filter: var(--st-backdrop-filter, none);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    :host([variant="outlined"]) {
      background-color: var(--st-split-bg, transparent);
      color: var(--st-split-fg, var(--md-sys-color-primary));
      border-color: var(--st-split-border, var(--md-sys-color-outline));
    }
    :host([variant="text"]) {
      background-color: var(--st-split-bg, transparent);
      color: var(--st-split-fg, var(--md-sys-color-primary));
    }

    :host([disabled]) {
      cursor: not-allowed;
      opacity: var(--st-disabled-opacity, 0.38);
    }
    :host([disabled]) .zone,
    :host([disabled]) st-ripple {
      pointer-events: none;
    }

    /* 主操作区 + 箭头区：M3 state layer（currentColor 半透明叠加） */
    .zone {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      color: inherit;
      cursor: inherit;
    }
    .main-zone {
      flex: 1;
      min-width: 0;
      gap: 0.571em;
      padding: var(--st-split-padding, 0 1.714em);
      border-radius: var(--st-control-radius, 1.429em) 0 0 var(--st-control-radius, 1.429em);
    }
    .caret-zone {
      flex-shrink: 0;
      aspect-ratio: 1 / 1;
      border-radius: 0 var(--st-control-radius, 1.429em) var(--st-control-radius, 1.429em) 0;
      /* 主区与箭头区的分界线（currentColor 40%） */
      border-left: 1px solid color-mix(in srgb, currentColor 40%, transparent);
    }

    .layer {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background-color: currentColor;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--st-motion-duration, 0.15s) ease;
    }
    .zone:hover .layer { opacity: var(--st-state-hover, 0.08); }
    .zone:active .layer { opacity: var(--st-state-press, 0.12); }

    .zone:focus-visible {
      outline: var(--st-focus-ring-width, 2px) var(--st-focus-ring-style, solid)
        var(--st-focus-ring-color, var(--md-sys-color-on-surface));
      outline-offset: var(--st-focus-ring-offset, 2px);
    }

    .caret-icon {
      width: 1.143em;
      height: 1.143em;
      transition: transform 0.2s ease;
      pointer-events: none;
    }
    .caret-icon.open { transform: rotate(180deg); }

    /* 下拉面板：fixed 定位（JS 计算，翻转避让视口），与 st-menu 一致 */
    .panel {
      display: none;
      position: fixed;
      left: 0;
      top: 0;
      box-sizing: border-box;
      min-width: 8em;
      max-height: 80vh;
      overflow-y: auto;
      padding: var(--st-menu-padding, 0.286em);
      border-radius: var(--st-menu-radius, 0.857em);
      background: var(--st-menu-bg, var(--md-sys-color-surface-container));
      color: var(--md-sys-color-on-surface);
      box-shadow: 0 0 0 var(--st-border-width, 1px) var(--st-menu-border, transparent),
        var(--st-menu-shadow, var(--st-shadow-3, 0 0.071em 0.143em rgba(0, 0, 0, 0.3), 0 0.143em 0.429em 0.143em rgba(0, 0, 0, 0.15)));
      backdrop-filter: var(--st-menu-backdrop-filter, none);
      -webkit-backdrop-filter: var(--st-menu-backdrop-filter, none);
      z-index: 1000;
      transform-origin: 50% 0;
      animation: st-split-in var(--st-overlay-enter-duration, 0.2s)
        var(--st-motion-easing, cubic-bezier(0.2, 0, 0, 1));
    }
    .panel.closing {
      pointer-events: none;
      opacity: 0;
      transform: translateY(-0.429em) scale(0.98);
      transition: opacity var(--st-overlay-exit-duration, 0.15s) ease,
        transform var(--st-overlay-exit-duration, 0.15s) ease;
    }
    @keyframes st-split-in {
      from { opacity: 0; transform: translateY(-0.429em) scale(0.98); }
      to { opacity: 1; transform: none; }
    }
    ::slotted(hr) {
      display: block;
      width: 100%;
      margin: 0.286em 0;
      border: none;
      border-top: 1px solid var(--md-sys-color-outline-variant);
    }
    @media (prefers-reduced-motion: reduce) {
      .panel, .caret-icon { animation: none; transition: none; }
    }

    l-m { display: none; }
  </style>

  <l-m src="../ripple/ripple.html"></l-m>
  <l-m src="../menu/menu-item.html"></l-m>

  <button class="zone main-zone" type="button" tabindex="0">
    <span class="layer"></span>
    <slot name="prefix"></slot>
    <slot></slot>
    <st-ripple></st-ripple>
  </button>
  <button class="zone caret-zone" type="button" tabindex="0" aria-haspopup="menu">
    <span class="layer"></span>
    <svg class="caret-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m6 9l6 6l6-6" />
    </svg>
    <st-ripple></st-ripple>
  </button>

  <div class="panel"><slot name="menu"></slot></div>

  <script>
    import "../color/st-color-init.js";
    import { syncAccessibleName } from "../a11y/a11y.js";
    export default async () => ({
      tag: "st-split-button",
      attrs: {
        variant: "filled",
        color: null,
        disabled: null,
        menuAlign: "right",
        menuLabel: "打开菜单",
      },
      data: {
        // open 是运行时状态（data，非标签属性）：选中菜单项 / 外部点击自动关闭改 this.open，
        // 经 sync:open 双向绑定回写上层（同 st-dialog 的状态建模，见 CONTEXT.md 代码层级规范）
        open: false,
      },
      watch: {
        open(val) {
          // data watch 初始化也会触发一次（坑 #27），值未变时无副作用
          const panel = this.ele.shadowRoot.querySelector(".panel");
          const caret = this.ele.shadowRoot.querySelector(".caret-icon");
          const caretZone = this.ele.shadowRoot.querySelector(".caret-zone");
          // data → 宿主属性（兼容 setAttribute / CSS，也便于外部读取状态）
          if (val) this.ele.setAttribute("open", "");
          else this.ele.removeAttribute("open");
          caretZone.setAttribute("aria-expanded", val ? "true" : "false");
          caret.classList.toggle("open", val);
          if (val) {
            // 先渲染再定位，避免闪烁；重新打开时取消关闭过渡并重启进入动画
            clearTimeout(this._closeTimer);
            panel.classList.remove("closing");
            panel.style.display = "block";
            // 定位探测期间禁用入场动画，定位完成后只启动一次（避免重复重播）
            panel.style.animation = "none";
            this.updatePosition();
            // 菜单项是 slot 里的自定义元素，升级后宽度可能变化：下一帧再定位一次
            requestAnimationFrame(() => {
              if (!this.open) return;
              this.updatePosition();
              panel.style.animation = "";
            });
            // 菜单项升级/字体度量稳定后可能再变宽：延迟兜底重定位一次
            clearTimeout(this._repositionTimer);
            this._repositionTimer = setTimeout(() => {
              if (this.open) this.updatePosition();
            }, 120);
            this.bindDocEvents();
            this.ele.dispatchEvent(new Event("open", { bubbles: true, composed: true }));
          } else {
            panel.classList.add("closing");
            clearTimeout(this._closeTimer);
            this._closeTimer = setTimeout(() => {
              panel.style.display = "none";
              panel.classList.remove("closing");
            }, 180);
            this.unbindDocEvents();
            this.ele.dispatchEvent(new Event("close", { bubbles: true, composed: true }));
          }
        },
        color() { this.applyColor(); },
        variant() { this.applyColor(); },
        // watch 初始化也会触发一次（坑 #27），applyDisabled 无副作用
        disabled() { this.applyDisabled?.(); },
        menuLabel() {
          this.ele.shadowRoot
            ?.querySelector(".caret-zone")
            ?.setAttribute("aria-label", this.menuLabel || "打开菜单");
        },
      },
      ready() {
        const ele = this.ele;
        const sr = ele.shadowRoot;
        const mainZone = sr.querySelector(".main-zone");
        const caretZone = sr.querySelector(".caret-zone");

        // 主区名称来自默认插槽（排除 menu 插槽里的菜单项文字）；箭头区用固定语义标签
        this._a11yCleanup = syncAccessibleName(ele, mainZone, {
          fromSlot: true,
          excludeSlots: ["menu"],
        });
        caretZone.setAttribute("aria-label", this.menuLabel || "打开菜单");
        caretZone.setAttribute("aria-expanded", this.open === true ? "true" : "false");

        // 属性 → data 兼容路径（README 曾承诺 setAttribute("open") 有效）
        if (ele.hasAttribute("open")) this.open = true;
        this._attrObserver = new MutationObserver(() => {
          const attrOpen = ele.hasAttribute("open");
          if (attrOpen !== (this.open === true)) this.open = attrOpen;
        });
        this._attrObserver.observe(ele, { attributes: true, attributeFilter: ["open"] });

        this._onDocPointerDown = (e) => {
          // 坑 #21：composed 事件必须用 composedPath 判断
          if (e.composedPath().includes(ele)) return;
          this.open = false;
        };
        this._onDocKeydown = (e) => {
          if (e.key === "Escape" && this.open) this.open = false;
        };
        this._onReposition = () => this.updatePosition();

        // 主区 click 天然冒泡 + composed 到宿主（主操作由外部 on:click 监听）
        // 箭头区点击只负责开合菜单，绝不触发主操作
        sr.querySelector(".caret-zone").addEventListener("click", (e) => {
          e.stopPropagation();
          e.preventDefault();
          if (this.disabled === null) this.open = !this.open;
        });
        // 箭头区键盘：Enter/Space 开合
        sr.querySelector(".caret-zone").addEventListener("keydown", (e) => {
          if (this.disabled === null && (e.key === " " || e.key === "Enter")) {
            e.preventDefault();
            this.open = !this.open;
          }
        });
        // 主区/箭头区 disabled：原生 button.disabled 阻断（坑 #29）
        this.applyDisabled = () => {
          const dis = this.disabled !== null;
          sr.querySelector(".main-zone").disabled = dis;
          sr.querySelector(".caret-zone").disabled = dis;
        };

        // 菜单内任意点击后自动关闭；item 自身的 click 已先触发，
        // 截断冒泡避免误触发宿主上绑定的主操作
        sr.querySelector(".panel").addEventListener("click", (e) => {
          e.stopPropagation();
          if (this.open) this.open = false;
        });

        // 面板宽度变化（菜单项升级/内容变化）时重新对齐
        this._panelObserver = new ResizeObserver(() => {
          if (this.open) this.updatePosition();
        });
        this._panelObserver.observe(sr.querySelector(".panel"));

        this.applyDisabled();
        this.applyColor();
      },
      detached() {
        clearTimeout(this._closeTimer);
        clearTimeout(this._repositionTimer);
        this.unbindDocEvents();
        this._attrObserver?.disconnect();
        this._panelObserver?.disconnect();
        this._a11yCleanup?.();
      },
      proto: {
        updatePosition() {
          if (!this.open) return;
          const panel = this.ele.shadowRoot.querySelector(".panel");
          const rect = this.ele.getBoundingClientRect();
          // 先应用 min-width 再量宽度，避免“量完又变宽”导致右对齐偏出
          panel.style.minWidth = Math.max(rect.width, 112) + "px";
          const panelW = panel.offsetWidth;
          const panelH = panel.offsetHeight;
          const vw = window.innerWidth;
          const vh = window.innerHeight;
          const margin = 8;
          const gap = 4;

          let left =
            (this.menuAlign || "right") === "left"
              ? rect.left
              : rect.right - panelW;
          left = Math.max(margin, Math.min(left, vw - panelW - margin));

          let top = rect.bottom + gap;
          if (top + panelH > vh - margin) {
            const topAbove = rect.top - panelH - gap;
            top = topAbove >= margin ? topAbove : Math.max(margin, vh - panelH - margin);
          }

          // position:fixed 的 containing block 可能是最近的 transform 祖先（坑 #42）：
          // 先摆到 0,0 量出原点，再把视口坐标换算成相对坐标，任何容器内都不会漂移。
          panel.style.left = "0px";
          panel.style.top = "0px";
          const cbOrigin = panel.getBoundingClientRect();
          panel.style.left = left - cbOrigin.left + "px";
          panel.style.top = top - cbOrigin.top + "px";
        },
        bindDocEvents() {
          if (this._docBound) return;
          document.addEventListener("pointerdown", this._onDocPointerDown, true);
          document.addEventListener("keydown", this._onDocKeydown, true);
          window.addEventListener("resize", this._onReposition, true);
          document.addEventListener("scroll", this._onReposition, true);
          this._docBound = true;
        },
        unbindDocEvents() {
          if (!this._docBound) return;
          document.removeEventListener("pointerdown", this._onDocPointerDown, true);
          document.removeEventListener("keydown", this._onDocKeydown, true);
          window.removeEventListener("resize", this._onReposition, true);
          document.removeEventListener("scroll", this._onReposition, true);
          this._docBound = false;
        },
        // color 接受 M3 角色名或 color 模块自定义变量名，按 variant 分派（同 st-button）
        // 只写自己的 --st-split-* 变量，不碰宿主 style（避免清掉使用者内联样式，坑 #46）
        applyColor() {
          const s = this.ele.style;
          for (const prop of ["--st-split-bg", "--st-split-fg", "--st-split-border"]) {
            s.removeProperty(prop);
          }
          const name = this.color;
          if (!name) return;
          const main = `var(--md-sys-color-${name}, var(--${name}, var(--md-sys-color-primary)))`;
          const on = `var(--md-sys-color-on-${name}, var(--on-${name}, var(--md-sys-color-on-primary)))`;
          if (this.variant === "outlined") {
            s.setProperty("--st-split-fg", main);
            s.setProperty("--st-split-border", main);
          } else if (this.variant === "text") {
            s.setProperty("--st-split-fg", main);
          } else {
            s.setProperty("--st-split-bg", main);
            s.setProperty("--st-split-fg", on);
          }
        },
      },
    });
  </script>
</template>
