<!--
  st-list-item — Senti-UI 列表项组件（基于 ofa.js）
  语义属性：button（可点击，hover 态 + 波纹 + click 事件）/ disabled / collapsible + expanded（sublist 折叠）
  插槽：prefix / 默认（正文）/ suffix / sublist；视觉在 :host 上可直接覆盖，见 README.md
-->
<template component>
  <style>
    :host {
      display: block;
      position: relative;
      font-size: var(--st-font-size, 14px);
      line-height: 1.5;
      border-radius: var(--st-list-item-radius, 0.5em);
      color: var(--md-sys-color-on-surface);
    }
    /* 首尾项外圆角（嵌套子列表同理） */
    :host(:first-child) {
      border-radius: var(--st-list-item-radius-outer, 1.143em) var(--st-list-item-radius-outer, 1.143em)
        var(--st-list-item-radius, 0.5em) var(--st-list-item-radius, 0.5em);
    }
    :host(:last-child) {
      border-radius: var(--st-list-item-radius, 0.5em) var(--st-list-item-radius, 0.5em)
        var(--st-list-item-radius-outer, 1.143em) var(--st-list-item-radius-outer, 1.143em);
    }
    :host(:first-child:last-child) {
      border-radius: var(--st-list-item-radius-outer, 1.143em);
    }

    .main {
      position: relative;
      display: flex;
      align-items: center;
      box-sizing: border-box;
      min-height: var(--st-list-item-height, 3em);
      padding: var(--st-list-item-padding, 0.5em 1em);
      border-radius: inherit;
    }

    /* M3 state layer：currentColor 半透明叠加 */
    .layer {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: currentColor;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--st-motion-duration, 0.15s) ease;
    }
    :host([button]:hover) .layer { opacity: var(--st-state-hover, 0.08); }
    :host([button]:active) .layer { opacity: var(--st-state-press, 0.12); }

    :host([disabled]) {
      cursor: not-allowed;
    }
    :host([disabled]) .main {
      opacity: var(--st-disabled-opacity, 0.38);
    }
    :host([disabled]) .layer { display: none; }

    .prefix,
    .suffix {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      gap: 0.571em;
    }
    .prefix { margin-right: 1em; color: var(--md-sys-color-on-surface-variant); }
    .suffix { margin-left: 0.571em; color: var(--md-sys-color-on-surface-variant); }

    /* 嵌套缩进：宽度由 JS 按祖先 st-list 层数设置（层级 × --st-list-step，默认每层 1em），
       以"行内占位"呈现——点击行/hover/波纹仍是整行宽，不像 sublist 加 margin 会挤压交互区。
       不能用 CSS 变量沿层级累加：同名自定义属性自引用（--x: calc(var(--x) + …)）按规范整条无效 */
    .left-indent {
      flex-shrink: 0;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }
    ::slotted([slot="prefix"]),
    ::slotted([slot="suffix"]) {
      display: inline-flex;
    }
    /* 副文本：slotted 元素加 secondary 属性 */
    ::slotted([secondary]) {
      font-size: 0.857em;
      line-height: 1.4;
      color: var(--md-sys-color-on-surface-variant);
    }

    .expand-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform var(--st-motion-duration-base, 0.2s) var(--st-motion-easing, ease);
    }
    /* 坑 #20：反向逻辑——默认旋转收起态，expanded 正向展开 */
    .expand-icon { transform: rotate(-90deg); }
    :host([expanded]) .expand-icon { transform: none; }

    .sublist {
      display: block;
    }

    /* 内部透明原生 button：承载点击/键盘/焦点语义（button / collapsible 时） */
    .native {
      all: unset;
      position: absolute;
      inset: 0;
      z-index: 2; /* 盖住 position:relative 的兄弟元素，保证点击/键盘都落在语义元素上 */
      cursor: pointer;
      border-radius: inherit;
      display: none;
    }
    :host([button]) .native,
    :host([collapsible]) .native { display: block; }
    .native:focus-visible {
      outline: var(--st-focus-ring-width, 2px) var(--st-focus-ring-style, solid)
        var(--st-focus-ring-color, var(--md-sys-color-on-surface));
      outline-offset: calc(-1 * var(--st-focus-ring-width, 2px));
    }

    /* 只有 button / collapsible 项才有交互波纹；纯展示项不响应 */
    st-ripple { display: none; }
    :host([button]) st-ripple,
    :host([collapsible]) st-ripple { display: block; }

    l-m { display: none; }

    /* 减少动态效果：动画/过渡压到近零，同时保留 animationend 等事件语义 */
    @media (prefers-reduced-motion: reduce) {
      :host,
      :host * {
        animation-delay: 0s !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

  <l-m src="../ripple/ripple.html"></l-m>
  <l-m src="../collapse/collapse.html"></l-m>

  <div class="main">
    <span class="layer"></span>
    <div class="left-indent"></div>
    <div class="prefix"><slot name="prefix"></slot></div>
    <div class="content"><slot></slot></div>
    <div class="suffix">
      <slot name="suffix"></slot>
      <div class="expand-icon" style="display:none;">
        <svg xmlns="http://www.w3.org/2000/svg" width="1.143em" height="1.143em" viewBox="0 0 24 24">
          <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m17 10l-5 5l-5-5"/>
        </svg>
      </div>
    </div>
    <st-ripple></st-ripple>
    <button class="native" type="button"></button>
  </div>

  <div class="sublist">
    <!-- 非 collapsible 项的 sublist 恒展开；只有 collapsible 且未 expanded 时才收起 -->
    <st-collapse attr:hide="collapsible !== null && expanded === null">
      <slot name="sublist"></slot>
    </st-collapse>
  </div>

  <script>
    import "../color/st-color-init.js";
    import { syncAccessibleName } from "../a11y/a11y.js";
    export default async () => ({
      tag: "st-list-item",
      attrs: {
        button: null,
        disabled: null,
        collapsible: null,
        expanded: null,
      },
      ready() {
        const ele = this.ele;
        const sr = ele.shadowRoot;

        // 嵌套缩进（自顶向下传播）：父项在 sublist slot 变化时把"深度 + 1"推给已分配的
        // 子 st-list（存 _stListDepth），并递归通知其中的子项——不依赖 parentElement /
        // assignedSlot 祖先链（ofa 页面模块可能重排嵌套 light DOM，链路不可靠）
        const applyDepth = () => {
          const d = ele._stListDepth || 0;
          sr.querySelector(".left-indent").style.width =
            d > 0 ? `calc(${d} * var(--st-list-step, 1em))` : "";
        };
        ele._onListDepth = (d) => {
          ele._stListDepth = d;
          applyDepth();
          pushDepth(); // 深度变化时向下一级重新传播
        };
        const pushDepth = () => {
          const d = (ele._stListDepth || 0) + 1;
          sr.querySelector('slot[name="sublist"]').assignedElements().forEach((el) => {
            if (el.tagName === "ST-LIST") {
              el.querySelectorAll("st-list-item").forEach((item) => item._onListDepth?.(d));
            }
          });
        };
        sr.querySelector('slot[name="sublist"]').addEventListener("slotchange", pushDepth);
        applyDepth();
        // 页面模块渲染可能在组件升级后才完成 slot 分配，延迟重推兜底
        requestAnimationFrame(pushDepth);
        setTimeout(pushDepth, 100);
        // 动态增删子列表项时也要重推深度（slotchange 只在 slot 分配变化时触发，
        // 不会因为已有 st-list 内部追加子项而触发）
        this._lightObserver = new MutationObserver(() => pushDepth());
        this._lightObserver.observe(ele, { childList: true, subtree: true });

        // collapsible 时显示展开箭头；非 collapsible 时 sublist 经 st-collapse 恒展开显示
        this._syncIcon = () => {
          sr.querySelector(".expand-icon").style.display =
            this.collapsible !== null ? "" : "none";
        };
        this._syncIcon();

        const native = sr.querySelector(".native");
        // disabled 同步到内部原生 button：原生 disabled 天然阻断点击/键盘/焦点
        this.applyDisabled = () => {
          native.disabled = this.disabled !== null;
          native.setAttribute("aria-disabled", this.disabled !== null ? "true" : "false");
        };
        // collapsible 项暴露展开状态；普通项不设置
        this.applyExpanded = () => {
          if (this.collapsible !== null) {
            native.setAttribute("aria-expanded", this.expanded !== null ? "true" : "false");
          } else {
            native.removeAttribute("aria-expanded");
          }
        };
        this.applyDisabled();
        this.applyExpanded();
        this._a11yCleanup = syncAccessibleName(ele, native, {
          fromSlot: true,
          excludeSlots: ["sublist", "prefix", "suffix"],
        });

        // 交互语义由内部 .native button 承载：
        // - 折叠项：点击切换 expanded（不冒泡，避免触发外部点击逻辑）
        // - button 项：click 天然冒泡 + composed 到宿主，无需手动派发
        native.addEventListener("click", (e) => {
          if (this.disabled !== null || this.collapsible === null) return;
          e.stopPropagation(); // 折叠项点击只切换 expanded，不作为 click 事件传出
          if (this.expanded !== null) ele.removeAttribute("expanded");
          else ele.setAttribute("expanded", "");
        });
      },
      watch: {
        // watch 初始化也会触发一次（坑 #27），无副作用的同步天然安全
        collapsible() { this._syncIcon?.(); this.applyExpanded?.(); },
        disabled() { this.applyDisabled?.(); },
        expanded() { this.applyExpanded?.(); },
      },
      detached() {
        this._lightObserver?.disconnect();
        this._a11yCleanup?.();
      },
    });
  </script>
</template>
