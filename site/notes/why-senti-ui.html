          <h1>为什么要开发 Senti-UI</h1>
          <p class="lead">
            当 AI 已经能生成任何风格，组件库的价值不再是提供一套好看的外观，
            而是让外观可以被安全地替换。
          </p>
          <div class="note-meta">
            <span class="tag">设计理念</span>
            <span>2026-11-01</span>
            <span class="divider" aria-hidden="true"></span>
            <span>约 4 分钟</span>
          </div>
        </header>

        <div class="note-body">
          <p>
            和 AI 一起做网页，最直观的变化是：描述 Apple 的毛玻璃、Windows 11 的 Mica、
            Material 3 的色调，很快就能得到一个像样的页面。风格本身，已经不再是瓶颈。
          </p>

          <h2><span class="num">01</span>麻烦不在风格，在组件</h2>
          <p>
            一个按钮可以写出无数种样子，但页面复杂之后，问题会从“像不像”变成“能不能用”：
            表单怎么校验、错误怎么被读屏读到、菜单会不会被裁掉、弹窗打开后焦点去了哪里。
          </p>
          <p>
            这些行为和风格无关，却决定了产品是否可用。如果每换一种风格就重写一遍，
            成本会随风格和组件数量一起增长。最后常见的结果是：同一个输入框，
            在三个页面里有三种校验提示。
          </p>

          <h2><span class="num">02</span>被反复重写的，是同一批组件</h2>
          <p>
            按钮、输入框、选择器、对话框、菜单，视觉可以千差万别，功能骨架却高度相似。
            随风格变化的是圆角、密度、描边、阴影和动效；不变的是角色、状态与交互契约。
          </p>
          <p>
            既然基础组件的功能本来就是一回事，能不能把用法统一起来，让风格成为可替换的一层？
          </p>

          <blockquote>
            <p>风格是变量，行为是常量。</p>
            <cite>Senti-UI 的基本假设</cite>
          </blockquote>

          <h2><span class="num">03</span>把行为和材质拆开</h2>
          <p>这就是 Senti-UI 的起点：同一套组件承载行为，皮肤承载材质。</p>
          <ul>
            <li><strong>标签与语义统一</strong>：<code>st-*</code> 组件用 <code>variant</code> / <code>disabled</code> / <code>loading</code> / <code>color</code> 表达状态，换项目不用重新学 API。</li>
            <li><strong>外观回归 CSS</strong>：高度、间距、圆角直接写宿主，不发明样式代理变量。</li>
            <li><strong>颜色只走 M3 角色</strong>：种子色、error、success 与深浅色自动贯穿。</li>
            <li><strong>材质交给皮肤</strong>：<code>data-skin</code> 只切换密度、描边、毛玻璃、焦点环和动效。</li>
          </ul>
          <p>换风格不是再写一套 Button，而是给同一套 Button 换一层材质。</p>

          <blockquote>
            <p>组件负责正确，皮肤负责好看。</p>
            <cite>分工原则</cite>
          </blockquote>

          <h2><span class="num">04</span>一套可复用的定制范式</h2>
          <p>
            没有约束，“换皮肤”也会变成混乱：每个人往组件里塞颜色和尺寸，
            组件最终被某一种风格绑死。所以 Senti-UI 把可定制面收窄成三条约定：
          </p>
          <ul class="principles">
            <li>
              <b>01 / SEMANTICS</b>
              <span>语义用属性，外观用原生 CSS。属性只表达状态与行为；尺寸、圆角直接覆写宿主。</span>
            </li>
            <li>
              <b>02 / COLOR</b>
              <span>颜色只走 M3 角色。组件只消费 <code>--md-sys-color-*</code>，皮肤不夹带颜色。</span>
            </li>
            <li>
              <b>03 / MATERIAL</b>
              <span>皮肤只改材质。不改结构、不改交互，也不依赖 <code>::part</code> 或文档树。</span>
            </li>
          </ul>
          <p>
            这让 AI 不必读完成百上千行组件源码，只要知道有哪些材质 token 和颜色角色；
            新增风格，也不必碰组件逻辑。它要生成的是一份皮肤 CSS，而不是一套新的组件实现。
          </p>

          <h2><span class="num">05</span>统一用法，减少幻觉</h2>
          <p>
            统一的标签、属性、插槽、事件和状态命名，最大的收益不是少写代码，而是减少不确定性。
            模型不用每次猜 <code>value</code> 还是 <code>modelValue</code>、<code>open</code> 还是
            <code>visible</code>，上一个页面的用法可以直接迁移到下一个。
          </p>
          <p>
            文档也按这个目标写：每个组件一页，属性、插槽、事件、默认值、可运行示例都在同一处。
            对人方便查，对 AI 是约束。猜测越少，幻觉越少。
          </p>

          <p>
            我们不是想让所有网站长得一样。同一个 <code>st-button</code>，在 M3 里可以是填充按钮，
            在 Apple 里是毛玻璃，在 Windows 11 里是 4px 圆角的 Fluent 控件，
            而它的加载态、禁用态、键盘行为和语义色始终一致。
          </p>
          <p><strong>组件是稳定的，材质是自由的。</strong>这是我们开发 Senti-UI 的原因。</p>
