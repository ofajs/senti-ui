            <h2>为什么要开发 Senti-UI</h2>
            <p>
              过去我们用前端框架省下组件开发时间，也顺便接受了它的设计语言。
              AI 让重新开发变得划算，Senti-UI 则想成为更适合 AI 使用的前端框架：
              行为统一，VI 留给皮肤。
            </p>
