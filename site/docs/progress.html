                  <li><code>prefers-reduced-motion</code> 下动画时长会趋零。</li>

            demo5Code: "<div class=\"demo-cell\">\n                    <span class=\"demo-label\">primary（默认）</span>\n                    <st-progress value=\"70\" style=\"width: 100%;\"></st-progress>\n                  </div>\n                  <div class=\"demo-cell\">\n                    <span class=\"demo-label\">success</span>\n                    <st-progress value=\"70\" color=\"success\" style=\"width: 100%;\"></st-progress>\n                  </div>\n                  <div class=\"demo-cell\">\n                    <span class=\"demo-label\">error</span>\n                    <st-progress value=\"70\" color=\"error\" style=\"width: 100%;\"></st-progress>\n                  </div>\n                  <div class=\"demo-cell\">\n                    <span class=\"demo-label\">tertiary</span>\n                    <st-progress value=\"70\" color=\"tertiary\" style=\"width: 100%;\"></st-progress>\n                  </div>\n                  <div class=\"demo-cell\">\n                    <span class=\"demo-label\">环形 · error</span>\n                    <st-progress circular value=\"70\" color=\"error\"></st-progress>\n                  </div>\n                  <div class=\"demo-cell\">\n                    <span class=\"demo-label\">环形 · success</span>\n                    <st-progress circular value=\"70\" color=\"success\"></st-progress>\n                  </div>",
            demo6Code: "<div style=\"display: grid; gap: 14px; width: 100%; max-width: 540px;\">\n                    <div style=\"display: grid; gap: 6px;\">\n                      <div style=\"display: flex; justify-content: space-between; gap: 10px; align-items: baseline;\">\n                        <span class=\"demo-label\">照片同步</span>\n                        <span style=\"font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: var(--md-sys-color-on-surface-variant);\">{{photo}}%</span>\n                      </div>\n                      <st-progress attr:value=\"photo\" style=\"width: 100%;\"></st-progress>\n                    </div>\n                    <div style=\"display: grid; gap: 6px;\">\n                      <div style=\"display: flex; justify-content: space-between; gap: 10px; align-items: baseline;\">\n                        <span class=\"demo-label\">云盘备份</span>\n                        <span style=\"font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: var(--md-sys-color-on-surface-variant);\">{{backup}}%</span>\n                      </div>\n                      <st-progress attr:value=\"backup\" color=\"success\" style=\"width: 100%;\"></st-progress>\n                    </div>\n                    <div style=\"display: grid; gap: 6px;\">\n                      <div style=\"display: flex; justify-content: space-between; gap: 10px; align-items: baseline;\">\n                        <span class=\"demo-label\">病毒扫描</span>\n                        <span style=\"font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: var(--md-sys-color-on-surface-variant);\">{{scan}}%</span>\n                      </div>\n                      <st-progress attr:value=\"scan\" color=\"tertiary\" style=\"width: 100%;\"></st-progress>\n                    </div>\n                  </div>\n                  <div class=\"row\">\n                    <st-button variant=\"outlined\" on:click=\"advance\">推进任务</st-button>\n                    <st-button variant=\"text\" on:click=\"clearTasks\">清零</st-button>\n                  </div>\n                  <span class=\"demo-note\">三个进度分别绑定 photo / backup / scan；推进任务每次各加一截，到 100 停止。</span>",
            progress: 36,
            photo: 45,
            backup: 80,
            scan: 20,
          },
          proto: {
            toggleCode(key) {
              this.codeView[key] = !this.codeView[key];
            },
            step(delta) {
              this.progress = Math.max(0, Math.min(100, this.progress + delta));
            },
            reset() {
              this.progress = 0;
            },
            simulate() {
              clearInterval(this._timer);
              this.progress = 0;
              this._timer = setInterval(() => {
                this.progress = Math.min(this.progress + 5, 100);
                if (this.progress >= 100) clearInterval(this._timer);
              }, 120);
            },
            advance() {
              this.photo = Math.min(this.photo + 12, 100);
              this.backup = Math.min(this.backup + 8, 100);
              this.scan = Math.min(this.scan + 15, 100);
            },
            clearTasks() {
              this.photo = 0;
              this.backup = 0;
              this.scan = 0;
            },
          },
        });
      </script>
