<!--
  st-nav-bar — Senti-UI 导航栏组件（基于 ofa.js）
  子项为 light DOM 的 st-nav-item（active 属性标记当前项，由外部切换）；
  药丸形高亮背景自动动画跟随 active 项，见 README.md
-->
<template component>
  <style>
    :host {
      position: relative;
      display: flex;
      box-sizing: border-box; /* height:100% 与 padding 不叠加超出容器 */
      align-items: center;
      justify-content: center;
      gap: 0.286em;
      font-size: 14px;
      font-family: inherit;
      background: var(--md-sys-color-surface-container);
    }

    /* 纵向模式（侧栏/rail）：子项纵向堆叠 */
    :host([vertical]) {
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      gap: 0.143em;
      padding: 0.286em;
    }

    /* 药丸形 active 背景：secondary-container，M3 emphasized 曲线跟随动画 */
    .active-bg {
      position: absolute;
      width: 0;
      height: 0;
      border-radius: 2em;
      background: var(--md-sys-color-secondary-container);
      opacity: 0;
      pointer-events: none;
      transition:
        left 0.3s cubic-bezier(0.2, 0, 0, 1),
        top 0.3s cubic-bezier(0.2, 0, 0, 1),
        width 0.3s cubic-bezier(0.2, 0, 0, 1),
        height 0.3s cubic-bezier(0.2, 0, 0, 1),
        opacity 0.2s ease;
    }
    .active-bg.not-animate { transition: none !important; }

    l-m { display: none; }
  </style>

  <l-m src="./nav-item.html"></l-m>
  <slot></slot>
  <div class="active-bg"></div>

  <script>
    import "../color/st-color-init.js";
    export default async () => ({
      tag: "st-nav-bar",
      attrs: {
        vertical: null, // 子项排列方向：横向一行（默认）/ 纵向一列
      },
      proto: {
        // 定位 active 药丸到 active 项的指示区域（30ms 合并连续切换）。
        // 必须用布局坐标（offsetLeft/Top/Width/Height）而非 getBoundingClientRect：
        // 后者含祖先 transform——导航在 st-dialog 等容器里时，初始定位常撞上
        // 容器开启动画的中间态（scale/translate 未归位），量出压扁 / 偏移的值；
        // 且祖先动画结束不触发自身 ResizeObserver，错位就此定格（实测踩坑）。
        // offset 系是纯布局值，对祖先 transform 与动画免疫
        updateActive() {
          if (this._timer) return;
          this._timer = setTimeout(() => {
            this._timer = null;
            const ele = this.ele;
            // 隐藏态（display:none 祖先）没有盒子，offset 全 0：跳过定位，
            // 等可见时 ResizeObserver 会再触发
            if (!ele.offsetWidth && !ele.offsetHeight) return;
            const items = ele.querySelectorAll("st-nav-item");
            const active = Array.from(items).find((it) => it.hasAttribute("active"));
            const bg = ele.shadowRoot.querySelector(".active-bg");
            if (!active) {
              bg.style.opacity = "0";
              return;
            }
            // 对齐指示区：active 子项带 parallel（文字在右）时整行背景
            // （item 相对 bar 的布局坐标），否则子项内部药丸区（.pill 相对
            // item 的布局坐标 + item 在 bar 内的偏移；item host 是
            // position:relative，恰好是 .pill 的 offsetParent）
            const pill = active.shadowRoot.querySelector(".pill");
            if (active.hasAttribute("parallel") || !pill) {
              bg.style.left = active.offsetLeft + "px";
              bg.style.top = active.offsetTop + "px";
              bg.style.width = active.offsetWidth + "px";
              bg.style.height = active.offsetHeight + "px";
            } else {
              bg.style.left = active.offsetLeft + pill.offsetLeft + "px";
              bg.style.top = active.offsetTop + pill.offsetTop + "px";
              bg.style.width = pill.offsetWidth + "px";
              bg.style.height = pill.offsetHeight + "px";
            }
            bg.style.opacity = "1";
          }, 30);
        },
      },
      ready() {
        const ele = this.ele;
        this._itemObserver = new MutationObserver(() => this.updateActive());
        const observeItems = () => {
          ele.querySelectorAll("st-nav-item").forEach((it) => {
            this._itemObserver.observe(it, { attributes: true, attributeFilter: ["active", "parallel"] });
          });
        };
        observeItems();
        this._childObserver = new MutationObserver(observeItems);
        this._childObserver.observe(ele, { childList: true });
        this.updateActive();
      },
      attached() {
        // 尺寸变化时瞬时重定位（不带动画）
        const bg = () => this.ele.shadowRoot.querySelector(".active-bg");
        this._resizeObserver = new ResizeObserver(() => {
          bg().classList.add("not-animate");
          this.updateActive();
          clearTimeout(this._resizeTimer);
          this._resizeTimer = setTimeout(() => bg().classList.remove("not-animate"), 50);
        });
        this._resizeObserver.observe(this.ele);
      },
      detached() {
        this._itemObserver?.disconnect();
        this._childObserver?.disconnect();
        this._resizeObserver?.disconnect();
      },
    });
  </script>
</template>
