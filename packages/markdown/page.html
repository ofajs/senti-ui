  <script>
    const CHUNKS = [
      "# 流式 Markdown\n\n",
      "这是逐段填充的 **Markdown**，",
      "还没闭合的代码块会先渲染到文末。\n\n",
      "```js\n",
      "const answer = 42;\n",
      "console.log(answer);\n",
      "```\n\n",
      "| 能力 | 状态 |\n",
      "| --- | :---: |\n",
      "| 代码块 | ✅ |\n",
      "| 表格 | ✅ |\n",
      "| 增量渲染 | ✅ |\n",
    ];

    export default async () => ({
      data: {
        streamText: "",
        streaming: false,
        streamIndex: 0,
        copyCount: 0,
      },
      proto: {
        startStream() {
          clearInterval(this._timer);
          this.streamText = "";
          this.streamIndex = 0;
          this.streaming = true;
          this._timer = setInterval(() => this.nextChunk(), 110);
        },
        nextChunk() {
          if (this.streamIndex >= CHUNKS.length) {
            this.streaming = false;
            clearInterval(this._timer);
            this._timer = null;
            return;
          }
          this.streamText += CHUNKS[this.streamIndex++];
          if (this.streamIndex >= CHUNKS.length) {
            this.streaming = false;
            clearInterval(this._timer);
            this._timer = null;
          }
        },
        appendOne() {
          if (this.streamIndex >= CHUNKS.length) return;
          this.streaming = true;
          this.streamText += CHUNKS[this.streamIndex++];
        },
        resetStream() {
          clearInterval(this._timer);
          this._timer = null;
          this.streamText = "";
          this.streamIndex = 0;
          this.streaming = false;
        },
        onCopy(e) {
          this.copyCount += 1;
          this.lastCopy = e.detail?.code || "";
        },
        focusCopy() {
          const btn = this.ele.shadowRoot
            .querySelector("#static-md")
            .shadowRoot.querySelector(".copy");
          btn?.focus();
        },
      },
      detached() {
        clearInterval(this._timer);
      },
    });
  </script>
