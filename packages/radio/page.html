<!-- st-radio 验收页，由同目录 index.html 通过 <o-page> 加载 -->
<template page>
  <style>
    :host { display: grid; gap: 20px; padding: 40px; align-content: start; }
    section { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
    h3 { margin: 0; font-size: 14px; color: var(--md-sys-color-on-surface-variant); width: 100%; }
  </style>

  <section>
    <h3>同组互斥（name="fruit"）</h3>
    <st-radio name="fruit" checked>苹果</st-radio>
    <st-radio name="fruit">香蕉</st-radio>
    <st-radio name="fruit" disabled>樱桃（禁用）</st-radio>
  </section>

  <section>
    <h3>另一组（name="size"，color="tertiary"）</h3>
    <st-radio name="size" color="tertiary" checked>S</st-radio>
    <st-radio name="size" color="tertiary">M</st-radio>
    <st-radio name="size" color="tertiary">L</st-radio>
  </section>

  <section>
    <h3>等比缩放 + color="error"</h3>
    <st-radio name="err" color="error" checked style="font-size: 12px;">12px</st-radio>
    <st-radio name="err" color="error" style="font-size: 20px;">20px</st-radio>
  </section>

  <section>
    <h3>数据绑定（attr:checked）</h3>
    <st-radio name="sync" attr:checked="pick === 0" on:click="pick = 0">方案 A</st-radio>
    <st-radio name="sync" attr:checked="pick === 1" on:click="pick = 1">方案 B</st-radio>
    <span class="state">pick 数据：<span class="code" style="font-family: ui-monospace, monospace;">{{pick}}</span></span>
  </section>

  <section>
    <h3>JS 主动操作（setAttribute 选中）</h3>
    <st-radio name="js" id="js-rd">JS 控制</st-radio>
    <st-button variant="outlined" on:click="jsPick">选中它</st-button>
  </section>

  <section>
    <h3>聚焦与键盘</h3>
    <p style="margin:0; font-size:13px; color: var(--md-sys-color-on-surface-variant);">
      <span class="code" style="font-family: ui-monospace, monospace;">Tab</span> 聚焦、<span class="code" style="font-family: ui-monospace, monospace;">Space</span>/<span class="code" style="font-family: ui-monospace, monospace;">Enter</span> 选中；同组互斥依赖同一父容器内同 <span class="code" style="font-family: ui-monospace, monospace;">name</span>
    </p>
  </section>

  <section>
    <h3>change 事件计数：<span class="code" style="font-family: ui-monospace, monospace;">{{count}}</span></h3>
    <st-radio name="fruit" on:change="onCountChange">点我</st-radio>
  </section>

  <script>
    export default async () => ({
      data: { count: 0, pick: 0 },
      proto: {
        onCountChange() {
          this.count += 1;
        },
        jsPick() { this.ele.shadowRoot.querySelector("#js-rd").setAttribute("checked", ""); },
      },
    });
  </script>
</template>
