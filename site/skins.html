<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>皮肤 — Senti-UI</title>
  <meta
    name="description"
    content="Senti-UI 主题页：同一批组件，在 Android Material 3、Apple 毛玻璃、Microsoft Windows 11、shadcn 扁平与 Cyberpunk 霓虹终端之间切换；每套主题带官方配色（M3 蓝 / iOS 蓝 / Windows 蓝 / zinc 灰阶 / 洋红青），并按主题记住各自的颜色；页面底部可用 Google Material Color Utilities 改种子色、覆盖角色与添加自定义颜色。"
  />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="皮肤 — Senti-UI" />
  <meta
    property="og:description"
    content="主题同页对比：Android Material 3 / Apple 毛玻璃 / Microsoft Windows 11 / shadcn 扁平 / Cyberpunk 霓虹终端，每套带官方配色与独立颜色记忆。"
  />
  <meta name="theme-color" content="#0061A4" />
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230061A4'/%3E%3Ccircle cx='32' cy='32' r='13' fill='white'/%3E%3C/svg%3E"
  />
  <script type="module">
    import "https://cdn.jsdelivr.net/gh/ofajs/ofa.js@refs/heads/v5/dist/ofa.min.mjs";
    import "https://cdn.jsdelivr.net/gh/ofajs/ofa.js@refs/heads/v5/packages/scsr/dist/scsr.min.mjs";
  </script>
  <script src="../packages/boot/st-boot.js"></script>
  <link rel="stylesheet" href="../packages/skin/m3.css" />
  <link rel="stylesheet" href="../packages/skin/apple.css" />
  <link rel="stylesheet" href="../packages/skin/shadcn.css" />
  <link rel="stylesheet" href="../packages/skin/cyberpunk.css" />
  <link rel="stylesheet" href="../packages/skin/windows.css" />
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
    }
    body {
      font-family: "Inter", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI",
        system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .nojs {
      max-width: 720px;
      margin: 0 auto;
      padding: 12vh 24px;
      line-height: 1.7;
    }
    .nojs a { color: var(--md-sys-color-primary, #0061a4); }
  </style>
</head>
<body>
  <noscript>
    <div class="nojs">
      <h1>皮肤</h1>
      <p>皮肤页的实时预览需要 JavaScript；也可以直接查看 <a href="./index.html">组件目录</a>。</p>
    </div>
  </noscript>

  <o-app src="./app-config.js">
    <template page>
      <l-m src="../packages/button/button.html"></l-m>
      <l-m src="../packages/button/icon-button.html"></l-m>
      <l-m src="../packages/input/input.html"></l-m>
      <l-m src="../packages/menu/menu.html"></l-m>
      <l-m src="../packages/tooltip/tooltip.html"></l-m>
      <l-m src="../packages/progress/progress.html"></l-m>

      <!-- 局部 data-skin 预览需要页面 shadow 内的样式表 -->
      <link rel="stylesheet" href="../packages/skin/m3.css" />
      <link rel="stylesheet" href="../packages/skin/apple.css" />
      <link rel="stylesheet" href="../packages/skin/shadcn.css" />
      <link rel="stylesheet" href="../packages/skin/cyberpunk.css" />
      <link rel="stylesheet" href="../packages/skin/windows.css" />

      <style>
        :host {
          --site-max: 1100px;
          --gutter: clamp(20px, 4vw, 40px);
          display: block;
          background: transparent;
          color: var(--md-sys-color-on-surface);
          font-size: 15px;
          line-height: 1.55;
        }
        *,
        *::before,
        *::after { box-sizing: border-box; }
        h1,
        h2,
        p { margin: 0; }
        a { color: inherit; }

        .skins-page {
          max-width: var(--site-max);
          margin: 0 auto;
          padding: clamp(40px, 6vw, 72px) var(--gutter) 88px;
        }
        .kicker {
          color: var(--md-sys-color-primary);
          font-size: 10.5px;
          font-weight: 700;
          letter-spacing: 0.18em;
          text-transform: uppercase;
        }
        h1 {
          margin-top: 10px;
          font-size: clamp(34px, 5vw, 52px);
          line-height: 1.08;
          letter-spacing: -0.035em;
          font-weight: 700;
        }
        .lead {
          max-width: 720px;
          margin-top: 14px;
          color: var(--md-sys-color-on-surface-variant);
          font-size: 14px;
          line-height: 1.8;
        }
        .current {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          margin-top: 22px;
          padding: 7px 12px;
          border: 1px solid var(--md-sys-color-outline-variant);
          border-radius: 999px;
          background: var(--md-sys-color-surface-container-low);
          color: var(--md-sys-color-on-surface-variant);
          font-size: 12px;
        }
        .current strong { color: var(--md-sys-color-on-surface); }
        .mono {
          font-family: ui-monospace, Menlo, monospace;
          font-size: 11px;
        }

        .skin-grid {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 16px;
          margin-top: 30px;
        }
        .skin-card {
          display: grid;
          align-content: start;
          gap: 14px;
          padding: 18px;
          border: 1px solid var(--md-sys-color-outline-variant);
          border-radius: 20px;
          background: var(--md-sys-color-surface-container-low);
        }
        .skin-head {
          display: flex;
          align-items: flex-start;
          justify-content: space-between;
          gap: 12px;
        }
        .skin-head h2 {
          font-size: 17px;
          letter-spacing: -0.015em;
        }
        .skin-head p {
          margin-top: 5px;
          color: var(--md-sys-color-on-surface-variant);
          font-size: 12px;
          line-height: 1.65;
        }
        .skin-chip {
          flex: none;
          padding: 3px 9px;
          border-radius: 999px;
          background: var(--md-sys-color-surface-container-high);
          color: var(--md-sys-color-on-surface-variant);
          font-family: ui-monospace, Menlo, monospace;
          font-size: 10px;
        }
        .skin-preview {
          display: grid;
          gap: 10px;
          padding: 18px;
          border: 1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 80%, transparent);
          border-radius: 14px;
          background:
            radial-gradient(120% 130% at 8% 0%, color-mix(in srgb, var(--md-sys-color-primary-container) 75%, transparent), transparent 60%),
            radial-gradient(120% 130% at 96% 100%, color-mix(in srgb, var(--md-sys-color-tertiary-container) 65%, transparent), transparent 62%),
            var(--md-sys-color-surface-container-lowest);
        }
        .preview-row {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          gap: 8px;
        }
        .skin-preview st-input { width: 100%; }
        .skin-actions {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
        }
        .skin-actions .hint {
          color: var(--md-sys-color-on-surface-variant);
          font-size: 11px;
        }
        .note {
          margin-top: 26px;
          padding: 14px 16px;
          border: 1px solid var(--md-sys-color-outline-variant);
          border-radius: 14px;
          background: var(--md-sys-color-surface-container-low);
          color: var(--md-sys-color-on-surface-variant);
          font-size: 12.5px;
          line-height: 1.75;
        }
        .note code {
          font-family: ui-monospace, Menlo, monospace;
          font-size: 11px;
          color: var(--md-sys-color-on-surface);
        }

        /* ---------- 颜色体系：改色 / 加色 ---------- */
        .color-lab {
          margin-top: 44px;
          padding-top: 32px;
          border-top: 1px solid var(--md-sys-color-outline-variant);
        }
        .color-lab-head {
          display: flex;
          align-items: flex-end;
          justify-content: space-between;
          gap: 28px;
        }
        .color-lab-head h2 {
          margin-top: 7px;
          font-size: clamp(24px, 3.2vw, 34px);
          line-height: 1.1;
          letter-spacing: -0.035em;
          font-weight: 700;
        }
        .color-lab-desc {
          max-width: 520px;
          padding-bottom: 3px;
          color: var(--md-sys-color-on-surface-variant);
          font-size: 12.5px;
          line-height: 1.75;
          text-align: right;
        }
        .color-lab-desc code {
          color: var(--md-sys-color-on-surface);
          font-family: ui-monospace, Menlo, monospace;
          font-size: 11px;
        }
        .color-lab-desc a {
          color: var(--md-sys-color-primary);
          text-decoration: none;
          white-space: nowrap;
        }
        .color-lab-desc a:hover { text-decoration: underline; }
        .color-lab-grid {
          display: grid;
          grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr);
          gap: 16px;
          align-items: start;
          margin-top: 20px;
        }
        .color-panel,
        .color-preview {
          border: 1px solid var(--st-card-border, var(--md-sys-color-outline-variant));
          border-radius: 20px;
          /* 复用皮肤卡片材质：Apple 下自动变半透明 + backdrop blur */
          background: var(--st-card-bg, var(--md-sys-color-surface-container-low));
          -webkit-backdrop-filter: var(--st-card-backdrop-filter, none);
          backdrop-filter: var(--st-card-backdrop-filter, none);
          padding: 18px;
        }
        .color-seed-row {
          display: flex;
          align-items: center;
          gap: 10px;
          flex-wrap: wrap;
        }
        .color-label {
          color: var(--md-sys-color-on-surface-variant);
          font-size: 12px;
        }
        .color-picker {
          width: 44px;
          height: 40px;
          padding: 0;
          border: 1px solid var(--md-sys-color-outline);
          border-radius: 11px;
          background: transparent;
          cursor: pointer;
        }
        .color-picker::-webkit-color-swatch-wrapper { padding: 3px; }
        .color-picker::-webkit-color-swatch { border: 0; border-radius: 8px; }
        .hex-input {
          width: 112px;
          height: 40px;
          padding: 0 11px;
          border: 1px solid var(--md-sys-color-outline);
          border-radius: 10px;
          background: var(--md-sys-color-surface);
          color: var(--md-sys-color-on-surface);
          font: inherit;
          font-family: ui-monospace, Menlo, monospace;
          font-size: 12px;
          letter-spacing: 0.02em;
        }
        .color-reset {
          margin-left: auto;
          height: 32px;
          padding: 0 10px;
          font-size: 11px;
        }
        .color-help {
          margin-top: 9px;
          color: var(--md-sys-color-on-surface-variant);
          font-size: 11px;
          line-height: 1.65;
        }
        .role-list {
          display: grid;
          gap: 6px;
          margin-top: 16px;
        }
        .role-row {
          display: grid;
          grid-template-columns: 38px minmax(0, 1fr) auto auto;
          gap: 10px;
          align-items: center;
          padding: 8px 10px;
          border-radius: 12px;
          background: var(--st-card-outlined-bg, var(--md-sys-color-surface));
        }
        .role-color {
          width: 38px;
          height: 32px;
          padding: 2px;
          border: 1px solid var(--md-sys-color-outline-variant);
          border-radius: 8px;
          background: transparent;
          cursor: pointer;
        }
        .role-color::-webkit-color-swatch-wrapper { padding: 1px; }
        .role-color::-webkit-color-swatch { border: 0; border-radius: 6px; }
        .role-meta {
          min-width: 0;
          display: grid;
          gap: 1px;
        }
        .role-meta strong {
          font-size: 12px;
          font-weight: 600;
          letter-spacing: 0.01em;
        }
        .role-meta span {
          color: var(--md-sys-color-on-surface-variant);
          font-size: 10px;
        }
        .role-row code {
          color: var(--md-sys-color-on-surface-variant);
          font-family: ui-monospace, Menlo, monospace;
          font-size: 10px;
          white-space: nowrap;
        }
        .role-reset {
          height: 28px;
          padding: 0 8px;
          font-size: 10px;
        }
        .custom-head {
          display: flex;
          align-items: flex-start;
          justify-content: space-between;
          gap: 12px;
          margin-top: 20px;
          padding-top: 16px;
          border-top: 1px solid var(--md-sys-color-outline-variant);
        }
        .custom-head strong {
          display: block;
          font-size: 13px;
          font-weight: 600;
        }
        .custom-head span {
          display: block;
          margin-top: 3px;
          color: var(--md-sys-color-on-surface-variant);
          font-size: 10.5px;
          line-height: 1.5;
        }
        .custom-add {
          flex: none;
          height: 32px;
          padding: 0 10px;
          font-size: 11px;
        }
        .custom-list {
          display: grid;
          gap: 6px;
          margin-top: 10px;
        }
        .custom-row {
          display: grid;
          grid-template-columns: 38px minmax(0, 1fr) auto auto;
          gap: 10px;
          align-items: center;
          padding: 8px 10px;
          border-radius: 12px;
          background: var(--st-card-outlined-bg, var(--md-sys-color-surface));
        }
        .name-input {
          width: 100%;
          height: 32px;
          padding: 0 9px;
          border: 1px solid var(--md-sys-color-outline-variant);
          border-radius: 8px;
          background: var(--md-sys-color-surface-container-low);
          color: var(--md-sys-color-on-surface);
          font: inherit;
          font-family: ui-monospace, Menlo, monospace;
          font-size: 11px;
        }
        .custom-row code {
          color: var(--md-sys-color-on-surface-variant);
          font-family: ui-monospace, Menlo, monospace;
          font-size: 10px;
          white-space: nowrap;
        }
        .custom-empty {
          padding: 12px 10px;
          color: var(--md-sys-color-on-surface-variant);
          font-size: 11px;
          line-height: 1.6;
        }
        .color-actions {
          display: flex;
          align-items: center;
          gap: 10px;
          min-height: 20px;
          margin-top: 14px;
        }
        .color-status {
          color: var(--md-sys-color-on-surface-variant);
          font-size: 10.5px;
          line-height: 1.5;
        }
        .preview-head {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 10px;
        }
        .preview-head span {
          color: var(--md-sys-color-on-surface-variant);
          font-size: 9.5px;
          font-weight: 700;
          letter-spacing: 0.14em;
        }
        .preview-head code {
          color: var(--md-sys-color-on-surface-variant);
          font-family: ui-monospace, Menlo, monospace;
          font-size: 10px;
        }
        .preview-controls {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          margin-top: 14px;
        }
        .preview-controls st-input { width: 100%; }
        .token-list {
          display: grid;
          gap: 5px;
          margin-top: 16px;
          padding-top: 14px;
          border-top: 1px solid var(--md-sys-color-outline-variant);
        }
        .token {
          display: grid;
          grid-template-columns: 14px minmax(0, 1fr) auto;
          gap: 8px;
          align-items: center;
          min-width: 0;
        }
        .token i {
          width: 14px;
          height: 14px;
          border-radius: 4px;
          box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--md-sys-color-outline) 55%, transparent);
        }
        .token code {
          overflow: hidden;
          color: var(--md-sys-color-on-surface-variant);
          font-family: ui-monospace, Menlo, monospace;
          font-size: 10px;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        .token span {
          color: var(--md-sys-color-on-surface-variant);
          font-family: ui-monospace, Menlo, monospace;
          font-size: 10px;
        }
        .custom-buttons {
          display: flex;
          flex-wrap: wrap;
          gap: 6px;
          margin-top: 14px;
        }
        .custom-buttons st-button {
          height: 30px;
          padding: 0 10px;
          font-size: 10.5px;
        }
        .preview-note {
          margin-top: 16px;
          color: var(--md-sys-color-on-surface-variant);
          font-size: 10.5px;
          line-height: 1.65;
        }
        /* ---------- 可用色块变量：白天 / 黑夜各自铺对应 surface，避免串背景 ---------- */
        .swatch-library {
          margin-top: 26px;
          padding-top: 24px;
          border-top: 1px solid var(--md-sys-color-outline-variant);
        }
        .swatch-head {
          display: flex;
          align-items: flex-end;
          justify-content: space-between;
          gap: 24px;
        }
        .swatch-head h3 {
          margin-top: 6px;
          font-size: clamp(19px, 2.3vw, 26px);
          line-height: 1.15;
          letter-spacing: -0.03em;
          font-weight: 700;
        }
        .swatch-desc {
          max-width: 560px;
          padding-bottom: 2px;
          color: var(--md-sys-color-on-surface-variant);
          font-size: 11.5px;
          line-height: 1.7;
          text-align: right;
        }
        .swatch-panels {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          align-items: start;
          gap: 12px;
          margin-top: 16px;
        }
        .swatch-panel {
          min-width: 0;
          padding: 14px;
          border: 1px solid var(--md-sys-color-outline-variant);
          border-radius: 16px;
          background: var(--md-sys-color-surface-container);
          color: var(--md-sys-color-on-surface);
        }
        .swatch-panel-head {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 10px;
        }
        .swatch-panel-head span {
          color: var(--md-sys-color-on-surface);
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.1em;
          text-transform: uppercase;
        }
        .swatch-panel-head code {
          color: var(--md-sys-color-on-surface-variant);
          font-family: ui-monospace, Menlo, monospace;
          font-size: 9.5px;
        }
        .swatch-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(126px, 1fr));
          gap: 8px;
          margin-top: 12px;
        }
        .swatch-card {
          min-width: 0;
          overflow: hidden;
          border: 1px solid var(--md-sys-color-outline-variant);
          border-radius: 10px;
          background: var(--md-sys-color-surface-container-low);
        }
        .swatch-block {
          display: flex;
          align-items: flex-end;
          justify-content: flex-end;
          height: 54px;
          padding: 6px 8px;
          font-family: ui-monospace, Menlo, monospace;
          font-size: 10px;
          letter-spacing: 0.01em;
        }
        .swatch-token {
          display: flex;
          align-items: flex-start;
          gap: 6px;
          width: 100%;
          padding: 6px 8px;
          border: 0;
          border-radius: 0;
          background: transparent;
          color: var(--md-sys-color-on-surface-variant);
          font: inherit;
          font-family: ui-monospace, Menlo, monospace;
          font-size: 9px;
          line-height: 1.45;
          text-align: left;
          cursor: pointer;
        }
        .swatch-token code {
          min-width: 0;
          overflow-wrap: anywhere;
          font: inherit;
        }
        .swatch-token .copy-mark {
          flex: none;
          margin-left: auto;
          opacity: 0.45;
          transition: opacity 0.15s ease;
        }
        .swatch-token:hover {
          color: var(--md-sys-color-primary);
          background: color-mix(in srgb, var(--md-sys-color-primary) 9%, transparent);
        }
        .swatch-token:hover .copy-mark,
        .swatch-token.copied .copy-mark {
          opacity: 1;
        }
        .swatch-token.copied {
          color: var(--md-sys-color-primary);
        }
        .swatch-token:focus-visible {
          outline: 2px solid var(--md-sys-color-primary);
          outline-offset: -2px;
        }
        .swatch-copy-status {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }
        @media (max-width: 900px) {
          .color-lab-head,
          .swatch-head { display: grid; gap: 9px; }
          .color-lab-desc,
          .swatch-desc { max-width: none; text-align: left; }
          .color-lab-grid,
          .swatch-panels { grid-template-columns: minmax(0, 1fr); }
        }
        @media (max-width: 620px) {
          .role-row,
          .custom-row { grid-template-columns: 38px minmax(0, 1fr) auto; }
          .role-row code,
          .custom-row code { display: none; }
          .color-reset { margin-left: 0; }
        }

        @media (max-width: 860px) {
          .skin-grid { grid-template-columns: minmax(0, 1fr); }
        }
      </style>

      <main class="skins-page">
        <header>
          <p class="kicker">MATERIALS</p>
          <h1>选择主题</h1>
          <p class="lead">
            每套材质都有各自的官方配色：M3 蓝、Apple iOS 蓝、Windows 11 蓝、shadcn zinc 灰阶、
            Cyberpunk 洋红/青。点选会同时切换材质与配色，并按主题记住各自的颜色；页面底部
            仍然可以改种子色、覆盖单个角色，或添加自己的颜色变量。
          </p>
          <div class="current">
            当前主题 <strong>{{skinLabel}}</strong>
            <span class="mono">data-skin="{{skin}}"</span>
          </div>
        </header>

        <section class="skin-grid" aria-label="可选主题">
          <article class="skin-card">
            <div class="skin-head">
              <div>

      <script>
        export const parent = "./layout.html";

        export default async () => ({
          data: {
            skin: "m3",
            seed: "#0061A4",
            overrides: {},
            customs: [],
            roleColors: {
              primary: "#0061A4",
              secondary: "#565E71",
              tertiary: "#725572",
              error: "#B3261E",
              success: "#006E1C",
            },
            customTokens: [],
            lightSwatches: [],
            darkSwatches: [],
            copyStatus: "",
            colorStatus: "",
          },
          ready() {
            this.syncSkin();
            this.initColorLab();
            this.initPreviewPalettes();
            this._observer = new MutationObserver(() => this.syncSkin());
            this._observer.observe(document.documentElement, {
              attributes: true,
              attributeFilter: ["data-skin"],
            });
          },
          detached() {
            this._observer?.disconnect();
            this._previewObserver?.disconnect();
            if (this._previewMedia && this._onPreviewScheme) {
              this._previewMedia.removeEventListener("change", this._onPreviewScheme);
            }
          },
          proto: {
            get skinLabel() {
              return (
                {
                  m3: "Android · Material 3",
                  apple: "Apple · 毛玻璃",
                  windows: "Microsoft · Windows 11",
                  shadcn: "shadcn · 扁平",
                  cyberpunk: "Cyberpunk · 霓虹终端",
                }[this.skin] || this.skin
              );
            },
            syncSkin() {
              this.skin =
                document.documentElement.dataset.skin ||
                localStorage.getItem("st-skin") ||
                "m3";
            },
            async initPreviewPalettes() {
              let tries = 0;
              while (!window.__site?.previewThemes && tries++ < 300) {
                await new Promise((resolve) => setTimeout(resolve, 20));
              }
              if (!window.__site?.previewThemes) return;
              this.applyPreviewPalettes();
              this._previewObserver = new MutationObserver(() => this.applyPreviewPalettes());
              this._previewObserver.observe(document.documentElement, {
                attributes: true,
                attributeFilter: ["class"],
              });
              this._previewMedia = window.matchMedia("(prefers-color-scheme: dark)");
              this._onPreviewScheme = () => this.applyPreviewPalettes();
              this._previewMedia.addEventListener("change", this._onPreviewScheme);
            },
            applyPreviewPalettes() {
              const themes = window.__site?.previewThemes;
              const root = this.ele?.shadowRoot;
              if (!themes || !root) return;
              const dark =
                document.documentElement.classList.contains("st-dark") ||
                (!document.documentElement.classList.contains("st-light") &&
                  window.matchMedia("(prefers-color-scheme: dark)").matches);
              for (const el of root.querySelectorAll(".skin-preview[data-skin]")) {
                const theme = themes[el.dataset.skin];
                if (!theme) continue;
                const vars = theme.forceDark || dark ? theme.dark : theme.light;
                for (const [name, value] of Object.entries(vars)) {
                  el.style.setProperty(name, value);
                }
              }
            },
            async initColorLab() {
              let tries = 0;
              while (!window.__site?.applyTheme && tries++ < 300) {
                await new Promise((resolve) => setTimeout(resolve, 20));
              }
              if (!window.__site?.applyTheme) {
                this.colorStatus = "颜色模块加载失败，请刷新重试。";
                return;
              }
              try {
                const saved = JSON.parse(localStorage.getItem("st-color-config") || "null");
                if (saved && /^#[0-9a-fA-F]{6}$/.test(saved.seed || "")) {
                  this.seed = saved.seed.toLowerCase();
                  this.overrides = saved.overrides || {};
                  this.customs = Array.isArray(saved.customs)
                    ? saved.customs.map((c) => ({
                        name: String(c.name || ""),
                        color: String(c.color || "#7FDBFF").toLowerCase(),
                      }))
                    : [];
                }
              } catch {}
              this.applyColor(false);
              if (!this.colorStatus) this.colorStatus = "已载入本域配色，修改会即时保存。";
            },
            applyColor(persist = true) {
              const api = window.__site;
              if (!api?.applyTheme) return;
              const seed = String(this.seed || "").trim().toLowerCase();
              if (!/^#[0-9a-f]{6}$/.test(seed)) {
                this.colorStatus = "种子色格式应为 #RRGGBB";
                return;
              }
              this.seed = seed;

              const overrides = {};
              for (const role of ["primary", "secondary", "tertiary", "error", "success"]) {
                const value = String(this.overrides?.[role] || "").toLowerCase();
                if (/^#[0-9a-f]{6}$/.test(value)) overrides[role] = value;
              }
              this.overrides = overrides;

              const customs = this.customs.map((c) => ({
                name: String(c.name || "").trim(),
                color: String(c.color || "").toLowerCase(),
              }));
              const customsObj = Object.fromEntries(
                customs
                  .filter((c) => c.name && /^#[0-9a-f]{6}$/.test(c.color))
                  .map((c) => [c.name, c.color])
              );

              const generated = api.generateM3Theme(seed, overrides);
              api.applyTheme(seed, overrides, customsObj);
              const auto = generated.light;
              this.roleColors = {
                primary: (overrides.primary || auto.primary).toLowerCase(),
                secondary: (overrides.secondary || auto.secondary).toLowerCase(),
                tertiary: (overrides.tertiary || auto.tertiary).toLowerCase(),
                error: (overrides.error || auto.error).toLowerCase(),
                success: (overrides.success || auto.success).toLowerCase(),
              };
              const expanded = api.expandCustoms(customsObj);
              this.customTokens = Object.entries(expanded.light).map(
                ([name, hex]) => ({ name, hex: String(hex).toLowerCase() })
              );

              const contrastColor = (hex) => {
                const n = parseInt(hex.slice(1), 16);
                const [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
                return (r * 299 + g * 587 + b * 114) / 1000 > 128 ? "#000000" : "#ffffff";
              };
              const toSwatches = (scheme, customScheme) => {
                const items = Object.keys(scheme).map((name) => {
                  const hex = String(scheme[name]).toLowerCase();
                  return {
                    varName:
                      "--md-sys-color-" +
                      name.replace(/[A-Z]/g, (char) => "-" + char.toLowerCase()),
                    hex,
                    text: contrastColor(hex),
                  };
                });
                for (const [varName, value] of Object.entries(customScheme)) {
                  const hex = String(value).toLowerCase();
                  items.push({ varName, hex, text: contrastColor(hex) });
                }
                return items;
              };
              this.lightSwatches = toSwatches(generated.light, expanded.light);
              this.darkSwatches = toSwatches(generated.dark, expanded.dark);

              // 两块面板各自铺该模式的 surface / 文字色；子元素只消费面板内的局部变量。
              const root = this.ele?.shadowRoot;
              const panelVars = {
                primary: "primary",
                surface: "surface",
                surfaceContainer: "surface-container",
                surfaceContainerLow: "surface-container-low",
                onSurface: "on-surface",
                onSurfaceVariant: "on-surface-variant",
                outline: "outline",
                outlineVariant: "outline-variant",
              };
              for (const [id, scheme] of [
                ["#swatch-light", generated.light],
                ["#swatch-dark", generated.dark],
              ]) {
                const panel = root?.querySelector(id);
                if (!panel) continue;
                for (const [key, varName] of Object.entries(panelVars)) {
                  panel.style.setProperty("--md-sys-color-" + varName, scheme[key]);
                }
              }

              if (persist) {
                localStorage.setItem(
                  "st-color-config",
                  JSON.stringify({ seed, overrides, customs })
                );
                localStorage.setItem(
                  "st-theme-css",
                  api.themeToCss(seed, overrides, customsObj)
                );
                this.colorStatus = "已应用，并保存到本域配色。";
              }
            },
            async copyToken(event) {
              const button = event.currentTarget;
              const token = button?.querySelector("code")?.textContent.trim();
              if (!token) return;

              let copied = false;
              try {
                await navigator.clipboard.writeText(token);
                copied = true;
              } catch {}
              if (!copied) {
                // 非安全上下文 / 剪贴板权限被拒时的兜底
                const area = document.createElement("textarea");
                area.value = token;
                area.setAttribute("readonly", "");
                area.style.position = "fixed";
                area.style.top = "-1000px";
                document.body.appendChild(area);
                area.select();
                try {
                  copied = document.execCommand("copy");
                } finally {
                  area.remove();
                }
              }

              if (!copied) {
                this.copyStatus = "复制失败，请手动选择变量名";
                return;
              }
              this.copyStatus = "已复制 " + token;
              button.classList.add("copied");
              const mark = button.querySelector(".copy-mark");
              if (mark) mark.textContent = "✓";
              clearTimeout(button._copyTimer);
              button._copyTimer = setTimeout(() => {
                button.classList.remove("copied");
                if (mark) mark.textContent = "⧉";
              }, 1200);
            },
            setSeed(value) {
              const next = String(value || "").trim().toLowerCase();
              if (!/^#[0-9a-f]{6}$/.test(next)) {
                this.colorStatus = "种子色格式应为 #RRGGBB";
                return;
              }
              this.seed = next;
              this.applyColor();
            },
            setRole(role, color) {
              const next = String(color || "").toLowerCase();
              if (!/^#[0-9a-f]{6}$/.test(next)) return;
              this.overrides = { ...this.overrides, [role]: next };
              this.applyColor();
            },
            resetRole(role) {
              const next = { ...this.overrides };
              delete next[role];
              this.overrides = next;
              this.applyColor();
            },
            addCustom() {
              let index = 1;
              let name = "brand";
              while (this.customs.some((c) => c.name === name)) {
                index += 1;
                name = "brand-" + index;
              }
              this.customs = [...this.customs, { name, color: "#ff7a59" }];
              this.applyColor();
            },
            setCustomName(index, name) {
              let next = String(name || "")
                .trim()
                .replace(/[A-Z]/g, (c) => "-" + c.toLowerCase())
                .replace(/[^a-z0-9-]/g, "-")
                .replace(/-+/g, "-")
                .replace(/^-|-$/g, "");
              if (!next) next = "custom";
              const base = next;
              let n = 2;
              while (this.customs.some((c, i) => i !== index && c.name === next)) {
                next = base + "-" + n++;
              }
              this.customs = this.customs.map((c, i) =>
                i === index ? { ...c, name: next } : c
              );
              this.applyColor();
            },
            setCustomColor(index, color) {
              const next = String(color || "").toLowerCase();
              if (!/^#[0-9a-f]{6}$/.test(next)) return;
              this.customs = this.customs.map((c, i) =>
                i === index ? { ...c, color: next } : c
              );
              this.applyColor();
            },
            removeCustom(index) {
              this.customs = this.customs.filter((_, i) => i !== index);
              this.applyColor();
            },
            resetAll() {
              this.seed = "#0061A4";
              this.overrides = {};
              this.customs = [];
              this.applyColor(false);
              localStorage.removeItem("st-color-config");
              const api = window.__site;
              if (api?.themeToCss) {
                localStorage.setItem("st-theme-css", api.themeToCss("#0061A4", {}, {}));
              }
              this.colorStatus = "已恢复默认 M3 配色。";
            },
            use(id) {
              const theme = window.__siteTheme;
              if (theme?.applyThemePreset) {
                const result = theme.applyThemePreset(id);
                this.skin = result.skin;
                this.seed = result.config.seed;
                this.overrides = result.config.overrides;
                this.customs = result.config.customs;
                this.applyColor(false);
                this.colorStatus = "已切换到 " + this.skinLabel + " 主题。";
                return;
              }
              if (window.__site) window.__site.setSkin(id);
              else {
                try {
                  localStorage.setItem("st-skin", id);
                } catch {}
                document.documentElement.dataset.skin = id;
              }
              this.skin = id;
            },
            useCyberpunk() {
              // Cyberpunk 的官方配色（深色 + 洋红/青）由主题预设统一提供；
              // 皮肤 CSS 本身仍然不写任何颜色。
              this.use("cyberpunk");
            },
          },
        });
      </script>

    </template>
  </o-app>
