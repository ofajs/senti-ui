            <header class="doc-hero">

              <h1>List <code>st-list</code></h1>
              <p class="doc-lead">st-list 只负责纵向排列，st-list-item 负责内容与交互：button 可点击、disabled 禁用、collapsible + expanded 折叠子列表。首尾项自动大圆角，子列表按层级自动缩进。</p>
              <div class="doc-links">
                <a href="../index.html">组件目录</a>
                <a href="https://github.com/ofajs/senti-ui/blob/main/packages/list/README.md" target="_blank" rel="noreferrer">GitHub README <iconify-icon icon="mdi:open-in-new"></iconify-icon></a>
              </div>
            </header>

            <section class="doc-section">
              <h2>基础结构：prefix、副文本与 suffix</h2>
              <p class="doc-section-lead">默认插槽是正文，prefix / suffix 放图标或数量，正文里的任意子元素加 secondary 属性就显示为小号灰色副文本。st-list 内直接用原生 hr 做分隔线，首尾项自动使用更大圆角。</p>

                <div class="demo-top">
                  <span class="live"><i></i>{{codeView.demo1 ? 'CODE' : 'LIVE'}}</span>
                  <div class="demo-top-actions">
                    <code>st-list + st-list-item</code>
                    <st-button class="demo-code-toggle" variant="text" on:click="toggleCode('demo1')">
                      <iconify-icon slot="prefix" attr:icon="codeView.demo1 ? 'mdi:eye-outline' : 'mdi:code-tags'"></iconify-icon>
                      {{codeView.demo1 ? '查看示例' : '查看代码'}}
                    </st-button>
                  </div>
                </div>
                <div class="demo-stage" attr:hidden="codeView.demo1">

                      <div>收件箱<span secondary style="display: block;">12 封未读</span></div>
                      <span slot="suffix">12</span>
                    </st-list-item>

                      <iconify-icon slot="suffix" icon="mdi:chevron-right"></iconify-icon>

            <div class="doc-cols">
              <div class="doc-block">
                <h3>属性（st-list-item）</h3>
                <table class="api">
                  <thead><tr><th>属性</th><th>类型</th><th>默认</th><th>说明</th></tr></thead>
                  <tbody>
                    <tr><td><code>button</code></td><td>boolean</td><td>无</td><td>可点击项：state layer + 波纹 + 原生 click</td></tr>
                    <tr><td><code>disabled</code></td><td>boolean</td><td>无</td><td>0.38 透明度，阻断点击 / 键盘 / 波纹</td></tr>
                    <tr><td><code>collapsible</code></td><td>boolean</td><td>无</td><td>显示箭头，点击切换 expanded（不派发 click）</td></tr>
                    <tr><td><code>expanded</code></td><td>boolean</td><td>无</td><td>子列表展开；配合 collapsible 使用</td></tr>
                    <tr><td><code>style</code></td><td>原生 CSS</td><td>无</td><td>st-list 上可覆写 <code>--st-list-step</code>、font-size 等</td></tr>
                  </tbody>
                </table>
              </div>
              <div class="doc-block">
                <h3>插槽 / 事件 / 注意</h3>
                <ul class="api-list">
                  <li>st-list 无语义属性；st-list-item 插槽：<code>prefix</code> / 默认正文 / <code>suffix</code> / <code>sublist</code>。</li>
                  <li>副文本：正文子元素加 <code>secondary</code> 属性；分隔线直接放原生 <code>&lt;hr&gt;</code>。</li>
                  <li>事件：<code>button</code> 项的 click 原生冒泡（composed）；plain 项的原生 click 也会冒泡但没有交互态；折叠项点击只切换 expanded。</li>
                  <li>键盘：button / collapsible 项由内部原生 button 承载，Tab 聚焦、Enter / Space 激活。</li>
                  <li>缩进：每层 <code>1em</code>，用 <code>--st-list-step</code> 调整；不要给 sublist 加左 margin / padding。</li>
