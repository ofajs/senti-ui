      <script>
        export const parent = "./layout.html";

        const CHUNKS = [
          "# 流式 Markdown\n\n",
          "这是逐段填充的 **Markdown**，",
          "还没闭合的代码块会先渲染到文末。\n\n",
          "```js\n",
          "const answer = 42;\n",
          "console.log(answer);\n",
          "```\n\n",
          "| 能力 | 状态 |\n",
          "| --- | :---: |\n",
          "| 代码块 | ✅ |\n",
          "| 表格 | ✅ |\n",
          "| 增量渲染 | ✅ |\n",
        ];

        export default async () => ({
          data: {
            codeView: { demo1: false, demo2: false, demo3: false, demo4: false, demo5: false },
            streamText: "",
            streaming: false,
            streamIndex: 0,
            copyCount: 0,
            demo1Code: `<st-markdown>
  <textarea hidden>
# Markdown 渲染

这是一段 **粗体**、\`行内代码\` 与 [安全链接](https://example.com)。

- 第一项
  - 嵌套项
- [x] 已完成
- [ ] 未完成

\`\`\`js
const answer = 42;
\`\`\`

| 能力 | 状态 |
| --- | :---: |
| 代码块 | ✅ |
  </textarea>
</st-markdown>`,
            demo2Code: `<st-markdown id="answer" streaming></st-markdown>

// 每帧只合并渲染一次
const answer = $("st-markdown").ele;
answer.value = "";
answer.appendMarkdown("# 流式 Markdown\\n\\n");
answer.appendMarkdown("还没闭合的代码块会先渲染到末尾：\\n\\n");
answer.appendMarkdown("\`\`\`js\\nconst answer = 42;");`,
            demo3Code: `<st-chat-message from="assistant" name="Senti" streaming>
  <st-markdown :value="answer"></st-markdown>
</st-chat-message>`,
            demo4Code: `<st-markdown breaks>
  <textarea hidden>第一行
第二行</textarea>
</st-markdown>

<script>alert("按文本显示")<\/script>`,
            demo5Code: `#my-md { font-size: 15px; }
#my-md::part(code-block) {
  border-color: var(--md-sys-color-primary);
}

<div data-skin="apple">
  <link rel="stylesheet" href=".../packages/skin/apple.css">
  <st-markdown>…</st-markdown>
</div>`,
          },
          proto: {
            toggleCode(key) {
              this.codeView[key] = !this.codeView[key];
            },
            startStream() {
              clearInterval(this._timer);
              this.streamText = "";
              this.streamIndex = 0;
              this.streaming = true;
              this._timer = setInterval(() => this.nextChunk(), 110);
            },
            nextChunk() {
              if (this.streamIndex >= CHUNKS.length) {
                this.streaming = false;
                clearInterval(this._timer);
                this._timer = null;
                return;
              }
              this.streamText += CHUNKS[this.streamIndex++];
              if (this.streamIndex >= CHUNKS.length) {
                this.streaming = false;
                clearInterval(this._timer);
                this._timer = null;
              }
            },
            appendOne() {
              if (this.streamIndex >= CHUNKS.length) return;
              this.streaming = true;
              this.streamText += CHUNKS[this.streamIndex++];
            },
            resetStream() {
              clearInterval(this._timer);
              this._timer = null;
              this.streamText = "";
              this.streamIndex = 0;
              this.streaming = false;
            },
            onCopy() {
              this.copyCount += 1;
            },
          },
          detached() {
            clearInterval(this._timer);
          },
        });
      </script>
