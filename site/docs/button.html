        <div class="doc-cols">
          <div class="doc-block">
            <h3>属性</h3>
            <table class="api">
              <thead><tr><th>属性</th><th>类型</th><th>默认</th><th>说明</th></tr></thead>
              <tbody><tr><td><code>variant</code></td><td>"filled" | "outlined" | "text"</td><td>"filled"</td><td>M3 三种按钮类型</td></tr><tr><td><code>color</code></td><td>M3 角色名 / 自定义变量名</td><td>无</td><td>语义换色，与 variant 自由组合</td></tr><tr><td><code>disabled</code></td><td>boolean</td><td>无</td><td>阻断点击，0.38 透明度</td></tr><tr><td><code>loading</code></td><td>boolean</td><td>无</td><td>显示 spinner 并自动禁用</td></tr><tr><td><code>type</code></td><td>"button" | "submit" | "reset"</td><td>"button"</td><td>转发给内部原生 button</td></tr></tbody>
            </table>
          </div>
          <div class="doc-block">
            <h3>插槽 / 事件 / 注意</h3>
            <ul class="api-list"><li>插槽：默认文字；<code>prefix</code> / <code>suffix</code> 放图标。</li><li>事件：<code>click</code> 直接在宿主监听；Tab 聚焦、Enter / Space 激活由内部原生 button 提供。</li><li>同包：<code>st-button-group</code>（connected / full-width）、<code>st-split-button</code>（主区 + 菜单）、<code>st-icon-button</code>（standard / filled / tonal / outlined）。</li></ul>
          </div>
        </div>

      <script>
        export const parent = "../layout.html";

        export default async () => ({
          data: {
            selectValue: "",
            dialogOpen: false,
            collapsed: false,
            tab: 0,
            tabLabels: ["概览", "活动", "设置"],
            navTab: 0,
            navLabels: ["首页", "发现", "我的"],
            toolResult: "（未调用）",
          },
          proto: {
            get tabLabel() {
              return this.tabLabels[this.tab] || "";
            },
            get navLabel() {
              return this.navLabels[this.navTab] || "";
            },
            onSelect(e) {
              this.selectValue = e.target.value || "";
            },
            runToast() {
              if (!window.__site) return;
              this.toolResult = "toast → 已弹出（3s）";
              window.__site.toast("这是一条 toast。");
            },
            async runAlert() {
              if (!window.__site) return;
              const ok = await window.__site.alert({ title: "操作成功", message: "这是 alert 命令式对话框。", ok: "知道了" });
              this.toolResult = "alert → " + ok;
            },
            async runConfirm() {
              if (!window.__site) return;
              const ok = await window.__site.confirm({ title: "确认删除", message: "确定删除这条记录吗？", yes: "删除", cancel: "取消", color: "error" });
              this.toolResult = "confirm → " + ok;
            },
            async runPrompt() {
              if (!window.__site) return;
              const value = await window.__site.prompt({ title: "重命名", message: "输入新的名称", placeholder: "新名称" });
              this.toolResult = "prompt → " + JSON.stringify(value);
            },
            openCtx(e) {
              e.preventDefault();
              if (!window.__site) return;
              const self = this;
              window.__site.contextMenu(e, [
                { id: "copy", label: "复制", prefix: "⧉" },
                { id: "rename", label: "重命名", prefix: "✏" },
                { separator: true },
                { id: "delete", label: "删除", prefix: "⌫", disabled: true },
              ]).then((id) => { self.toolResult = "contextMenu → " + (id || "未选择"); });
            },
          },
        });
      </script>
    </template>

    window.__siteReady = true;
