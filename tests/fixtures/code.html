<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>st-code test fixture</title>
  <script src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js/dist/ofa.min.mjs" type="module"></script>
  <l-m src="/packages/code/code.html"></l-m>
</head>
<body>
  <st-code id="c-html" frame lang="html" title="index.html">
    <template>
      <div class="card"><h2>Hi</h2></div>
      <script>window.__executed = true;</script>
    </template>
  </st-code>

  <st-code id="c-js" frame lang="js" title="app.js">
    <template>
      const f=()=>{return 1}
    </template>
  </st-code>

  <st-code id="c-off" lang="js" format="off" title="exact.js">
    <template>const a={b:1};</template>
  </st-code>

  <st-code id="c-dyn" frame lang="css" title="dynamic.css"></st-code>

  <st-code id="c-sass" lang="sass" title="theme.sass">
    <template>$a: red
.b
  color: $a
</template>
  </st-code>

  <script>
    window.__codeEvents = [];
    document.addEventListener("copy", (e) => {
      if (e.target?.tagName === "ST-CODE") window.__codeEvents.push("copy");
    });
  </script>
</body>
</html>
