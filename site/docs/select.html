                <table class="api">
                  <thead><tr><th>属性</th><th>类型</th><th>默认</th><th>说明</th></tr></thead>
                  <tbody>
                    <tr><td><code>variant</code></td><td>"outlined" | "filled"</td><td>"outlined"</td><td>M3 两种输入框类型</td></tr>

                    <tr><td><code>placeholder</code></td><td>string</td><td>无</td><td>未选中时的占位文本</td></tr>

                    <tr><td><code>options</code></td><td>Array&lt;{ value, label }&gt;</td><td>无</td><td>动态选项入口：<code>:options</code> 或 <code>el.options = []</code></td></tr>
                  </tbody>
                </table>
              </div>
              <div class="doc-block">
                <h3>插槽 / 事件 / 注意</h3>
                <ul class="api-list">
                  <li>选项：<code>&lt;option&gt;</code> 或 <code>&lt;st-option&gt;</code>（<code>value</code> / <code>label</code> + 富内容插槽）。</li>
                  <li>事件：<code>change</code>（用户选中时派发，composed）；程序改 <code>el.value</code> 不派发。</li>
                  <li>方法：<code>focus()</code> / <code>blur()</code>；键盘 ↑↓ / Enter / Space / Home / End / Escape / Tab。</li>
                  <li><code>value</code> 是运行时 property；初始选中用 <code>default-value</code>，不要写 selected。</li>
                  <li>弹层渲染在 shadow 内，<code>overflow: hidden</code> 祖先会裁剪它；组件只负责上下翻转。</li>
                </ul>
              </div>

            demo3Code: "<st-select placeholder=\"长列表：试试 ↑ ↓ / Home / End\" style=\"width: 100%; max-width: 360px;\" on:change=\"onPick\">\n                    <option value=\"1\">选项 01</option>\n                    <option value=\"2\">选项 02</option>\n                    <option value=\"3\">选项 03</option>\n                    <option value=\"4\">选项 04</option>\n                    <option value=\"5\">选项 05</option>\n                    <option value=\"6\">选项 06</option>\n                    <option value=\"7\">选项 07</option>\n                    <option value=\"8\">选项 08</option>\n                    <option value=\"9\">选项 09</option>\n                    <option value=\"10\">选项 10</option>\n                    <option value=\"11\">选项 11</option>\n                    <option value=\"12\">选项 12</option>\n                  </st-select>\n                  <span class=\"demo-note\">最近选中：{{lastPick}}</span>",
            demo4Code: "<div class=\"demo-cell\">\n                    <span class=\"demo-label\">原生 option 富内容</span>\n                    <st-select placeholder=\"选择水果\">\n                      <option value=\"apple\"><span style=\"margin-right: 8px;\">🍎</span><b>苹果</b> Apple</option>\n                      <option value=\"banana\"><span style=\"margin-right: 8px;\">🍌</span><b>香蕉</b> Banana</option>\n                      <option value=\"cherry\"><span style=\"margin-right: 8px;\">🍒</span><b>樱桃</b> Cherry</option>\n                    </st-select>\n                  </div>\n                  <div class=\"demo-cell\">\n                    <span class=\"demo-label\">st-option + label</span>\n                    <st-select default-value=\"relay\" placeholder=\"选择部署方式\">\n                      <st-option value=\"direct\" label=\"直连\"><iconify-icon icon=\"mdi:flash\" style=\"margin-right:8px\"></iconify-icon><b>直连</b> Direct</st-option>\n                      <st-option value=\"relay\" label=\"邀请码\"><iconify-icon icon=\"mdi:key-variant\" style=\"margin-right:8px\"></iconify-icon><b>邀请码</b> <span style=\"opacity: 0.62;\">Invite code</span></st-option>\n                      <st-option label=\"无 value（取 label）\">缺省 value 演示</st-option>\n                    </st-select>\n                  </div>",
            demo5Code: "<div class=\"demo-cell\">\n                    <span class=\"demo-label\">cities</span>\n                    <st-select :options=\"cities\" placeholder=\":options 数据绑定\" on:change=\"onCity\"></st-select>\n                  </div>\n                  <div class=\"demo-cell\">\n                    <span class=\"demo-label\">extendedCities</span>\n                    <st-select :options=\"extendedCities\" placeholder=\"另一组城市数据\" on:change=\"onCity\"></st-select>\n                  </div>\n                  <div class=\"demo-cell\">\n                    <span class=\"demo-label\">修改数据源</span>\n                    <st-button variant=\"outlined\" on:click=\"swapCities\">换一组城市</st-button>\n                  </div>",
