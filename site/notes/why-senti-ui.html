          <h1>为什么要开发 Senti-UI</h1>
          <p class="lead">
            当 AI 已经能生成任何风格，组件库的价值不再是提供一套好看的外观，
            而是让外观可以被安全地替换。
          </p>
          <div class="note-meta">
            <span class="tag">设计理念</span>
            <span>2026-11-01</span>
            <span class="divider" aria-hidden="true"></span>
            <span>约 7 分钟</span>
          </div>
        </header>

        <div class="note-body">
          <p>
            这两年和 AI 一起做网页，最直观的变化是：只要描述想要的感觉——Apple 的毛玻璃、
            Windows 11 的 Mica、Material 3 的色调——它很快就能给出一个看起来不错的页面。
            风格本身，已经不再是瓶颈。
          </p>

          <h2><span class="num">01</span>风格不再是瓶颈，麻烦从别处开始</h2>
          <p>
            一个按钮、一个输入框、一张卡片，AI 可以写出无数种样子。但当页面开始变复杂，
            问题会从“像不像”变成“能不能用”：表单怎么校验，错误怎么被读屏软件读到，
            下拉菜单会不会被容器裁掉，弹窗打开后焦点去了哪里。
          </p>
          <p>
            这些行为与视觉风格无关，却决定了产品是否可用。更现实的是，如果每换一种风格
            就重新实现一遍这些行为，成本会随“风格数量 × 组件数量”增长。第一版还能控制，
            第三版就开始失控：同一个输入框，在三个页面里有三种校验提示；同一个菜单，
            有的能按 Esc 关闭，有的不能。
          </p>

          <h2><span class="num">02</span>被反复重写的，其实是同一批组件</h2>
          <p>
            按钮、输入框、选择器、对话框、菜单……它们的视觉可以千差万别，功能骨架却高度相似。
            真正随风格变化的是圆角、密度、描边、阴影、模糊和动效；不变的是角色、状态与交互契约。
          </p>
          <p>
            既然基础组件的功能本来就是一回事，为什么不把用法统一起来，让风格成为可替换的一层？
          </p>

          <blockquote>
            <p>风格是变量，行为是常量。</p>
            <cite>Senti-UI 的基本假设</cite>
          </blockquote>

          <h2><span class="num">03</span>把“行为”和“材质”拆开</h2>
          <p>
            这就是 Senti-UI 的起点。我们不再为每一种风格造一套组件，而是用同一套组件承载行为，
            用皮肤承载材质。
          </p>
          <ul>
            <li><strong>标签统一</strong>：按钮、输入、选择、对话框都叫 <code>st-*</code>，跨页面、跨项目可以直接迁移。</li>
            <li><strong>语义统一</strong>：<code>variant</code> / <code>disabled</code> / <code>loading</code> / <code>color</code> 表达状态，不靠记某一套设计系统的类名。</li>
            <li><strong>状态统一</strong>：<code>value</code>、<code>open</code> 等是运行时状态，插槽、事件与键盘行为遵循同一份契约。</li>
            <li><strong>外观回归 CSS</strong>：高度、间距、圆角直接在宿主上写原生 CSS，不发明样式代理变量。</li>
            <li><strong>颜色只走 M3 角色</strong>：种子色、error、success 与深浅色自动贯穿所有组件。</li>
            <li><strong>材质交给皮肤</strong>：<code>data-skin</code> 切换的只有密度、描边、毛玻璃、焦点环和动效。</li>
          </ul>
          <p>
            于是在 Senti-UI 里，换风格不是再写一套 Button，而是给同一套 Button 换一层材质。
            组件的行为和无障碍只维护一次，风格可以有很多种。
          </p>

          <blockquote>
            <p>组件负责正确，皮肤负责好看。</p>
            <cite>分工原则</cite>
          </blockquote>

          <h2><span class="num">04</span>一套可复用的定制范式</h2>
          <p>
            如果没有约束，“换皮肤”很快会变成另一场混乱：每个人都往组件里塞自己的颜色和尺寸变量，
            最后组件被某一种风格绑死，换回来又得改一遍。
          </p>
          <p>所以我们把可定制面收窄成三条约定：</p>
          <ul class="principles">
            <li>
              <b>01 / SEMANTICS</b>
              <span>语义用属性，外观用原生 CSS。属性只表达状态与行为；尺寸、圆角、间距直接覆写宿主。</span>
            </li>
            <li>
              <b>02 / COLOR</b>
              <span>颜色只走 M3 角色。组件只消费 <code>--md-sys-color-*</code>，皮肤不夹带颜色。</span>
            </li>
            <li>
              <b>03 / MATERIAL</b>
              <span>皮肤只改材质。不改结构、不改交互，也不依赖 <code>::part</code> 或文档树。</span>
            </li>
          </ul>
          <p>
            这三条约定看起来限制了自由，实际让定制变得可预测。AI 不需要读完成百上千行组件源码，
            只要知道有哪些材质 token、哪些颜色角色可用；新增一套风格，也不必碰组件逻辑。
          </p>
          <p>
            对 AI 来说，这尤其重要：它要生成的是一份皮肤 CSS，而不是一套新的组件实现。
            行为、边界情况和无障碍，已经在库里被验证过。
          </p>

          <h2><span class="num">05</span>统一用法，也是在减少幻觉</h2>
          <p>
            让不同的 AI、不同的人使用同一套组件，最大的收益不是少写代码，而是减少不确定性。
          </p>
          <p>
            统一的标签、属性、插槽、事件和状态命名，意味着模型不用每次猜：这个库的输入框用
            <code>value</code> 还是 <code>modelValue</code>，弹窗用 <code>open</code> 还是
            <code>visible</code>，选中态放在属性还是 class 上。上一个页面里出现过的用法，
            可以直接迁移到下一个页面。
          </p>
          <p>
            我们尽量让文档自包含：每个组件一页，属性、插槽、事件、默认值、可运行示例都在同一处。
            不是为了写得更长，而是为了让 AI 少一次猜测。猜测越少，幻觉越少。
          </p>
          <p>
            这也是为什么文档会把默认值和边界情况写得很细。对人是查阅，对 AI 是约束。
          </p>

          <h2><span class="num">06</span>我们想要的结果</h2>
          <p>不是让所有网站长得一样。恰恰相反。</p>
          <p>
            我们希望同一个 <code>st-button</code>，在 Material 3 里是饱满的填充按钮，
            在 Apple 风格里是半透明毛玻璃，在 Windows 11 里是 4px 圆角的 Fluent 控件，
            在 shadcn 风格里是克制的描边按钮——而它的加载态、禁用态、键盘行为和语义色始终一致。
          </p>
          <p>
            这样，AI 才能把精力放在“这个产品应该是什么感觉”，而不是一遍遍重新实现“按钮怎么点”。
          </p>
          <p><strong>组件是稳定的，材质是自由的。</strong>这是我们开发 Senti-UI 的原因。</p>
        </div>
