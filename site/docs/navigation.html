            <header class="doc-hero">
              <p class="doc-kicker">导航 · 17 / 21</p>
              <h1>Navigation <code>st-nav-bar</code></h1>
              <p class="doc-lead">三个组件分工明确：st-nav-bar 控制排列方向，st-nav-item 控制文字位置与选中态，st-nav-layout 按自身宽度在底部导航、横排导航与左侧 rail 之间切换。active 始终由外部切换。</p>
              <div class="doc-links">
                <a href="../index.html">组件目录</a>
                <a href="https://github.com/ofajs/senti-ui/blob/main/packages/navigation/README.md" target="_blank" rel="noreferrer">GitHub README <iconify-icon icon="mdi:open-in-new"></iconify-icon></a>
              </div>
            </header>

            <section class="doc-section">
              <h2>底部导航：icon 上、文字下</h2>
              <p class="doc-section-lead">默认形态是 M3 底部导航栏：药丸高亮落在 icon 区域，文字在下方。用 attr:active 绑定当前索引，on:click 改 data；药丸背景会自动动画跟随。角标不是内置 API，用 icon 插槽里的原生绝对定位即可。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>st-nav-bar + st-nav-item</code></div>
                <div class="demo-stage block" style="gap: 12px;">
                  <st-nav-bar style="width: 100%;">
                    <st-nav-item attr:active="navTab === 0" on:click="selectNav(0)"><iconify-icon slot="icon" icon="mdi:home-outline"></iconify-icon>首页</st-nav-item>
                    <st-nav-item attr:active="navTab === 1" on:click="selectNav(1)"><iconify-icon slot="icon" icon="mdi:magnify"></iconify-icon>发现</st-nav-item>
                    <st-nav-item attr:active="navTab === 2" on:click="selectNav(2)">
                      <span slot="icon" style="position: relative;"><iconify-icon icon="mdi:bell-outline"></iconify-icon><span style="position: absolute; top: -4px; right: -8px; min-width: 13px; height: 13px; padding: 0 3px; border-radius: 7px; background: var(--md-sys-color-error); color: var(--md-sys-color-on-error); font-size: 9px; line-height: 13px; text-align: center;">3</span></span>
                      消息
                    </st-nav-item>
                    <st-nav-item attr:active="navTab === 3" on:click="selectNav(3)"><span slot="icon">👤</span>我的</st-nav-item>
                  </st-nav-bar>
                  <span class="demo-note">当前：{{navName}} · 药丸背景会平滑移动到选中项</span>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码（含角标）</summary>
                <pre><code>&lt;st-nav-bar&gt;
  &lt;st-nav-item attr:active="nav === 0" on:click="nav = 0"&gt;
    &lt;iconify-icon slot="icon" icon="mdi:home-outline"&gt;&lt;/iconify-icon&gt;首页
  &lt;/st-nav-item&gt;
  &lt;st-nav-item attr:active="nav === 1" on:click="nav = 1"&gt;
    &lt;span slot="icon" style="position: relative;"&gt;
      &lt;iconify-icon icon="mdi:bell-outline"&gt;&lt;/iconify-icon&gt;&lt;span style="position: absolute; top: -4px; right: -8px;"&gt;3&lt;/span&gt;
    &lt;/span&gt;消息
  &lt;/st-nav-item&gt;
&lt;/st-nav-bar&gt;</code></pre>
              </details>
            </section>

            <section class="doc-section">
              <h2>尺寸与外观：改 font-size 而非加变量</h2>
              <p class="doc-section-lead">item 的 padding、药丸、图标与文字全部用 em 定义。缩放整条导航只需改 st-nav-bar 的 font-size；底色默认 surface-container，直接覆写 background、border-radius 即可，不需要额外属性。</p>
              <div class="demo">

                      <st-nav-item attr:active="sizeTabA === 2" on:click="sizeTabA = 2"><iconify-icon slot="icon" icon="mdi:send"></iconify-icon>已发送</st-nav-item>
                    </st-nav-bar>
                  </div>

                      <st-nav-item attr:active="sizeTabB === 1" on:click="sizeTabB = 1"><span slot="icon">🏷️</span>标签</st-nav-item>
                      <st-nav-item attr:active="sizeTabB === 2" on:click="sizeTabB = 2"><iconify-icon slot="icon" icon="mdi:send"></iconify-icon>已发送</st-nav-item>
                    </st-nav-bar>
                  </div>
                </div>
              </div>

            <section class="doc-section">
              <h2>纵向 rail 与抽屉</h2>
              <p class="doc-section-lead">形态属性分两层：st-nav-bar 的 vertical 让子项纵向排列；st-nav-item 的 parallel 让文字移到 icon 右侧（active 药丸覆盖整行）。两者自由组合：vertical 得到窄 rail，vertical + parallel 得到抽屉。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>vertical / parallel</code></div>
                <div class="demo-stage grid">
                  <div class="demo-cell">
                    <span class="demo-label">rail：bar vertical</span>
                    <st-nav-bar vertical style="width: fit-content; border-radius: 16px; overflow: hidden;">
                      <st-nav-item attr:active="railTab === 0" on:click="railTab = 0"><iconify-icon slot="icon" icon="mdi:inbox-arrow-down"></iconify-icon>收件箱</st-nav-item>
                      <st-nav-item attr:active="railTab === 1" on:click="railTab = 1"><span slot="icon">🏷️</span>标签</st-nav-item>
                      <st-nav-item attr:active="railTab === 2" on:click="railTab = 2"><iconify-icon slot="icon" icon="mdi:send"></iconify-icon>已发送</st-nav-item>
                    </st-nav-bar>
                  </div>
                  <div class="demo-cell">
                    <span class="demo-label">抽屉：vertical + parallel</span>
                    <st-nav-bar vertical style="width: fit-content; border-radius: 16px; overflow: hidden;">
                      <st-nav-item parallel attr:active="drawerTab === 0" on:click="drawerTab = 0"><iconify-icon slot="icon" icon="mdi:inbox-arrow-down"></iconify-icon>收件箱</st-nav-item>
                      <st-nav-item parallel attr:active="drawerTab === 1" on:click="drawerTab = 1"><span slot="icon">🏷️</span>标签</st-nav-item>
                      <st-nav-item parallel attr:active="drawerTab === 2" on:click="drawerTab = 2"><iconify-icon slot="icon" icon="mdi:send"></iconify-icon>已发送</st-nav-item>
                    </st-nav-bar>
                  </div>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码</summary>
                <pre><code>&lt;!-- 窄 rail：icon 上 / 文字下 --&gt;
&lt;st-nav-bar vertical style="position: fixed; left: 0; top: 0; bottom: 0;"&gt;
  &lt;st-nav-item active&gt;&lt;iconify-icon slot="icon" icon="mdi:inbox-arrow-down"&gt;&lt;/iconify-icon&gt;收件箱&lt;/st-nav-item&gt;
  &lt;st-nav-item&gt;&lt;span slot="icon"&gt;🏷️&lt;/span&gt;标签&lt;/st-nav-item&gt;
&lt;/st-nav-bar&gt;

&lt;!-- 抽屉：item 加 parallel，文字移到右边 --&gt;
&lt;st-nav-item parallel&gt;...&lt;/st-nav-item&gt;</code></pre>
              </details>
            </section>

            <section class="doc-section">
              <h2>禁用项 disabled</h2>
              <p class="doc-section-lead">disabled 项透明度 0.38，内部原生 button 被禁用：点击、键盘与事件全部阻断，不会因点击变成当前项。active 仍由你的数据决定，请不要把禁用项设为当前项。</p>

            <section class="doc-section">
              <h2>响应式布局 st-nav-layout</h2>
              <p class="doc-section-lead">st-nav-layout 按自身宽度（container query，不是视口）切换三档：小于 768px 底部导航；768–1023px 仍在底部但 item 自动横排；1024px 及以上移到左侧窄 rail。它自己给 bar 和 item 补 vertical / parallel，使用方不用手写断点。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>st-nav-layout</code></div>
                <div class="demo-stage block" style="gap: 18px;">
                  <div style="width: 100%;">
                    <span class="demo-label">跟随文档栏宽度（当前容器）</span>
                    <st-nav-layout style="height: 300px; margin-top: 6px; border: 1px solid var(--md-sys-color-outline-variant); border-radius: 16px; overflow: hidden;">
                      <st-nav-bar slot="nav">
                        <st-nav-item attr:active="layoutTab === 0" on:click="layoutTab = 0"><iconify-icon slot="icon" icon="mdi:home-outline"></iconify-icon>首页</st-nav-item>
                        <st-nav-item attr:active="layoutTab === 1" on:click="layoutTab = 1"><iconify-icon slot="icon" icon="mdi:magnify"></iconify-icon>发现</st-nav-item>
                        <st-nav-item attr:active="layoutTab === 2" on:click="layoutTab = 2"><span slot="icon">👤</span>我的</st-nav-item>
                      </st-nav-bar>
                      <div style="padding: 18px; height: 100%; box-sizing: border-box; overflow: auto;">
                        <span class="demo-label">内容区（默认插槽）</span>
                        <div style="margin-top: 6px; font-size: 17px; font-weight: 700;">{{layoutName}}</div>
                        <p style="margin: 8px 0 0; color: var(--md-sys-color-on-surface-variant); font-size: 12.5px; line-height: 1.75;">容器宽 768–1023px 时导航仍在底部，但 item 自动切横排、选中整行药丸背景；缩到 768px 以下回到 icon 上 / 文字下。</p>
                      </div>
                    </st-nav-layout>
                  </div>
                  <div style="width: 100%;">
                    <span class="demo-label">宽容器 1040px：自动变左侧 rail（可横向滚动查看）</span>
                    <div style="width: 100%; overflow-x: auto; margin-top: 6px; padding-bottom: 4px;">
                      <div style="width: 1040px;">
                        <st-nav-layout style="height: 300px; border: 1px solid var(--md-sys-color-outline-variant); border-radius: 16px; overflow: hidden;">
                          <st-nav-bar slot="nav">
                            <st-nav-item attr:active="wideTab === 0" on:click="wideTab = 0"><iconify-icon slot="icon" icon="mdi:inbox-arrow-down"></iconify-icon>收件箱</st-nav-item>
                            <st-nav-item attr:active="wideTab === 1" on:click="wideTab = 1"><span slot="icon">🏷️</span>标签</st-nav-item>
                            <st-nav-item attr:active="wideTab === 2" on:click="wideTab = 2"><iconify-icon slot="icon" icon="mdi:send"></iconify-icon>已发送</st-nav-item>
                          </st-nav-bar>
                          <div style="padding: 18px; height: 100%; box-sizing: border-box; overflow: auto;">
                            <span class="demo-label">容器宽度 ≥ 1024px</span>
                            <div style="margin-top: 6px; font-size: 17px; font-weight: 700;">{{wideName}}</div>
                            <p style="margin: 8px 0 0; color: var(--md-sys-color-on-surface-variant); font-size: 12.5px; line-height: 1.75;">导航已移到左侧窄 rail，宽度跟随内容而不是占满屏宽；bar 自动获得 vertical，item 自动摘掉 parallel。</p>
                            <p style="margin: 8px 0 0; color: var(--md-sys-color-on-surface-variant); font-size: 12.5px; line-height: 1.75;">判定依据是布局容器自身宽度，所以把应用放进窄面板时，即使窗口很宽也仍然走底部形态。</p>
                          </div>
                        </st-nav-layout>
                      </div>
                      <span class="demo-note" style="grid-column: 1 / -1;">演示容器固定 1040px（超过卡片宽度），可横向滚动查看完整 rail。</span>
                    </div>
                  </div>
                </div>
              </div>
              <details class="snippet">

                  <thead><tr><th>属性</th><th>类型</th><th>默认</th><th>说明</th></tr></thead>
                  <tbody>
                    <tr><td><code>vertical</code></td><td>boolean</td><td>无</td><td>st-nav-bar：子项纵向排列（rail / 抽屉）</td></tr>
                    <tr><td><code>active</code></td><td>boolean</td><td>无</td><td>st-nav-item：当前项，药丸背景跟随</td></tr>
                    <tr><td><code>parallel</code></td><td>boolean</td><td>无</td><td>st-nav-item：文字在 icon 右侧，active 覆盖整行</td></tr>
                    <tr><td><code>disabled</code></td><td>boolean</td><td>无</td><td>st-nav-item：0.38 透明度，阻断点击与键盘</td></tr>

                <ul class="api-list">
                  <li>st-nav-item 插槽：<code>icon</code> / 默认文字；st-nav-layout 插槽：<code>nav</code> / 默认内容区。</li>
                  <li>事件：item 的 click 原生冒泡（composed）；disabled 项不派发。</li>
                  <li>键盘：Tab 聚焦、Enter / Space 激活；focus-visible 有焦点环。</li>
                  <li>形态分两层：<code>vertical</code> 写 bar，<code>parallel</code> 写 item，不要写错。</li>
                  <li>st-nav-layout 断点：<code>&lt;768px</code> 底部 / <code>768–1023px</code> 底部横排 / <code>≥1024px</code> 左侧 rail；按容器自身宽度判断。</li>
                  <li>st-nav-layout 的高度依赖外部给定（如 <code>height: 100vh</code>），<code>height: 100%</code> 无父高时为空。</li>
                  <li>st-nav-layout 建议只放一个 st-nav-bar；bar 的底色可在宿主上覆盖。</li>
                </ul>
