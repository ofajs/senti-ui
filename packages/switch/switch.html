<!--
  st-switch — Senti-UI 开关组件（基于 ofa.js）
  语义属性：checked / disabled / color（M3 角色名）
  视觉对齐 Punch-UI 精致版：2px 描边轨道、拇指未选中收缩/选中复原并对勾描边入场，
  选中时边框扩展填满轨道成实心底；默认值全用 em，见 README.md
-->
<template component>
  <style>
    :host {
      display: inline-flex;
      align-items: center;
      position: relative;
      font-size: var(--st-font-size, 14px);
      font-family: var(--st-font, inherit);
      vertical-align: middle;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    :host([disabled]) {
      cursor: not-allowed;
      opacity: var(--st-disabled-opacity, 0.38);
    }

    .track {
      box-sizing: border-box;
      position: relative;
      width: 3.714em; /* 52px */
      height: 2.286em; /* 32px */
      flex-shrink: 0;
      border-radius: var(--st-switch-radius, 2.286em);
      background: var(--md-sys-color-surface-container-highest); /* 未选中底色，恒定 */
    }

    /* 描边/填充统一层：描边宽度恒定（2px），选中态用背景色过渡填充。
       不用"边框扩展成实心底"技巧——宽度动画/取整会在轨道正中露出缝隙行
       （切换瞬间与小数字号下都可见）；背景色过渡中心永远被覆盖，无任何暴露行 */
    .bg {
      position: absolute;
      inset: 0;
      box-sizing: border-box;
      border-radius: inherit;
      border: var(--st-switch-border-width, 0.143em) solid var(--md-sys-color-outline);
      background: transparent;
      transition: border-color var(--st-motion-duration-slow, 0.3s) ease,
        background-color var(--st-motion-duration-slow, 0.3s) ease;
    }

    /* 拇指：未选中 outline 灰 + scale(0.6) 收缩，选中复原并滑到右侧 */
    .thumb {
      position: absolute;
      left: 0.143em;
      top: 50%;
      width: 1.714em; /* 24px */
      height: 1.714em;
      border-radius: 50%;
      transform: translateY(-50%) scale(0.6);
      background: var(--md-sys-color-outline);
      box-shadow: var(--st-switch-thumb-shadow, var(--st-shadow-thumb, 0 0.071em 0.214em rgba(0, 0, 0, 0.25)));
      transition: transform var(--st-motion-duration-slow, 0.3s) var(--st-motion-easing, cubic-bezier(0.4, 0, 0.2, 1)),
        background-color var(--st-motion-duration-slow, 0.3s) ease;
      display: grid;
      place-items: center;
      color: inherit;
    }
    :host([checked]) .thumb {
      transform: translateY(-50%) translateX(1.429em) scale(1);
      background: var(--md-sys-color-on-primary);
    }

    /* 选中态对勾：stroke 描边入场（on-角色色拇指上用角色色勾） */
    .mark {
      width: 1.143em;
      height: 1.143em;
      opacity: 0;
      transition: opacity var(--st-motion-duration-slow, 0.3s) ease;
    }
    :host([checked]) .mark { opacity: 1; }
    .mark path {
      stroke-dasharray: 26;
      stroke-dashoffset: 26;
    }
    :host([checked]) .mark path {
      animation: st-sw-draw var(--st-motion-duration-base, 0.16s) ease-out forwards;
      animation-delay: 0.16s;
    }
    @keyframes st-sw-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .thumb, .track, .mark { transition: none; animation: none; }
    }

    .label {
      display: none;
      margin-left: 0.857em;
    }
    :host([has-label]) .label { display: inline; }

    /* 内部透明原生 checkbox：承载点击/键盘/焦点语义，覆盖整个组件 */
    .native {
      all: unset;
      position: absolute;
      inset: 0;
      cursor: inherit;
      z-index: 2; /* 盖住 position 的兄弟元素，保证点击/键盘都落在语义元素上 */
    }
    .native:focus-visible ~ .track {
      outline: var(--st-focus-ring-width, 2px) var(--st-focus-ring-style, solid)
        var(--st-focus-ring-color, var(--md-sys-color-on-surface));
      outline-offset: var(--st-focus-ring-offset, 2px);
    }

    l-m { display: none; }
  </style>

  <input class="native" type="checkbox" tabindex="0">
  <span class="track"><span class="bg"></span><span class="thumb">
    <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" d="M5 11l6 6l10 -10"/>
    </svg>
  </span></span>
  <span class="label"><slot></slot></span>

  <script>
    import "../color/st-color-init.js";
    import { syncAccessibleName } from "../a11y/a11y.js";
    import { createFormProxy, syncFormProxy, bindFormReset } from "../form/form-proxy.js";
    export default async () => ({
      tag: "st-switch",
      attrs: {
        checked: null,
        disabled: null,
        color: null,
        name: null,
        value: "on",
        form: null,
        required: null,
      },
      watch: {
        checked() { this.applyState(); },
        disabled() { this.applyState(); },
        color() { this.applyState(); },
        name() { this.syncForm?.(); },
        form() { this.syncForm?.(); },
        value() { this.syncForm?.(); },
        required() { this.syncForm?.(); },
      },
      ready() {
        const ele = this.ele;
        const sr = ele.shadowRoot;
        const input = sr.querySelector(".native");

        // 交互：原生 input 承载点击与键盘（Space），变更后反射回宿主属性并派发 change
        input.addEventListener("change", () => {
          if (input.checked) ele.setAttribute("checked", "");
          else ele.removeAttribute("checked");
          if (this._proxy) this._proxy.checked = input.checked;
          input.removeAttribute("aria-invalid");
          ele.dispatchEvent(new Event("change", { bubbles: true, composed: true }));
        });

        // 标签文字是 slot 内容、与原生 input 是兄弟节点，必须同步为可访问名称
        this._a11yCleanup = syncAccessibleName(ele, input, { fromSlot: true });

        // 表单代理是 light DOM 子节点，会破坏 :host(:empty)；用 has-label 显式判断
        const labelSlot = sr.querySelector(".label slot");
        const syncLabel = () => {
          const has = labelSlot
            .assignedNodes()
            .some((node) => node.nodeType === 1 || (node.nodeType === 3 && node.textContent.trim()));
          ele.toggleAttribute("has-label", has);
        };
        labelSlot.addEventListener("slotchange", syncLabel);
        syncLabel();

        const proxy = createFormProxy(ele, "checkbox");
        this._proxy = proxy;
        this.syncForm = () => {
          syncFormProxy(proxy, {
            name: this.name,
            form: ele.getAttribute("form"),
            value: this.value ?? "on",
            checked: this.checked !== null,
            disabled: this.disabled !== null,
            required: this.required !== null,
          });
        };
        this.syncForm();
        proxy.addEventListener("invalid", (e) => {
          e.preventDefault();
          input.setAttribute("aria-invalid", "true");
          ele.dispatchEvent(new Event("invalid", { bubbles: true, composed: true }));
        });
        const initialChecked = this.checked !== null;
        this._resetCleanup = bindFormReset(ele, () => {
          if (initialChecked) ele.setAttribute("checked", "");
          else ele.removeAttribute("checked");
          this.applyState();
        });

        this.applyState();
      },
      detached() {
        this._a11yCleanup?.();
        this._resetCleanup?.();
      },
      proto: {
        // watch 初始化也会触发一次（坑 #27），applyState 无副作用，天然安全。
        // 选中态：边框扩展填满轨道（border-width = 轨道半高）实现实心底，拇指用 on-角色色
        applyState() {
          const sr = this.ele.shadowRoot;
          const input = sr.querySelector(".native");
          const thumb = sr.querySelector(".thumb");
          const on = this.checked !== null;

          input.checked = on;
          input.disabled = this.disabled !== null;
          this.syncForm?.();

          const name = this.color;
          const main = name
            ? `var(--md-sys-color-${name}, var(--${name}, var(--md-sys-color-primary)))`
            : "var(--md-sys-color-primary)";
          const onMain = name
            ? `var(--md-sys-color-on-${name}, var(--on-${name}, var(--md-sys-color-on-primary)))`
            : "var(--md-sys-color-on-primary)";

          const bg = sr.querySelector(".bg");
          if (on) {
            bg.style.background = main;
            bg.style.borderColor = main;
            thumb.style.background = onMain;
            thumb.style.color = main; // 对勾颜色 = 角色色（拇指底为 on-角色色）
          } else {
            bg.style.background = "";
            bg.style.borderColor = "";
            thumb.style.background = "";
            thumb.style.color = "";
          }
        },
      },
    });
  </script>
</template>
