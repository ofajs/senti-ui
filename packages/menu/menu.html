<!--
  st-menu — Senti-UI 下拉菜单组件（基于 ofa.js）
  语义属性：align（left|right，面板与触发器的对齐）；open 为运行时状态（el.open 读写/JS 控制）
  trigger 插槽为触发器；菜单项为 light DOM 的 st-menu-item；点击外部/Escape/选中后自动关闭，见 README.md
  多级子菜单：st-menu 放在 st-menu-item 的 sub-menu 插槽内（自动进入子菜单模式：
  面板定位在该 item 侧边并自动翻转，由 item 负责 hover 展开与箭头）
  右键菜单：不放 trigger，JS 调 openAt(x, y) 在光标处打开（自动翻转避让视口）
-->
<template component>
  <style>
    :host {
      position: relative;
      display: inline-flex;
      vertical-align: middle;
      font-size: 14px;
      line-height: 1.2;
      font-family: inherit;
      color: var(--md-sys-color-on-surface);
    }

    /* 子菜单模式（ready 时检测挂 sub 属性）：宿主零尺寸、不参与父面板布局，
       仅作为 fixed 面板的挂载点；定位锚点由 JS 取所在 st-menu-item 的 rect */
    :host([sub]) {
      position: absolute;
      width: 0;
      height: 0;
      display: block;
    }
    :host([sub]) .trigger {
      display: none;
    }

    .trigger {
      display: flex;
    }

    /* 面板 fixed 定位（JS 计算位置，翻转避让视口），弹层不随滚动裁剪 */
    .panel {
      display: none;
      position: fixed;
      left: 0;
      top: 0;
      box-sizing: border-box;
      min-width: 6em; /* 84px */
      max-height: 80vh;
      overflow-y: auto;
      padding: 0.286em;
      border-radius: 0.857em; /* 12px */
      background: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface);
      box-shadow: 0 0.071em 0.143em rgba(0, 0, 0, 0.3), 0 0.143em 0.429em 0.143em rgba(0, 0, 0, 0.15);
      z-index: 1000;
      transform-origin: 50% 0;
      animation: st-menu-in 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    /* 关闭过渡 */
    .panel.closing {
      pointer-events: none;
      opacity: 0;
      transform: translateY(-0.429em) scale(0.98);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    @keyframes st-menu-in {
      from { opacity: 0; transform: translateY(-0.429em) scale(0.98); }
      to { opacity: 1; transform: none; }
    }

    ::slotted(hr) {
      display: block;
      width: 100%;
      margin: 0.286em 0;
      border: none;
      border-top: 1px solid var(--md-sys-color-outline-variant);
    }

    @media (prefers-reduced-motion: reduce) {
      .panel { animation: none; transition: none; }
    }

    l-m { display: none; }
  </style>

  <l-m src="./menu-item.html"></l-m>

  <div class="trigger"><slot name="trigger"></slot></div>
  <div class="panel"><slot></slot></div>

  <script>
    import "../color/st-color-init.js";
    export default async () => ({
      tag: "st-menu",
      attrs: {
        align: "right",
      },
      data: {
        open: false,
      },
      watch: {
        open(val) {
          // watch 初始化也会以初始值触发一次（坑 #27），首次调用只记录状态、不派发事件
          if (this._openInited === undefined) {
            this._openInited = true;
            return;
          }
          const panel = this.ele.shadowRoot.querySelector(".panel");
          if (val) {
            // 子菜单检测兜底：ofa 升级 light DOM 的时序下 ready 时 parentElement
            // 可能尚未就绪（命令式动态构建时踩到），首次打开时再校验一次
            if (!this._isSub && this.ele.closest("st-menu-item")) {
              this._isSub = true;
              this.ele.setAttribute("sub", "");
            }
            // 先渲染再定位，避免闪烁；重新打开时取消关闭过渡并重启进入动画
            clearTimeout(this._closeTimer);
            panel.classList.remove("closing");
            panel.style.display = "block";
            this.updatePosition();
            this.bindDocEvents();
            this.ele.dispatchEvent(new Event("open", { bubbles: true, composed: true }));
          } else {
            // 关闭：级联关闭所有仍打开的子菜单，再做退出过渡隐藏。
            // 面板 display:none 会连带隐藏 fixed 的子菜单面板，这里同步清状态避免重开时残留。
            // 注意：_openSubs 里存的是原生元素，open 必须经 $() 包装对象写（原生赋值不进 ofa data）
            for (const sub of [...this._openSubs]) $(sub).open = false;
            this._anchorPoint = null;
            panel.classList.add("closing");
            clearTimeout(this._closeTimer);
            this._closeTimer = setTimeout(() => {
              panel.style.display = "none";
              panel.classList.remove("closing");
            }, 180);
            this.unbindDocEvents();
            this.ele.dispatchEvent(new Event("close", { bubbles: true, composed: true }));
          }
        },
      },
      ready() {
        const ele = this.ele;
        const sr = ele.shadowRoot;
        this._openSubs = new Set();

        // 子菜单模式：本组件挂在某个 st-menu-item 的 sub-menu 插槽内（祖先链可判）。
        // hover 展开/收起与箭头由 st-menu-item 负责，这里只负责定位与关闭链
        this._isSub = !!(ele.parentElement && ele.parentElement.closest("st-menu"));
        if (this._isSub) ele.setAttribute("sub", "");

        // 点击触发器切换。子菜单模式下 click 也要停掉冒泡：
        // 否则会冒到父级面板的"点击即关闭"监听，把父菜单一起关掉
        sr.querySelector(".trigger").addEventListener("click", (e) => {
          if (this._isSub) e.stopPropagation();
          this._anchorPoint = null; // 回到触发器定位模式
          this.open = !this.open;
        });

        // 菜单内任意点击后自动关闭（不阻止冒泡，菜单项 click 正常传出）；
        // 点击子菜单里的菜单项时，冒泡到这里的正是"整链关闭"语义
        sr.querySelector(".panel").addEventListener("click", () => {
          if (this.open) this.open = false;
        });

        // 追踪仍打开的后代子菜单（open/close 事件 composed 冒泡到宿主）
        ele.addEventListener("open", (e) => {
          if (e.target !== ele) this._openSubs.add(e.target);
        });
        ele.addEventListener("close", (e) => {
          if (e.target !== ele) this._openSubs.delete(e.target);
        });

        // 鼠标移到本菜单的其他项时，关闭不在指针路径上的子菜单（hover 切换兄弟子菜单）
        sr.querySelector(".panel").addEventListener("pointerover", (e) => {
          const path = e.composedPath();
          for (const sub of [...this._openSubs]) {
            if (!path.includes(sub)) $(sub).open = false;
          }
        });

        this._onDocPointerDown = (e) => {
          // 坑 #21：composed 事件必须用 composedPath 判断，contains 会误判
          if (e.composedPath().includes(ele)) return;
          this.open = false;
        };
        this._onDocKeydown = (e) => {
          // Escape 只关最内层：还有打开的子菜单时交由子菜单自己处理
          if (e.key === "Escape" && this.open && !this._openSubs.size) this.open = false;
        };
        this._onReposition = () => this.updatePosition();
      },
      detached() {
        clearTimeout(this._closeTimer);
        clearTimeout(this._subOpenTimer);
        clearTimeout(this._subCloseTimer);
        this.unbindDocEvents();
      },
      proto: {
        // 在指定视口坐标打开（右键菜单场景）：面板左上角对齐坐标，
        // 空间不足自动向左/上翻转，不超出可视区域。ofa 页面用法：
        // on:contextmenu 事件里 e.preventDefault() 后调 openAt(e.clientX, e.clientY)
        openAt(x, y) {
          this._anchorPoint = { x, y };
          // 已打开时（菜单开着又右键别处）watch 不会再触发，手动重定位
          if (this.open) this.updatePosition();
          else this.open = true;
        },
        updatePosition() {
          if (!this.open) return;
          const ele = this.ele;
          const panel = ele.shadowRoot.querySelector(".panel");
          const panelW = panel.offsetWidth;
          const panelH = panel.offsetHeight;
          const vw = window.innerWidth;
          const vh = window.innerHeight;
          const margin = 8;
          const gap = 4;

          let left, top;
          if (this._anchorPoint) {
            // 坐标锚点（右键菜单）：面板左上角对齐光标，
            // 右侧/下方空间不足时翻转到光标左/上方，再夹紧在视口内
            const { x, y } = this._anchorPoint;
            left = x + panelW > vw - margin ? Math.max(margin, x - panelW) : x;
            top = y + panelH > vh - margin ? Math.max(margin, y - panelH) : y;
            panel.style.transformOrigin =
              y + panelH > vh - margin ? "50% 100%" : "50% 0";
            panel.style.minWidth = "";
          } else {
            // 子菜单锚点 = 所在的 st-menu-item（宿主本身零尺寸）
            const anchor = this._isSub ? ele.closest("st-menu-item") : null;
            const rect = anchor
              ? anchor.getBoundingClientRect()
              : ele.getBoundingClientRect();
            if (this._isSub) {
              // 子菜单：面板放触发项右侧（空间不足翻转到左侧），顶部对齐触发项
              left = rect.right + gap;
              if (left + panelW > vw - margin) {
                left = Math.max(margin, rect.left - panelW - gap);
                panel.style.transformOrigin = "100% 0";
              } else {
                panel.style.transformOrigin = "0 0";
              }
              top = Math.max(margin, Math.min(rect.top, vh - panelH - margin));
              panel.style.minWidth = "";
            } else {
              left =
                (this.align || "right") === "left"
                  ? rect.left
                  : rect.right - panelW;
              left = Math.max(margin, Math.min(left, vw - panelW - margin));

              top = rect.bottom + gap;
              if (top + panelH > vh - margin) {
                // 下方空间不足时翻转到上方
                const topAbove = rect.top - panelH - gap;
                top = topAbove >= margin ? topAbove : Math.max(margin, vh - panelH - margin);
              }
              // 宽度只由内容决定（CSS min-width 6em 兜底），
              // 不跟随触发器宽度——否则触发按钮宽时菜单跟着变宽
              panel.style.minWidth = "";
            }
          }

          panel.style.left = left + "px";
          panel.style.top = top + "px";
        },
        bindDocEvents() {
          if (this._docBound) return;
          document.addEventListener("pointerdown", this._onDocPointerDown, true);
          document.addEventListener("keydown", this._onDocKeydown, true);
          window.addEventListener("resize", this._onReposition, true);
          document.addEventListener("scroll", this._onReposition, true);
          this._docBound = true;
        },
        unbindDocEvents() {
          if (!this._docBound) return;
          document.removeEventListener("pointerdown", this._onDocPointerDown, true);
          document.removeEventListener("keydown", this._onDocKeydown, true);
          window.removeEventListener("resize", this._onReposition, true);
          document.removeEventListener("scroll", this._onReposition, true);
          this._docBound = false;
        },
      },
    });
  </script>
</template>
