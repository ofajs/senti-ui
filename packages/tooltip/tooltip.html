<!--
  st-tooltip — Sensi-UI 提示组件（基于 ofa.js）
  语义属性：content（提示文本，纯文本渲染防注入）/ placement(top|bottom，默认自动翻转) / disabled
  open 为运行时状态（ofa data）：sync:open 可双向绑定；悬停/聚焦宿主自动开合
  默认插槽放触发元素；气泡 fixed 定位自动翻转避让视口，见 README.md
-->
<template component>
  <style>
    :host {
      position: relative;
      display: inline-flex;
    }

    /* 气泡：fixed 定位（JS 计算位置），inverse-surface 深色底 */
    .bubble {
      display: none;
      position: fixed;
      left: 0;
      top: 0;
      box-sizing: border-box;
      max-width: 20em;
      padding: var(--st-tooltip-padding, 0.357em 0.643em);
      border-radius: var(--st-tooltip-radius, 0.286em);
      font-size: 0.857em; /* 12px */
      font-family: var(--st-font, inherit);
      line-height: 1.5;
      background: var(--st-tooltip-bg, var(--md-sys-color-inverse-surface));
      color: var(--st-tooltip-fg, var(--md-sys-color-inverse-on-surface));
      box-shadow: var(--st-tooltip-shadow, none);
      backdrop-filter: var(--st-tooltip-backdrop-filter, none);
      -webkit-backdrop-filter: var(--st-tooltip-backdrop-filter, none);
      z-index: 1200;
      pointer-events: none;
    }
    :host([open]) .bubble { display: block; }
    :host([drop-up]) .bubble {
      transform-origin: 50% 100%;
      animation: st-tip-in-up var(--st-tooltip-duration, 0.15s)
        var(--st-motion-easing, cubic-bezier(0.2, 0, 0, 1));
    }
    :host(:not([drop-up])) .bubble {
      transform-origin: 50% 0;
      animation: st-tip-in var(--st-tooltip-duration, 0.15s)
        var(--st-motion-easing, cubic-bezier(0.2, 0, 0, 1));
    }
    @keyframes st-tip-in {
      from { opacity: 0; transform: translateY(0.286em); }
      to { opacity: 1; transform: none; }
    }
    @keyframes st-tip-in-up {
      from { opacity: 0; transform: translateY(-0.286em); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bubble { animation: none; }
    }

    l-m { display: none; }
  </style>

  <slot></slot>
  <div class="bubble" role="tooltip" aria-hidden="true"></div>

  <script>
    import "../color/st-color-init.js";
    import { rafThrottle } from "../a11y/a11y.js";
    export default async () => ({
      tag: "st-tooltip",
      attrs: {
        content: null,
        disabled: null,
      },
      data: {
        // open 是运行时状态（data，非标签属性）：sync:open 可双向绑定；
        // 悬停/聚焦宿主自动开合也走这里
        open: false,
      },
      watch: {
        open(val) {
          const ele = this.ele;
          const bubble = ele.shadowRoot?.querySelector(".bubble");
          // data → 属性反射（CSS :host([open]) 显隐选择器依赖属性）
          if (val) ele.setAttribute("open", "");
          else ele.removeAttribute("open");
          if (bubble) bubble.setAttribute("aria-hidden", val ? "false" : "true");
          if (val) {
            // 首次定位时先停入场动画，定位完再启动（只播一次）
            if (bubble) bubble.style.animation = "none";
            this.updatePosition?.();
            requestAnimationFrame(() => {
              if (!this.open) return;
              this.updatePosition?.();
              if (bubble) bubble.style.animation = "";
            });
            this.bindReposition?.();
          } else {
            this.unbindReposition?.();
          }
        },
        content() {
          this.applyContent();
          // 文本变化会改变气泡宽度，打开状态下要重新定位
          if (this.open) this.updatePosition?.();
        },
        disabled() { if (this.disabled !== null) this.open = false; },
      },
      ready() {
        const ele = this.ele;
        const sr = ele.shadowRoot;
        this.applyContent = () => {
          const text = this.content || "";
          sr.querySelector(".bubble").textContent = text;
          // 跨 shadow 的 aria-describedby 不可靠：用 aria-description 把提示文本
          // 挂到触发元素（组件触发器则挂到内部原生控件）上
          sr.querySelector('slot:not([name])')
            .assignedElements()
            .forEach((el) => {
              const target = el.shadowRoot?.querySelector("button, input, textarea, a[href]") || el;
              if (text) target.setAttribute("aria-description", text);
              else target.removeAttribute("aria-description");
            });
        };
        this.applyContent();
        this.ele.shadowRoot
          .querySelector('slot:not([name])')
          .addEventListener("slotchange", this.applyContent);
        // 触发元素可能晚于 tooltip 升级：下一帧与短定时器再同步 aria-description
        requestAnimationFrame(() => this.applyContent());
        this._descTimers = [50, 150, 300, 600].map((delay) =>
          setTimeout(() => this.applyContent(), delay)
        );

        // 属性 → data 兼容路径（README 承诺 setAttribute("open") 有效）
        if (ele.hasAttribute("open")) this.open = true;
        this._attrObserver = new MutationObserver(() => {
          const attrOpen = ele.hasAttribute("open");
          if (attrOpen !== (this.open === true)) this.open = attrOpen;
        });
        this._attrObserver.observe(ele, { attributes: true, attributeFilter: ["open"] });

        this._onReposition = rafThrottle(() => this.updatePosition());
        this.bindReposition = () => {
          if (this._repositionBound) return;
          window.addEventListener("resize", this._onReposition, true);
          document.addEventListener("scroll", this._onReposition, true);
          this._repositionBound = true;
        };
        this.unbindReposition = () => {
          if (!this._repositionBound) return;
          window.removeEventListener("resize", this._onReposition, true);
          document.removeEventListener("scroll", this._onReposition, true);
          this._repositionBound = false;
        };

        // 悬停/聚焦开合（disabled 时不响应）；触屏不响应 pointerenter，
        // 改为长按 500ms 打开，避免滑动/轻点误触
        const show = () => { if (this.disabled === null) this.open = true; };
        const hide = () => {
          this._touchOpened = false;
          this.open = false;
        };
        const cancelLongPress = () => {
          clearTimeout(this._touchTimer);
          this._touchTimer = null;
          this._touchStart = null;
        };
        ele.addEventListener("pointerenter", (e) => {
          if (e.pointerType === "touch") return;
          show();
        });
        ele.addEventListener("pointerleave", (e) => {
          if (e.pointerType === "touch") return;
          hide();
        });
        ele.addEventListener("focusin", show);
        ele.addEventListener("focusout", hide);
        ele.addEventListener("pointerdown", (e) => {
          if (e.pointerType !== "touch" || this.disabled !== null) return;
          cancelLongPress();
          this._suppressClick = false;
          this._touchStart = { x: e.clientX, y: e.clientY };
          this._touchTimer = setTimeout(() => {
            this._touchTimer = null;
            this._touchOpened = true;
            this._suppressClick = true;
            show();
          }, 500);
        });
        ele.addEventListener("pointermove", (e) => {
          if (!this._touchStart || e.pointerType !== "touch") return;
          const dx = e.clientX - this._touchStart.x;
          const dy = e.clientY - this._touchStart.y;
          if (Math.hypot(dx, dy) > 10) cancelLongPress();
        });
        for (const type of ["pointerup", "pointercancel"]) {
          ele.addEventListener(type, (e) => {
            if (e.pointerType === "touch") cancelLongPress();
          });
        }
        // 长按已打开时吞掉系统 contextmenu 与抬手 click，避免误触触发器
        ele.addEventListener("contextmenu", (e) => {
          if (this._touchOpened) e.preventDefault();
        });
        ele.addEventListener("click", (e) => {
          if (!this._suppressClick) return;
          this._suppressClick = false;
          e.preventDefault();
          e.stopPropagation();
        }, true);
        // 触屏没有 pointerleave：点触发器外部关闭
        this._onDocPointerDown = (e) => {
          if (!this.open) return;
          if (e.composedPath().includes(ele)) return;
          hide();
        };
        document.addEventListener("pointerdown", this._onDocPointerDown, true);
        // 捕获阶段消费 Escape：只关 tooltip，不连带关掉外层 dialog
        this._onKeydown = (e) => {
          if (e.key === "Escape" && this.open) {
            e.stopPropagation();
            this.open = false;
          }
        };
        document.addEventListener("keydown", this._onKeydown, true);
      },
      detached() {
        document.removeEventListener("keydown", this._onKeydown, true);
        document.removeEventListener("pointerdown", this._onDocPointerDown, true);
        this.unbindReposition();
        this._attrObserver?.disconnect();
        clearTimeout(this._showTimer);
        clearTimeout(this._touchTimer);
        this._descTimers?.forEach(clearTimeout);
      },
      proto: {
        // 气泡定位：触发器上方居中，视口上方放不下翻到下方（横向夹在视口内）
        updatePosition() {
          const ele = this.ele;
          const bubble = ele.shadowRoot.querySelector(".bubble");
          const rect = ele.getBoundingClientRect();
          ele.removeAttribute("drop-up");
          // 先显示才能量尺寸（visibility 不影响布局：直接量 offsetWidth）
          const w = bubble.offsetWidth;
          const h = bubble.offsetHeight;
          let left = rect.left + rect.width / 2 - w / 2;
          left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
          const gap = 7; // 7px
          let top = rect.top - h - gap;
          if (top < 8) {
            top = rect.bottom + gap;
          } else {
            ele.setAttribute("drop-up", "");
          }
          // fixed 的 containing block 可能被祖先 transform 接管（坑 #42）：
          // 先归零量原点，再写相对坐标，放进 dialog 等动画容器也不会偏移
          bubble.style.left = "0px";
          bubble.style.top = "0px";
          const origin = bubble.getBoundingClientRect();
          bubble.style.left = left - origin.left + "px";
          bubble.style.top = top - origin.top + "px";
        },
      },
    });
  </script>
</template>
