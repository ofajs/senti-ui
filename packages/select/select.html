<!--
  st-select — Senti-UI 单选下拉框组件（基于 ofa.js）
  语义属性：variant(filled|outlined) / default-value / placeholder / color / disabled
  value 是运行时状态（ofa data），通过 el.value 读写，不作为标签属性
  选项写在 light DOM：原生 <option> 或 <st-option> 组件（label 属性定闭合态文本，插槽放富内容）
  视觉全部在 :host 上，直接用原生 CSS 属性定制，见 README.md
-->
<template component>
  <style>
    :host {
      /* 视觉样式全部定义在 host 上，外部 style 可直接覆盖任何原生属性 */
      /* 尺寸类默认值用 em：改 font-size 即可整体等比缩放 */
      display: inline-flex;
      align-items: center;
      position: relative; /* 聚焦描边/底线浮层与下拉弹层的定位基准 */
      gap: 0.571em;
      box-sizing: border-box;
      height: var(--st-height, 2.857em);
      min-width: 13.571em; /* M3 最小填充宽度 = 190px @ 14px */
      padding: var(--st-field-padding, 0 1em);
      border: var(--st-border-width, 1px) solid
        var(--st-field-border, var(--md-sys-color-outline));
      border-radius: var(--st-field-radius, 0.5em);
      font-size: var(--st-font-size, 14px);
      font-family: var(--st-font, inherit);
      letter-spacing: var(--st-letter-spacing, normal);
      line-height: 1;
      color: var(--md-sys-color-on-surface);
      background-color: var(--st-field-bg, transparent);
      box-shadow: var(--st-field-shadow, none);
      -webkit-backdrop-filter: var(--st-backdrop-filter, none);
      backdrop-filter: var(--st-backdrop-filter, none);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* M3 filled 变体：无全边框，仅底边分隔线，容器底色 */
    :host([variant="filled"]) {
      background-color: var(--st-field-filled-bg, var(--md-sys-color-surface-container-highest));
      border-color: transparent;
      border-bottom-color: var(--st-field-underline, var(--md-sys-color-on-surface-variant));
      border-radius: var(--st-field-radius, 0.5em) var(--st-field-radius, 0.5em) 0 0;
    }

    /* focus 描边/底线：绝对定位浮层，不挤占布局，由 CSS 过渡呈现动画 */
    .outline-ring {
      position: absolute;
      inset: -1px; /* 盖在 1px 边框外侧，视觉 = 边框加粗到 2px */
      border: 2px solid
        var(--st-field-focus-ring-color, var(--st-accent, var(--md-sys-color-primary)));
      border-radius: inherit;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--st-motion-duration, 150ms) ease;
    }
    :host(:focus-within) .outline-ring {
      opacity: var(--st-field-focus-ring-opacity, 1);
    }
    /* 皮肤焦点材质：用 --st-accent 在组件内组合颜色，避免皮肤 token 在祖先处
       提前解析 var(--st-accent) 而丢失 color 属性的语义色（坑 #59a）。
       默认所有增量均为 0，保持 M3 原有内嵌描边。 */
    :host(:focus-within) {
      box-shadow:
        0 0 0 var(--st-field-focus-gap, 0px) var(--st-field-focus-gap-color, transparent),
        0 0 0 calc(var(--st-field-focus-gap, 0px) + var(--st-field-focus-glow-spread, 0px))
          color-mix(
            in srgb,
            var(--st-accent, var(--st-field-focus-color, var(--md-sys-color-primary)))
              var(--st-field-focus-glow-alpha, 0%),
            transparent
          ),
        inset 0 calc(-1 * var(--st-field-focus-underline-height, 0px)) 0 0
          color-mix(
            in srgb,
            var(--st-accent, var(--st-field-focus-color, var(--md-sys-color-primary)))
              var(--st-field-focus-underline-alpha, 100%),
            transparent
          ),
        var(--st-field-focus-shadow, 0 0 0 0 transparent);
    }
    :host([variant="filled"]) .outline-ring { display: none; }

    .line-clip {
      display: none;
      position: absolute;
      inset: -1px; /* 扩到边框外沿，底线才能盖住 1px 底边框 */
      border-radius: inherit;
      overflow: hidden;
      pointer-events: none;
    }
    :host([variant="filled"]) .line-clip { display: block; }
    .bottom-line {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 2px;
      width: 0;
      background-color: var(
        --st-field-underline-color,
        var(--st-accent, var(--md-sys-color-primary))
      );
      transition: width var(--st-motion-duration-base, 200ms) var(--st-motion-easing, cubic-bezier(0.2, 0, 0, 1));
    }
    :host(:focus-within) .bottom-line { width: 100%; }

    :host([disabled]) {
      opacity: var(--st-disabled-opacity, 0.38);
      cursor: not-allowed;
    }
    :host([disabled]) .outline-ring,
    :host([disabled]) .line-clip { display: none; }

    /* 选中值 / 占位文本 */
    .label {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: start;
    }
    /* 闭合态可带选项里的图标：图标不伸缩，文本负责省略 */
    .label.has-icon { display: inline-flex; align-items: center; gap: 0.5em; }
    .label.has-icon .label-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .label.has-icon > svg,
    .label.has-icon > img,
    .label.has-icon > [slot="icon"],
    .label.has-icon > iconify-icon { flex: none; }
    .label.placeholder { color: var(--md-sys-color-on-surface-variant); }

    /* 真正的 combobox：把焦点与 ARIA 关系放进 shadow，
       让 aria-controls / aria-activedescendant 与 listbox 处于同一棵树 */
    .control {
      position: absolute;
      inset: 0;
      z-index: 3;
      border-radius: inherit;
      outline: none;
      cursor: inherit;
    }
    .control:focus-visible { outline: none; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* 下拉箭头（CSS chevron），展开时旋转 180° */
    .arrow {
      width: 0.571em;
      height: 0.571em;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg) translateY(-0.1em);
      transition: transform var(--st-motion-duration-base, 200ms) var(--st-motion-easing, ease);
      flex-shrink: 0;
      opacity: 0.8;
    }
    :host([open]) .arrow { transform: rotate(225deg) translateY(-0.1em); }

    /* 下拉弹层：挂在 shadow 内（宿主须不被 overflow 裁剪的祖先包裹）。
       打开时按视口剩余空间自动翻转（drop-up），开合动画同 st-menu */
    .listbox {
      display: none;
      position: absolute;
      top: calc(100% + 0.286em);
      left: -1px;
      right: -1px;
      min-width: 100%;
      max-height: 15em;
      overflow-y: auto;
      padding: var(--st-select-popup-padding, 0.286em);
      box-sizing: border-box;
      background-color: var(--st-select-popup-bg, var(--md-sys-color-surface-container));
      border-radius: var(--st-select-popup-radius, 0.5em);
      box-shadow: 0 0 0 var(--st-border-width, 1px) var(--st-select-popup-border, transparent),
        var(--st-select-popup-shadow, var(--st-shadow-overlay, 0 0.2em 0.8em rgb(0 0 0 / 0.2)));
      backdrop-filter: var(--st-select-popup-backdrop-filter, none);
      -webkit-backdrop-filter: var(--st-select-popup-backdrop-filter, none);
      z-index: 10;
      transform-origin: 50% 0;
      animation: st-select-in var(--st-overlay-enter-duration, 0.2s)
        var(--st-motion-easing, cubic-bezier(0.2, 0, 0, 1));
    }
    /* 下方空间不足时向上弹（open 时 JS 按视口位置判定挂 drop-up） */
    :host([drop-up]) .listbox {
      top: auto;
      bottom: calc(100% + 0.286em);
      transform-origin: 50% 100%;
      animation-name: st-select-in-up;
    }
    /* 关闭过渡：短暂保留 closing 态播完退出动画再隐藏（坑 #34：不能只靠 display） */
    :host([open]) .listbox,
    :host([closing]) .listbox { display: block; }
    .listbox.closing, :host([closing]) .listbox {
      pointer-events: none;
      opacity: 0;
      transform: translateY(-0.429em) scale(0.98);
      transition: opacity var(--st-overlay-exit-duration, 0.15s) ease,
        transform var(--st-overlay-exit-duration, 0.15s) ease;
    }
    :host([drop-up]) .listbox.closing,
    :host([drop-up][closing]) .listbox {
      transform: translateY(0.429em) scale(0.98);
    }
    @keyframes st-select-in {
      from { opacity: 0; transform: translateY(-0.429em) scale(0.98); }
      to { opacity: 1; transform: none; }
    }
    @keyframes st-select-in-up {
      from { opacity: 0; transform: translateY(0.429em) scale(0.98); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      :host,
      :host * {
        animation-delay: 0s !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .listbox { animation: none; transition: none; }
    }

    .opt {
      display: flex;
      align-items: center;
      gap: 0.571em;
      padding: var(--st-select-option-padding, 0.786em 0.714em);
      border-radius: var(--st-select-option-radius, 0.357em);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .opt:hover { background-color: var(--st-select-option-hover-bg, var(--md-sys-color-surface-container-high)); }
    .opt[data-active] { background-color: var(--st-select-option-hover-bg, var(--md-sys-color-surface-container-high)); }
    .opt[data-selected] {
      background-color: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }
    .opt .check {
      display: none;
      width: 0.5em;
      height: 0.286em;
      border-left: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(-45deg);
      margin-left: auto;
      flex-shrink: 0;
    }
    .opt[data-selected] .check { display: inline-block; }

    /* 分组标题（optgroup label）：只作视觉分组，选项仍平铺为 listbox 的子项 */
    .group { padding-top: 0.286em; }
    .group-label {
      padding: 0.429em 0.714em 0.286em;
      font-size: 0.786em;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--md-sys-color-on-surface-variant);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* 禁用选项：不可点、不可键盘选中，保持读屏可感知 */
    .opt[data-disabled] {
      opacity: var(--st-disabled-opacity, 0.38);
      cursor: not-allowed;
    }
    .opt[data-disabled]:hover { background: transparent; }
    .opt[data-disabled][data-selected] {
      background: var(--md-sys-color-secondary-container);
    }

    /* light DOM 里的 <option>/<st-option> 只作数据源，不参与渲染；
       l-m 是 flex item 会参与 gap 布局，必须隐藏（坑 #14） */
    slot { display: none; }
    l-m { display: none; }
  </style>

  <span class="outline-ring"></span>
  <span class="line-clip"><span class="bottom-line"></span></span>
  <span class="label" id="st-label"></span>
  <span class="arrow"></span>
  <span class="control" id="st-control" role="combobox" tabindex="0"
    aria-haspopup="listbox" aria-controls="st-listbox"
    aria-describedby="st-value" aria-expanded="false"></span>
  <span class="sr-only" id="st-value"></span>
  <div class="listbox" id="st-listbox" role="listbox"></div>
  <l-m src="./option.html"></l-m>
  <slot id="st-slot"></slot>

  <script>
    import "../color/st-color-init.js";
    import { syncAccessibleName } from "../a11y/a11y.js";
    import { createFormProxy, syncFormProxy, bindFormReset } from "../form/form-proxy.js";
    export default async () => ({
      tag: "st-select",
      attrs: {
        variant: "outlined",
        placeholder: null,
        color: null,
        disabled: null,
        name: null,
        form: null,
        required: null,
        options: null, // 动态选项数组入口：:options="[{value,label}]" 绑定或 el.options = [...]，
        // 经宿主 property setter 存入内部 _opts（不走 ofa attr data，避免数组被序列化成字符串）
      },
      data: {
        value: null, // 运行时选中值，attached 时由 default-value 属性初始化
      },
      watch: {
        color() { this.applyColor(); },
        // 外部改 this.value（data / el.value）时刷新选中态
        value() { this.syncSelected(false); },
        // :options 绑定会把数组 JSON 序列化写入 attribute，这里解析后重建列表
        options() {
          let list = this.options;
          if (typeof list === "string") {
            try { list = JSON.parse(list || "[]"); } catch { list = []; }
          }
          if (!Array.isArray(list)) return;
          this._opts = list.map((o) => ({
            value: String(o.value ?? o.label),
            label: String(o.label ?? o.value),
            disabled: !!o.disabled,
            group: o.group ? String(o.group) : "",
            el: null,
          }));
          this.buildList();
          this.syncSelected(false);
        },
        disabled() { this.close(); this.syncDisabled?.(); this.syncForm?.(); },
        name() { this.syncForm?.(); },
        form() { this.syncForm?.(); },
        required() { this.syncForm?.(); },
      },
      ready() {
        this.applyColor();
        const ele = this.ele;
        const sr = ele.shadowRoot;
        this.labelEl = sr.querySelector("#st-label");
        this.listEl = sr.querySelector("#st-listbox");
        this.controlEl = sr.querySelector("#st-control");
        this.slotEl = sr.querySelector("#st-slot");
        this.activeIndex = -1;
        this._selectedIndex = -1;
        // 宿主本身不可聚焦，桥接 focus/blur 到内部 combobox
        ele.focus = () => {
          if (this.disabled === null) this.controlEl.focus();
        };
        ele.blur = () => this.controlEl.blur();
        // 点选项（包括 disabled 项）时把焦点留在 combobox 上：
        // 否则浏览器会把焦点移到 body，随后 Escape/Tab 不再经过组件的键盘处理
        this.listEl.addEventListener("pointerdown", (e) => {
          if (!e.target.closest?.(".opt")) return;
          e.preventDefault();
          this.controlEl.focus();
        });

        // 自绘 listbox 的组合框语义（ARIA 角色 + 展开状态 + 选项选中态）。
        // 宿主属性延后到构造结束再写，避免命令式 createElement 时抛
        // "The result must not have attributes"
        this.listEl.setAttribute("role", "listbox");
        const proxy = createFormProxy(ele, "text");
        this.syncForm = () => {
          syncFormProxy(proxy, {
            name: this.name,
            form: ele.getAttribute("form"),
            value: this.value == null ? "" : this.value,
            disabled: this.disabled !== null,
            required: this.required !== null,
          });
        };
        this.syncForm();
        proxy.addEventListener("invalid", (e) => {
          e.preventDefault();
          this.controlEl.setAttribute("aria-invalid", "true");
          ele.dispatchEvent(new Event("invalid", { bubbles: true, composed: true }));
        });
        this._resetCleanup = bindFormReset(ele, () => {
          const dv = ele.getAttribute("default-value");
          this._selectedIndex = -1; // reset 按 value 回第一个同值项
          this.value = dv;
          this.syncSelected(false);
          this.close();
        });
        this._a11yReady = false;
        this.syncDisabled = () => {
          if (!this._a11yReady) return;
          const disabled = this.disabled !== null;
          this.controlEl.tabIndex = disabled ? -1 : 0;
          if (disabled) this.controlEl.setAttribute("aria-disabled", "true");
          else this.controlEl.removeAttribute("aria-disabled");
        };
        queueMicrotask(() => {
          this._a11yCleanup = syncAccessibleName(ele, this.controlEl);
          this._a11yReady = true;
          this.syncDisabled();
          this.syncForm();
        });

        // 宿主 value 用 getter/setter 反射到 data（ofa 的 data 不在原生属性上）
        Object.defineProperty(ele, "value", {
          get: () => (this.value === null ? "" : this.value),
          set: (v) => { this.value = v == null || v === "" ? null : String(v); },
        });

        // 宿主 options property：动态选项入口（:options 绑定 / el.options = [...]）。
        // 内部存储用 _opts，不经 ofa attr data（数组会被序列化成字符串）。
        // 注意：o-fill 会把内容渲染进自身 shadow，slot 看不到其中的 option，动态选项走这里
        Object.defineProperty(ele, "options", {
          get: () => this._opts || [],
          set: (list) => {
            this._opts = Array.isArray(list)
              ? list.map((o) => ({
                  value: String(o.value ?? o.label),
                  label: String(o.label ?? o.value),
                  disabled: !!o.disabled,
                  group: o.group ? String(o.group) : "",
                  el: null,
                }))
              : [];
            this.buildList();
            this.syncSelected(false);
          },
        });

        // 读取 light DOM 的 <option> / <st-option> 作为数据源。
        // 支持容器组件（如 o-fill）包裹：o-fill 把条目渲染进自身 shadowRoot，
        // 这里深入其 shadow 收集，并用 MutationObserver 跟随其重渲染
        this._optObservers = [];
        const collectFrom = (el) => {
          if (el.tagName === "OPTION" || el.tagName === "ST-OPTION") return [el];
          const seen = new Set();
          const found = [];
          const pull = (root) =>
            [...root.querySelectorAll("option, st-option")].forEach((o) => {
              if (!seen.has(o)) { seen.add(o); found.push(o); }
            });
          pull(el);
          if (el.shadowRoot) {
            pull(el.shadowRoot);
            const mo = new MutationObserver(() => readOptions());
            mo.observe(el.shadowRoot, { childList: true, subtree: true });
            this._optObservers.push(mo);
          }
          // o-fill 实际把条目渲染在自身 light DOM（innerHTML），容器本体也要观察
          const mo = new MutationObserver(() => readOptions());
          mo.observe(el, { childList: true, subtree: true });
          this._optObservers.push(mo);
          return found;
        };
        const readOptions = () => {
          this._optObservers.forEach((mo) => mo.disconnect());
          this._optObservers = [];
          this._opts = this.slotEl
            .assignedElements()
            .flatMap((el) => collectFrom(el))
            .map((el) => {
              const text = el.textContent.trim();
              // label 属性定闭合态显示文本（富内容/多语言场景），缺省取插槽文本
              const label = el.getAttribute("label") ?? text;
              // optgroup / option 的 disabled 都要继承；group label 用于下拉分组标题
              const groupEl = el.closest("optgroup");
              return {
                value: el.getAttribute("value") ?? label,
                label,
                disabled: el.hasAttribute("disabled") || !!(groupEl && groupEl.hasAttribute("disabled")),
                group: groupEl?.label?.trim() || "",
                el,
              };
            });
          this.buildList();
          // attached 时读取 default-value 属性作为初始值写入 data.value
          if (this.value === null) {
            const dv = ele.getAttribute("default-value");
            if (dv !== null) this.value = dv;
          }
          this.syncSelected(false);
        };
        this.slotEl.addEventListener("slotchange", readOptions);
        readOptions();
        // 绑定可能早于 ready 写入 attribute，此时 slot 无 option、用 _opts 兜底解析
        if (this.options !== null && (!this._opts || !this._opts.length)) {
          let list = this.options;
          if (typeof list === "string") {
            try { list = JSON.parse(list || "[]"); } catch { list = []; }
          }
          if (Array.isArray(list) && list.length) {
            this._opts = list.map((o) => ({
              value: String(o.value ?? o.label),
              label: String(o.label ?? o.value),
              disabled: !!o.disabled,
              group: o.group ? String(o.group) : "",
              el: null,
            }));
            this.buildList();
            if (this.value === null) {
              const dv = ele.getAttribute("default-value");
              if (dv !== null) this.value = dv;
            }
            this.syncSelected(false);
          }
        }

        // 键盘可达：宿主本身可聚焦；disabled 状态由上方 queueMicrotask 中的
        // syncDisabled 应用（构造期不能写宿主属性）
        ele.addEventListener("keydown", (e) => this.onKeydown(e));
        ele.addEventListener("click", () => {
          if (this.disabled === null) this.isOpen() ? this.close() : this.openList();
        });
        // 点击外部关闭：必须用 composedPath 判断——composed 事件在 document 层
        // 的 target 已被 shadow 边界重定向为外层宿主，contains(e.target) 会误判为外部
        this._onDocDown = (e) => { if (!e.composedPath().includes(ele)) this.close(); };
        document.addEventListener("pointerdown", this._onDocDown);
      },
      detached() {
        document.removeEventListener("pointerdown", this._onDocDown);
        clearTimeout(this._closeTimer);
        this._a11yCleanup?.();
        this._resetCleanup?.();
      },
      proto: {
        isOpen() { return this.ele.hasAttribute("open"); },
        openList() {
          if (this.disabled !== null || !this._opts.length) return;
          const ele = this.ele;
          clearTimeout(this._closeTimer);
          ele.removeAttribute("closing"); // 重新打开时取消退出过渡、重启进入动画
          ele.removeAttribute("drop-up");
          ele.setAttribute("open", "");
          this.controlEl.setAttribute("aria-expanded", "true");
          // 按视口剩余空间翻转：下方放不下且上方更宽裕时向上弹
          const rect = ele.getBoundingClientRect();
          const below = window.innerHeight - rect.bottom - 8;
          const above = rect.top - 8;
          if (below < this.listEl.offsetHeight && above > below) {
            ele.setAttribute("drop-up", "");
          }
          // 键盘激活项初始定位到当前选中项；选中项被禁用时从第一个可用项开始
          const sel = this.currentIndex();
          const initial = sel >= 0 && !this._opts[sel].disabled ? sel : this.firstEnabled(false);
          this.setActive(initial, true);
        },
        close() {
          const ele = this.ele;
          if (!this.isOpen() && !ele.hasAttribute("closing")) return;
          ele.removeAttribute("open");
          this.controlEl.setAttribute("aria-expanded", "false");
          this.controlEl.removeAttribute("aria-activedescendant");
          clearTimeout(this._closeTimer);
          ele.setAttribute("closing", ""); // 播 150ms 退出动画后再隐藏
          this._closeTimer = setTimeout(() => ele.removeAttribute("closing"), 180);
        },
        buildList() {
          this.listEl.innerHTML = "";
          let lastGroup = "";
          let groupEl = this.listEl;
          this._opts.forEach((opt, i) => {
            // optgroup：同一组用一个 role=group 容器包住，标题只做视觉呈现
            if (opt.group && opt.group !== lastGroup) {
              groupEl = document.createElement("div");
              groupEl.className = "group";
              groupEl.setAttribute("role", "group");
              groupEl.setAttribute("aria-label", opt.group);
              const heading = document.createElement("div");
              heading.className = "group-label";
              heading.setAttribute("aria-hidden", "true");
              heading.textContent = opt.group;
              groupEl.appendChild(heading);
              this.listEl.appendChild(groupEl);
              lastGroup = opt.group;
            } else if (!opt.group) {
              lastGroup = "";
              groupEl = this.listEl;
            }
            const item = document.createElement("div");
            item.className = "opt";
            item.id = `st-opt-${i}`;
            item.setAttribute("role", "option");
            if (opt.disabled) {
              item.toggleAttribute("data-disabled", true);
              item.setAttribute("aria-disabled", "true");
            }
            // 有实际内容（元素或非空白文本）时克隆渲染（支持富内容），否则退回纯文本 label
            const rich = opt.el && [...opt.el.childNodes].some((n) => n.nodeType === 1 || (n.nodeType === 3 && n.textContent.trim()));
            if (rich) {
              [...opt.el.childNodes].forEach((n) => item.appendChild(n.cloneNode(true)));
            } else {
              item.textContent = opt.label;
            }
            item.appendChild(Object.assign(document.createElement("span"), { className: "check" }));
            item.addEventListener("click", (e) => {
              e.stopPropagation();
              if (opt.disabled) return;
              this.select(i);
            });
            item.addEventListener("pointerenter", () => {
              if (!opt.disabled) this.setActive(i, false);
            });
            opt.item = item;
            groupEl.appendChild(item);
          });
        },
        // 当前选中项下标：优先用最近一次用户选择的下标（支持重复 value），
        // 外部改 value 时回退到第一个同值选项。
        currentIndex() {
          const list = this._opts || [];
          const i = this._selectedIndex;
          if (i >= 0 && list[i] && list[i].value === this.value) return i;
          return list.findIndex((o) => o.value === this.value);
        },
        // 选中态与显示文本同步（change 事件由 select() 派发）
        syncSelected() {
          const hasMatch = this._opts?.some((o) => o.value === this.value);
          // 非法值（外部写入不存在的 value / 选中项被动态删除）不能只显示成占位、
          // 却继续把旧值交给表单代理：那会让 FormData 提交一个界面上不存在的值。
          // 选项尚未加载时不处理，等 readOptions 完成后再校验。
          if (!hasMatch && this.value !== null && this._opts?.length) {
            this.value = null;
            this._selectedIndex = -1;
          }
          const index = this._opts?.length ? this.currentIndex() : -1;
          const opt = index >= 0 ? this._opts[index] : undefined;
          this._selectedIndex = index;
          this.labelEl.replaceChildren();
          this.labelEl.classList.toggle("placeholder", !opt);
          if (!opt) {
            this.labelEl.textContent = this.placeholder || "";
            this.labelEl.classList.remove("has-icon");
          } else {
            // 闭合态：label 提供文字，选项里的图标元素（svg/img/iconify-icon/[slot=icon]）一并显示
            const icons =
              opt.el && opt.el.tagName === "ST-OPTION"
                ? [...opt.el.childNodes].filter((node) => {
                    if (!node || node.nodeType !== 1) return false;
                    if (node.getAttribute("slot") === "icon") return true;
                    const tag = node.tagName.toLowerCase();
                    return tag === "svg" || tag === "img" || tag.endsWith("-icon");
                  })
                : [];
            this.labelEl.classList.toggle("has-icon", icons.length > 0);
            if (icons.length) {
              icons.forEach((node) => this.labelEl.appendChild(node.cloneNode(true)));
              const text = document.createElement("span");
              text.className = "label-text";
              text.textContent = opt.label;
              this.labelEl.appendChild(text);
            } else {
              this.labelEl.textContent = opt.label;
            }
          }
          const valueEl = this.ele.shadowRoot?.querySelector("#st-value");
          if (valueEl) {
            valueEl.textContent = opt ? opt.label : (this.placeholder || "");
          }
          this.syncForm?.();
          this._opts.forEach((opt, i) => {
            const item = opt.item;
            if (!item) return;
            const selected = i === index;
            item.toggleAttribute("data-selected", selected);
            item.setAttribute("aria-selected", selected ? "true" : "false");
          });
        },
        select(i) {
          const opt = this._opts[i];
          const current = this.currentIndex();
          if (!opt || opt.disabled || i === current) { this.close(); return; }
          this._selectedIndex = i;
          this.value = opt.value; // ofa data（同 value 的重复项也允许切换选中下标）
          this.syncSelected();
          this.controlEl.removeAttribute("aria-invalid");
          this.close();
          this.ele.dispatchEvent(new Event("change", { bubbles: true, composed: true }));
        },
        setActive(i, scroll) {
          this.activeIndex = i;
          this._opts.forEach((opt, j) => {
            opt.item?.toggleAttribute("data-active", j === i);
          });
          const item = this._opts[i]?.item;
          if (i >= 0 && item) {
            this.controlEl.setAttribute("aria-activedescendant", item.id);
            if (scroll) item.scrollIntoView({ block: "nearest" });
          }
        },
        // 在选项之间移动，跳过 disabled（全部禁用时停在原处）
        moveActive(step) {
          const n = this._opts.length;
          if (!n) return;
          let i = this.activeIndex;
          if (i < 0) i = step > 0 ? -1 : 0;
          for (let k = 0; k < n; k += 1) {
            i = (i + step + n) % n;
            if (!this._opts[i].disabled) {
              this.setActive(i, true);
              return;
            }
          }
        },
        firstEnabled(last = false) {
          const list = last ? [...this._opts].reverse() : this._opts;
          const index = list.findIndex((opt) => !opt.disabled);
          if (index === -1) return -1;
          return last ? this._opts.length - 1 - index : index;
        },
        onKeydown(e) {
          if (this.disabled !== null) return;
          const open = this.isOpen();
          switch (e.key) {
            case "Enter": case " ":
              e.preventDefault();
              if (open) { this.select(this.activeIndex); } else { this.openList(); }
              break;
            case "ArrowDown":
              e.preventDefault();
              if (!open) this.openList();
              else this.moveActive(1);
              break;
            case "ArrowUp":
              e.preventDefault();
              if (!open) this.openList();
              else this.moveActive(-1);
              break;
            case "Home":
              if (open) { e.preventDefault(); this.setActive(this.firstEnabled(false), true); }
              break;
            case "End":
              if (open) { e.preventDefault(); this.setActive(this.firstEnabled(true), true); }
              break;
            case "Escape":
              // 只关下拉：不让 Escape 继续冒泡把外层 dialog 一起关掉
              if (open) {
                e.stopPropagation();
                e.preventDefault();
              }
              this.close();
              break;
            case "Tab":
              this.close();
              break;
          }
        },
        // color 接受 M3 角色名或 color 模块自定义变量名，控制 focus 描边/底线颜色
        applyColor() {
          const name = this.color;
          const active = name
            ? `var(--md-sys-color-${name}, var(--${name}, var(--md-sys-color-primary)))`
            : "";
          const sr = this.ele.shadowRoot;
          sr.querySelector(".outline-ring").style.borderColor = active; // 空串 = 回退 CSS 默认 primary
          sr.querySelector(".bottom-line").style.backgroundColor = active;
        },
        focus() { if (this.disabled === null) this.controlEl.focus(); },
        blur() { this.controlEl.blur(); },
      },
    });
  </script>
</template>
