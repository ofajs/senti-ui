<!--
  st-chat-message — Senti-UI 对话消息气泡（基于 ofa.js）
  语义属性：from(user|assistant|system) / name / time / avatar / status / streaming / error
  插槽：默认（消息内容）/ avatar（自定义头像）/ actions（复制、重试等操作）
  视觉在 :host 上（em 尺寸），材质走 --st-chat-* 皮肤 token，见 README.md
-->
<template component>
  <style>
    :host {
      display: flex;
      align-items: flex-start;
      gap: var(--st-chat-avatar-gap, 0.643em);
      box-sizing: border-box;
      width: fit-content;
      max-width: var(--st-chat-bubble-max-width, 85%);
      margin-block: 0 var(--st-chat-gap, 0.857em);
      margin-inline: 0 auto; /* assistant 靠左 */
      /* 1em = 继承父级字号：容器改 font-size 时消息整体等比缩放 */
      font-size: 1em;
      font-family: var(--st-font, inherit);
      color: var(--md-sys-color-on-surface);
      transform-origin: 0 100%;
      /* 新消息入场：只作用在消息宿主，文本流式更新不会重播 */
      animation: st-chat-message-in var(--st-chat-enter-duration, 260ms)
        var(--st-motion-easing, cubic-bezier(0.2, 0, 0, 1)) both;
    }

    /* 用户消息靠右，头像在气泡右侧 */
    :host([from="user"]) {
      flex-direction: row-reverse;
      margin-inline: auto 0;
      transform-origin: 100% 100%;
    }
    :host([from="user"]) .body { align-items: flex-end; }
    :host([from="user"]) .meta { justify-content: flex-end; }

    /* 系统消息：居中的轻量说明，不占气泡材质 */
    :host([from="system"]) {
      display: block;
      width: 100%;
      max-width: 100%;
      margin-inline: auto;
      text-align: center;
      transform-origin: 50% 100%;
    }
    :host([from="system"]) .body { align-items: center; }
    :host([from="system"]) .bubble {
      padding: 0.214em 0.571em;
      border: 0;
      border-radius: var(--st-chat-system-radius, var(--st-radius-sm, 0.5em));
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      font-size: 0.857em;
      color: var(--md-sys-color-on-surface-variant);
    }

    .avatar {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      width: var(--st-chat-avatar-size, 2.286em);
      height: var(--st-chat-avatar-size, 2.286em);
      margin-top: 0.143em;
      overflow: hidden;
      border-radius: var(--st-chat-avatar-radius, 50%);
      background: var(--st-chat-avatar-bg, var(--md-sys-color-surface-container-highest));
      color: var(--md-sys-color-on-surface-variant);
      font-size: 0.786em;
      font-weight: 600;
    }
    .avatar-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    ::slotted([slot="avatar"]) {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .body {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.286em;
      min-width: 0;
      max-width: 100%;
    }

    .meta {
      display: flex;
      align-items: baseline;
      gap: 0.571em;
      max-width: 100%;
      font-size: 0.786em;
      line-height: 1.4;
      color: var(--md-sys-color-on-surface-variant);
    }
    .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
      color: var(--md-sys-color-on-surface);
    }
    .time { flex: none; opacity: 0.75; }

    .bubble {
      position: relative;
      box-sizing: border-box;
      max-width: 100%;
      padding: var(--st-chat-bubble-padding, 0.714em 1em);
      border: var(--st-border-width, 1px) solid var(--st-chat-bubble-border, transparent);
      border-radius: var(--st-chat-bubble-radius, 1.143em);
      border-bottom-left-radius: var(--st-chat-bubble-tail-radius, 0.286em);
      background: var(--st-chat-assistant-bg, var(--md-sys-color-surface-container-high));
      color: var(--md-sys-color-on-surface);
      box-shadow: var(--st-chat-bubble-shadow, none);
      backdrop-filter: var(--st-chat-bubble-backdrop-filter, none);
      -webkit-backdrop-filter: var(--st-chat-bubble-backdrop-filter, none);
    }
    /* 靠近说话人的下角收窄，形成气泡指向（逻辑方向） */
    :host([from="user"]) .bubble {
      border-bottom-left-radius: var(--st-chat-bubble-radius, 1.143em);
      border-bottom-right-radius: var(--st-chat-bubble-tail-radius, 0.286em);
      background: var(--st-chat-user-bg, var(--md-sys-color-primary-container));
      color: var(--md-sys-color-on-primary-container);
    }
    :host([from="user"]) .bubble .name { color: inherit; }
    :host([error]) .bubble { border-color: var(--md-sys-color-error); }
    :host([error]) .status { color: var(--md-sys-color-error); }

    .content {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      line-height: 1.55;
    }

    /* 流式输出光标 */
    .cursor {
      display: none;
      width: 0.429em;
      height: 1.05em;
      margin-left: 0.143em;
      border-radius: 0.071em;
      background: currentColor;
      vertical-align: -0.143em;
      animation: st-chat-cursor 1s steps(1, end) infinite;
    }
    :host([streaming]) .cursor { display: inline-block; }
    :host([streaming]) .bubble.is-empty .cursor { display: none; }

    /* 内容为空、正在生成时显示三个呼吸点 */
    .typing {
      display: none;
      align-items: center;
      gap: 0.214em;
      height: 1.2em;
      vertical-align: middle;
    }
    .typing i {
      width: 0.357em;
      height: 0.357em;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.4;
      animation: st-chat-dot 1.2s ease-in-out infinite;
    }
    .typing i:nth-child(2) { animation-delay: 0.15s; }
    .typing i:nth-child(3) { animation-delay: 0.3s; }
    :host([streaming]) .bubble.is-empty .typing { display: inline-flex; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.286em;
    }
    :host([from="user"]) .actions { justify-content: flex-end; }

    .status {
      font-size: 0.786em;
      line-height: 1.4;
      color: var(--md-sys-color-on-surface-variant);
    }

    .avatar[hidden],
    .avatar-img[hidden],
    .meta[hidden],
    .actions[hidden],
    .status[hidden] {
      display: none;
    }

    @keyframes st-chat-message-in {
      from {
        opacity: 0;
        transform: translateY(var(--st-chat-enter-distance, 0.571em)) scale(0.98);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }
    @keyframes st-chat-cursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes st-chat-dot {
      0%, 80%, 100% { opacity: 0.28; transform: translateY(0); }
      40% { opacity: 0.9; transform: translateY(-0.143em); }
    }

    /* 减少动态效果：动画/过渡压到近零，同时保留 animationend 等事件语义 */
    @media (prefers-reduced-motion: reduce) {
      :host,
      :host * {
        animation-delay: 0s !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .typing i { opacity: 0.5; }
    }
  </style>

  <div class="avatar" part="avatar" hidden>
    <slot name="avatar"></slot>
    <img class="avatar-img" part="avatar-image" alt="" hidden />
  </div>

  <div class="body">
    <div class="meta" part="meta" hidden>
      <span class="name" part="name"></span>
      <span class="time" part="time"></span>
    </div>
    <div class="bubble" part="bubble">
      <div class="content" part="content"
        ><slot></slot><span class="typing" aria-hidden="true"><i></i><i></i><i></i></span
        ><span class="cursor" aria-hidden="true"></span
      ></div>
    </div>
    <div class="actions" part="actions" hidden><slot name="actions"></slot></div>
    <div class="status" part="status" hidden></div>
  </div>

  <script>
    import "../color/st-color-init.js";
    export default async () => ({
      tag: "st-chat-message",
      attrs: {
        from: "assistant",
        name: null,
        time: null,
        avatar: null,
        status: null,
        streaming: null,
        error: null,
      },
      ready() {
        const ele = this.ele;
        const sr = ele.shadowRoot;
        const avatar = sr.querySelector(".avatar");
        const avatarImg = sr.querySelector(".avatar-img");
        const avatarSlot = sr.querySelector('slot[name="avatar"]');
        const actions = sr.querySelector(".actions");
        const actionsSlot = sr.querySelector('slot[name="actions"]');
        const contentSlot = sr.querySelector(".content slot");
        const meta = sr.querySelector(".meta");
        const nameEl = sr.querySelector(".name");
        const timeEl = sr.querySelector(".time");
        const bubble = sr.querySelector(".bubble");
        const statusEl = sr.querySelector(".status");

        const hasContent = (slot) =>
          slot
            .assignedNodes({ flatten: true })
            .some((node) => node.nodeType === 1 || node.textContent.trim() !== "");

        this._syncAvatar = () => {
          const slotFilled = hasContent(avatarSlot);
          const url = (this.avatar || "").trim();
          avatar.hidden = !slotFilled && !url;
          avatarImg.hidden = slotFilled || !url;
          if (url) {
            avatarImg.src = url;
            avatarImg.alt = (this.name || "").trim();
          }
        };

        this._syncMeta = () => {
          const name = (this.name || "").trim();
          const time = (this.time || "").trim();
          nameEl.textContent = name;
          timeEl.textContent = time;
          meta.hidden = !name && !time;
        };

        this._syncStatus = () => {
          const status = (this.status || "").trim();
          statusEl.textContent = status;
          statusEl.hidden = !status;
        };

        this._syncActions = () => {
          actions.hidden = !hasContent(actionsSlot);
        };

        this._syncStreaming = () => {
          const streaming = this.streaming !== null;
          bubble.toggleAttribute("aria-busy", streaming);
          bubble.classList.toggle("is-empty", !hasContent(contentSlot));
        };

        avatarSlot.addEventListener("slotchange", () => {
          this._syncAvatar();
        });
        actionsSlot.addEventListener("slotchange", () => {
          this._syncActions();
        });
        contentSlot.addEventListener("slotchange", () => {
          this._syncStreaming();
        });

        // 流式内容多以文本节点/数据绑定更新，slotchange 不会触发，需要观察 light DOM
        this._observer = new MutationObserver(() => {
          this._syncStreaming();
          this._syncActions();
        });
        this._observer.observe(ele, {
          childList: true,
          subtree: true,
          characterData: true,
        });

        // 首次同步放到微任务：构造期不能写宿主属性（坑 #54b），内部元素不受限，
        // 但统一延后能与 ofa 的初始 slot 分配对齐
        queueMicrotask(() => {
          this._syncAvatar();
          this._syncMeta();
          this._syncStatus();
          this._syncActions();
          this._syncStreaming();
        });
      },
      watch: {
        // watch 初始化也会触发一次（坑 #27），ready 前用可选调用跳过
        avatar() { this._syncAvatar?.(); },
        name() { this._syncAvatar?.(); this._syncMeta?.(); },
        time() { this._syncMeta?.(); },
        status() { this._syncStatus?.(); },
        streaming() { this._syncStreaming?.(); },
      },
      detached() {
        this._observer?.disconnect();
      },
    });
  </script>
</template>
