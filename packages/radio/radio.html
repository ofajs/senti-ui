<!--
  st-radio — Senti-UI 单选按钮组件（基于 ofa.js）
  语义属性：name（分组键，组件手动管理同组互斥）/ checked / disabled / color（M3 角色名）
  注意：原生 radio 的同 name 分组不跨 shadow root，互斥由组件在同一容器内查询同 name 兄弟实现
  视觉默认值全用 em（宿主改 font-size 等比缩放），见 README.md
-->
<template component>
  <style>
    :host {
      display: inline-flex;
      align-items: center;
      position: relative;
      font-size: var(--st-font-size, 14px);
      font-family: var(--st-font, inherit);
      vertical-align: middle;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    :host([disabled]) {
      cursor: not-allowed;
      opacity: var(--st-disabled-opacity, 0.38);
    }

    .circle {
      box-sizing: border-box;
      position: relative;
      width: 1.571em; /* 22px */
      height: 1.571em;
      flex-shrink: 0;
      border: var(--st-radio-border-width, 0.143em) solid var(--md-sys-color-on-surface-variant);
      border-radius: var(--st-radio-radius, 50%);
      display: grid;
      place-items: center;
      transition: border-color var(--st-motion-duration, 0.16s) ease;
    }
    :host([checked]) .circle {
      border-color: var(--st-radio-dot-bg, var(--md-sys-color-primary));
    }

    /* 选中圆点：宽度弹性入场（M3 emphasized 曲线） */
    .dot {
      width: 0;
      height: 0;
      border-radius: 50%;
      background: color-mix(
        in srgb,
        var(--st-radio-dot-bg, var(--md-sys-color-primary)) var(--st-radio-fill-alpha, 100%),
        transparent
      );
      -webkit-backdrop-filter: var(--st-radio-backdrop-filter, none);
      backdrop-filter: var(--st-radio-backdrop-filter, none);
      transition: width var(--st-motion-duration-base, 0.2s) var(--st-motion-easing, cubic-bezier(0.2, 0, 0, 1)),
        height var(--st-motion-duration-base, 0.2s) var(--st-motion-easing, cubic-bezier(0.2, 0, 0, 1));
    }
    :host([checked]) .dot {
      width: 0.714em; /* 10px */
      height: 0.714em;
    }

    .label {
      display: none;
      margin-left: 0.857em;
    }
    :host([has-label]) .label { display: inline; }

    /* 内部透明原生 radio：承载点击/键盘/焦点语义，覆盖整个组件（点文字也能选中） */
    .native {
      all: unset;
      position: absolute;
      inset: 0;
      z-index: 2; /* 盖住 position:relative 的兄弟元素，保证点击/键盘都落在语义元素上 */
      cursor: inherit;
    }
    .native:focus-visible ~ .circle {
      outline: var(--st-focus-ring-width, 2px) var(--st-focus-ring-style, solid)
        var(--st-focus-ring-color, var(--md-sys-color-on-surface));
      outline-offset: var(--st-focus-ring-offset, 2px);
    }

    l-m { display: none; }

    /* 减少动态效果：动画/过渡压到近零，同时保留 animationend 等事件语义 */
    @media (prefers-reduced-motion: reduce) {
      :host,
      :host * {
        animation-delay: 0s !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

  <input class="native" type="radio" tabindex="0">
  <span class="circle"><span class="dot"></span></span>
  <span class="label"><slot></slot></span>

  <script>
    import "../color/st-color-init.js";
    import { syncAccessibleName } from "../a11y/a11y.js";
    import { createFormProxy, syncFormProxy, bindFormReset, formFor } from "../form/form-proxy.js";
    export default async () => ({
      tag: "st-radio",
      attrs: {
        name: null,
        checked: null,
        disabled: null,
        color: null,
        value: "on",
        form: null,
        required: null,
      },
      watch: {
        checked() { this.applyState(); },
        disabled() { this.applyState(); },
        color() { this.applyState(); },
        name() { this.syncGroup?.(); this.syncForm?.(); },
        form() { this.syncGroup?.(); this.syncForm?.(); },
        value() { this.syncForm?.(); },
        required() { this.syncForm?.(); },
      },
      ready() {
        const ele = this.ele;
        const sr = ele.shadowRoot;
        const input = sr.querySelector(".native");

        // 同组项：同一个树作用域 + 同一个 form owner + 同名。
        // 不能只按 root + name 查——两个独立 <form> 里的同名 radio 会被误互斥。
        this._groupMembers = () => {
          if (!this.name) return [ele];
          const scope = ele.getRootNode();
          const owner = formFor(ele);
          return [...scope.querySelectorAll(`st-radio[name="${CSS.escape(this.name)}"]`)].filter(
            (sib) => formFor(sib) === owner
          );
        };

        // roving tabindex：组内只有选中项（无选中时为第一个可用项）进 Tab 顺序，
        // 方向键在组内移动并选中，符合 WAI-ARIA radio group 惯例
        this.syncGroup = () => {
          const members = this._groupMembers();
          if (members.length <= 1) {
            input.tabIndex = 0;
            return;
          }
          const enabled = members.filter((sib) => !sib.hasAttribute("disabled"));
          const tabbable = enabled.find((sib) => sib.hasAttribute("checked")) || enabled[0] || null;
          members.forEach((sib) => {
            const native = sib.shadowRoot?.querySelector(".native");
            if (native) native.tabIndex = sib === tabbable ? 0 : -1;
          });
        };

        // 选中自身 + 取消同组其他项 + 派发一次 composed change
        this._selectSelf = () => {
          if (this.disabled !== null) return;
          input.checked = true;
          ele.setAttribute("checked", "");
          this._groupMembers().forEach((sib) => {
            if (sib !== ele && sib.hasAttribute("checked")) {
              sib.removeAttribute("checked");
              if (sib._proxy) sib._proxy.checked = false;
            }
          });
          input.removeAttribute("aria-invalid");
          this.syncGroup();
          ele.dispatchEvent(new Event("change", { bubbles: true, composed: true }));
        };
        // 供组内其他 radio 的方向键导航调用（组件实例方法不在 DOM 元素上）
        ele._selectSelf = this._selectSelf;

        input.addEventListener("change", () => {
          if (input.checked) this._selectSelf();
        });

        // 方向键：在组内循环移动焦点并选中（原生 radio 分组不跨 shadow root，
        // 每个组件内只有一个 input，必须手动代理组内键盘导航）
        input.addEventListener("keydown", (e) => {
          if (this.disabled !== null) return;
          const forward = e.key === "ArrowRight" || e.key === "ArrowDown";
          const backward = e.key === "ArrowLeft" || e.key === "ArrowUp";
          if (!forward && !backward) return;
          const members = this._groupMembers().filter(
            (sib) => !sib.hasAttribute("disabled") && sib.shadowRoot?.querySelector(".native")
          );
          if (members.length < 2) return;
          e.preventDefault();
          const index = Math.max(0, members.indexOf(ele));
          const target = members[(index + (forward ? 1 : -1) + members.length) % members.length];
          const native = target.shadowRoot.querySelector(".native");
          native.focus();
          target._selectSelf?.();
        });

        // 标签文字是 slot 内容、与原生 input 是兄弟节点，必须同步为可访问名称
        this._a11yCleanup = syncAccessibleName(ele, input, { fromSlot: true });

        // 表单代理是 light DOM 子节点，会破坏 :host(:empty)；用 has-label 显式判断
        const labelSlot = sr.querySelector(".label slot");
        const syncLabel = () => {
          const has = labelSlot
            .assignedNodes()
            .some((node) => node.nodeType === 1 || (node.nodeType === 3 && node.textContent.trim()));
          ele.toggleAttribute("has-label", has);
        };
        labelSlot.addEventListener("slotchange", syncLabel);
        syncLabel();

        const proxy = createFormProxy(ele, "radio");
        this._proxy = proxy;
        this.syncForm = () => {
          syncFormProxy(proxy, {
            name: this.name,
            form: ele.getAttribute("form"),
            value: this.value ?? "on",
            checked: this.checked !== null,
            disabled: this.disabled !== null,
            required: this.required !== null,
          });
        };
        this.syncForm();
        proxy.addEventListener("invalid", (e) => {
          e.preventDefault();
          input.setAttribute("aria-invalid", "true");
          ele.dispatchEvent(new Event("invalid", { bubbles: true, composed: true }));
        });
        const initialChecked = this.checked !== null;
        this._resetCleanup = bindFormReset(ele, () => {
          if (initialChecked) ele.setAttribute("checked", "");
          else ele.removeAttribute("checked");
          this.applyState();
        });

        this.applyState();
      },
      detached() {
        this._a11yCleanup?.();
        this._resetCleanup?.();
      },
      proto: {
        // watch 初始化也会触发一次（坑 #27），applyState 无副作用，天然安全
        applyState() {
          const sr = this.ele.shadowRoot;
          const input = sr.querySelector(".native");
          const circle = sr.querySelector(".circle");
          const dot = sr.querySelector(".dot");

          input.checked = this.checked !== null;
          input.disabled = this.disabled !== null;
          this.syncGroup?.();
          this.syncForm?.();

          const name = this.color;
          if (this.checked !== null && name) {
            const main = `var(--md-sys-color-${name}, var(--${name}, var(--md-sys-color-primary)))`;
            circle.style.setProperty("--st-radio-dot-bg", main);
          } else {
            circle.style.removeProperty("--st-radio-dot-bg");
          }
        },
      },
    });
  </script>
</template>
