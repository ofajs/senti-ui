<!--
  st-split-button — Senti-UI 分裂按钮（基于 ofa.js）
  主操作区 + 下拉箭头区：点主区触发主操作（click 冒泡），点箭头展开菜单（slot="menu"，放 st-menu-item）。
  语义属性：variant(filled|outlined|text) / color(M3 角色名) / disabled / menu-align(left|right)
  open 为运行时状态（data）：ofa 页面用 sync:open 双向绑定，见 README.md
-->
<template component>
  <style>
    :host {
      position: relative;
      display: inline-flex;
      vertical-align: middle;
      align-items: stretch;
      box-sizing: border-box;
      height: 2.857em; /* 40px，与 st-button 一致 */
      border-radius: 1.429em;
      border: 1px solid transparent;
      font-size: 14px;
      font-family: inherit;
      font-weight: 500;
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    :host([variant="outlined"]) {
      background-color: transparent;
      color: var(--md-sys-color-primary);
      border-color: var(--md-sys-color-outline);
    }
    :host([variant="text"]) {
      background-color: transparent;
      color: var(--md-sys-color-primary);
    }

    :host([disabled]) {
      cursor: not-allowed;
      opacity: 0.38;
    }
    :host([disabled]) .zone,
    :host([disabled]) st-ripple {
      pointer-events: none;
    }

    /* 主操作区 + 箭头区：M3 state layer（currentColor 半透明叠加） */
    .zone {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      color: inherit;
      cursor: inherit;
    }
    .main-zone {
      flex: 1;
      min-width: 0;
      gap: 0.571em;
      padding: 0 1.429em 0 1.429em;
      border-radius: 1.429em 0 0 1.429em;
    }
    .caret-zone {
      flex-shrink: 0;
      aspect-ratio: 1 / 1;
      border-radius: 0 1.429em 1.429em 0;
      /* 主区与箭头区的分界线（currentColor 40%） */
      border-left: 1px solid color-mix(in srgb, currentColor 40%, transparent);
    }

    .layer {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background-color: currentColor;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }
    .zone:hover .layer { opacity: 0.08; }
    .zone:active .layer { opacity: 0.12; }

    .zone:focus-visible {
      outline: 2px solid var(--md-sys-color-on-surface);
      outline-offset: 2px;
    }

    .caret-icon {
      width: 1.143em;
      height: 1.143em;
      transition: transform 0.2s ease;
      pointer-events: none;
    }
    .caret-icon.open { transform: rotate(180deg); }

    /* 下拉面板：fixed 定位（JS 计算，翻转避让视口），与 st-menu 一致 */
    .panel {
      display: none;
      position: fixed;
      left: 0;
      top: 0;
      box-sizing: border-box;
      min-width: 8em;
      max-height: 80vh;
      overflow-y: auto;
      padding: 0.286em;
      border-radius: 0.857em;
      background: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface);
      box-shadow: 0 0.071em 0.143em rgba(0, 0, 0, 0.3), 0 0.143em 0.429em 0.143em rgba(0, 0, 0, 0.15);
      z-index: 1000;
      transform-origin: 50% 0;
      animation: st-split-in 0.2s cubic-bezier(0.2, 0, 0, 1);
    }
    .panel.closing {
      pointer-events: none;
      opacity: 0;
      transform: translateY(-0.429em) scale(0.98);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    @keyframes st-split-in {
      from { opacity: 0; transform: translateY(-0.429em) scale(0.98); }
      to { opacity: 1; transform: none; }
    }
    ::slotted(hr) {
      display: block;
      width: 100%;
      margin: 0.286em 0;
      border: none;
      border-top: 1px solid var(--md-sys-color-outline-variant);
    }
    @media (prefers-reduced-motion: reduce) {
      .panel, .caret-icon { animation: none; transition: none; }
    }

    l-m { display: none; }
  </style>

  <l-m src="../ripple/ripple.html"></l-m>
  <l-m src="../menu/menu-item.html"></l-m>

  <button class="zone main-zone" type="button" tabindex="0">
    <span class="layer"></span>
    <slot name="prefix"></slot>
    <slot></slot>
    <st-ripple></st-ripple>
  </button>
  <button class="zone caret-zone" type="button" tabindex="0" aria-haspopup="menu">
    <span class="layer"></span>
    <svg class="caret-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m6 9l6 6l6-6" />
    </svg>
    <st-ripple></st-ripple>
  </button>

  <div class="panel"><slot name="menu"></slot></div>

  <script>
    import "../color/st-init.js";
    export default async () => ({
      tag: "st-split-button",
      attrs: {
        variant: "filled",
        color: null,
        disabled: null,
        menuAlign: "right",
      },
      data: {
        // open 是运行时状态（data，非标签属性）：选中菜单项 / 外部点击自动关闭改 this.open，
        // 经 sync:open 双向绑定回写上层（同 st-dialog 的状态建模，见 CONTEXT.md 代码层级规范）
        open: false,
      },
      watch: {
        open(val) {
          // data watch 初始化也会触发一次（坑 #27），值未变时无副作用
          const panel = this.ele.shadowRoot.querySelector(".panel");
          const caret = this.ele.shadowRoot.querySelector(".caret-icon");
          caret.classList.toggle("open", val);
          if (val) {
            // 先渲染再定位，避免闪烁；重新打开时取消关闭过渡并重启进入动画
            clearTimeout(this._closeTimer);
            panel.classList.remove("closing");
            panel.style.display = "block";
            this.updatePosition();
            this.bindDocEvents();
            this.ele.dispatchEvent(new Event("open", { bubbles: true, composed: true }));
          } else {
            panel.classList.add("closing");
            clearTimeout(this._closeTimer);
            this._closeTimer = setTimeout(() => {
              panel.style.display = "none";
              panel.classList.remove("closing");
            }, 180);
            this.unbindDocEvents();
            this.ele.dispatchEvent(new Event("close", { bubbles: true, composed: true }));
          }
        },
        color() { this.applyColor(); },
        variant() { this.applyColor(); },
        // watch 初始化也会触发一次（坑 #27），applyDisabled 无副作用
        disabled() { this.applyDisabled?.(); },
      },
      ready() {
        const ele = this.ele;
        const sr = ele.shadowRoot;

        this._onDocPointerDown = (e) => {
          // 坑 #21：composed 事件必须用 composedPath 判断
          if (e.composedPath().includes(ele)) return;
          this.open = false;
        };
        this._onDocKeydown = (e) => {
          if (e.key === "Escape" && this.open) this.open = false;
        };
        this._onReposition = () => this.updatePosition();

        // 主区 click 天然冒泡 + composed 到宿主（主操作由外部 on:click 监听）
        // 箭头区点击只负责开合菜单，绝不触发主操作
        sr.querySelector(".caret-zone").addEventListener("click", (e) => {
          e.stopPropagation();
          e.preventDefault();
          if (this.disabled === null) this.open = !this.open;
        });
        // 箭头区键盘：Enter/Space 开合
        sr.querySelector(".caret-zone").addEventListener("keydown", (e) => {
          if (this.disabled === null && (e.key === " " || e.key === "Enter")) {
            e.preventDefault();
            this.open = !this.open;
          }
        });
        // 主区/箭头区 disabled：原生 button.disabled 阻断（坑 #29）
        this.applyDisabled = () => {
          const dis = this.disabled !== null;
          sr.querySelector(".main-zone").disabled = dis;
          sr.querySelector(".caret-zone").disabled = dis;
        };

        // 菜单内任意点击后自动关闭；item 自身的 click 已先触发，
        // 截断冒泡避免误触发宿主上绑定的主操作
        sr.querySelector(".panel").addEventListener("click", (e) => {
          e.stopPropagation();
          if (this.open) this.open = false;
        });

        this.applyDisabled();
        this.applyColor();
      },
      detached() {
        clearTimeout(this._closeTimer);
        this.unbindDocEvents();
      },
      proto: {
        updatePosition() {
          if (!this.open) return;
          const panel = this.ele.shadowRoot.querySelector(".panel");
          const rect = this.ele.getBoundingClientRect();
          const panelW = panel.offsetWidth;
          const panelH = panel.offsetHeight;
          const vw = window.innerWidth;
          const vh = window.innerHeight;
          const margin = 8;
          const gap = 4;

          let left =
            (this.menuAlign || "right") === "left"
              ? rect.left
              : rect.right - panelW;
          left = Math.max(margin, Math.min(left, vw - panelW - margin));

          let top = rect.bottom + gap;
          if (top + panelH > vh - margin) {
            const topAbove = rect.top - panelH - gap;
            top = topAbove >= margin ? topAbove : Math.max(margin, vh - panelH - margin);
          }

          panel.style.left = left + "px";
          panel.style.top = top + "px";
          panel.style.minWidth = Math.max(rect.width, 112) + "px";
        },
        bindDocEvents() {
          if (this._docBound) return;
          document.addEventListener("pointerdown", this._onDocPointerDown, true);
          document.addEventListener("keydown", this._onDocKeydown, true);
          window.addEventListener("resize", this._onReposition, true);
          document.addEventListener("scroll", this._onReposition, true);
          this._docBound = true;
        },
        unbindDocEvents() {
          if (!this._docBound) return;
          document.removeEventListener("pointerdown", this._onDocPointerDown, true);
          document.removeEventListener("keydown", this._onDocKeydown, true);
          window.removeEventListener("resize", this._onReposition, true);
          document.removeEventListener("scroll", this._onReposition, true);
          this._docBound = false;
        },
        // color 接受 M3 角色名或 color 模块自定义变量名，按 variant 分派（同 st-button）
        applyColor() {
          const s = this.ele.style;
          const name = this.color;
          if (!name) {
            s.background = "";
            s.color = "";
            s.borderColor = "";
            return;
          }
          const main = `var(--md-sys-color-${name}, var(--${name}, var(--md-sys-color-primary)))`;
          const on = `var(--md-sys-color-on-${name}, var(--on-${name}, var(--md-sys-color-on-primary)))`;
          if (this.variant === "outlined") {
            s.background = "";
            s.color = main;
            s.borderColor = main;
          } else if (this.variant === "text") {
            s.background = "";
            s.color = main;
            s.borderColor = "";
          } else {
            s.background = main;
            s.color = on;
            s.borderColor = "";
          }
        },
      },
    });
  </script>
</template>
