<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Senti-UI — 语义组件，任意材质</title>
  <meta
    name="description"
    content="Senti-UI 是基于 ofa.js 的 AI-first 组件库：属性只表达语义，外观用原生 CSS，颜色只走 M3，材质可以由皮肤自由替换。无构建，CDN 即用。"
  />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Senti-UI — 语义组件，任意材质" />
  <meta
    property="og:description"
    content="同一批 st-* 组件，同一套 M3 颜色；材质可换（M3 / Apple 毛玻璃 / shadcn），无构建，CDN 即用。"
  />
  <meta name="theme-color" content="#0061A4" />
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230061A4'/%3E%3Ccircle cx='32' cy='32' r='13' fill='white'/%3E%3C/svg%3E"
  />

  <!-- 运行时：ofa.js v5 + scsr 桥接（同一模块内按顺序加载，scsr 必须在 ofa 之后） -->
  <script type="module">
    import "https://cdn.jsdelivr.net/gh/ofajs/ofa.js@refs/heads/v5/dist/ofa.min.mjs";
    import "https://cdn.jsdelivr.net/gh/ofajs/ofa.js@refs/heads/v5/packages/scsr/dist/scsr.min.mjs";
  </script>
  <!-- 首帧主题引导（同步、禁缓存路径由 npm run dev 提供） -->
  <script src="../packages/boot/st-boot.js"></script>

  <!-- 三套材质同时预载：切换零等待，且允许同页并列展示三种材质 -->
  <link rel="stylesheet" href="../packages/skin/m3.css" />
  <link rel="stylesheet" href="../packages/skin/apple.css" />
  <link rel="stylesheet" href="../packages/skin/shadcn.css" />

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
    }
    body {
      font-family: "Inter", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI",
        system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    /* 无 JS 兜底：SCSR 的 template[page] 在脚本执行前是惰性的 */
    .nojs {
      max-width: 720px;
      margin: 0 auto;
      padding: 12vh 24px;
      font-family: system-ui, sans-serif;
      line-height: 1.7;
      color: var(--md-sys-color-on-surface, #1a1c1e);
      background: var(--md-sys-color-surface, #fdfcff);
    }
    .nojs h1 { margin: 0 0 12px; font-size: 40px; letter-spacing: -0.03em; }
    .nojs p { margin: 0 0 16px; color: var(--md-sys-color-on-surface-variant, #43474e); }
    .nojs a { color: var(--md-sys-color-primary, #0061a4); }
  </style>
</head>
<body>
  <!-- 组件按需引入：本页聚合全部组件，故全部预载 -->
  <l-m src="../packages/button/button.html"></l-m>
  <l-m src="../packages/button/button-group.html"></l-m>
  <l-m src="../packages/button/split-button.html"></l-m>
  <l-m src="../packages/button/icon-button.html"></l-m>
  <l-m src="../packages/input/input.html"></l-m>
  <l-m src="../packages/textarea/textarea.html"></l-m>
  <l-m src="../packages/select/select.html"></l-m>
  <l-m src="../packages/dialog/dialog.html"></l-m>
  <l-m src="../packages/checkbox/checkbox.html"></l-m>
  <l-m src="../packages/switch/switch.html"></l-m>
  <l-m src="../packages/radio/radio.html"></l-m>
  <l-m src="../packages/snackbar/snackbar.html"></l-m>
  <l-m src="../packages/slider/slider.html"></l-m>
  <l-m src="../packages/progress/progress.html"></l-m>
  <l-m src="../packages/tooltip/tooltip.html"></l-m>
  <l-m src="../packages/card/card.html"></l-m>
  <l-m src="../packages/badges/badges.html"></l-m>
  <l-m src="../packages/collapse/collapse.html"></l-m>
  <l-m src="../packages/list/list.html"></l-m>
  <l-m src="../packages/menu/menu.html"></l-m>
  <l-m src="../packages/tabs/tab-bar.html"></l-m>
  <l-m src="../packages/navigation/nav-bar.html"></l-m>
  <l-m src="../packages/navigation/nav-layout.html"></l-m>
  <l-m src="../packages/ripple/ripple.html"></l-m>

  <!-- SCSR 契约：完整页面内联在 o-app 的 template[page] 里；
       真实路径 /site/ 即当前文档，scsr 接管后由 o-page 从 URL 收编渲染 -->
  <noscript>
    <div class="nojs">
      <h1>Senti-UI</h1>
      <p>语义组件，任意材质。官网的实时换肤与组件演示需要 JavaScript；文档与源码无需脚本即可查看。</p>
      <p><a href="../docs/index.html">打开组件文档</a> · <a href="https://github.com/ofajs/senti-ui">GitHub</a></p>
    </div>
  </noscript>

  <o-app src="./app-config.js">
    <template page>
        <!-- 局部皮肤预览（data-skin 卡片）需要 shadow 内的样式表：
             文档树里的 [data-skin] 规则进不了 page shadow，而 link 可以 -->
        <link rel="stylesheet" href="../packages/skin/m3.css" />
        <link rel="stylesheet" href="../packages/skin/apple.css" />
        <link rel="stylesheet" href="../packages/skin/shadcn.css" />

        <style>
          :host {
            --site-max: 1180px;
            --gutter: clamp(20px, 4vw, 40px);

            display: block;
            background: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            font-size: 15px;
            line-height: 1.55;
          }
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }
          h1,
          h2,
          h3,
          h4,
          p,
          dl,
          dd,
          pre {
            margin: 0;
          }
          a {
            color: inherit;
          }
          button {
            font: inherit;
          }

          /* ---------- 顶栏 ---------- */
          .top {
            position: sticky;
            top: 0;
            z-index: 40;
            background: color-mix(in srgb, var(--md-sys-color-surface) 82%, transparent);
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
            -webkit-backdrop-filter: blur(16px) saturate(150%);
            backdrop-filter: blur(16px) saturate(150%);
          }
          .top-inner {
            max-width: var(--site-max);
            margin: 0 auto;
            padding: 12px var(--gutter);
            display: flex;
            align-items: center;
            gap: 20px;
          }
          .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--md-sys-color-on-surface);
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -0.03em;
            cursor: pointer;
          }
          .brand-mark {
            width: 26px;
            height: 26px;
            border-radius: 9px;
            background: linear-gradient(140deg, var(--md-sys-color-primary), var(--md-sys-color-tertiary));
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--md-sys-color-on-primary) 18%, transparent);
            flex: none;
          }
          .brand-accent {
            color: var(--md-sys-color-primary);
          }
          .top-nav {
            display: flex;
            align-items: center;
            gap: 2px;
            margin-left: auto;
          }
          .nav-link {
            padding: 7px 12px;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 13px;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease;
          }
          .nav-link:hover {
            background: color-mix(in srgb, currentColor 9%, transparent);
            color: var(--md-sys-color-on-surface);
          }
          .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
          }
          .top-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 34px;
            padding: 0 12px;
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: 999px;
            background: transparent;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 12px;
            text-decoration: none;
            white-space: nowrap;
            cursor: pointer;
            transition: color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
          }
          .top-btn:hover {
            color: var(--md-sys-color-on-surface);
            border-color: var(--md-sys-color-outline);
            background: var(--md-sys-color-surface-container-low);
          }
          .top-btn-strong {
            border-color: transparent;
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
          }
          .top-btn-strong:hover {
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border-color: transparent;
            filter: brightness(1.08);
          }

          /* ---------- 通用版式 ---------- */
          main {
            background:
              radial-gradient(900px 520px at 12% -6%, color-mix(in srgb, var(--md-sys-color-primary-container) 52%, transparent), transparent 70%),
              radial-gradient(760px 460px at 96% 6%, color-mix(in srgb, var(--md-sys-color-tertiary-container) 46%, transparent), transparent 70%);
          }
          .section {
            max-width: var(--site-max);
            margin: 0 auto;
            padding: clamp(56px, 7vw, 88px) var(--gutter);
            scroll-margin-top: 86px;
          }
          .section + .section {
            border-top: 1px solid var(--md-sys-color-outline-variant);
          }
          .section-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 32px;
            margin-bottom: 28px;
          }
          .section-kicker {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--md-sys-color-primary);
          }
          .section h2 {
            margin-top: 8px;
            font-size: clamp(28px, 3.6vw, 40px);
            line-height: 1.1;
            letter-spacing: -0.035em;
          }
          .section-desc {
            max-width: 460px;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 13.5px;
            line-height: 1.75;
          }

          /* ---------- Hero ---------- */
          .hero {
            max-width: var(--site-max);
            margin: 0 auto;
            padding: clamp(48px, 7vw, 80px) var(--gutter) clamp(40px, 5vw, 56px);
            display: grid;
            grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
            gap: clamp(32px, 5vw, 64px);
            align-items: center;
            scroll-margin-top: 80px;
          }
          .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 12px;
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: 999px;
            background: color-mix(in srgb, var(--md-sys-color-surface-container-low) 70%, transparent);
            color: var(--md-sys-color-on-surface-variant);
            font-size: 11px;
            letter-spacing: 0.04em;
          }
          .eyebrow .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--md-sys-color-success);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--md-sys-color-success) 18%, transparent);
          }
          .hero h1 {
            margin: 18px 0 0;
            font-size: clamp(44px, 6.6vw, 76px);
            line-height: 0.98;
            letter-spacing: -0.045em;
            font-weight: 800;
          }
          .grad {
            background: linear-gradient(100deg, var(--md-sys-color-primary), var(--md-sys-color-tertiary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
          }
          .lead {
            max-width: 520px;
            margin-top: 22px;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 16px;
            line-height: 1.75;
          }
          .lead code {
            font-family: ui-monospace, Menlo, monospace;
            font-size: 0.92em;
            padding: 1px 5px;
            border-radius: 5px;
            background: var(--md-sys-color-surface-container);
            color: var(--md-sys-color-primary);
          }
          .cta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 28px;
          }
          .stats {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            margin-top: 38px;
            padding-top: 22px;
            border-top: 1px solid var(--md-sys-color-outline-variant);
          }
          .stats dt {
            font-size: 24px;
            font-weight: 750;
            letter-spacing: -0.03em;
          }
          .stats dd {
            margin-top: 2px;
            font-size: 11px;
            color: var(--md-sys-color-on-surface-variant);
          }

          .hero-side {
            display: grid;
            gap: 14px;
          }
          .skin-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
          }
          .skin-row-label {
            margin-right: 2px;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
          }
          .skin-pick {
            font-size: 12px;
            height: 32px;
            padding: 0 14px;
          }
          .preview {
            display: grid;
            gap: 13px;
            padding: clamp(20px, 3vw, 28px);
            border: 1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 85%, transparent);
            border-radius: 26px;
            background: color-mix(in srgb, var(--md-sys-color-surface-container-high) 74%, transparent);
            box-shadow:
              0 30px 60px -34px rgb(0 0 0 / 0.4),
              0 1px 0 color-mix(in srgb, var(--md-sys-color-on-surface) 5%, transparent) inset;
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            backdrop-filter: blur(18px) saturate(140%);
            overflow: visible;
          }
          .preview-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
          }
          .live {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.14em;
            color: var(--md-sys-color-on-surface-variant);
          }
          .live i {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--md-sys-color-success);
            animation: live-pulse 2.2s ease-in-out infinite;
          }
          @keyframes live-pulse {
            50% {
              opacity: 0.35;
            }
          }
          .preview-chip {
            padding: 3px 9px;
            border-radius: 999px;
            background: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-on-secondary-container);
            font-family: ui-monospace, Menlo, monospace;
            font-size: 10px;
          }
          .preview-title {
            margin-top: 2px;
            font-size: 24px;
            letter-spacing: -0.03em;
          }
          .preview-sub {
            color: var(--md-sys-color-on-surface-variant);
            font-size: 12.5px;
          }
          .field {
            display: grid;
            gap: 6px;
          }
          .field-label {
            color: var(--md-sys-color-on-surface-variant);
            font-size: 11px;
            letter-spacing: 0.03em;
          }
          .field st-input {
            width: 100%;
          }
          .preview-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
          }
          .preview-row st-switch {
            font-size: 13px;
          }
          .block {
            width: 100%;
          }
          .preview-foot {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 11.5px;
          }
          .preview-hint {
            color: var(--md-sys-color-on-surface-variant);
            font-size: 11px;
            text-align: center;
          }

          /* ---------- 理念 ---------- */
          .principles {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
          }
          .principle {
            display: grid;
            align-content: start;
            gap: 9px;
            padding: 22px;
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: 20px;
            background: color-mix(in srgb, var(--md-sys-color-surface-container-low) 65%, transparent);
          }
          .principle .num {
            font-family: ui-monospace, Menlo, monospace;
            font-size: 11px;
            color: var(--md-sys-color-primary);
          }
          .principle h3 {
            font-size: 15px;
            letter-spacing: -0.01em;
          }
          .principle p {
            color: var(--md-sys-color-on-surface-variant);
            font-size: 12.5px;
            line-height: 1.7;
          }

          /* ---------- 组件展柜 ---------- */
          .specs {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            gap: 14px;
          }
          .spec {
            grid-column: span 4;
            padding: 18px 20px 20px;
            border-radius: 20px;
            transition: border-color 0.18s ease, background-color 0.18s ease;
          }
          .spec:hover {
            border-color: color-mix(in srgb, var(--md-sys-color-primary) 45%, var(--md-sys-color-outline-variant));
          }
          .spec.half {
            grid-column: span 6;
          }
          .spec.wide {
            grid-column: span 12;
          }
          .spec-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
          }
          .spec-head h3 {
            font-size: 14px;
            letter-spacing: -0.01em;
          }
          .tag {
            padding: 2px 8px;
            border-radius: 999px;
            background: var(--md-sys-color-surface-container-high);
            color: var(--md-sys-color-on-surface-variant);
            font-family: ui-monospace, Menlo, monospace;
            font-size: 10px;
            white-space: nowrap;
          }
          .spec-body {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 9px;
          }
          .spec-body.col {
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
          }
          .spec-note {
            margin-top: 12px;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 11.5px;
            line-height: 1.65;
          }
          .spec-note code,
          .mono {
            font-family: ui-monospace, Menlo, monospace;
            font-size: 0.94em;
          }
          .spec-note code {
            padding: 1px 4px;
            border-radius: 4px;
            background: var(--md-sys-color-surface-container-high);
          }
          .ripple-tile {
            position: relative;
            display: grid;
            place-items: center;
            width: 100%;
            height: 62px;
            border-radius: 14px;
            overflow: hidden;
            background: color-mix(in srgb, var(--md-sys-color-primary) 13%, var(--md-sys-color-surface));
            color: var(--md-sys-color-primary);
            font-size: 12.5px;
            cursor: pointer;
            user-select: none;
          }
          .ctx-tile {
            display: grid;
            place-items: center;
            width: 100%;
            min-height: 54px;
            padding: 10px;
            border: 1px dashed var(--md-sys-color-outline);
            border-radius: 12px;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 11.5px;
            text-align: center;
            cursor: context-menu;
            user-select: none;
          }
          .result {
            margin-top: 10px;
            color: var(--md-sys-color-on-surface-variant);
            font-family: ui-monospace, Menlo, monospace;
            font-size: 11px;
            overflow-wrap: anywhere;
          }
          .snackbar-stage st-snackbar {
            position: static;
            width: 100%;
          }
          .tool-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
          }
          .progress-row {
            display: flex;
            align-items: center;
            gap: 12px;
          }
          .progress-row > span {
            width: 4.2em;
            flex: none;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 11px;
          }
          .progress-row st-progress {
            flex: 1;
          }
          .mini-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
          }
          .mini-card {
            display: grid;
            gap: 3px;
            padding: 14px;
            border-radius: 14px;
            font-size: 12px;
          }
          .mini-card strong {
            font-size: 12.5px;
          }
          .mini-card span {
            color: var(--md-sys-color-on-surface-variant);
            font-size: 10.5px;
          }
          .site-list {
            width: 100%;
          }
          .tabs-panel {
            margin-top: 2px;
            padding: 12px 14px;
            border-radius: 12px;
            background: var(--md-sys-color-surface-container-low);
            color: var(--md-sys-color-on-surface-variant);
            font-size: 12px;
          }
          .nav-layout {
            height: 320px;
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: 18px;
            overflow: hidden;
          }
          .nav-layout-body {
            display: grid;
            align-content: start;
            gap: 6px;
            height: 100%;
            padding: 22px;
            background: var(--md-sys-color-surface-container-lowest);
          }
          .nav-layout-body h4 {
            font-size: 15px;
          }
          .nav-layout-body p {
            color: var(--md-sys-color-on-surface-variant);
            font-size: 12px;
            line-height: 1.7;
          }
          .rail-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
          }
          .rail-stats > div {
            display: grid;
            gap: 1px;
            min-width: 92px;
            padding: 10px 12px;
            border-radius: 12px;
            background: var(--md-sys-color-surface-container);
          }
          .rail-stats strong {
            font-size: 18px;
            letter-spacing: -0.02em;
          }
          .rail-stats span {
            color: var(--md-sys-color-on-surface-variant);
            font-size: 10.5px;
          }

          /* ---------- 皮肤 ---------- */
          .skin-cards {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
          }
          .skin-card {
            display: grid;
            align-content: start;
            gap: 12px;
            padding: 20px;
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: 22px;
            background: var(--md-sys-color-surface-container-low);
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
          }
          .skin-card.active {
            border-color: var(--md-sys-color-primary);
            box-shadow: 0 0 0 1px var(--md-sys-color-primary) inset;
          }
          .skin-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
          }
          .skin-card-head h3 {
            font-size: 15px;
            letter-spacing: -0.01em;
          }
          .skin-chip {
            padding: 2px 8px;
            border-radius: 999px;
            background: var(--md-sys-color-surface-container-high);
            color: var(--md-sys-color-on-surface-variant);
            font-family: ui-monospace, Menlo, monospace;
            font-size: 10px;
          }
          .skin-desc {
            min-height: 3.4em;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 12px;
            line-height: 1.65;
          }
          .skin-preview {
            display: grid;
            gap: 9px;
            padding: 16px;
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: 16px;
            /* 让毛玻璃有东西可模糊：三种材质共用 M3 色彩渐变做背景 */
            background:
              radial-gradient(120% 120% at 10% 0%, color-mix(in srgb, var(--md-sys-color-primary-container) 70%, transparent), transparent 58%),
              radial-gradient(100% 100% at 100% 100%, color-mix(in srgb, var(--md-sys-color-tertiary-container) 60%, transparent), transparent 62%),
              var(--md-sys-color-surface-container);
          }
          .skin-preview st-input {
            width: 100%;
          }
          .skin-card > st-button {
            justify-self: start;
          }

          /* ---------- 快速开始 ---------- */
          .start-grid {
            display: grid;
            grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
            gap: clamp(28px, 4vw, 56px);
            align-items: start;
          }
          .start-copy p {
            max-width: 440px;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 13.5px;
            line-height: 1.8;
          }
          .start-list {
            margin: 20px 0 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 9px;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 12.5px;
          }
          .start-list li {
            display: flex;
            gap: 9px;
            align-items: baseline;
          }
          .start-list li::before {
            content: "✓";
            color: var(--md-sys-color-success);
            font-weight: 700;
          }
          .code-panel {
            overflow: hidden;
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: 18px;
            background: var(--md-sys-color-surface-container-low);
          }
          .code-head {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px 9px 14px;
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
            background: var(--md-sys-color-surface-container);
          }
          .dots {
            display: inline-flex;
            gap: 5px;
          }
          .dots i {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--md-sys-color-outline-variant);
          }
          .code-file {
            color: var(--md-sys-color-on-surface-variant);
            font-family: ui-monospace, Menlo, monospace;
            font-size: 10.5px;
          }
          .copy-btn {
            margin-left: auto;
            font-size: 11px;
            height: 28px;
            padding: 0 10px;
          }
          .code {
            display: block;
            max-height: 340px;
            margin: 0;
            padding: 18px 20px;
            overflow: auto;
            color: var(--md-sys-color-on-surface);
            font-family: ui-monospace, Menlo, monospace;
            font-size: 11.5px;
            line-height: 1.8;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
          }

          /* ---------- 页脚 ---------- */
          .footer {
            max-width: var(--site-max);
            margin: 0 auto;
            padding: 34px var(--gutter) 46px;
            border-top: 1px solid var(--md-sys-color-outline-variant);
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 24px;
            flex-wrap: wrap;
          }
          .footer-brand {
            display: flex;
            align-items: center;
            gap: 10px;
          }
          .footer-brand strong {
            font-size: 14px;
          }
          .footer-brand p {
            color: var(--md-sys-color-on-surface-variant);
            font-size: 11.5px;
          }
          .footer-links {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
          }
          .footer-links a {
            padding: 6px 10px;
            border-radius: 999px;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 12px;
            text-decoration: none;
          }
          .footer-links a:hover {
            background: var(--md-sys-color-surface-container-low);
            color: var(--md-sys-color-on-surface);
          }
          .footer-note {
            width: 100%;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 11px;
          }

          @media (max-width: 1024px) {
            .principles {
              grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .skin-cards {
              grid-template-columns: repeat(2, minmax(0, 1fr));
            }
          }
          @media (max-width: 900px) {
            .hero {
              grid-template-columns: minmax(0, 1fr);
            }
            .hero-side {
              max-width: 560px;
            }
            .top-nav {
              display: none;
            }
            .spec,
            .spec.half {
              grid-column: span 6;
            }
            .start-grid {
              grid-template-columns: minmax(0, 1fr);
            }
          }
          @media (max-width: 640px) {
            .spec,
            .spec.half {
              grid-column: span 12;
            }
            .stats {
              grid-template-columns: repeat(2, minmax(0, 1fr));
              gap: 14px;
            }
            .principles,
            .skin-cards {
              grid-template-columns: minmax(0, 1fr);
            }
            .section-head {
              flex-direction: column;
              align-items: flex-start;
              gap: 12px;
            }
            .top-btn {
              padding: 0 10px;
            }
            .top-btn-strong {
              display: none;
            }
            .footer {
              flex-direction: column;
            }
          }
          @media (prefers-reduced-motion: reduce) {
            .live i {
              animation: none;
            }
            .nav-link,
            .top-btn,
            .principle,
            .spec {
              transition: none;
            }
          }
        </style>

        <header class="top">
          <div class="top-inner">
            <button class="brand" on:click="goTop">
              <span class="brand-mark" aria-hidden="true"></span>
              <span>Senti<span class="brand-accent">UI</span></span>
            </button>
            <nav class="top-nav" aria-label="页面导航">
              <button class="nav-link" on:click="jump('actions')">组件</button>
              <button class="nav-link" on:click="jump('skins')">材质</button>
              <button class="nav-link" on:click="jump('why')">理念</button>
              <button class="nav-link" on:click="jump('start')">开始</button>
            </nav>
            <div class="top-actions">
              <button class="top-btn" on:click="cycleTheme" title="切换主题模式">◐ {{themeLabel}}</button>
              <button class="top-btn top-btn-strong" on:click="openRepo">GitHub ↗</button>
            </div>
          </div>
        </header>

        <main>
          <section class="hero" id="top">
            <div class="hero-copy">
              <p class="eyebrow"><span class="dot"></span>ofa.js v5 · Material Design 3 · zero build</p>
              <h1>语义组件，<br /><span class="grad">任意材质。</span></h1>
              <p class="lead">
                按钮、输入、选择、对话框、菜单、导航……同一批 <code>st-*</code> 标签，同一套 M3 颜色。<br />
                想换风格时，只换皮肤，不换组件。
              </p>
              <div class="cta">
                <st-button on:click="jump('actions')">浏览组件 <span slot="suffix">↓</span></st-button>
                <st-button variant="outlined" on:click="openRepo">查看源码 ↗</st-button>
              </div>
              <dl class="stats">
                <div><dt>29</dt><dd>自定义标签</dd></div>
                <div><dt>20</dt><dd>组件模块</dd></div>
                <div><dt>3</dt><dd>内置材质</dd></div>
                <div><dt>0</dt><dd>构建步骤</dd></div>
              </dl>
            </div>

            <div class="hero-side">
              <div class="skin-row">
                <span class="skin-row-label">材质</span>
                <st-button class="skin-pick" attr:variant="skin === 'm3' ? 'filled' : 'outlined'" on:click="pickSkin('m3')">M3</st-button>
                <st-button class="skin-pick" attr:variant="skin === 'apple' ? 'filled' : 'outlined'" on:click="pickSkin('apple')">Apple 毛玻璃</st-button>
                <st-button class="skin-pick" attr:variant="skin === 'shadcn' ? 'filled' : 'outlined'" on:click="pickSkin('shadcn')">shadcn</st-button>
              </div>

              <div class="preview">
                <div class="preview-head">
                  <span class="live"><i></i>LIVE PREVIEW</span>
                  <span class="preview-chip">{{skinLabel}}</span>
                </div>
                <h2 class="preview-title">欢迎回来</h2>
                <p class="preview-sub">这一小块表单，就是换肤的全部范围。</p>

                <div class="field">
                  <span class="field-label">邮箱</span>
                  <st-input placeholder="you@example.com"><span slot="prefix">✉</span></st-input>
                </div>
                <div class="field">
                  <span class="field-label">密码</span>
                  <st-input type="password" placeholder="••••••••"><span slot="prefix">⌘</span></st-input>
                </div>

                <div class="preview-row">
                  <st-switch attr:checked="remember" on:change="remember = !remember">记住我</st-switch>
                  <st-button variant="text" on:click="forgot">忘记密码？</st-button>
                </div>

                <st-button class="block" on:click="fakeLogin">登录</st-button>
                <p class="preview-foot">还没有账号？<st-button variant="text" on:click="fakeLogin">创建账号</st-button></p>
              </div>
              <p class="preview-hint">当前材质：{{skinLabel}} · 颜色仍来自 M3（右上角可切深色）</p>
            </div>
          </section>

          <section class="section" id="why">
            <div class="section-head">
              <div>
                <p class="section-kicker">01 / WHY</p>
                <h2>为什么是 Senti-UI</h2>
              </div>
              <p class="section-desc">
                传统组件库把“人”的便利预设塞进 API；Senti-UI 只保留语义，把外观交还给原生 CSS，把材质交给皮肤。
              </p>
            </div>
            <div class="principles">
              <article class="principle">
                <span class="num">01</span>
                <h3>语义用属性</h3>
                <p><span class="mono">disabled</span> / <span class="mono">loading</span> / <span class="mono">variant</span> 只表达状态与行为。没有 size 枚举，外观直接写原生 CSS。</p>
              </article>
              <article class="principle">
                <span class="num">02</span>
                <h3>颜色只走 M3</h3>
                <p>所有组件消费 <span class="mono">--md-sys-color-*</span>。种子色、error、success 与深浅色主题永远一致。</p>
              </article>
              <article class="principle">
                <span class="num">03</span>
                <h3>材质可以换</h3>
                <p>皮肤只改圆角、密度、描边、阴影、毛玻璃与动效；同一套组件可以长得像 M3、Apple 或 shadcn。</p>
              </article>
              <article class="principle">
                <span class="num">04</span>
                <h3>零构建</h3>
                <p>一个 <span class="mono">l-m</span> 标签引入组件，CDN 即用；没有打包器，没有运行时编译配置。</p>
              </article>
            </div>
          </section>

          <section class="section" id="actions">
            <div class="section-head">
              <div>
                <p class="section-kicker">02 / ACTIONS</p>
                <h2>动作与反馈</h2>
              </div>
              <p class="section-desc">按钮、图标按钮、按钮组、分裂按钮、徽标与波纹。全部支持键盘聚焦、Enter / Space 激活与禁用态。</p>
            </div>
            <div class="specs">
              <st-card variant="outlined" class="spec">
                <div class="spec-head"><h3>按钮</h3><code class="tag">st-button</code></div>
                <div class="spec-body">
                  <st-button>Filled</st-button>
                  <st-button variant="outlined">Outlined</st-button>
                  <st-button variant="text">Text</st-button>
                  <st-button loading>Loading</st-button>
                  <st-button disabled>Disabled</st-button>
                </div>
                <p class="spec-note">三种 M3 variant + loading。高度、圆角、间距全部是 em，改 font-size 即整体缩放。</p>
              </st-card>

              <st-card variant="outlined" class="spec">
                <div class="spec-head"><h3>语义色</h3><code class="tag">color</code></div>
                <div class="spec-body">
                  <st-button color="error">Delete</st-button>
                  <st-button color="success">Save</st-button>
                  <st-button color="tertiary" variant="outlined">Accent</st-button>
                  <st-button color="error" variant="text">Danger</st-button>
                </div>
                <p class="spec-note"><span class="mono">color</span> 接受 M3 角色名或 color 工具里的自定义变量名，换肤时语义不变。</p>
              </st-card>

              <st-card variant="outlined" class="spec">
                <div class="spec-head"><h3>图标按钮与徽标</h3><code class="tag">st-icon-button · st-badges</code></div>
                <div class="spec-body">
                  <st-icon-button title="收藏">★</st-icon-button>
                  <st-icon-button variant="filled" title="完成">✓</st-icon-button>
                  <st-icon-button variant="tonal" color="error" title="删除">⌫</st-icon-button>
                  <st-icon-button variant="outlined" title="设置">⚙</st-icon-button>
                  <st-badges value="12"><st-icon-button title="通知">🔔</st-icon-button></st-badges>
                </div>
                <p class="spec-note">图标按钮必须配 title / aria-label；徽标可封顶、可换色、可标在任意元素上。</p>
              </st-card>

              <st-card variant="outlined" class="spec">
                <div class="spec-head"><h3>按钮组</h3><code class="tag">st-button-group</code></div>
                <div class="spec-body">
                  <st-button-group connected>
                    <st-button>日</st-button>
                    <st-button variant="outlined">周</st-button>
                    <st-button variant="outlined">月</st-button>
                  </st-button-group>
                </div>
                <p class="spec-note">connected 连体、full-width 等分；圆角由 JS 按位置自动计算。</p>
              </st-card>

              <st-card variant="outlined" class="spec">
                <div class="spec-head"><h3>分裂按钮</h3><code class="tag">st-split-button</code></div>
                <div class="spec-body">
                  <st-split-button on:click="splitAction">
                    发送
                    <span slot="prefix">↗</span>
                    <st-menu-item slot="menu" on:click="splitPick('发送到邮箱')">发送到邮箱</st-menu-item>
                    <st-menu-item slot="menu" on:click="splitPick('发送到云盘')">发送到云盘</st-menu-item>
                    <st-menu-item slot="menu" disabled>定时发送</st-menu-item>
                  </st-split-button>
                </div>
                <p class="spec-note">主区点按触发主操作，箭头开合菜单；菜单面板自动翻转避让视口。</p>
              </st-card>

              <st-card variant="outlined" class="spec">
                <div class="spec-head"><h3>波纹</h3><code class="tag">st-ripple</code></div>
                <div class="ripple-tile">点我试试<st-ripple></st-ripple></div>
                <p class="spec-note">放在 position: relative 的父元素里即可；按钮已内建波纹，Apple / shadcn 皮肤会把它关掉。</p>
              </st-card>
            </div>
          </section>

          <section class="section" id="inputs">
            <div class="section-head">
              <div>
                <p class="section-kicker">03 / INPUTS</p>
                <h2>输入与选择</h2>
              </div>
              <p class="section-desc">输入、文本域、下拉、复选、开关、单选、滑块。value 是运行时状态，用 <span class="mono">el.value</span> 读写。</p>
            </div>
            <div class="specs">
              <st-card variant="outlined" class="spec half">
                <div class="spec-head"><h3>输入框</h3><code class="tag">st-input</code></div>
                <div class="spec-body col">
                  <st-input placeholder="you@example.com"><span slot="prefix">✉</span></st-input>
                  <st-input color="error" placeholder="校验错误态"><span slot="prefix">!</span></st-input>
                  <st-input variant="filled" placeholder="Filled 变体" default-value="已填充"></st-input>
                </div>
                <p class="spec-note">outlined / filled、prefix / suffix、color 校验态；focus 描边与 caret 跟随语义色。</p>
              </st-card>

              <st-card variant="outlined" class="spec half">
                <div class="spec-head"><h3>多行文本</h3><code class="tag">st-textarea</code></div>
                <div class="spec-body col">
                  <st-textarea rows="3" placeholder="写点什么……"></st-textarea>
                  <st-textarea autosize default-value="autosize：高度跟随内容自动撑开。"></st-textarea>
                </div>
                <p class="spec-note">rows 为最小高度；autosize 用 ResizeObserver 跟随内容与字号变化。</p>
              </st-card>

              <st-card variant="outlined" class="spec half">
                <div class="spec-head"><h3>下拉选择</h3><code class="tag">st-select</code></div>
                <div class="spec-body col">
                  <st-select placeholder="选择一种水果" on:change="fruitChange">
                    <option value="apple">苹果</option>
                    <option value="banana">香蕉</option>
                    <option value="cherry">樱桃</option>
                    <option value="durian">榴莲</option>
                    <st-option value="mango" label="芒果（st-option）">🥭 芒果 · 富内容选项</st-option>
                  </st-select>
                  <span class="result">当前值：{{fruit || "（未选择）"}}</span>
                </div>
                <p class="spec-note">支持原生 option 与 st-option 富内容；键盘 ↑↓ / Enter / Escape / Home / End 全支持。</p>
              </st-card>

              <st-card variant="outlined" class="spec half">
                <div class="spec-head"><h3>复选与开关</h3><code class="tag">st-checkbox · st-switch</code></div>
                <div class="spec-body col">
                  <st-checkbox attr:checked="agree" on:change="agree = !agree">我同意服务条款</st-checkbox>
                  <st-checkbox indeterminate>全选（不确定态）</st-checkbox>
                  <st-switch attr:checked="notify" on:change="notify = !notify">接收通知</st-switch>
                </div>
                <p class="spec-note">内部是透明原生 input，天然支持 Space / Tab；change 事件 composed，可直接在宿主监听。</p>
              </st-card>

              <st-card variant="outlined" class="spec half">
                <div class="spec-head"><h3>单选</h3><code class="tag">st-radio</code></div>
                <div class="spec-body col">
                  <st-radio name="plan" attr:checked="plan === 'free'" on:change="plan = 'free'">免费版</st-radio>
                  <st-radio name="plan" attr:checked="plan === 'pro'" on:change="plan = 'pro'">专业版</st-radio>
                  <st-radio name="plan" attr:checked="plan === 'team'" on:change="plan = 'team'">团队版</st-radio>
                  <span class="result">当前方案：{{plan}}</span>
                </div>
                <p class="spec-note">同名 radio 在同一容器内互斥；跨 shadow 时由组件手动维护分组。</p>
              </st-card>

              <st-card variant="outlined" class="spec half">
                <div class="spec-head"><h3>滑块</h3><code class="tag">st-slider</code></div>
                <div class="spec-body col">
                  <st-slider default-value="64" on:input="volumeChange" on:change="volumeChange"></st-slider>
                  <st-slider color="success" default-value="82"></st-slider>
                  <span class="result">音量：{{volume}}</span>
                </div>
                <p class="spec-note">内部原生 range 承载拖拽与键盘；聚焦时显示数值气泡。</p>
              </st-card>
            </div>
          </section>

          <section class="section" id="feedback">
            <div class="section-head">
              <div>
                <p class="section-kicker">04 / FEEDBACK</p>
                <h2>反馈与浮层</h2>
              </div>
              <p class="section-desc">对话框、菜单、消息条、Toast、提示、进度。所有交互都支持 Escape 关闭与点击外部关闭。</p>
            </div>
            <div class="specs">
              <st-card variant="outlined" class="spec">
                <div class="spec-head"><h3>对话框</h3><code class="tag">st-dialog</code></div>
                <div class="spec-body">
                  <st-button variant="outlined" on:click="openDlg">打开对话框</st-button>
                </div>

                    <p>拖动窗口宽度，观察导航位置与形态自动切换。</p>

        </footer>

        <st-dialog sync:open="dialogOpen" auto-close on:close="dialogOpen = false">
          <h2 slot="headline">删除这个项目？</h2>
          <p>这是一个真实的 <span class="mono">st-dialog</span>。面板、遮罩、入场动效、焦点管理都由组件负责。</p>
          <p style="margin-top: 8px; color: var(--md-sys-color-on-surface-variant);">
            按 Escape 或点击遮罩也可以关闭。
          </p>
          <div slot="actions">
            <st-button variant="text" on:click="dialogOpen = false">取消</st-button>
            <st-button color="error" on:click="confirmDelete">删除</st-button>
          </div>
        </st-dialog>

        <script>
          export default async () => ({
            data: {
              themeMode: "auto",
              skin: "m3",
              remember: true,
              agree: true,
              notify: true,
              plan: "pro",
              fruit: "",
              volume: "64",
              dialogOpen: false,
              tipOpen: false,
              collapsed: false,
              tab: 0,
              tabLabels: ["概览", "活动", "设置"],
              navTab: 0,
              navLabels: ["首页", "发现", "我的"],
              railTab: 0,
              railLabels: ["概览", "组件", "材质"],
              lastAction: "（还没有操作）",
              lastTool: "（未调用）",
              ctxResult: "（未选择）",
              copied: false,
              installCode:
                '\x3Cscript src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@refs/heads/v5/dist/ofa.min.mjs" type="module">\x3C/script>\n' +
                '\x3Cscript src="https://cdn.jsdelivr.net/gh/ofajs/senti-ui/packages/boot/st-boot.js">\x3C/script>\n' +
                '\x3Cl-m src="https://cdn.jsdelivr.net/gh/ofajs/senti-ui/packages/button/button.html">\x3C/l-m>\n\n' +
                '\x3Cst-button color="error">Delete\x3C/st-button>',
            },
            ready() {
              this.syncChrome();
              if (!window.__site) {
                this._poll = setInterval(() => {
                  if (window.__site) {
                    this.syncChrome();
                    clearInterval(this._poll);
                  }
                }, 60);
                setTimeout(() => clearInterval(this._poll), 4000);
              }
            },
            detached() {
              clearInterval(this._poll);
            },
            proto: {
              get themeLabel() {
                return { auto: "跟随系统", light: "浅色", dark: "深色" }[this.themeMode] || "跟随系统";
              },
              get skinLabel() {
                return { m3: "M3", apple: "Apple 毛玻璃", shadcn: "shadcn 扁平" }[this.skin] || "M3";
              },
              get tabLabel() {
                return this.tabLabels[this.tab] || "";
              },
              get navLabel() {
                return this.navLabels[this.navTab] || "";
              },
              get railLabel() {
                return this.railLabels[this.railTab] || "";
              },
              syncChrome() {
                this.skin =
                  document.documentElement.dataset.skin ||
                  localStorage.getItem("st-skin") ||
                  "m3";
                if (window.__site) {
                  this.themeMode = window.__site.getThemeMode();
                } else {
                  try {
                    this.themeMode = localStorage.getItem("st-theme-mode") || "auto";
                  } catch {
                    this.themeMode = "auto";
                  }
                }
              },
              toast(message) {
                if (window.__site) window.__site.toast(message);
              },
              jump(id) {
                const target = this.ele.shadowRoot.getElementById(id);
                if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
              },
              goTop() {
                window.scrollTo({ top: 0, behavior: "smooth" });
              },
              openRepo() {
                window.open("https://github.com/ofajs/senti-ui", "_blank", "noopener");
              },
              cycleTheme() {
                const order = ["auto", "light", "dark"];
                const index = order.indexOf(this.themeMode);
                const next = order[(index + 1) % order.length];
                this.themeMode = next;
                if (window.__site) window.__site.setThemeMode(next);
              },
              pickSkin(id) {
                this.skin = id;
                if (window.__site) window.__site.setSkin(id);
                this.toast("材质 → " + this.skinLabel);
              },
              fakeLogin() {
                this.toast("登录成功（演示）");
              },
              forgot() {
                this.toast("重置邮件已发送（演示）");
              },
              openDlg() {
                this.dialogOpen = true;
              },
              confirmDelete() {
                this.dialogOpen = false;
                this.toast("已删除（演示）");
              },
              menuPick(label) {
                this.lastAction = label;
                this.toast("菜单：已选择「" + label + "」");
              },
              splitAction() {
                this.toast("主操作：发送");
              },
              splitPick(label) {
                this.lastAction = label;
                this.toast("已选择「" + label + "」");
              },
              showUndo() {
                this.toast("已撤销（演示）");
              },
              listPick(label) {
                this.toast("列表项：" + label);
              },
              toggleCollapse() {
                this.collapsed = !this.collapsed;
              },
              fruitChange(e) {
                this.fruit = e.target.value || "";
              },
              volumeChange(e) {
                this.volume = String(e.target.value);
              },
              async runToast() {
                if (!window.__site) return;
                this.lastTool = "toast → 已弹出（3s）";
                await window.__site.toast("这是一条 toast，3 秒后自动消失");
              },
              async runAlert() {
                if (!window.__site) return;
                const ok = await window.__site.alert({
                  title: "操作成功",
                  message: "密码已重置，请使用新密码登录。",
                  ok: "知道了",
                });
                this.lastTool = "alert → " + ok;
              },
              async runConfirm() {
                if (!window.__site) return;
                const ok = await window.__site.confirm({
                  title: "确认删除",
                  message: "确定要删除用户 bob 吗？此操作不可撤销。",
                  yes: "删除",
                  cancel: "取消",
                  color: "error",
                });
                this.lastTool = "confirm → " + ok;
              },
              async runPrompt() {
                if (!window.__site) return;
                const value = await window.__site.prompt({
                  title: "重置密码",
                  message: "为用户 bob 设置新密码（至少 4 位）",
                  placeholder: "请输入新密码",
                });
                this.lastTool = "prompt → " + JSON.stringify(value);
              },
              openCtx(e) {
                e.preventDefault();
                if (!window.__site) return;
                const self = this;
                window.__site
                  .contextMenu(e, [
                    { id: "copy", label: "复制", prefix: "⧉" },
                    { id: "rename", label: "重命名", prefix: "✏" },
                    { separator: true },
                    {
                      id: "delete",
                      label: "删除",
                      prefix: "⌫",
                      disabled: true,
                    },
                  ])
                  .then((id) => {
                    self.ctxResult = id || "未选择";
                  });
              },
              async copyCode() {
                try {
                  await navigator.clipboard.writeText(this.installCode);
                  this.copied = true;
                  this.toast("安装代码已复制");
                  setTimeout(() => {
                    this.copied = false;
                  }, 1800);
                } catch {
                  this.toast("复制失败，请手动选择代码");
                }
              },
            },
          });
        </script>
    </template>
  </o-app>
