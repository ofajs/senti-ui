          <p class="doc-lead">导航栏 / 导航项 / 响应式布局：药丸背景跟随 active；nav-layout 按容器宽度自动切换底部导航与左侧 rail。</p>

        <div class="demo">
          <div class="demo-top"><span class="live"><i></i>LIVE</span><code>st-nav-bar</code></div>
          <div class="demo-stage">
            <st-nav-bar style="width:100%;">
  <st-nav-item attr:active="navTab === 0" on:click="navTab = 0"><span slot="icon">⌂</span>首页</st-nav-item>
  <st-nav-item attr:active="navTab === 1" on:click="navTab = 1"><span slot="icon">⌕</span>发现</st-nav-item>
  <st-nav-item attr:active="navTab === 2" on:click="navTab = 2"><span slot="icon">◉</span>我的</st-nav-item>
</st-nav-bar>
<span class="demo-result">当前项：{{navLabel}}</span>

        <div class="doc-cols">
          <div class="doc-block">
            <h3>属性</h3>
            <table class="api">
              <thead><tr><th>属性</th><th>类型</th><th>默认</th><th>说明</th></tr></thead>
              <tbody><tr><td><code>vertical</code></td><td>boolean</td><td>无</td><td>st-nav-bar：纵向排列（侧栏 / rail）</td></tr><tr><td><code>active</code></td><td>boolean</td><td>无</td><td>st-nav-item：当前项</td></tr><tr><td><code>parallel</code></td><td>boolean</td><td>无</td><td>st-nav-item：文字在 icon 右侧</td></tr><tr><td><code>disabled</code></td><td>boolean</td><td>无</td><td>禁用项</td></tr></tbody>
            </table>
          </div>
          <div class="doc-block">
            <h3>插槽 / 事件 / 注意</h3>
            <ul class="api-list"><li>插槽：<code>icon</code> / 默认文字；事件：item 的 <code>click</code> 冒泡（composed）。</li><li><code>st-nav-layout</code>：以自身宽度切换 <code>&lt;768px</code> 底部 / <code>768–1023px</code> 底部横排 / <code>≥1024px</code> 左侧 rail。</li><li>形态属性分两层：<code>vertical</code> 在 bar，<code>parallel</code> 在 item。</li></ul>
          </div>

      <script>
        export const parent = "../layout.html";

        export default async () => ({
          data: {
            selectValue: "",
            dialogOpen: false,
            collapsed: false,
            tab: 0,
            tabLabels: ["概览", "活动", "设置"],
            navTab: 0,
            navLabels: ["首页", "发现", "我的"],
            toolResult: "（未调用）",
          },
          proto: {
            get tabLabel() {
              return this.tabLabels[this.tab] || "";
            },
            get navLabel() {
              return this.navLabels[this.navTab] || "";
            },
            onSelect(e) {
              this.selectValue = e.target.value || "";
            },
            runToast() {
              if (!window.__site) return;
              this.toolResult = "toast → 已弹出（3s）";
              window.__site.toast("这是一条 toast。");
            },
            async runAlert() {
              if (!window.__site) return;
              const ok = await window.__site.alert({ title: "操作成功", message: "这是 alert 命令式对话框。", ok: "知道了" });
              this.toolResult = "alert → " + ok;
            },
            async runConfirm() {
              if (!window.__site) return;
              const ok = await window.__site.confirm({ title: "确认删除", message: "确定删除这条记录吗？", yes: "删除", cancel: "取消", color: "error" });
              this.toolResult = "confirm → " + ok;
            },
            async runPrompt() {
              if (!window.__site) return;
              const value = await window.__site.prompt({ title: "重命名", message: "输入新的名称", placeholder: "新名称" });
              this.toolResult = "prompt → " + JSON.stringify(value);
            },
            openCtx(e) {
              e.preventDefault();
              if (!window.__site) return;
              const self = this;
              window.__site.contextMenu(e, [
                { id: "copy", label: "复制", prefix: "⧉" },
                { id: "rename", label: "重命名", prefix: "✏" },
                { separator: true },
                { id: "delete", label: "删除", prefix: "⌫", disabled: true },
              ]).then((id) => { self.toolResult = "contextMenu → " + (id || "未选择"); });
            },
          },
        });
      </script>
    </template>
  </o-app>

  <script type="module">
    import { setThemeMode, getThemeMode } from "../../packages/color/st-theme-mode.js";
    import { setSkin } from "../../packages/skin/st-skin.js";
    import alert from "../../packages/dialog/alert.js";
    import confirm from "../../packages/dialog/confirm.js";
    import prompt from "../../packages/dialog/prompt.js";
    import toast from "../../packages/snackbar/toast.js";
    import contextMenu from "../../packages/menu/context-menu.js";
    window.__site = { setThemeMode, getThemeMode, setSkin, alert, confirm, prompt, toast, contextMenu };
    window.__siteReady = true;
  </script>
