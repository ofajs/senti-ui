<!--
  st-slider — Senti-UI 滑块组件（基于 ofa.js），视觉对齐 M3 sliders 规范
  语义属性：min / max / step / default-value / disabled / color（M3 角色名）
  value 是运行时状态（ofa data）：el.value 读写，输入时派发 input，松手派发 change
  交互由内部透明原生 input[type=range] 承载（拖拽/键盘 ←→/焦点），见 README.md
-->
<template component>
  <style>
    :host {
      display: inline-flex;
      align-items: center;
      position: relative;
      width: 13.571em; /* 190px */
      height: 2.857em; /* 40px 触控高度 */
      font-size: var(--st-font-size, 14px);
      font-family: var(--st-font, inherit);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    :host([disabled]) {
      cursor: not-allowed;
      opacity: var(--st-disabled-opacity, 0.38);
    }
    :host([disabled]) .native { pointer-events: none; }

    /* M3 轨道：4px 高、两端半圆；左右各内缩拇指半径（拇指中心在轨道端点上） */
    .track,
    .fill {
      position: absolute;
      top: 50%;
      height: var(--st-slider-track-height, 0.286em);
      border-radius: var(--st-slider-track-radius, 0.286em);
      transform: translateY(-50%);
    }
    .track {
      left: 0.714em; /* = 拇指半径 0.714em(10px) */
      right: 0.714em;
      background: var(--md-sys-color-surface-container-highest);
    }
    .fill {
      left: 0.714em;
      width: 50%;
      background: color-mix(
        in srgb,
        var(--st-slider-main, var(--md-sys-color-primary)) var(--st-slider-fill-alpha, 100%),
        transparent
      );
      -webkit-backdrop-filter: var(--st-slider-backdrop-filter, none);
      backdrop-filter: var(--st-slider-backdrop-filter, none);
    }

    /* M3 拇指：20px 角色色圆点，轨道端点间移动；拖动/聚焦时显示数值气泡 */
    .thumb {
      position: absolute;
      top: 50%;
      width: 1.429em; /* 20px */
      height: 1.429em;
      border-radius: var(--st-slider-thumb-radius, 50%);
      background: color-mix(
        in srgb,
        var(--st-slider-main, var(--md-sys-color-primary)) var(--st-slider-fill-alpha, 100%),
        transparent
      );
      -webkit-backdrop-filter: var(--st-slider-backdrop-filter, none);
      backdrop-filter: var(--st-slider-backdrop-filter, none);
      box-shadow: var(--st-slider-thumb-shadow, none);
      transform: translate(-50%, -50%);
      left: 50%;
    }

    /* 数值气泡（M3 value indicator）：拖动/键盘聚焦时显示，浅底深字 */
    .value-tip {
      position: absolute;
      bottom: calc(50% + 1.143em); /* 拇指上方 16px */
      transform: translateX(-50%);
      left: 50%;
      box-sizing: border-box;
      min-width: 1.714em;
      padding: 0.143em 0.429em;
      border-radius: var(--st-slider-tip-radius, 0.286em);
      font-size: 0.786em; /* 11px */
      line-height: 1.5;
      text-align: center;
      white-space: nowrap;
      background: var(--st-slider-main, var(--md-sys-color-primary));
      color: var(--md-sys-color-on-primary);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--st-motion-duration, 0.15s) ease;
    }
    .value-tip::after {
      /* 气泡小三角 */
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 0.286em solid transparent;
      border-top-color: var(--st-slider-main, var(--md-sys-color-primary));
    }
    :host(.st-active) .value-tip { opacity: 1; }

    /* 内部透明原生 range：承载拖拽/键盘/焦点，覆盖整条轨道 */
    .native {
      all: unset;
      position: absolute;
      inset: 0;
      z-index: 2;
      cursor: inherit;
      opacity: 0;           /* 透明但可交互，避免浏览器默认 thumb/轨道 盖在自定义 UI 上 */
      outline: none;
    }
    /* 兜底：各浏览器 range 的伪元素也置透明 */
    .native::-webkit-slider-runnable-track,
    .native::-webkit-slider-thumb,
    .native::-moz-range-track,
    .native::-moz-range-thumb {
      background: transparent;
      border: none;
    }
    .native:focus-visible ~ .thumb {
      outline: var(--st-focus-ring-width, 2px) var(--st-focus-ring-style, solid)
        var(--st-focus-ring-color, var(--md-sys-color-on-surface));
      outline-offset: var(--st-focus-ring-offset, 2px);
    }

    l-m { display: none; }

    /* 减少动态效果：动画/过渡压到近零，同时保留 animationend 等事件语义 */
    @media (prefers-reduced-motion: reduce) {
      :host,
      :host * {
        animation-delay: 0s !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

  <input class="native" type="range" tabindex="0">
  <span class="track"></span>
  <span class="fill"></span>
  <span class="value-tip">0</span>
  <span class="thumb"></span>

  <script>
    import "../color/st-color-init.js";
    import { syncAccessibleName } from "../a11y/a11y.js";
    import { createFormProxy, syncFormProxy, bindFormReset } from "../form/form-proxy.js";
    export default async () => ({
      tag: "st-slider",
      attrs: {
        min: "0",
        max: "100",
        step: "1",
        defaultValue: null,
        disabled: null,
        color: null,
        name: null,
        form: null,
        required: null,
      },
      data: {
        // value 是运行时状态（ofa data，非标签属性）：attached 时由 default-value 初始化
        value: null,
      },
      watch: {
        value() { this.applyVisual(); },
        color() { this.applyColor(); },
        disabled() { this.applyState(); },
        min() { this.applyState(); },
        max() { this.applyState(); },
        step() { this.applyState(); },
        name() { this.syncForm?.(); },
        form() { this.syncForm?.(); },
        required() { this.syncForm?.(); },
      },
      ready() {
        const ele = this.ele;
        const sr = ele.shadowRoot;
        const input = sr.querySelector(".native");

        // 宿主 value property：读写反射到 ofa data
        Object.defineProperty(ele, "value", {
          get: () => this.value,
          set: (v) => { this.value = String(v); },
        });

        // 表单代理：ofa 自定义元素没有 formAssociated，用 light DOM 原生 range
        // 承担 name/value/required/min/max/step 与 FormData 提交
        const proxy = createFormProxy(ele, "range");
        this._proxy = proxy;
        this.syncForm = () => {
          syncFormProxy(proxy, {
            type: "range",
            name: this.name,
            form: ele.getAttribute("form"),
            value: input.value,
            disabled: this.disabled !== null,
            required: this.required !== null,
            min: input.min,
            max: input.max,
            step: input.step,
          });
          if (this.required !== null) input.setAttribute("aria-required", "true");
          else input.removeAttribute("aria-required");
        };
        this.syncForm();
        proxy.addEventListener("invalid", (e) => {
          e.preventDefault();
          input.setAttribute("aria-invalid", "true");
          ele.dispatchEvent(new Event("invalid", { bubbles: true, composed: true }));
        });

        // 原生 range 承载拖拽与键盘；input 实时反馈，change（松手/键盘提交）单独派发
        input.addEventListener("input", () => {
          this.value = input.value;
          input.removeAttribute("aria-invalid");
          this.syncForm?.();
          ele.dispatchEvent(new Event("input", { bubbles: true, composed: true }));
        });
        input.addEventListener("change", () => {
          ele.dispatchEvent(new Event("change", { bubbles: true, composed: true }));
        });

        // 拖动/聚焦时显示数值气泡（M3 value indicator）
        const activate = () => ele.classList.add("st-active");
        const deactivate = () => ele.classList.remove("st-active");
        input.addEventListener("pointerdown", activate);
        input.addEventListener("pointerup", deactivate);
        input.addEventListener("pointercancel", deactivate);
        input.addEventListener("focus", activate);
        input.addEventListener("blur", deactivate);

        this.applyState();
        this.applyColor();
        this._a11yCleanup = syncAccessibleName(ele, input);
        // 原生 form.reset() 后回到 default-value（缺省时回到 min）
        this._resetCleanup = bindFormReset(ele, () => {
          const dv = ele.getAttribute("default-value");
          const next = dv !== null ? dv : this.min ?? "0";
          this.value = String(next);
          input.value = String(next);
          input.removeAttribute("aria-invalid");
          this.applyVisual();
          this.syncForm?.();
        });
        // 宿主尺寸变化（隐藏→显示、窗口缩放、容器变宽）时重算几何
        this._resizeObserver = new ResizeObserver(() => this.applyVisual());
        this._resizeObserver.observe(ele);
        // setAttribute 的 watch 异步（坑 #18），初始同步一次
        requestAnimationFrame(() => { this.applyState(); this.applyVisual(); });
      },
      detached() {
        this._resizeObserver?.disconnect();
        this._a11yCleanup?.();
        this._resetCleanup?.();
      },
      proto: {
        applyState() {
          const sr = this.ele.shadowRoot;
          const input = sr.querySelector(".native");
          input.min = this.min ?? "0";
          input.max = this.max ?? "100";
          input.step = this.step ?? "1";
          input.disabled = this.disabled !== null;
          if (this.value === null) {
            const dv = this.ele.getAttribute("default-value");
            this.value = dv !== null ? dv : this.min ?? "0";
          }
          this.applyVisual();
        },
        // 按 value 比例布置：fill 宽度与拇指中心（均以轨道内缩区为基准）+ 气泡位置/文本
        applyVisual() {
          const sr = this.ele.shadowRoot;
          const input = sr.querySelector(".native");
          if (this.value !== null) input.value = this.value;
          this.syncForm?.();
          const min = Number(input.min || 0);
          const max = Number(input.max || 100);
          const v = Math.min(Math.max(Number(input.value || min), min), max);
          // max/min 变化后把越界值夹回范围（同时回写 data，el.value 不残留旧值）
          if (this.value !== null && Number(this.value) !== v) this.value = String(v);
          const pct = max > min ? ((v - min) / (max - min)) * 100 : 0;

          // 用布局宽度而不是 getBoundingClientRect：后者含祖先 transform，
          // 且在 display:none 时量到 0；隐藏时直接跳过，等 ResizeObserver 再算
          const hostW = this.ele.clientWidth;
          if (!hostW) return;
          const fontSize = parseFloat(getComputedStyle(this.ele).fontSize) || 14;
          const padPx = 0.714 * fontSize;
          // M3：激活段从轨道左端延伸到拇指中心（fill 有 left 内缩起点，宽度要减去起点）
          const thumbLeft = padPx + (pct / 100) * (hostW - padPx * 2);
          sr.querySelector(".fill").style.width = ((thumbLeft - padPx) / hostW) * 100 + "%";
          const thumb = sr.querySelector(".thumb");
          thumb.style.left = thumbLeft + "px";
          const tip = sr.querySelector(".value-tip");
          tip.style.left = thumbLeft + "px";
          tip.textContent = input.value;
        },
        // color 接受 M3 角色名：设置 --st-slider-main（激活段/拇指/气泡/三角一处联动），
        // 气泡文字恒用 on-primary（气泡底是纯角色色）
        applyColor() {
          const name = this.color;
          this.ele.style.setProperty(
            "--st-slider-main",
            name
              ? `var(--md-sys-color-${name}, var(--${name}, var(--md-sys-color-primary)))`
              : "var(--md-sys-color-primary)"
          );
        },
      },
    });
  </script>
</template>
