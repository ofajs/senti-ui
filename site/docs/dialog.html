                <h3>属性</h3>
                <table class="api">
                  <thead><tr><th>属性</th><th>类型</th><th>默认</th><th>说明</th></tr></thead>

                </table>
              </div>
              <div class="doc-block">
                <h3>插槽 / 事件 / 注意</h3>
                <ul class="api-list"><li>插槽：<code>headline</code> / 默认 / <code>actions</code>；空区块自动隐藏。</li><li>事件：<code>close</code>（composed）；打开时焦点移入面板容器。</li><li>面板样式用 <code>::part(panel)</code> 定制；命令式 <code>alert</code> / <code>confirm</code> / <code>prompt</code> 见 Command tools。</li></ul>
              </div>

        <st-dialog sync:open="dialogOpen" auto-close on:close="dialogOpen = false">
          <h2 slot="headline">删除这个项目？</h2>
          <p>这是文档页里的真实 <code>st-dialog</code>：遮罩、Escape、焦点管理都由组件负责。</p>
          <div slot="actions">
            <st-button variant="text" on:click="dialogOpen = false">取消</st-button>
            <st-button color="error" on:click="dialogOpen = false">删除</st-button>
          </div>
        </st-dialog>
        </div>
      </div>
      <script>
        export const parent = "../layout.html";

        export default async () => ({
          data: {
            selectValue: "",
            dialogOpen: false,
            collapsed: false,
            tab: 0,
            tabLabels: ["概览", "活动", "设置"],
            navTab: 0,
            navLabels: ["首页", "发现", "我的"],
            toolResult: "（未调用）",
          },
          proto: {
            get tabLabel() {
              return this.tabLabels[this.tab] || "";
            },
            get navLabel() {
              return this.navLabels[this.navTab] || "";
            },
            goDoc(id) {
              this.goto("./" + id + ".html");
            },
            onNavigate(e) {
              if (e.target.value) this.goto("./" + e.target.value + ".html");
            },
            onSelect(e) {
              this.selectValue = e.target.value || "";
            },
            runToast() {
              if (!window.__site) return;
              this.toolResult = "toast → 已弹出（3s）";
              window.__site.toast("这是一条 toast。");
            },
            async runAlert() {
              if (!window.__site) return;
              const ok = await window.__site.alert({ title: "操作成功", message: "这是 alert 命令式对话框。", ok: "知道了" });
              this.toolResult = "alert → " + ok;
            },
            async runConfirm() {
              if (!window.__site) return;
              const ok = await window.__site.confirm({ title: "确认删除", message: "确定删除这条记录吗？", yes: "删除", cancel: "取消", color: "error" });
              this.toolResult = "confirm → " + ok;
            },
            async runPrompt() {
              if (!window.__site) return;
              const value = await window.__site.prompt({ title: "重命名", message: "输入新的名称", placeholder: "新名称" });
              this.toolResult = "prompt → " + JSON.stringify(value);
            },
            openCtx(e) {
              e.preventDefault();
              if (!window.__site) return;
              const self = this;
              window.__site.contextMenu(e, [
                { id: "copy", label: "复制", prefix: "⧉" },
                { id: "rename", label: "重命名", prefix: "✏" },
                { separator: true },
                { id: "delete", label: "删除", prefix: "⌫", disabled: true },
              ]).then((id) => { self.toolResult = "contextMenu → " + (id || "未选择"); });
            },
          },
        });
      </script>
