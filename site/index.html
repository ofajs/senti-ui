<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Senti-UI — 语义组件，任意材质</title>
  <meta
    name="description"
    content="Senti-UI 是基于 ofa.js 的 AI-first 组件库：属性只表达语义，外观用原生 CSS，颜色只走 M3，材质可以由皮肤自由替换。无构建，CDN 即用。"
  />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Senti-UI — 语义组件，任意材质" />
  <meta
    property="og:description"
    content="同一批 st-* 组件，同一套 M3 颜色；材质可换（M3 / Apple 毛玻璃 / shadcn），无构建，CDN 即用。"
  />
  <meta name="theme-color" content="#0061A4" />
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230061A4'/%3E%3Ccircle cx='32' cy='32' r='13' fill='white'/%3E%3C/svg%3E"
  />

  <!-- 运行时：ofa.js v5 + scsr 桥接（同一模块内按顺序加载，scsr 必须在 ofa 之后） -->
  <script type="module">
    import "https://cdn.jsdelivr.net/gh/ofajs/ofa.js@refs/heads/v5/dist/ofa.min.mjs";
    import "https://cdn.jsdelivr.net/gh/ofajs/ofa.js@refs/heads/v5/packages/scsr/dist/scsr.min.mjs";
  </script>
  <!-- 首帧主题引导（同步、禁缓存路径由 npm run dev 提供） -->
  <script src="../packages/boot/st-boot.js"></script>

  <!-- 三套材质同时预载：切换零等待，且允许同页并列展示三种材质 -->
  <link rel="stylesheet" href="../packages/skin/m3.css" />
  <link rel="stylesheet" href="../packages/skin/apple.css" />
  <link rel="stylesheet" href="../packages/skin/shadcn.css" />

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
    }
    body {
      font-family: "Inter", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI",
        system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    /* 无 JS 兜底：SCSR 的 template[page] 在脚本执行前是惰性的 */
    .nojs {
      max-width: 720px;
      margin: 0 auto;
      padding: 12vh 24px;
      font-family: system-ui, sans-serif;
      line-height: 1.7;
      color: var(--md-sys-color-on-surface, #1a1c1e);
      background: var(--md-sys-color-surface, #fdfcff);
    }
    .nojs h1 { margin: 0 0 12px; font-size: 40px; letter-spacing: -0.03em; }
    .nojs p { margin: 0 0 16px; color: var(--md-sys-color-on-surface-variant, #43474e); }
    .nojs a { color: var(--md-sys-color-primary, #0061a4); }
  </style>
</head>
<body>
  <!-- 组件按需引入：本页聚合全部组件，故全部预载 -->
  <l-m src="../packages/button/button.html"></l-m>
  <l-m src="../packages/button/button-group.html"></l-m>
  <l-m src="../packages/button/split-button.html"></l-m>
  <l-m src="../packages/button/icon-button.html"></l-m>
  <l-m src="../packages/input/input.html"></l-m>
  <l-m src="../packages/textarea/textarea.html"></l-m>
  <l-m src="../packages/select/select.html"></l-m>
  <l-m src="../packages/dialog/dialog.html"></l-m>
  <l-m src="../packages/checkbox/checkbox.html"></l-m>
  <l-m src="../packages/switch/switch.html"></l-m>
  <l-m src="../packages/radio/radio.html"></l-m>
  <l-m src="../packages/snackbar/snackbar.html"></l-m>
  <l-m src="../packages/slider/slider.html"></l-m>
  <l-m src="../packages/progress/progress.html"></l-m>
  <l-m src="../packages/tooltip/tooltip.html"></l-m>
  <l-m src="../packages/card/card.html"></l-m>
  <l-m src="../packages/badges/badges.html"></l-m>
  <l-m src="../packages/collapse/collapse.html"></l-m>
  <l-m src="../packages/list/list.html"></l-m>
  <l-m src="../packages/menu/menu.html"></l-m>
  <l-m src="../packages/tabs/tab-bar.html"></l-m>
  <l-m src="../packages/navigation/nav-bar.html"></l-m>
  <l-m src="../packages/navigation/nav-layout.html"></l-m>
  <l-m src="../packages/ripple/ripple.html"></l-m>

  <!-- SCSR 契约：完整页面内联在 o-app 的 template[page] 里；
       真实路径 /site/ 即当前文档，scsr 接管后由 o-page 从 URL 收编渲染 -->
  <noscript>
    <div class="nojs">
      <h1>Senti-UI</h1>
      <p>语义组件，任意材质。官网的实时换肤与组件演示需要 JavaScript；文档与源码无需脚本即可查看。</p>
      <p><a href="./docs/index.html">打开组件文档</a> · <a href="https://github.com/ofajs/senti-ui">GitHub</a></p>
    </div>
  </noscript>

  <o-app src="./app-config.js">
    <template page>
        <!-- 局部皮肤预览（data-skin 卡片）需要 shadow 内的样式表：
             文档树里的 [data-skin] 规则进不了 page shadow，而 link 可以 -->
        <link rel="stylesheet" href="../packages/skin/m3.css" />
        <link rel="stylesheet" href="../packages/skin/apple.css" />
        <link rel="stylesheet" href="../packages/skin/shadcn.css" />

        <style>
          :host {
            --site-max: 1180px;
            --gutter: clamp(20px, 4vw, 40px);

            display: block;
            background: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            font-size: 15px;
            line-height: 1.55;
          }
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }
          h1,
          h2,
          h3,
          h4,
          p,
          dl,
          dd,
          pre {
            margin: 0;
          }
          a {
            color: inherit;
          }
          button {
            font: inherit;
          }

          /* ---------- 顶栏 ---------- */
          .top {
            position: sticky;
            top: 0;
            z-index: 40;
            background: color-mix(in srgb, var(--md-sys-color-surface) 82%, transparent);
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
            -webkit-backdrop-filter: blur(16px) saturate(150%);
            backdrop-filter: blur(16px) saturate(150%);
          }
          .top-inner {
            max-width: var(--site-max);
            margin: 0 auto;
            padding: 12px var(--gutter);
            display: flex;
            align-items: center;
            gap: 20px;
          }
          .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--md-sys-color-on-surface);
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -0.03em;
            cursor: pointer;
          }
          .brand-mark {
            width: 26px;
            height: 26px;
            border-radius: 9px;
            background: linear-gradient(140deg, var(--md-sys-color-primary), var(--md-sys-color-tertiary));
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--md-sys-color-on-primary) 18%, transparent);
            flex: none;
          }
          .brand-accent {
            color: var(--md-sys-color-primary);
          }
          .top-nav {
            display: flex;
            align-items: center;
            gap: 2px;
            margin-left: auto;
          }
          .nav-link {
            padding: 7px 12px;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 13px;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease;
          }
          .nav-link:hover {
            background: color-mix(in srgb, currentColor 9%, transparent);
            color: var(--md-sys-color-on-surface);
          }
          .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
          }
          .top-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 34px;
            padding: 0 12px;
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: 999px;
            background: transparent;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 12px;
            text-decoration: none;
            white-space: nowrap;
            cursor: pointer;
            transition: color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
          }
          .top-btn:hover {
            color: var(--md-sys-color-on-surface);
            border-color: var(--md-sys-color-outline);
            background: var(--md-sys-color-surface-container-low);
          }
          .top-btn-strong {
            border-color: transparent;
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
          }
          .top-btn-strong:hover {
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border-color: transparent;
            filter: brightness(1.08);
          }

          /* ---------- 通用版式 ---------- */
          main {
            background:
              radial-gradient(900px 520px at 12% -6%, color-mix(in srgb, var(--md-sys-color-primary-container) 52%, transparent), transparent 70%),
              radial-gradient(760px 460px at 96% 6%, color-mix(in srgb, var(--md-sys-color-tertiary-container) 46%, transparent), transparent 70%);
          }
          .section {
            max-width: var(--site-max);
            margin: 0 auto;
            padding: clamp(56px, 7vw, 88px) var(--gutter);
            scroll-margin-top: 86px;
          }
          .section + .section {
            border-top: 1px solid var(--md-sys-color-outline-variant);
          }
          .section-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 32px;
            margin-bottom: 28px;
          }
          .section-kicker {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--md-sys-color-primary);
          }
          .section h2 {
            margin-top: 8px;
            font-size: clamp(28px, 3.6vw, 40px);
            line-height: 1.1;
            letter-spacing: -0.035em;
          }
          .section-desc {
            max-width: 460px;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 13.5px;
            line-height: 1.75;
          }

          /* ---------- Hero ---------- */
          .hero {
            max-width: var(--site-max);
            margin: 0 auto;
            padding: clamp(48px, 7vw, 80px) var(--gutter) clamp(40px, 5vw, 56px);
            display: grid;
            grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
            gap: clamp(32px, 5vw, 64px);
            align-items: center;
            scroll-margin-top: 80px;
          }
          .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 12px;
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: 999px;
            background: color-mix(in srgb, var(--md-sys-color-surface-container-low) 70%, transparent);
            color: var(--md-sys-color-on-surface-variant);
            font-size: 11px;
            letter-spacing: 0.04em;
          }
          .eyebrow .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--md-sys-color-success);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--md-sys-color-success) 18%, transparent);
          }
          .hero h1 {
            margin: 18px 0 0;
            font-size: clamp(44px, 6.6vw, 76px);
            line-height: 0.98;
            letter-spacing: -0.045em;
            font-weight: 800;
          }
          .grad {
            background: linear-gradient(100deg, var(--md-sys-color-primary), var(--md-sys-color-tertiary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
          }
          .lead {
            max-width: 520px;
            margin-top: 22px;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 16px;
            line-height: 1.75;
          }
          .lead code {
            font-family: ui-monospace, Menlo, monospace;
            font-size: 0.92em;
            padding: 1px 5px;
            border-radius: 5px;
            background: var(--md-sys-color-surface-container);
            color: var(--md-sys-color-primary);
          }
          .cta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 28px;
          }
          .stats {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            margin-top: 38px;
            padding-top: 22px;
            border-top: 1px solid var(--md-sys-color-outline-variant);
          }
          .stats dt {
            font-size: 24px;
            font-weight: 750;
            letter-spacing: -0.03em;
          }
          .stats dd {
            margin-top: 2px;
            font-size: 11px;
            color: var(--md-sys-color-on-surface-variant);
          }

          .hero-side {
            display: grid;
            gap: 14px;
          }
          .skin-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
          }
          .skin-row-label {
            margin-right: 2px;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
          }
          .skin-pick {
            font-size: 12px;
            height: 32px;
            padding: 0 14px;
          }
          .preview {
            display: grid;
            gap: 13px;
            padding: clamp(20px, 3vw, 28px);
            border: 1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 85%, transparent);
            border-radius: 26px;
            background: color-mix(in srgb, var(--md-sys-color-surface-container-high) 74%, transparent);
            box-shadow:
              0 30px 60px -34px rgb(0 0 0 / 0.4),
              0 1px 0 color-mix(in srgb, var(--md-sys-color-on-surface) 5%, transparent) inset;
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            backdrop-filter: blur(18px) saturate(140%);
            overflow: visible;
          }
          .preview-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
          }
          .live {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.14em;
            color: var(--md-sys-color-on-surface-variant);
          }
          .live i {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--md-sys-color-success);
            animation: live-pulse 2.2s ease-in-out infinite;
          }
          @keyframes live-pulse {
            50% {
              opacity: 0.35;
            }
          }
          .preview-chip {
            padding: 3px 9px;
            border-radius: 999px;
            background: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-on-secondary-container);
            font-family: ui-monospace, Menlo, monospace;
            font-size: 10px;
          }
          .preview-title {
            margin-top: 2px;
            font-size: 24px;
            letter-spacing: -0.03em;
          }
          .preview-sub {
            color: var(--md-sys-color-on-surface-variant);
            font-size: 12.5px;
          }
          .field {
            display: grid;
            gap: 6px;
          }
          .field-label {
            color: var(--md-sys-color-on-surface-variant);
            font-size: 11px;
            letter-spacing: 0.03em;
          }
          .field st-input {
            width: 100%;
          }
          .preview-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
          }
          .preview-row st-switch {
            font-size: 13px;
          }
          .block {
            width: 100%;
          }
          .preview-foot {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 11.5px;
          }
          .preview-hint {
            color: var(--md-sys-color-on-surface-variant);
            font-size: 11px;
            text-align: center;
          }

          /* ---------- 理念 ---------- */
          .principles {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
          }
          .principle {
            display: grid;
            align-content: start;
            gap: 9px;
            padding: 22px;
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: 20px;
            background: color-mix(in srgb, var(--md-sys-color-surface-container-low) 65%, transparent);
          }
          .principle .num {
            font-family: ui-monospace, Menlo, monospace;
            font-size: 11px;
            color: var(--md-sys-color-primary);
          }
          .principle h3 {
            font-size: 15px;
            letter-spacing: -0.01em;
          }
          .principle p {
            color: var(--md-sys-color-on-surface-variant);
            font-size: 12.5px;
            line-height: 1.7;
          }

          /* ---------- 组件展柜 ---------- */
          .specs {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            gap: 14px;
          }
          .spec {
            grid-column: span 4;
            padding: 18px 20px 20px;
            border-radius: 20px;
            transition: border-color 0.18s ease, background-color 0.18s ease;
          }
          .spec:hover {
            border-color: color-mix(in srgb, var(--md-sys-color-primary) 45%, var(--md-sys-color-outline-variant));
          }
          .spec.half {
            grid-column: span 6;
          }
          .spec.wide {
            grid-column: span 12;
          }
          .spec-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
          }
          .spec-head h3 {
            font-size: 14px;
            letter-spacing: -0.01em;
          }
          .tag {
            padding: 2px 8px;
            border-radius: 999px;
            background: var(--md-sys-color-surface-container-high);
            color: var(--md-sys-color-on-surface-variant);
            font-family: ui-monospace, Menlo, monospace;
            font-size: 10px;
            white-space: nowrap;
          }
          .spec-body {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 9px;
          }
          .spec-body.col {
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
          }
          .spec-note {
            margin-top: 12px;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 11.5px;
            line-height: 1.65;
          }
          .spec-note code,
          .mono {
            font-family: ui-monospace, Menlo, monospace;
            font-size: 0.94em;
          }
          .spec-note code {
            padding: 1px 4px;
            border-radius: 4px;
            background: var(--md-sys-color-surface-container-high);
          }
          .ripple-tile {
            position: relative;
            display: grid;
            place-items: center;
            width: 100%;
            height: 62px;
            border-radius: 14px;
            overflow: hidden;
            background: color-mix(in srgb, var(--md-sys-color-primary) 13%, var(--md-sys-color-surface));
            color: var(--md-sys-color-primary);
            font-size: 12.5px;
            cursor: pointer;
            user-select: none;
          }
          .ctx-tile {
            display: grid;
            place-items: center;
            width: 100%;
            min-height: 54px;
            padding: 10px;
            border: 1px dashed var(--md-sys-color-outline);
            border-radius: 12px;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 11.5px;
            text-align: center;
            cursor: context-menu;
            user-select: none;
          }
          .result {
            margin-top: 10px;
            color: var(--md-sys-color-on-surface-variant);
            font-family: ui-monospace, Menlo, monospace;
            font-size: 11px;
            overflow-wrap: anywhere;
          }
          .snackbar-stage st-snackbar {
            position: static;
            width: 100%;
          }
          .tool-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
          }
          .progress-row {
            display: flex;
            align-items: center;
            gap: 12px;
          }
          .progress-row > span {
            width: 4.2em;
            flex: none;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 11px;
          }
          .progress-row st-progress {
            flex: 1;
          }
          .mini-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
          }
          .mini-card {
            display: grid;
            gap: 3px;
            padding: 14px;
            border-radius: 14px;
            font-size: 12px;
          }
          .mini-card strong {
            font-size: 12.5px;
          }
          .mini-card span {
            color: var(--md-sys-color-on-surface-variant);
            font-size: 10.5px;
          }
          .site-list {
            width: 100%;
          }
          .tabs-panel {
            margin-top: 2px;
            padding: 12px 14px;
            border-radius: 12px;
            background: var(--md-sys-color-surface-container-low);
            color: var(--md-sys-color-on-surface-variant);
            font-size: 12px;
          }
          .nav-layout {
            height: 320px;
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: 18px;
            overflow: hidden;
          }
          .nav-layout-body {
            display: grid;
            align-content: start;
            gap: 6px;
            height: 100%;
            padding: 22px;
            background: var(--md-sys-color-surface-container-lowest);
          }
          .nav-layout-body h4 {
            font-size: 15px;
          }
          .nav-layout-body p {
            color: var(--md-sys-color-on-surface-variant);
            font-size: 12px;
            line-height: 1.7;
          }
          .rail-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;

        <st-dialog sync:open="dialogOpen" auto-close on:close="dialogOpen = false">
          <h2 slot="headline">删除这个项目？</h2>
          <p>这是一个真实的 <span class="mono">st-dialog</span>。面板、遮罩、入场动效、焦点管理都由组件负责。</p>
          <p style="margin-top: 8px; color: var(--md-sys-color-on-surface-variant);">
            按 Escape 或点击遮罩也可以关闭。
          </p>
          <div slot="actions">
            <st-button variant="text" on:click="dialogOpen = false">取消</st-button>
            <st-button color="error" on:click="confirmDelete">删除</st-button>
          </div>
        </st-dialog>

        <script>
          export const parent = "./layout.html";

          export default async () => ({
            data: {
              remember: true,
              agree: true,
              notify: true,
              plan: "pro",
              fruit: "",
              volume: "64",
              dialogOpen: false,
              tipOpen: false,
              collapsed: false,
              tab: 0,
              tabLabels: ["概览", "活动", "设置"],
              navTab: 0,
              navLabels: ["首页", "发现", "我的"],
              railTab: 0,
              railLabels: ["概览", "组件", "材质"],
              lastAction: "（还没有操作）",
              lastTool: "（未调用）",
              ctxResult: "（未选择）",
              copied: false,
              installCode:
                '\x3Cscript src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@refs/heads/v5/dist/ofa.min.mjs" type="module">\x3C/script>\n' +
                '\x3Cscript src="https://cdn.jsdelivr.net/gh/ofajs/senti-ui/packages/boot/st-boot.js">\x3C/script>\n' +
                '\x3Cl-m src="https://cdn.jsdelivr.net/gh/ofajs/senti-ui/packages/button/button.html">\x3C/l-m>\n\n' +
                '\x3Cst-button color="error">Delete\x3C/st-button>',
            },
            proto: {
              get tabLabel() {
                return this.tabLabels[this.tab] || "";
              },
              get navLabel() {
                return this.navLabels[this.navTab] || "";
              },
              get railLabel() {
                return this.railLabels[this.railTab] || "";
              },
              toast(message) {
                if (window.__site) window.__site.toast(message);
              },
              jump(id) {
                const target = this.ele.shadowRoot.getElementById(id);
                if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
              },
              goTop() {
                window.scrollTo({ top: 0, behavior: "smooth" });
              },
              goDocs() {
                this.goto("./docs/index.html");
              },
              openRepo() {
                window.open("https://github.com/ofajs/senti-ui", "_blank", "noopener");
              },
              fakeLogin() {
                this.toast("登录成功（演示）");
              },
              forgot() {
                this.toast("重置邮件已发送（演示）");
              },
              openDlg() {
                this.dialogOpen = true;
              },
              confirmDelete() {
                this.dialogOpen = false;
                this.toast("已删除（演示）");
              },
              menuPick(label) {
                this.lastAction = label;
                this.toast("菜单：已选择「" + label + "」");
              },
              splitAction() {
                this.toast("主操作：发送");
              },
              splitPick(label) {
                this.lastAction = label;
                this.toast("已选择「" + label + "」");
              },
              showUndo() {
                this.toast("已撤销（演示）");
              },
              listPick(label) {
                this.toast("列表项：" + label);
              },
              toggleCollapse() {
                this.collapsed = !this.collapsed;
              },
              fruitChange(e) {
                this.fruit = e.target.value || "";
              },
              volumeChange(e) {
                this.volume = String(e.target.value);
              },
              async runToast() {
                if (!window.__site) return;
                this.lastTool = "toast → 已弹出（3s）";
                await window.__site.toast("这是一条 toast，3 秒后自动消失");
              },
              async runAlert() {
                if (!window.__site) return;
                const ok = await window.__site.alert({
                  title: "操作成功",
                  message: "密码已重置，请使用新密码登录。",
                  ok: "知道了",
                });
                this.lastTool = "alert → " + ok;
              },
              async runConfirm() {
                if (!window.__site) return;
                const ok = await window.__site.confirm({
                  title: "确认删除",
                  message: "确定要删除用户 bob 吗？此操作不可撤销。",
                  yes: "删除",
                  cancel: "取消",
                  color: "error",
                });
                this.lastTool = "confirm → " + ok;
              },
              async runPrompt() {
                if (!window.__site) return;
                const value = await window.__site.prompt({
                  title: "重置密码",
                  message: "为用户 bob 设置新密码（至少 4 位）",
                  placeholder: "请输入新密码",
                });
                this.lastTool = "prompt → " + JSON.stringify(value);
              },
              openCtx(e) {
                e.preventDefault();
                if (!window.__site) return;
                const self = this;
                window.__site
                  .contextMenu(e, [
                    { id: "copy", label: "复制", prefix: "⧉" },
                    { id: "rename", label: "重命名", prefix: "✏" },
                    { separator: true },
                    {
                      id: "delete",
                      label: "删除",
                      prefix: "⌫",
                      disabled: true,
                    },
                  ])
                  .then((id) => {
                    self.ctxResult = id || "未选择";
                  });
              },
              async copyCode() {
                try {
                  await navigator.clipboard.writeText(this.installCode);
                  this.copied = true;
                  this.toast("安装代码已复制");
                  setTimeout(() => {
                    this.copied = false;
                  }, 1800);
                } catch {
                  this.toast("复制失败，请手动选择代码");
                }
              },
            },
          });
        </script>
    </template>
  </o-app>

  <!-- 页面模块内不能相对 import（ofa 页面模块经 eval 执行），
       命令式工具与皮肤/主题 API 在这里预加载并挂到 window，页面模块轮询就绪 -->
  <script type="module">
    import { setThemeMode, getThemeMode } from "../packages/color/st-theme-mode.js";
    import { setSkin, getSkin } from "../packages/skin/st-skin.js";
    import alert from "../packages/dialog/alert.js";
    import confirm from "../packages/dialog/confirm.js";
    import prompt from "../packages/dialog/prompt.js";
    import toast from "../packages/snackbar/toast.js";
    import contextMenu from "../packages/menu/context-menu.js";

    window.__site = {
      setThemeMode,
      getThemeMode,
      setSkin,
      getSkin,
      alert,
      confirm,
      prompt,
      toast,
      contextMenu,
    };
    window.__siteReady = true;
  </script>
</body>
</html>
