              <h1>Card <code>st-card</code></h1>
              <p class="doc-lead">卡片容器：elevated / filled / outlined 三种类型，内容用默认插槽自由组合。interactive 让整卡可点并带波纹、hover 抬升与键盘焦点环。</p>
              <div class="doc-links">
                <a href="../index.html">组件目录</a>
                <a href="https://github.com/ofajs/senti-ui/blob/main/packages/card/README.md" target="_blank" rel="noreferrer">GitHub README <iconify-icon icon="mdi:open-in-new"></iconify-icon></a>
              </div>
            </header>

            <section class="doc-section">
              <h2>三种 variant</h2>
              <p class="doc-section-lead">elevated 用 level 1 阴影，filled 用更深的容器底色，outlined 用描边与透明底。三者共享同一套 em 尺寸，只改变材质。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>variant</code></div>
                <div class="demo-stage grid">
                  <div class="demo-cell">
                    <span class="demo-label">elevated（默认）</span>
                    <st-card style="width: 100%;">
                      <strong style="font-size: 14px;">Elevated</strong>
                      <p style="margin: 6px 0 0; font-size: 12px; line-height: 1.65; color: var(--md-sys-color-on-surface-variant);">level 1 阴影 + surface-container-low 底色，适合页面主内容块。</p>
                    </st-card>
                  </div>
                  <div class="demo-cell">
                    <span class="demo-label">filled</span>
                    <st-card variant="filled" style="width: 100%;">
                      <strong style="font-size: 14px;">Filled</strong>
                      <p style="margin: 6px 0 0; font-size: 12px; line-height: 1.65; color: var(--md-sys-color-on-surface-variant);">surface-container-highest 底色、无阴影，适合并列的信息卡。</p>
                    </st-card>
                  </div>
                  <div class="demo-cell">
                    <span class="demo-label">outlined</span>
                    <st-card variant="outlined" style="width: 100%;">
                      <strong style="font-size: 14px;">Outlined</strong>
                      <p style="margin: 6px 0 0; font-size: 12px; line-height: 1.65; color: var(--md-sys-color-on-surface-variant);">outline-variant 描边、透明底，最轻量，适合密集列表。</p>
                    </st-card>
                  </div>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码</summary>
                <pre><code>&lt;st-card&gt;
  &lt;strong&gt;Elevated&lt;/strong&gt;
  &lt;p&gt;默认类型，level 1 阴影。&lt;/p&gt;
&lt;/st-card&gt;

&lt;st-card variant="filled"&gt;...&lt;/st-card&gt;
&lt;st-card variant="outlined"&gt;...&lt;/st-card&gt;</code></pre>
              </details>

            <section class="doc-section">
              <h2>interactive：整卡可点</h2>
              <p class="doc-section-lead">加 interactive 后整张卡成为按钮：hover 抬升、按下有波纹，Tab 可聚焦、Enter / Space 可激活。选择类场景用一张卡表达一个选项。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>interactive + click</code></div>
                <div class="demo-stage grid">
                  <st-card interactive on:click="pick('基础版')" style="width: 100%;">
                    <strong style="font-size: 14px;">基础版</strong>
                    <p style="margin: 6px 0 10px; font-size: 12px; line-height: 1.65; color: var(--md-sys-color-on-surface-variant);">个人项目与原型验证，包含 1 个工作区。</p>
                    <span style="font-size: 11px; color: var(--md-sys-color-primary);">{{picked === '基础版' ? '✓ 已选择' : '点击选择'}}</span>
                  </st-card>
                  <st-card interactive on:click="pick('团队版')" style="width: 100%;">
                    <strong style="font-size: 14px;">团队版</strong>
                    <p style="margin: 6px 0 10px; font-size: 12px; line-height: 1.65; color: var(--md-sys-color-on-surface-variant);">多人协作与权限管理，包含 10 个工作区。</p>
                    <span style="font-size: 11px; color: var(--md-sys-color-primary);">{{picked === '团队版' ? '✓ 已选择' : '点击选择'}}</span>
                  </st-card>
                  <st-card interactive on:click="pick('企业版')" style="width: 100%;">

                    <span style="font-size: 11px; color: var(--md-sys-color-primary);">{{picked === '企业版' ? '✓ 已选择' : '点击选择'}}</span>

    },
  });
&lt;/script&gt;</code></pre>
