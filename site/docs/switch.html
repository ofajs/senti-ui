              <h1>Switch <code>st-switch</code></h1>
              <p class="doc-lead">开关：轨道、拇指弹性位移与对勾动画共同表达开合。checked / disabled / color 三个语义属性，适合设置项与即时生效的偏好开关。</p>
              <div class="doc-links">
                <a href="../index.html">组件目录</a>
                <a href="https://github.com/ofajs/senti-ui/blob/main/packages/switch/README.md" target="_blank" rel="noreferrer">GitHub README <iconify-icon icon="mdi:open-in-new"></iconify-icon></a>
              </div>
            </header>

            <section class="doc-section">
              <h2>基础状态</h2>
              <p class="doc-section-lead">无属性为关闭，<code>checked</code> 为开启；disabled 阻断交互并降低透明度。它与 checkbox 的区别是语义：开关表示立即生效的设置，不需要再点保存。</p>
              <div class="demo">
                <div class="demo-top">
                  <span class="live"><i></i>{{codeView.demo1 ? 'CODE' : 'LIVE'}}</span>
                  <div class="demo-top-actions">
                    <code>st-switch</code>
                    <st-button class="demo-code-toggle" variant="text" on:click="toggleCode('demo1')">
                      <iconify-icon slot="prefix" attr:icon="codeView.demo1 ? 'mdi:eye-outline' : 'mdi:code-tags'"></iconify-icon>
                      {{codeView.demo1 ? '查看示例' : '查看代码'}}
                    </st-button>
                  </div>
                </div>
                <div class="demo-stage" attr:hidden="codeView.demo1">
                  <st-switch>关闭</st-switch>
                  <st-switch checked>开启</st-switch>
                  <st-switch disabled>禁用关闭</st-switch>
                  <st-switch disabled checked>禁用开启</st-switch>
                  <st-switch></st-switch>
                </div>

                <st-code class="demo-code" attr:hidden="!codeView.demo1" lang="html" :code="demo1Code"></st-code>
              </div>
            </section>

            <section class="doc-section">
              <h2>color 语义色</h2>
              <p class="doc-section-lead"><code>color</code> 只改变开启态的轨道色，拇指自动使用对应的 on-角色色以保证对比度。未选中态始终是 outline / surface 系，不随 color 变化。</p>
              <div class="demo">
                <div class="demo-top">
                  <span class="live"><i></i>{{codeView.demo2 ? 'CODE' : 'LIVE'}}</span>
                  <div class="demo-top-actions">
                    <code>color</code>
                    <st-button class="demo-code-toggle" variant="text" on:click="toggleCode('demo2')">
                      <iconify-icon slot="prefix" attr:icon="codeView.demo2 ? 'mdi:eye-outline' : 'mdi:code-tags'"></iconify-icon>
                      {{codeView.demo2 ? '查看示例' : '查看代码'}}
                    </st-button>
                  </div>
                </div>
                <div class="demo-stage" attr:hidden="codeView.demo2">
                  <st-switch color="primary" checked>primary</st-switch>
                  <st-switch color="secondary" checked>secondary</st-switch>
                  <st-switch color="tertiary" checked>tertiary</st-switch>
                  <st-switch color="error" checked>error</st-switch>
                  <st-switch color="success" checked>success</st-switch>
                </div>

                <st-code class="demo-code" attr:hidden="!codeView.demo2" lang="html" :code="demo2Code"></st-code>
              </div>
            </section>

            <section class="doc-section">

                <div class="demo-top">
                  <span class="live"><i></i>{{codeView.demo3 ? 'CODE' : 'LIVE'}}</span>
                  <div class="demo-top-actions">

                      <iconify-icon slot="prefix" attr:icon="codeView.demo3 ? 'mdi:eye-outline' : 'mdi:code-tags'"></iconify-icon>
                      {{codeView.demo3 ? '查看示例' : '查看代码'}}

                  </div>
                </div>

                  <span class="demo-note">通知：{{notify ? '开启' : '关闭'}} · 自动同步：{{autoSync ? '开启' : '关闭'}} · change {{changeCount}} 次 · 最近{{lastState}}</span>
                </div>

                <st-code class="demo-code" attr:hidden="!codeView.demo3" lang="html" :code="demo3Code"></st-code>
              </div>
            </section>

                <table class="api">
                  <thead><tr><th>属性</th><th>类型</th><th>默认</th><th>说明</th></tr></thead>

                    <tr><td><code>checked</code></td><td>boolean</td><td>无</td><td>开启态；点击自动同步</td></tr>
                    <tr><td><code>disabled</code></td><td>boolean</td><td>无</td><td>0.38 透明度，阻断交互</td></tr>
                    <tr><td><code>color</code></td><td>M3 角色名 / 自定义变量名</td><td>无</td><td>开启态轨道色，拇指自动用 on-角色色</td></tr>
                  </tbody>
                </table>
              </div>
              <div class="doc-block">
                <h3>插槽 / 事件 / 注意</h3>
                <ul class="api-list">
                  <li>插槽：默认插槽是标签文字或 emoji；为空时文字区自动隐藏。</li>
                  <li>事件：<code>change</code>（bubbles + composed），触发时 checked 属性已同步。</li>
                  <li>布尔属性用 <code>attr:checked="expr"</code>；不要用 <code>:checked</code>。</li>
                  <li><code>color</code> 只影响开启态，未选中态恒为 outline / surface。</li>
                  <li>不要用外部 CSS 强改拇指尺寸或边框宽度：实心底靠 border-width 扩展实现。</li>
                </ul>
              </div>

toUpdate = !autoUpdate\"></st-switch>\n                    </div>\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0;\">\n                      <div style=\"display: grid; gap: 2px; text-align: left;\">\n                        <span style=\"font-size: 13px;\">省电模式</span>\n                        <span style=\"font-size: 11px; color: var(--md-sys-color-on-surface-variant);\">降低后台活动频率</span>\n                      </div>\n                      <st-switch attr:checked=\"saver\" on:change=\"saver = !saver\"></st-switch>\n                    </div>\n                  </div>\n                  <span class=\"demo-note\">Wi-Fi {{wifi ? '开' : '关'}} · 蓝牙 {{bluetooth ? '开' : '关'}} · 自动更新 {{autoUpdate ? '开' : '关'}} · 省电 {{saver ? '开' : '关'}}</span>",
