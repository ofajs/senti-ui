<!-- st-snackbar 验收页：直接展示组件形态，无需 JS 触发 -->
<template page>
  <style>
    :host { display: grid; gap: 24px; padding: 40px; align-content: start; }
    h3 { margin: 0; font-size: 14px; color: var(--md-sys-color-on-surface-variant); }
    st-snackbar { position: static; }
  </style>

  <h3>基础（默认 secondary 主题次级色）</h3>
  <st-snackbar open>
    已删除 1 个项目
    <st-button slot="action" variant="text" color="inverse-primary">撤销</st-button>
  </st-snackbar>

  <h3>color 属性 — M3 角色（primary / secondary / tertiary / error / success）</h3>
  <st-snackbar open color="primary">primary：主题主色消息</st-snackbar>
  <st-snackbar open color="secondary">secondary：主题次级色消息</st-snackbar>
  <st-snackbar open color="tertiary">tertiary：主题三级色消息</st-snackbar>
  <st-snackbar open color="error">
    error：操作失败，请重试
    <st-button slot="action" variant="text" color="on-error">重试</st-button>
  </st-snackbar>
  <st-snackbar open color="success">success：保存成功</st-snackbar>

  <h3>长文本（超宽自动换行，最大 480px）</h3>
  <st-snackbar open>
    这是一条很长的消息：网络连接已断开，正在尝试重新连接，请稍候片刻。系统会在恢复后自动同步你的数据。
  </st-snackbar>

  <h3>纯 style 定制（原生 CSS 属性，自由换色）</h3>
  <st-snackbar open style="border-radius: 999px; background: var(--md-sys-color-error); color: var(--md-sys-color-on-error);">
    胶囊形 + error 角色色
  </st-snackbar>
</template>
