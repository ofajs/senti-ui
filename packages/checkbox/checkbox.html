<!--
  st-checkbox — Senti-UI 复选框组件（基于 ofa.js）
  语义属性：checked / indeterminate / disabled / color（M3 角色名）
  视觉默认值全用 em（宿主改 font-size 等比缩放），尺寸类可直接用原生 CSS 属性覆盖，见 README.md
-->
<template component>
  <style>
    :host {
      display: inline-flex;
      align-items: center;
      position: relative;
      font-size: var(--st-font-size, 14px);
      font-family: var(--st-font, inherit);
      line-height: 1.4;
      vertical-align: middle;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    :host([disabled]) {
      cursor: not-allowed;
      opacity: var(--st-disabled-opacity, 0.38);
    }

    .box {
      box-sizing: border-box;
      position: relative;
      width: 1.571em; /* 22px */
      height: 1.571em;
      flex-shrink: 0;
      border: var(--st-checkbox-border-width, 0.143em) solid var(--md-sys-color-on-surface-variant);
      border-radius: var(--st-checkbox-radius, 0.286em);
      display: grid;
      place-items: center;
      color: var(--md-sys-color-on-primary);
      transition: background-color var(--st-motion-duration, 0.16s) ease,
        border-color var(--st-motion-duration, 0.16s) ease;
    }
    /* 选中/不确定态底色由 applyColor 按 color 属性写内联样式（无 color 属性时用默认 primary） */
    :host([checked]) .box,
    :host([indeterminate]) .box {
      border-color: var(--st-checkbox-checked-bg, var(--md-sys-color-primary));
      background: color-mix(
        in srgb,
        var(--st-checkbox-checked-bg, var(--md-sys-color-primary)) var(--st-checkbox-fill-alpha, 100%),
        transparent
      );
      -webkit-backdrop-filter: var(--st-checkbox-backdrop-filter, none);
      backdrop-filter: var(--st-checkbox-backdrop-filter, none);
    }

    /* 对勾：stroke-dash 描边入场 */
    .checkmark {
      opacity: 0;
    }
    :host([checked]) .checkmark { opacity: 1; }
    :host([indeterminate]) .checkmark { opacity: 0; }
    .checkmark path {
      stroke-dasharray: 26;
      stroke-dashoffset: 26;
    }
    :host([checked]) .checkmark path {
      animation: st-cb-draw var(--st-motion-duration, 0.16s) ease-out forwards;
      animation-delay: 0.1s;
    }
    @keyframes st-cb-draw { to { stroke-dashoffset: 0; } }

    /* 不确定态横线 */
    .dash {
      position: absolute;
      width: 0.714em;
      height: 0.143em;
      border-radius: 0.143em;
      background: currentColor;
      opacity: 0;
      transition: opacity var(--st-motion-duration, 0.15s) ease;
    }
    :host([indeterminate]) .dash { opacity: 1; }

    .label {
      display: none;
      margin-left: 0.857em; /* 12px */
    }
    :host([has-label]) .label { display: inline; }

    /* 内部透明原生 checkbox：承载点击/键盘/焦点语义，覆盖整个组件（点文字也能切换） */
    .native {
      all: unset;
      position: absolute;
      inset: 0;
      z-index: 2; /* 盖住 position:relative 的兄弟元素，保证点击/键盘都落在语义元素上 */
      cursor: inherit;
    }
    .native:focus-visible ~ .box {
      /* 焦点圈用 on-surface（与页面背景有对比，坑 #11） */
      outline: var(--st-focus-ring-width, 2px) var(--st-focus-ring-style, solid)
        var(--st-focus-ring-color, var(--md-sys-color-on-surface));
      outline-offset: var(--st-focus-ring-offset, 2px);
    }

    l-m { display: none; }

    /* 减少动态效果：动画/过渡压到近零，同时保留 animationend 等事件语义 */
    @media (prefers-reduced-motion: reduce) {
      :host,
      :host * {
        animation-delay: 0s !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

  <input class="native" type="checkbox" tabindex="0">
  <span class="box">
    <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" d="M5 11l6 6l10 -10"/>
    </svg>
    <span class="dash"></span>
  </span>
  <span class="label"><slot></slot></span>

  <script>
    import "../color/st-color-init.js";
    import { syncAccessibleName } from "../a11y/a11y.js";
    import { createFormProxy, syncFormProxy, bindFormReset } from "../form/form-proxy.js";
    export default async () => ({
      tag: "st-checkbox",
      attrs: {
        checked: null,
        indeterminate: null,
        disabled: null,
        color: null,
        name: null,
        value: "on",
        form: null,
        required: null,
      },
      watch: {
        checked() { this.applyState(); },
        indeterminate() { this.applyState(); },
        disabled() { this.applyState(); },
        color() { this.applyState(); },
        name() { this.syncForm?.(); },
        form() { this.syncForm?.(); },
        value() { this.syncForm?.(); },
        required() { this.syncForm?.(); },
      },
      ready() {
        const ele = this.ele;
        const sr = ele.shadowRoot;
        const input = sr.querySelector(".native");

        // 交互：原生 input 承载点击与键盘（Space），变更后反射回宿主属性并派发 change
        input.addEventListener("change", () => {
          if (input.checked) ele.setAttribute("checked", "");
          else ele.removeAttribute("checked");
          // 用户交互即退出不确定态
          ele.removeAttribute("indeterminate");
          if (this._proxy) this._proxy.checked = input.checked;
          input.removeAttribute("aria-invalid");
          ele.dispatchEvent(new Event("change", { bubbles: true, composed: true }));
        });

        // 标签文字是 slot 内容、与原生 input 是兄弟节点，必须同步为可访问名称
        this._a11yCleanup = syncAccessibleName(ele, input, { fromSlot: true });

        // 表单代理是 light DOM 子节点，会破坏 :host(:empty)；用 has-label 显式判断
        const labelSlot = sr.querySelector(".label slot");
        const syncLabel = () => {
          const has = labelSlot
            .assignedNodes()
            .some((node) => node.nodeType === 1 || (node.nodeType === 3 && node.textContent.trim()));
          ele.toggleAttribute("has-label", has);
        };
        labelSlot.addEventListener("slotchange", syncLabel);
        syncLabel();

        const proxy = createFormProxy(ele, "checkbox");
        this._proxy = proxy;
        this.syncForm = () => {
          syncFormProxy(proxy, {
            name: this.name,
            form: ele.getAttribute("form"),
            value: this.value ?? "on",
            // 原生 indeterminate 只是视觉态，checked 仍为 false，不参与提交；
            // 代理若把它当 checked 会把未选中的值提交进 FormData。
            checked: this.checked !== null,
            disabled: this.disabled !== null,
            required: this.required !== null,
          });
        };
        this.syncForm();
        proxy.addEventListener("invalid", (e) => {
          e.preventDefault();
          input.setAttribute("aria-invalid", "true");
          ele.dispatchEvent(new Event("invalid", { bubbles: true, composed: true }));
        });
        const initialChecked = this.checked !== null;
        this._resetCleanup = bindFormReset(ele, () => {
          if (initialChecked) ele.setAttribute("checked", "");
          else ele.removeAttribute("checked");
          this.applyState();
        });

        this.applyState();
      },
      detached() {
        this._a11yCleanup?.();
        this._resetCleanup?.();
      },
      proto: {
        // 把 checked/indeterminate/disabled/color 状态应用到内部结构。
        // watch 初始化也会以初始值触发一次（坑 #27），applyState 无副作用，天然安全
        applyState() {
          const ele = this.ele;
          const sr = ele.shadowRoot;
          const input = sr.querySelector(".native");
          const box = sr.querySelector(".box");
          const on = this.checked !== null || this.indeterminate !== null;

          input.checked = this.checked !== null;
          // 原生 mixed 态：读屏器据此播报“部分选中”，表单语义仍是未选中
          input.indeterminate = this.indeterminate !== null;
          input.disabled = this.disabled !== null;
          this.syncForm?.();

          const name = this.color;
          if (on) {
            const main = name
              ? `var(--md-sys-color-${name}, var(--${name}, var(--md-sys-color-primary)))`
              : "var(--md-sys-color-primary)";
            // 只写语义色变量，填充由 CSS 按皮肤 token 组合（实色 / 毛玻璃）
            box.style.setProperty("--st-checkbox-checked-bg", main);
          } else {
            box.style.removeProperty("--st-checkbox-checked-bg");
          }
          box.style.color = name
            ? `var(--md-sys-color-on-${name}, var(--on-${name}, var(--md-sys-color-on-primary)))`
            : "";
        },
      },
    });
  </script>
</template>
