          <article class="doc-page">
            <header class="doc-hero">
              <p class="doc-kicker">辅助 · 22 / 22</p>
              <h1>Command tools <code>toast · alert · confirm · prompt</code></h1>
              <p class="doc-lead">五个命令式工具：toast、alert、confirm、prompt、contextMenu。直接在 JS 里 import 调用，Promise 拿返回值，用完即销毁，不需要在模板里预置组件。</p>
              <div class="doc-links">
                <a href="../index.html">组件目录</a>
                <a href="https://github.com/ofajs/senti-ui/blob/main/packages/dialog/README.md" target="_blank" rel="noreferrer">Dialog README <iconify-icon icon="mdi:open-in-new"></iconify-icon></a>
                <a href="https://github.com/ofajs/senti-ui/blob/main/packages/snackbar/README.md" target="_blank" rel="noreferrer">Snackbar README <iconify-icon icon="mdi:open-in-new"></iconify-icon></a>
                <a href="https://github.com/ofajs/senti-ui/blob/main/packages/menu/README.md" target="_blank" rel="noreferrer">Menu README <iconify-icon icon="mdi:open-in-new"></iconify-icon></a>
              </div>
            </header>

            <section class="doc-section">
              <h2>toast：即用消息</h2>
              <p class="doc-section-lead">默认 3s 自动消失，固定在视口左下角并向下堆叠。传对象可以换颜色、改时长；duration: 0 表示不自动关闭，只能点 ✕ 或调用返回的 close()。</p>
              <div class="demo">
                <div class="demo-top">
                  <span class="live"><i></i>{{codeView.demo1 ? 'CODE' : 'LIVE'}}</span>
                  <div class="demo-top-actions">
                    <code>toast(message | options)</code>
                    <st-button class="demo-code-toggle" variant="text" on:click="toggleCode('demo1')">
                      <iconify-icon slot="prefix" attr:icon="codeView.demo1 ? 'mdi:eye-outline' : 'mdi:code-tags'"></iconify-icon>
                      {{codeView.demo1 ? '查看示例' : '查看代码'}}
                    </st-button>
                  </div>
                </div>
                <div class="demo-stage" attr:hidden="codeView.demo1">
                  <st-button variant="outlined" on:click="toastBasic">默认 toast</st-button>
                  <st-button variant="outlined" on:click="toastSuccess">成功色 · 4s</st-button>
                  <st-button variant="outlined" on:click="toastSticky">不自动关闭</st-button>
                  <st-button variant="text" on:click="closeToast">close() 关闭</st-button>
                  <span class="demo-note">结果：{{toastResult}}</span>
                </div>

                <st-code class="demo-code" attr:hidden="!codeView.demo1" lang="html" :code="demo1Code"></st-code>
              </div>
            </section>

            <section class="doc-section">
              <h2>alert：只有一个确认键</h2>
              <p class="doc-section-lead">确认返回 true；点遮罩或按 Escape 返回 null。参数支持字符串简写，也可以用对象补标题与按钮文案。</p>
              <div class="demo">
                <div class="demo-top">
                  <span class="live"><i></i>{{codeView.demo2 ? 'CODE' : 'LIVE'}}</span>
                  <div class="demo-top-actions">
                    <code>await alert()</code>
                    <st-button class="demo-code-toggle" variant="text" on:click="toggleCode('demo2')">
                      <iconify-icon slot="prefix" attr:icon="codeView.demo2 ? 'mdi:eye-outline' : 'mdi:code-tags'"></iconify-icon>
                      {{codeView.demo2 ? '查看示例' : '查看代码'}}
                    </st-button>
                  </div>
                </div>
                <div class="demo-stage" attr:hidden="codeView.demo2">
                  <st-button on:click="alertString">alert("操作成功")</st-button>
                  <st-button variant="outlined" on:click="alertObject">alert({ title, message })</st-button>
                  <span class="demo-note">结果：{{alertResult}} · 关闭方式不同，返回值是 true 或 null</span>
                </div>

                <st-code class="demo-code" attr:hidden="!codeView.demo2" lang="html" :code="demo2Code"></st-code>
              </div>
            </section>

            <section class="doc-section">
              <h2>confirm：确认、取消与危险操作</h2>
              <p class="doc-section-lead">确认返回 true，取消返回 false，点遮罩或按 Escape 返回 null。危险操作把 color 设为 error，主按钮会使用错误色。</p>
              <div class="demo">
                <div class="demo-top">
                  <span class="live"><i></i>{{codeView.demo3 ? 'CODE' : 'LIVE'}}</span>
                  <div class="demo-top-actions">
                    <code>await confirm()</code>
                    <st-button class="demo-code-toggle" variant="text" on:click="toggleCode('demo3')">
                      <iconify-icon slot="prefix" attr:icon="codeView.demo3 ? 'mdi:eye-outline' : 'mdi:code-tags'"></iconify-icon>
                      {{codeView.demo3 ? '查看示例' : '查看代码'}}
                    </st-button>
                  </div>
                </div>
                <div class="demo-stage" attr:hidden="codeView.demo3">
                  <st-button color="error" on:click="confirmDanger">删除（危险色）</st-button>
                  <st-button variant="outlined" on:click="confirmPlain">退出编辑（字符串简写）</st-button>
                  <st-button variant="text" on:click="confirmPublish">发布文章</st-button>
                  <span class="demo-note">结果：{{confirmResult}} · 注意 false 与 null 是两种不同结果</span>
                </div>

                <st-code class="demo-code" attr:hidden="!codeView.demo3" lang="html" :code="demo3Code"></st-code>
              </div>
            </section>

            <section class="doc-section">
              <h2>prompt：输入并返回结果</h2>
              <p class="doc-section-lead">确认返回输入值（字符串，可能为空串），取消、遮罩或 Escape 返回 null。输入框会自动聚焦并全选默认值，Enter 提交。</p>
              <div class="demo">
                <div class="demo-top">
                  <span class="live"><i></i>{{codeView.demo4 ? 'CODE' : 'LIVE'}}</span>
                  <div class="demo-top-actions">
                    <code>await prompt()</code>
                    <st-button class="demo-code-toggle" variant="text" on:click="toggleCode('demo4')">
                      <iconify-icon slot="prefix" attr:icon="codeView.demo4 ? 'mdi:eye-outline' : 'mdi:code-tags'"></iconify-icon>
                      {{codeView.demo4 ? '查看示例' : '查看代码'}}
                    </st-button>
                  </div>
                </div>
                <div class="demo-stage" attr:hidden="codeView.demo4">
                  <st-button on:click="promptBasic">重命名</st-button>
                  <st-button variant="outlined" on:click="promptPrefill">带默认值</st-button>
                  <st-button variant="text" on:click="promptString">字符串简写</st-button>
                  <span class="demo-note">结果：{{promptResult}} · 空输入会返回空串，不是 null</span>
                </div>

                <st-code class="demo-code" attr:hidden="!codeView.demo4" lang="html" :code="demo4Code"></st-code>
              </div>
            </section>

            <section class="doc-section">
              <h2>contextMenu：右键菜单</h2>
              <p class="doc-section-lead">传事件或坐标与 items 数组，菜单挂在 body 上定位并自动翻转避让视口。选中的叶子项 id 即返回值；点空白或按 Escape 返回 null，禁用项不可选。</p>
              <div class="demo">
                <div class="demo-top">
                  <span class="live"><i></i>{{codeView.demo5 ? 'CODE' : 'LIVE'}}</span>
                  <div class="demo-top-actions">
                    <code>await contextMenu(e, items)</code>
                    <st-button class="demo-code-toggle" variant="text" on:click="toggleCode('demo5')">
                      <iconify-icon slot="prefix" attr:icon="codeView.demo5 ? 'mdi:eye-outline' : 'mdi:code-tags'"></iconify-icon>
                      {{codeView.demo5 ? '查看示例' : '查看代码'}}
                    </st-button>
                  </div>
                </div>
                <div class="demo-stage" attr:hidden="codeView.demo5">
                  <div class="ctx-mini" on:contextmenu="openCtx">在这里点右键：基础菜单</div>
                  <div class="ctx-mini" on:contextmenu="openCtxNested">在这里点右键：子菜单 + 分隔线</div>
                  <span class="demo-note">结果：{{ctxResult}} · 取消返回 null</span>
                </div>

                <st-code class="demo-code" attr:hidden="!codeView.demo5" lang="html" :code="demo5Code"></st-code>
              </div>
            </section>

            <section class="doc-section">
              <h2>组合成完整流程</h2>
              <p class="doc-section-lead">命令式工具可以直接串起来：先 confirm 拿决定，再按结果 toast；或 prompt 拿到名称后写回数据。这样不需要在模板里维护对话框的 open 状态。</p>
              <div class="demo">
                <div class="demo-top">
                  <span class="live"><i></i>{{codeView.demo6 ? 'CODE' : 'LIVE'}}</span>
                  <div class="demo-top-actions">
                    <code>confirm → toast</code>
                    <st-button class="demo-code-toggle" variant="text" on:click="toggleCode('demo6')">
                      <iconify-icon slot="prefix" attr:icon="codeView.demo6 ? 'mdi:eye-outline' : 'mdi:code-tags'"></iconify-icon>
                      {{codeView.demo6 ? '查看示例' : '查看代码'}}
                    </st-button>
                  </div>
                </div>
                <div class="demo-stage" attr:hidden="codeView.demo6">
                  <st-button color="error" on:click="flowDelete">删除项目</st-button>
                  <st-button variant="outlined" on:click="flowRename">重命名项目</st-button>
                  <span class="demo-note">流程结果：{{flowResult}}</span>
                </div>

                <st-code class="demo-code" attr:hidden="!codeView.demo6" lang="html" :code="demo6Code"></st-code>
              </div>
            </section>

            <div class="doc-cols">
              <div class="doc-block">
                <h3>调用签名</h3>
                <table class="api">
                  <thead><tr><th>工具</th><th>参数</th><th>返回</th><th>说明</th></tr></thead>
                  <tbody>
                    <tr><td><code>toast</code></td><td>string / { message, duration, color }</td><td><code>{ close, el }</code></td><td>duration 毫秒，0 = 不自动关闭</td></tr>
                    <tr><td><code>alert</code></td><td>string / { title, message, ok, color }</td><td><code>true</code> / <code>null</code></td><td>只有确认键</td></tr>
                    <tr><td><code>confirm</code></td><td>string / { title, message, yes, cancel, color }</td><td><code>true</code> / <code>false</code> / <code>null</code></td><td>危险操作用 color="error"</td></tr>
                    <tr><td><code>prompt</code></td><td>string / { title, message, placeholder, value, yes, cancel }</td><td>string / <code>null</code></td><td>确认返回输入值</td></tr>
                    <tr><td><code>contextMenu</code></td><td>(event | { x, y }, items)</td><td>item id / <code>null</code></td><td>items 支持 separator / children / disabled</td></tr>
                  </tbody>
                </table>
              </div>
              <div class="doc-block">
                <h3>插槽 / 事件 / 注意</h3>
                <ul class="api-list">
                  <li>工具内部按需注入 <code>&lt;l-m&gt;</code>，无需预引入组件；但 ofa.js 必须已加载。</li>
                  <li>所有对话框自动挂到 <code>document.body</code>，关闭动画结束后自动移除，不要跨会话复用实例。</li>
                  <li>文本都经过转义；需要富文本请直接用 <code>st-dialog</code> 标签。</li>
                  <li><code>toast</code> 多条堆叠在左下角，容器不挡页面交互。</li>
                  <li><code>contextMenu</code> 的 <code>source</code> 传事件时自动 <code>preventDefault</code>；也可传 <code>{ x, y }</code> 坐标。</li>
                </ul>
              </div>
            </div>

      <script>
        export const parent = "./layout.html";

        export default async () => ({
          data: {
            codeView: { demo1: false, demo2: false, demo3: false, demo4: false, demo5: false, demo6: false },
            demo1Code: "<st-button variant=\"outlined\" on:click=\"toastBasic\">默认 toast</st-button>\n                  <st-button variant=\"outlined\" on:click=\"toastSuccess\">成功色 · 4s</st-button>\n                  <st-button variant=\"outlined\" on:click=\"toastSticky\">不自动关闭</st-button>\n                  <st-button variant=\"text\" on:click=\"closeToast\">close() 关闭</st-button>\n                  <span class=\"demo-note\">结果：{{toastResult}}</span>",
            demo2Code: "<st-button on:click=\"alertString\">alert(\"操作成功\")</st-button>\n                  <st-button variant=\"outlined\" on:click=\"alertObject\">alert({ title, message })</st-button>\n                  <span class=\"demo-note\">结果：{{alertResult}} · 关闭方式不同，返回值是 true 或 null</span>",
            demo3Code: "<st-button color=\"error\" on:click=\"confirmDanger\">删除（危险色）</st-button>\n                  <st-button variant=\"outlined\" on:click=\"confirmPlain\">退出编辑（字符串简写）</st-button>\n                  <st-button variant=\"text\" on:click=\"confirmPublish\">发布文章</st-button>\n                  <span class=\"demo-note\">结果：{{confirmResult}} · 注意 false 与 null 是两种不同结果</span>",
            demo4Code: "<st-button on:click=\"promptBasic\">重命名</st-button>\n                  <st-button variant=\"outlined\" on:click=\"promptPrefill\">带默认值</st-button>\n                  <st-button variant=\"text\" on:click=\"promptString\">字符串简写</st-button>\n                  <span class=\"demo-note\">结果：{{promptResult}} · 空输入会返回空串，不是 null</span>",
            demo5Code: "<div class=\"ctx-mini\" on:contextmenu=\"openCtx\">在这里点右键：基础菜单</div>\n                  <div class=\"ctx-mini\" on:contextmenu=\"openCtxNested\">在这里点右键：子菜单 + 分隔线</div>\n                  <span class=\"demo-note\">结果：{{ctxResult}} · 取消返回 null</span>",
            demo6Code: "<st-button color=\"error\" on:click=\"flowDelete\">删除项目</st-button>\n                  <st-button variant=\"outlined\" on:click=\"flowRename\">重命名项目</st-button>\n                  <span class=\"demo-note\">流程结果：{{flowResult}}</span>",
            toastResult: "（未调用）",
            alertResult: "（未调用）",
            confirmResult: "（未调用）",
            promptResult: "（未调用）",
            ctxResult: "（未调用）",
            flowResult: "（未调用）",
          },
          proto: {
            toggleCode(key) {
              this.codeView[key] = !this.codeView[key];
            },
            async toastBasic() {
              if (!window.__site) return;
              await window.__site.toast("已保存到草稿");
              this.toastResult = "toast → 默认 3s 后自动关闭";
            },
            async toastSuccess() {
              if (!window.__site) return;
              await window.__site.toast({ message: "同步完成", color: "success", duration: 4000 });
              this.toastResult = "toast → success 角色，4s 关闭";
            },
            async toastSticky() {
              if (!window.__site) return;
              this._toast = await window.__site.toast({ message: "点 ✕ 关闭这条消息", duration: 0 });
              this.toastResult = "toast → duration: 0，不会自动消失";
            },
            closeToast() {
              if (!this._toast) return;
              this._toast.close();
              this.toastResult = "toast.close() → 已关闭";
            },
            async alertString() {
              if (!window.__site) return;
              const ok = await window.__site.alert("操作成功");
              this.alertResult = "alert → " + JSON.stringify(ok);
            },
            async alertObject() {
              if (!window.__site) return;
              const ok = await window.__site.alert({
                title: "提示",
                message: "密码已重置，请用新密码登录。",
                ok: "知道了",
              });
              this.alertResult = "alert → " + JSON.stringify(ok);
            },
            async confirmDanger() {
              if (!window.__site) return;
              const ok = await window.__site.confirm({
                title: "确认删除",
                message: "删除后不可恢复。",
                yes: "删除",
                cancel: "取消",
                color: "error",
              });
              this.confirmResult = "confirm → " + JSON.stringify(ok);
            },
            async confirmPlain() {
              if (!window.__site) return;
              const ok = await window.__site.confirm("确定要退出编辑吗？未保存的更改会丢失。");
              this.confirmResult = "confirm → " + JSON.stringify(ok);
            },
            async confirmPublish() {
              if (!window.__site) return;
              const ok = await window.__site.confirm({
                title: "发布文章",
                message: "发布后所有访客可见。",
                yes: "发布",
                cancel: "再想想",
              });
              this.confirmResult = "confirm → " + JSON.stringify(ok);
            },
            async promptBasic() {
              if (!window.__site) return;
              const value = await window.__site.prompt({
                title: "重命名",
                message: "输入新的项目名称",
                placeholder: "项目名称",
              });
              this.promptResult = "prompt → " + JSON.stringify(value);
            },
            async promptPrefill() {
              if (!window.__site) return;
              const value = await window.__site.prompt({
                title: "重置密码",
                message: "至少 4 位",
                placeholder: "新密码",
                value: "senti-ui",
              });
              this.promptResult = "prompt → " + JSON.stringify(value);
            },
            async promptString() {
              if (!window.__site) return;
              const value = await window.__site.prompt("请输入邀请码");
              this.promptResult = "prompt → " + JSON.stringify(value);
            },
            openCtx(e) {
              e.preventDefault();
              if (!window.__site) return;
              window.__site
                .contextMenu(e, [
                  { id: "copy", label: "复制", prefix: "⧉", suffix: "⌘C" },
                  { id: "rename", label: "重命名", prefix: "✏" },
                  { separator: true },
                  { id: "archive", label: "归档", prefix: "📦", disabled: true },
                ])
                .then((id) => {
                  this.ctxResult = "contextMenu → " + JSON.stringify(id);
                });
            },
            openCtxNested(e) {
              e.preventDefault();
              if (!window.__site) return;
              window.__site
                .contextMenu(e, [
                  { id: "open", label: "打开", prefix: "↗" },
                  {
                    id: "export",
                    label: "导出为",
                    children: [
                      { id: "pdf", label: "PDF", suffix: ".pdf" },
                      { id: "md", label: "Markdown", suffix: ".md" },
                      {
                        id: "image",
                        label: "图片",
                        children: [
                          { id: "png", label: "PNG" },
                          { id: "svg", label: "SVG" },
                        ],
                      },
                    ],
                  },
                  { separator: true },
                  { id: "delete", label: "删除", prefix: "⌫", disabled: true },
                ])
                .then((id) => {
                  this.ctxResult = "contextMenu → " + JSON.stringify(id);
                });
            },
            async flowDelete() {
              if (!window.__site) return;
              const ok = await window.__site.confirm({
                title: "删除项目",
                message: "「官网改版」会被移入回收站。",
                yes: "删除",
                color: "error",
              });
              if (ok === true) {
                window.__site.toast({ message: "已删除项目", color: "success" });
                this.flowResult = "confirm → true，已弹出成功 toast";
              } else {
                this.flowResult = "confirm → " + JSON.stringify(ok) + "，未执行删除";
              }
            },
            async flowRename() {
              if (!window.__site) return;
              const name = await window.__site.prompt({
                title: "重命名项目",
                message: "当前名称：官网改版",
                value: "官网改版",
              });
              if (name) {
                window.__site.toast("名称已更新为「" + name + "」");
                this.flowResult = "prompt → " + JSON.stringify(name) + "，已弹 toast";
              } else {
                this.flowResult = "prompt → null，未修改";
              }
            },
          },
        });
      </script>
    </template>
  </o-app>

  <script type="module">
    import { setThemeMode, getThemeMode } from "../../packages/color/st-theme-mode.js";
    import { setSkin, getSkin } from "../../packages/skin/st-skin.js";
    import alert from "../../packages/dialog/alert.js";
    import confirm from "../../packages/dialog/confirm.js";
    import prompt from "../../packages/dialog/prompt.js";
    import toast from "../../packages/snackbar/toast.js";
    import contextMenu from "../../packages/menu/context-menu.js";
    window.__site = Object.assign(window.__site || {}, { setThemeMode, getThemeMode, setSkin, getSkin, alert, confirm, prompt, toast, contextMenu });
    window.__siteReady = true;
  </script>
</body>
</html>
