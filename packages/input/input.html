<!--
  st-input — Senti-UI 单行输入框组件（基于 ofa.js）
  语义属性：variant(filled|outlined) / default-value / disabled / readonly / type / placeholder / color
  value 是运行时状态（ofa data），通过 el.value 读写，不作为标签属性
  视觉全部在 :host 上，直接用原生 CSS 属性定制；
  材质（圆角/密度/描边/阴影/毛玻璃/焦点环）通过 --st-* 皮肤 token 消费，换肤见 packages/skin/README.md
-->
<template component>
  <style>
    :host {
      /* 视觉样式全部定义在 host 上，外部 style 可直接覆盖任何原生属性 */
      /* 尺寸类默认值用 em：改 font-size 即可整体等比缩放 */
      display: inline-flex;
      align-items: center;
      position: relative; /* 聚焦描边/底线浮层的定位基准 */
      gap: 0.571em;
      box-sizing: border-box;
      height: var(--st-height, 2.857em);
      min-width: 13.571em; /* M3 最小填充宽度 = 190px @ 14px */
      padding: var(--st-field-padding, 0 1em);
      border: var(--st-border-width, 1px) solid
        var(--st-field-border, var(--md-sys-color-outline));
      border-radius: var(--st-field-radius, 0.5em); /* 默认圆角：比 M3 文本域的 4px 稍圆润 */
      font-size: var(--st-font-size, 14px);
      font-family: var(--st-font, inherit);
      letter-spacing: var(--st-letter-spacing, normal);
      line-height: 1;
      color: var(--md-sys-color-on-surface);
      background-color: var(--st-field-bg, transparent);
      /* 材质（皮肤）：默认 none = 与 M3 原样一致 */
      box-shadow: var(--st-field-shadow, none);
      -webkit-backdrop-filter: var(--st-backdrop-filter, none);
      backdrop-filter: var(--st-backdrop-filter, none);
      cursor: text;
    }

    /* M3 filled 变体：无全边框，仅底边分隔线，容器底色 */
    :host([variant="filled"]) {
      background-color: var(--st-field-filled-bg, var(--md-sys-color-surface-container-highest));
      border-color: transparent;
      border-bottom-color: var(--st-field-underline, var(--md-sys-color-on-surface-variant));
      border-radius: var(--st-field-radius, 0.5em) var(--st-field-radius, 0.5em) 0 0;
    }

    /* focus 描边/底线：绝对定位浮层，不挤占布局，由 CSS 过渡呈现动画 */
    .outline-ring {
      position: absolute;
      inset: -1px; /* 盖在 1px 边框外侧，视觉 = 边框加粗到 2px */
      border: 2px solid
        var(--st-field-focus-ring-color, var(--st-accent, var(--md-sys-color-primary)));
      border-radius: inherit;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--st-motion-duration, 150ms) ease;
    }
    :host(:focus-within) .outline-ring {
      opacity: var(--st-field-focus-ring-opacity, 1);
    }
    /* 皮肤焦点材质：用 --st-accent 在组件内组合颜色，避免皮肤 token 在祖先处
       提前解析 var(--st-accent) 而丢失 color 属性的语义色（坑 #59a）。
       默认所有增量均为 0，保持 M3 原有内嵌描边。 */
    :host(:focus-within) {
      box-shadow:
        0 0 0 var(--st-field-focus-gap, 0px) var(--st-field-focus-gap-color, transparent),
        0 0 0 calc(var(--st-field-focus-gap, 0px) + var(--st-field-focus-glow-spread, 0px))
          color-mix(
            in srgb,
            var(--st-accent, var(--st-field-focus-color, var(--md-sys-color-primary)))
              var(--st-field-focus-glow-alpha, 0%),
            transparent
          ),
        inset 0 calc(-1 * var(--st-field-focus-underline-height, 0px)) 0 0
          color-mix(
            in srgb,
            var(--st-accent, var(--st-field-focus-color, var(--md-sys-color-primary)))
              var(--st-field-focus-underline-alpha, 100%),
            transparent
          ),
        var(--st-field-focus-shadow, 0 0 0 0 transparent);
    }
    :host([variant="filled"]) .outline-ring { display: none; }

    /* filled 聚焦底线：裁剪容器跟随宿主圆角，2px 线在内部从左到右展开盖在 1px 底边框上 */
    .line-clip {
      display: none;
      position: absolute;
      inset: -1px; /* 扩到边框外沿，底线才能盖住 1px 底边框 */
      border-radius: inherit; /* 宿主覆写 border-radius（如 pill）时底线随之裁剪 */
      overflow: hidden;
      pointer-events: none;
    }
    :host([variant="filled"]) .line-clip { display: block; }
    .bottom-line {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 2px;
      width: 0;
      background-color: var(
        --st-field-underline-color,
        var(--st-accent, var(--md-sys-color-primary))
      );
      transition: width 200ms cubic-bezier(0.2, 0, 0, 1);
    }
    :host(:focus-within) .bottom-line { width: 100%; }

    :host([disabled]) {
      opacity: var(--st-disabled-opacity, 0.38);
      cursor: not-allowed;
    }
    :host([disabled]) .outline-ring,
    :host([disabled]) .line-clip { display: none; }

    /* 内部透明原生 input：只负责语义（输入/键盘/焦点/disabled/readonly），不承载视觉 */
    .native {
      all: unset;
      flex: 1;
      min-width: 0;
      height: 100%;
      font: inherit;
      color: inherit;
      caret-color: var(--st-caret-color, var(--st-accent, var(--md-sys-color-primary)));
      cursor: inherit;
    }
    .native:focus { outline: none; }
    .native::placeholder {
      color: var(--md-sys-color-on-surface-variant);
      opacity: 1;
    }

    ::slotted([slot="prefix"]),
    ::slotted([slot="suffix"]) {
      display: inline-flex;
      color: var(--md-sys-color-on-surface-variant);
    }
  </style>

  <span class="outline-ring" part="focus-ring"></span>
  <span class="line-clip" part="underline"><span class="bottom-line"></span></span>
  <slot name="prefix"></slot>
  <input class="native" part="control"
    attr:type="type"
    attr:placeholder="placeholder"
    attr:maxlength="maxlength"
    attr:minlength="minlength"
    attr:pattern="pattern"
    attr:autocomplete="autocomplete"
    attr:inputmode="inputmode"
    attr:min="min"
    attr:max="max"
    attr:step="step"
    :value="value === null ? '' : value"
    :disabled="disabled !== null" />
  <slot name="suffix"></slot>

  <script>
    import "../color/st-color-init.js";
    import { syncAccessibleName } from "../a11y/a11y.js";
    import { createFormProxy, syncFormProxy, bindFormReset } from "../form/form-proxy.js";
    export default async () => ({
      tag: "st-input",
      attrs: {
        variant: "outlined",
        type: "text",
        placeholder: null,
        color: null,
        disabled: null,
        readonly: null,
        name: null,
        form: null,
        required: null,
        maxlength: null,
        minlength: null,
        pattern: null,
        autocomplete: null,
        inputmode: null,
        min: null,
        max: null,
        step: null,
      },
      data: {
        value: null, // 运行时输入值，attached 时由 default-value 属性初始化
      },
      watch: {
        color() { this.applyColor(); },
        // 外部改 this.value（data）时兜底同步内部 input（:value 绑定已覆盖）
        value() {
          const input = this.ele.shadowRoot.querySelector(".native");
          if (this.value !== null && input.value !== this.value) input.value = this.value;
          this.syncForm?.();
        },
        // ofa 属性绑定写不对 camelCase 的 readOnly，改在 JS 里同步
        readonly() {
          this.ele.shadowRoot.querySelector(".native").readOnly = this.readonly !== null;
          this.syncForm?.();
        },
        type() { this.syncForm?.(); },
        disabled() { this.syncForm?.(); },
        name() { this.syncForm?.(); },
        form() { this.syncForm?.(); },
        required() { this.syncForm?.(); },
        maxlength() { this.syncForm?.(); },
        minlength() { this.syncForm?.(); },
        pattern() { this.syncForm?.(); },
        autocomplete() { this.syncForm?.(); },
        min() { this.syncForm?.(); },
        max() { this.syncForm?.(); },
        step() { this.syncForm?.(); },
      },
      ready() {
        this.applyColor();
        const input = this.ele.shadowRoot.querySelector(".native");
        const ele = this.ele;
        input.readOnly = this.readonly !== null;
        // attached 时读取 default-value 属性作为初始值写入 data.value
        const dv = ele.getAttribute("default-value");
        input.value = dv === null ? "" : dv;
        this.value = input.value;
        // 宿主 value 用 getter/setter 反射到内部 input（ofa 的 data 不在原生属性上，
        // 页面侧 on:input 里读 e.target.value、外部读写 el.value 都依赖这里的反射）
        Object.defineProperty(ele, "value", {
          get: () => input.value,
          set: (v) => { input.value = v == null ? "" : v; this.value = input.value; },
        });
        // 表单代理：ofa 自定义元素不支持 formAssociated，用 light DOM 里的
        // 原生控件承担 name/value/required/pattern 等表单语义
        const proxy = createFormProxy(ele, this.type || "text");
        this.syncForm = () => {
          syncFormProxy(proxy, {
            type: this.type || "text",
            name: this.name,
            form: ele.getAttribute("form"),
            value: input.value,
            disabled: this.disabled !== null,
            readOnly: this.readonly !== null,
            required: this.required !== null,
            maxlength: this.maxlength,
            minlength: this.minlength,
            pattern: this.pattern,
            autocomplete: this.autocomplete,
            min: this.min,
            max: this.max,
            step: this.step,
          });
          if (this.required !== null) input.setAttribute("aria-required", "true");
          else input.removeAttribute("aria-required");
        };
        this.syncForm();
        proxy.addEventListener("invalid", (e) => {
          e.preventDefault();
          input.setAttribute("aria-invalid", "true");
          ele.dispatchEvent(new Event("invalid", { bubbles: true, composed: true }));
        });
        // 输入时同步 ofa data（:value 单向绑定只管 data → input，反向靠这里）
        input.addEventListener("input", () => {
          this.value = input.value;
          input.removeAttribute("aria-invalid");
          this.syncForm?.();
        });
        // 原生 change 不是 composed，穿不出 shadow，需转发到宿主（bubbles + composed）
        input.addEventListener("change", () => {
          ele.dispatchEvent(new Event("change", { bubbles: true, composed: true }));
        });
        // 宿主 aria-label / aria-labelledby / title → 内部 input 的可访问名称
        this._a11yCleanup = syncAccessibleName(ele, input);
        this.syncForm();
        // 原生 form.reset() 后把默认值同步回组件
        this._resetCleanup = bindFormReset(ele, () => {
          const dv = ele.getAttribute("default-value");
          input.value = dv === null ? "" : dv;
          this.value = input.value;
          input.removeAttribute("aria-invalid");
          this.syncForm();
        });
      },
      detached() {
        this._a11yCleanup?.();
        this._resetCleanup?.();
      },
      proto: {
        // color 接受 M3 角色名或 color 模块自定义变量名，控制 caret 与 focus 描边/底线颜色。
        // 只写 --st-accent 变量：caret / focus ring / 底线都在 CSS 里消费它，
        // 皮肤也因此能继续用同一语义色组合自己的材质（无需知道 color 属性实现）。
        applyColor() {
          const s = this.ele.style;
          s.removeProperty("--st-accent");
          const name = this.color;
          if (!name) return;
          s.setProperty(
            "--st-accent",
            `var(--md-sys-color-${name}, var(--${name}, var(--md-sys-color-primary)))`
          );
        },
        focus() { this.ele.shadowRoot.querySelector(".native").focus(); },
        blur() { this.ele.shadowRoot.querySelector(".native").blur(); },
      },
    });
  </script>
</template>
