          <article class="doc-page">
            <header class="doc-hero">
              <p class="doc-kicker">基础 · 1 / 21</p>
              <h1>Button <code>st-button</code></h1>
              <p class="doc-lead">四种按钮形态同属一个包：普通按钮、按钮组、分裂按钮、图标按钮。语义只由 variant / color / disabled / loading 表达，尺寸与材质直接写原生 CSS。</p>
              <div class="doc-links">
                <a href="../index.html">组件目录</a>
                <a href="https://github.com/ofajs/senti-ui/blob/main/packages/button/README.md" target="_blank" rel="noreferrer">GitHub README ↗</a>
              </div>
            </header>

            <section class="doc-section">
              <h2>三种 variant</h2>
              <p class="doc-section-lead">M3 的 filled / outlined / text 是语义类型，不是外观预设。它们共享同一套高度、内边距与圆角，只改变填充和描边。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>st-button</code></div>
                <div class="demo-stage">
                  <st-button>Filled</st-button>
                  <st-button variant="outlined">Outlined</st-button>
                  <st-button variant="text">Text</st-button>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码</summary>
                <pre><code>&lt;st-button&gt;Filled&lt;/st-button&gt;
&lt;st-button variant="outlined"&gt;Outlined&lt;/st-button&gt;
&lt;st-button variant="text"&gt;Text&lt;/st-button&gt;</code></pre>
              </details>
            </section>

            <section class="doc-section">
              <h2>状态：disabled 与 loading</h2>
              <p class="doc-section-lead">loading 会自动禁用点击并显示随字号缩放的 spinner；异步任务只需把 loading 绑到 data，不需要手动叠 disabled。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>disabled / loading</code></div>
                <div class="demo-stage">
                  <st-button disabled>Disabled</st-button>
                  <st-button loading>Loading</st-button>
                  <st-button attr:loading="busy" on:click="startTask">{{busy ? '提交中…' : '提交表单'}}</st-button>
                  <span class="demo-note">点击计数：{{clicks}}</span>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码（异步提交）</summary>
                <pre><code>&lt;st-button attr:loading="busy" on:click="submit"&gt;
  {{busy ? '提交中…' : '提交表单'}}
&lt;/st-button&gt;

&lt;script&gt;
  export default async () =&gt; ({
    data: { busy: false },
    proto: {
      async submit() {
        this.busy = true;
        await fetch('/api/save', { method: 'POST' });
        this.busy = false;
      },
    },
  });
&lt;/script&gt;</code></pre>
              </details>
            </section>

            <section class="doc-section">
              <h2>color 语义换色</h2>
              <p class="doc-section-lead">color 接受 M3 角色名或 color 工具里的自定义变量名，并与三种 variant 自由组合。切换种子色 / error / success 时全站按钮一起变化，不需要改组件样式。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>color + variant</code></div>
                <div class="demo-stage grid">
                  <div class="demo-cell">
                    <span class="demo-label">primary</span>
                    <div class="row">
                      <st-button color="primary">Primary</st-button>
                      <st-button color="primary" variant="outlined">Primary</st-button>
                    </div>
                  </div>
                  <div class="demo-cell">
                    <span class="demo-label">error</span>
                    <div class="row">
                      <st-button color="error">Delete</st-button>
                      <st-button color="error" variant="outlined">Delete</st-button>
                      <st-button color="error" variant="text">Delete</st-button>
                    </div>
                  </div>
                  <div class="demo-cell">
                    <span class="demo-label">success</span>
                    <div class="row">
                      <st-button color="success">保存</st-button>
                      <st-button color="success" variant="outlined">已保存</st-button>
                    </div>
                  </div>
                  <div class="demo-cell">
                    <span class="demo-label">secondary / tertiary</span>
                    <div class="row">
                      <st-button color="secondary">Secondary</st-button>
                      <st-button color="tertiary" variant="outlined">Tertiary</st-button>
                    </div>
                  </div>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码</summary>
                <pre><code>&lt;st-button color="error"&gt;Delete&lt;/st-button&gt;
&lt;st-button color="error" variant="outlined"&gt;Delete&lt;/st-button&gt;
&lt;st-button color="success"&gt;保存&lt;/st-button&gt;
&lt;!-- 自定义变量需先在 color 工具中定义 --&gt;
&lt;st-button color="brand"&gt;Brand&lt;/st-button&gt;</code></pre>
              </details>
            </section>

            <section class="doc-section">
              <h2>图标插槽与尺寸</h2>
              <p class="doc-section-lead">prefix / suffix 放图标；尺寸类默认值全部用 em，只改 font-size 就能整体等比缩放，也可以用原生 CSS 单独覆写高度、圆角或背景。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>slot / font-size</code></div>
                <div class="demo-stage">
                  <st-button><span slot="prefix">🔍</span>Search</st-button>
                  <st-button variant="outlined">Settings<span slot="suffix">⚙️</span></st-button>
                  <st-button style="font-size: 12px;">12px</st-button>
                  <st-button>Default 14px</st-button>
                  <st-button style="font-size: 18px;">18px</st-button>
                  <st-button style="height: 32px; border-radius: 8px; font-size: 12px;">Compact 覆写</st-button>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码</summary>
                <pre><code>&lt;st-button&gt;&lt;span slot="prefix"&gt;🔍&lt;/span&gt;Search&lt;/st-button&gt;
&lt;st-button variant="outlined"&gt;Settings&lt;span slot="suffix"&gt;⚙️&lt;/span&gt;&lt;/st-button&gt;

&lt;st-button style="font-size: 12px;"&gt;12px&lt;/st-button&gt;
&lt;st-button style="height: 32px; border-radius: 8px; font-size: 12px;"&gt;Compact&lt;/st-button&gt;</code></pre>
              </details>
            </section>

            <section class="doc-section">
              <h2>按钮组</h2>
              <p class="doc-section-lead">st-button-group 负责首尾圆角与间距。connected 连体，full-width 等分整行；也可以直接用 attr:variant 把按钮组当分段选择器。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>st-button-group</code></div>
                <div class="demo-stage block">
                  <st-button-group>
                    <st-button variant="outlined">左</st-button>
                    <st-button variant="outlined">中</st-button>
                    <st-button variant="outlined">右</st-button>
                  </st-button-group>
                  <st-button-group connected>
                    <st-button>新建</st-button>
                    <st-button variant="outlined">编辑</st-button>
                    <st-button color="error" variant="outlined">删除</st-button>
                  </st-button-group>
                  <st-button-group full-width style="max-width: 420px;">
                    <st-button variant="text">取消</st-button>
                    <st-button>确定</st-button>
                  </st-button-group>
                  <st-button-group connected>
                    <st-button attr:variant="range === 'day' ? 'filled' : 'outlined'" on:click="range = 'day'">日</st-button>
                    <st-button attr:variant="range === 'week' ? 'filled' : 'outlined'" on:click="range = 'week'">周</st-button>
                    <st-button attr:variant="range === 'month' ? 'filled' : 'outlined'" on:click="range = 'month'">月</st-button>
                  </st-button-group>
                  <span class="demo-note">range = {{range}}</span>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码（连体按钮组）</summary>
                <pre><code>&lt;st-button-group connected&gt;
  &lt;st-button&gt;新建&lt;/st-button&gt;
  &lt;st-button variant="outlined"&gt;编辑&lt;/st-button&gt;
  &lt;st-button color="error" variant="outlined"&gt;删除&lt;/st-button&gt;
&lt;/st-button-group&gt;</code></pre>
              </details>
            </section>

            <section class="doc-section">
              <h2>分裂按钮</h2>
              <p class="doc-section-lead">主操作区与菜单箭头分开：点主区触发 click，点箭头展开 menu 插槽。open 是运行时状态，ofa 页面里用 sync:open 双向绑定。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>st-split-button</code></div>
                <div class="demo-stage">
                  <st-split-button on:click="splitCount += 1">
                    发送
                    <span slot="prefix">📤</span>
                    <st-menu-item slot="menu" on:click="lastPick = '发送到邮箱'">发送到邮箱</st-menu-item>
                    <st-menu-item slot="menu" on:click="lastPick = '发送到云盘'">发送到云盘</st-menu-item>
                    <hr slot="menu">
                    <st-menu-item slot="menu" disabled>定时发送（禁用）</st-menu-item>
                  </st-split-button>
                  <st-split-button variant="outlined" color="error" menu-align="left">
                    删除
                    <st-menu-item slot="menu" on:click="lastPick = '移到回收站'">移到回收站</st-menu-item>
                    <st-menu-item slot="menu" on:click="lastPick = '彻底删除'">彻底删除</st-menu-item>
                  </st-split-button>
                  <span class="demo-note">主操作 {{splitCount}} 次 · 最近选择：{{lastPick}}</span>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码</summary>
                <pre><code>&lt;st-split-button on:click="send"&gt;
  发送
  &lt;st-menu-item slot="menu" on:click="sendTo('email')"&gt;发送到邮箱&lt;/st-menu-item&gt;
  &lt;st-menu-item slot="menu" on:click="sendTo('cloud')"&gt;发送到云盘&lt;/st-menu-item&gt;
&lt;/st-split-button&gt;</code></pre>
              </details>
            </section>

            <section class="doc-section">
              <h2>图标按钮</h2>
              <p class="doc-section-lead">standard / filled / tonal / outlined 四种类型，同样支持 color 与 disabled。没有文字，务必用 title 或 aria-label 提供无障碍名称。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>st-icon-button</code></div>
                <div class="demo-stage">
                  <st-icon-button title="收藏" on:click="iconCount += 1">⭐</st-icon-button>
                  <st-icon-button variant="filled" title="确认" on:click="iconCount += 1">✅</st-icon-button>
                  <st-icon-button variant="tonal" title="删除" on:click="iconCount += 1">🗑</st-icon-button>
                  <st-icon-button variant="outlined" title="设置" on:click="iconCount += 1">⚙️</st-icon-button>
                  <st-icon-button variant="filled" color="error" title="错误操作" on:click="iconCount += 1">🚫</st-icon-button>
                  <st-icon-button variant="tonal" color="success" title="保存" on:click="iconCount += 1">💾</st-icon-button>
                  <st-icon-button variant="outlined" disabled title="禁用">🔒</st-icon-button>
                  <span class="demo-note">点击 {{iconCount}} 次</span>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码</summary>
                <pre><code>&lt;st-icon-button title="收藏"&gt;⭐&lt;/st-icon-button&gt;
&lt;st-icon-button variant="filled" title="确认"&gt;✅&lt;/st-icon-button&gt;
&lt;st-icon-button variant="tonal" color="error" title="删除"&gt;🗑&lt;/st-icon-button&gt;</code></pre>
              </details>
            </section>

            <div class="doc-cols">
              <div class="doc-block">
                <h3>属性</h3>
                <table class="api">
                  <thead><tr><th>属性</th><th>类型</th><th>默认</th><th>说明</th></tr></thead>
                  <tbody>
                    <tr><td><code>variant</code></td><td>"filled" | "outlined" | "text"</td><td>"filled"</td><td>普通按钮三种类型</td></tr>
                    <tr><td><code>color</code></td><td>M3 角色名 / 自定义变量名</td><td>无</td><td>与 variant 自由组合的语义换色</td></tr>
                    <tr><td><code>disabled</code></td><td>boolean</td><td>无</td><td>0.38 透明度并阻断点击</td></tr>
                    <tr><td><code>loading</code></td><td>boolean</td><td>无</td><td>显示 spinner，自动阻断点击</td></tr>
                    <tr><td><code>type</code></td><td>"button" | "submit" | "reset"</td><td>"button"</td><td>转发给内部原生 button</td></tr>
                  </tbody>
                </table>
              </div>
              <div class="doc-block">
                <h3>插槽 / 事件 / 同包组件</h3>
                <ul class="api-list">
                  <li>插槽：默认文字；<code>prefix</code> / <code>suffix</code> 放图标。</li>
                  <li>事件：<code>click</code> 直接在宿主监听；Tab 聚焦、Enter / Space 激活由内部原生 button 提供。</li>
                  <li><code>st-button-group</code>：<code>connected</code> 连体、<code>full-width</code> 等分。</li>
                  <li><code>st-split-button</code>：主区 click + menu 插槽，<code>open</code> 是运行时状态。</li>
                  <li><code>st-icon-button</code>：standard / filled / tonal / outlined。</li>
                </ul>
              </div>
            </div>

            <nav class="doc-pager" aria-label="上下篇">
              <div class="pager-empty"></div><a class="pager-link pager-next" olink href="./input.html"><span>下一页</span>Input →</a>
            </nav>
          </article>
      <script>
        export const parent = "./layout.html";

        export default async () => ({
          data: {
            clicks: 0,
            busy: false,
            range: "day",
            splitCount: 0,
            lastPick: "（无）",
            iconCount: 0,
          },
          proto: {
            startTask() {
              if (this.busy) return;
              this.clicks += 1;
              this.busy = true;
              setTimeout(() => { this.busy = false; }, 1200);
            },
          },
        });
      </script>
    </template>
  </o-app>

    window.__site = { setThemeMode, getThemeMode, setSkin, getSkin, alert, confirm, prompt, toast, contextMenu };
    window.__siteReady = true;
