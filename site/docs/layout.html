<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>组件文档 — Senti-UI</title>
    <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--md-sys-color-surface); }
  </style>
</head>
  <body>
    <!-- SCSR 二级父页：文档侧栏 / 移动端左侧抽屉只在这里维护一次。
         每个组件页 export const parent = "./layout.html"，正文通过 <slot> 进入。 -->
    <o-app src="../app-config.js">
      <template page>
        <link rel="stylesheet" href="../docs.css" />

        <!-- 文档 layout 自己会用到 list / drawer；从手记、皮肤等其他栏目进入文档时，
             目标页 body 里的 <l-m> 不会被执行，所以依赖必须在父页里再声明一次。 -->
        <l-m src="../../packages/list/list.html"></l-m>
        <l-m src="../../packages/drawer/drawer.html"></l-m>
        <l-m src="../../packages/button/button.html"></l-m>
        <l-m src="../../packages/button/icon-button.html"></l-m>
        <l-m src="../../packages/code/code.html"></l-m>

        <div class="docs-shell">
          <aside class="docs-side" aria-label="组件文档目录">
            <p class="side-title">Components · 27</p>

            <st-list class="side-list">
              <st-list-item button class:active="current === 'index'" on:click="goDoc('index')">
                <span>概览</span><code slot="suffix">all</code>
              </st-list-item>
            </st-list>

            <o-fill :value="navGroups" fill-key="title">
              <div class="side-group-block">
                <p class="side-group">{{$data.title}}</p>
                <st-list class="side-list">
                  <o-fill :value="$data.items" fill-key="id">
                    <st-list-item button attr:class="$data.active ? 'active' : ''" on:click="$host.goDoc($data.id)">
                      <span>{{$data.label}}</span><code slot="suffix">{{$data.tag}}</code>
                    </st-list-item>
                  </o-fill>
                </st-list>
              </div>
            </o-fill>
          </aside>

          <div class="docs-body">
            <div class="docs-mobile-nav">
              <st-button class="docs-nav-trigger" variant="outlined" on:click="navOpen = true">
                <iconify-icon slot="prefix" icon="mdi:format-list-bulleted"></iconify-icon>
                组件目录 · {{currentLabel}}
              </st-button>
            </div>


            <slot></slot>
          </div>
        </div>

        <st-drawer class="docs-nav-drawer" sync:open="navOpen" auto-close side="left" aria-label="组件文档目录">
          <div slot="headline" class="docs-nav-head">
            <span class="docs-nav-title">组件目录</span>
            <st-icon-button title="关闭目录" on:click="navOpen = false"><iconify-icon icon="mdi:close"></iconify-icon></st-icon-button>
          </div>
          <div class="docs-nav-body">
            <st-list class="side-list">
              <st-list-item button class:active="current === 'index'" on:click="goDoc('index')">
                <span>概览</span><code slot="suffix">all</code>
              </st-list-item>
            </st-list>
            <o-fill :value="navGroups" fill-key="title">
              <div class="side-group-block">
                <p class="side-group">{{$data.title}}</p>
                <st-list class="side-list">
                  <o-fill :value="$data.items" fill-key="id">
                    <st-list-item button attr:class="$data.active ? 'active' : ''" on:click="$host.goDoc($data.id)">
                      <span>{{$data.label}}</span><code slot="suffix">{{$data.tag}}</code>
                    </st-list-item>
                  </o-fill>
                </st-list>
              </div>
            </o-fill>
          </div>
        </st-drawer>

        <script>
          export const parent = "../layout.html";

          export default async () => ({
            data: {
              current: "index",
              currentLabel: "概览",
              navOpen: false,
              navGroups: [
                {
                  title: "基础",
                  items: [{ id: "button", label: "Button", tag: "st-button" }],
                },
                {
                  title: "表单",
                  items: [
                    { id: "input", label: "Input", tag: "st-input" },
                    { id: "textarea", label: "Textarea", tag: "st-textarea" },
                    { id: "select", label: "Select", tag: "st-select" },
                    { id: "checkbox", label: "Checkbox", tag: "st-checkbox" },
                    { id: "switch", label: "Switch", tag: "st-switch" },
                    { id: "radio", label: "Radio", tag: "st-radio" },
                    { id: "slider", label: "Slider", tag: "st-slider" },
                  ],
                },
                {
                  title: "反馈",
                  items: [
                    { id: "dialog", label: "Dialog", tag: "st-dialog" },
                    { id: "drawer", label: "Drawer", tag: "st-drawer" },
                    { id: "menu", label: "Menu", tag: "st-menu" },
                    { id: "snackbar", label: "Snackbar", tag: "st-snackbar" },
                    { id: "progress", label: "Progress", tag: "st-progress" },
                  ],
                },
                {
                  title: "内容",
                  items: [
                    { id: "card", label: "Card", tag: "st-card" },
                    { id: "badges", label: "Badges", tag: "st-badges" },
                    { id: "chip", label: "Chip", tag: "st-chip" },
                    { id: "avatar", label: "Avatar", tag: "st-avatar" },
                    { id: "list", label: "List", tag: "st-list" },
                  ],
                },
                {
                  title: "导航",
                  items: [
                    { id: "tabs", label: "Tabs", tag: "st-tab-bar" },
                    { id: "navigation", label: "Navigation", tag: "st-nav-bar" },
                  ],
                },
                {
                  title: "辅助",
                  items: [
                    { id: "collapse", label: "Collapse", tag: "st-collapse" },
                    { id: "tooltip", label: "Tooltip", tag: "st-tooltip" },
                    { id: "ripple", label: "Ripple", tag: "st-ripple" },
                    { id: "skeleton", label: "Skeleton", tag: "st-skeleton" },
                    { id: "tools", label: "Command tools", tag: "toast" },
                  ],
                },
                {
                  title: "高级",
                  items: [
                    { id: "code", label: "Code", tag: "st-code" },
                    { id: "chat", label: "Chat", tag: "st-chat" },
                  ],
                },
              ],
            },
            ready() {
              this.syncActive();
            },
            routerChange({ current } = {}) {
              this.syncActive(current);
              this.navOpen = false;
            },
            proto: {
              syncActive(current) {
                const raw =
                  (current && current.src) || location.pathname.split("?")[0];
                const file = raw.split("?")[0].split("/").pop().replace(/\.html$/, "");
                this.current = !file || file === "index" || file === "layout" ? "index" : file;
                let label = this.current === "index" ? "概览" : "组件目录";
                for (const group of this.navGroups) {
                  for (const item of group.items) {
                    item.active = item.id === this.current;
                    if (item.active) label = item.label;
                  }
                }
                this.currentLabel = label;
              },
              goDoc(id) {
                this.navOpen = false;
                this.goto(id === "index" ? "./index.html" : "./" + id + ".html");
              },
            },
          });
        </script>
      </template>
    </o-app>

    <script type="module">
      import "https://cdn.jsdelivr.net/gh/ofajs/ofa.js@refs/heads/v5/dist/ofa.min.mjs";
      import "https://cdn.jsdelivr.net/gh/ofajs/ofa.js@refs/heads/v5/packages/scsr/dist/scsr.min.mjs";
    </script>
  </body>
</html>
