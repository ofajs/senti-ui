            <header class="doc-hero">

              <h1>Radio <code>st-radio</code></h1>
              <p class="doc-lead">单选按钮：用 name 作为分组键，在最近的同一容器内互斥；attr:checked 表示选中态，change 只在被点中的那一项派发。圆圈与间距全用 em，改 font-size 即等比缩放。</p>
              <div class="doc-links">
                <a href="../index.html">组件目录</a>
                <a href="https://github.com/ofajs/senti-ui/blob/main/packages/radio/README.md" target="_blank" rel="noreferrer">GitHub README ↗</a>
              </div>
            </header>

            <section class="doc-section">
              <h2>基础用法与同组互斥</h2>
              <p class="doc-section-lead">同组选项写在同一个父容器里，name 相同的 st-radio 自动互斥。用 attr:checked 绑定数据、on:change 回写选中值，页面状态与组件选中态保持同一条链路。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>name + attr:checked</code></div>
                <div class="demo-stage">
                  <st-radio name="doc-plan" attr:checked="plan === 'free'" on:change="setPlan('free', '免费版')">免费版</st-radio>
                  <st-radio name="doc-plan" attr:checked="plan === 'pro'" on:change="setPlan('pro', '专业版')">专业版</st-radio>
                  <st-radio name="doc-plan" attr:checked="plan === 'team'" on:change="setPlan('team', '团队版')">团队版</st-radio>
                  <span class="demo-note">plan = {{plan}}（{{planLabel}}）· change 触发 {{planChanges}} 次</span>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码（受控单选组）</summary>
                <pre><code>&lt;st-radio name="plan" attr:checked="plan === 'free'" on:change="plan = 'free'"&gt;免费版&lt;/st-radio&gt;
&lt;st-radio name="plan" attr:checked="plan === 'pro'" on:change="plan = 'pro'"&gt;专业版&lt;/st-radio&gt;
&lt;st-radio name="plan" attr:checked="plan === 'team'" on:change="plan = 'team'"&gt;团队版&lt;/st-radio&gt;

&lt;script&gt;
  export default async () =&gt; ({
    data: { plan: "pro" },
  });
&lt;/script&gt;</code></pre>
              </details>
            </section>

            <section class="doc-section">
              <h2>change 事件与回显</h2>
              <p class="doc-section-lead">change 是 composed 事件，会穿过 shadow 冒泡到页面；只有被用户点中的那一项派发，被取消的兄弟项不会派发。点击已选中的项也不会重复触发。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>on:change</code></div>
                <div class="demo-stage">
                  <st-radio name="doc-fruit" attr:checked="fruit === 'apple'" on:change="setFruit('apple', '苹果')">苹果</st-radio>
                  <st-radio name="doc-fruit" attr:checked="fruit === 'banana'" on:change="setFruit('banana', '香蕉')">香蕉</st-radio>
                  <st-radio name="doc-fruit" attr:checked="fruit === 'cherry'" on:change="setFruit('cherry', '樱桃')">樱桃</st-radio>
                  <span class="demo-note">最近选择：{{fruitLabel}} · 累计 {{fruitChanges}} 次 change</span>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码（事件回显）</summary>
                <pre><code>&lt;st-radio name="fruit" attr:checked="fruit === 'apple'" on:change="setFruit('apple')"&gt;苹果&lt;/st-radio&gt;
&lt;st-radio name="fruit" attr:checked="fruit === 'banana'" on:change="setFruit('banana')"&gt;香蕉&lt;/st-radio&gt;

&lt;script&gt;
  export default async () =&gt; ({
    data: { fruit: "apple", fruitChanges: 0 },
    proto: {
      setFruit(value) {
        this.fruit = value;
        this.fruitChanges += 1;
      },
    },
  });
&lt;/script&gt;</code></pre>
              </details>
            </section>

            <section class="doc-section">
              <h2>disabled、color 与尺寸</h2>
              <p class="doc-section-lead">disabled 会阻断点击和键盘并降到 0.38 透明度；color 接受 M3 角色名或 color 工具里的自定义变量名，只影响选中态的圆环与圆点。改宿主 font-size 即可整体等比缩放。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>disabled / color / font-size</code></div>
                <div class="demo-stage">
                  <st-radio name="doc-off" disabled checked>禁用 · 已选中</st-radio>
                  <st-radio name="doc-off" disabled>禁用 · 未选中</st-radio>
                  <st-radio name="doc-color" color="error" attr:checked="accent === 'error'" on:change="accent = 'error'">error</st-radio>
                  <st-radio name="doc-color" color="success" attr:checked="accent === 'success'" on:change="accent = 'success'">success</st-radio>
                  <st-radio name="doc-color" color="tertiary" attr:checked="accent === 'tertiary'" on:change="accent = 'tertiary'">tertiary</st-radio>
                  <st-radio name="doc-scale" style="font-size: 20px;">font-size: 20px</st-radio>
                  <span class="demo-note">color 组当前选中：{{accent}}</span>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码</summary>
                <pre><code>&lt;st-radio name="off" disabled checked&gt;禁用 · 已选中&lt;/st-radio&gt;
&lt;st-radio name="color" color="error" checked&gt;error&lt;/st-radio&gt;
&lt;st-radio name="color" color="success"&gt;success&lt;/st-radio&gt;

&lt;st-radio name="scale" style="font-size: 20px;"&gt;font-size: 20px&lt;/st-radio&gt;</code></pre>
              </details>
            </section>

              <details class="snippet">

            <section class="doc-section">
              <h2>列表式选项</h2>
              <p class="doc-section-lead">把一列 st-radio 直接放进带边框的原生 div，每一项 display:flex + width:100% 铺满整行，用 border-bottom 分隔。组内的互斥范围就是这个外层 div，不要再给每一行套独立 div。</p>
              <div class="demo">

            <section class="doc-section">
              <h2>分组边界：同名不同容器</h2>
              <p class="doc-section-lead">互斥范围是最近的 st-list / st-menu / fieldset / form / div / section。下面两个容器都用 name="doc-shared"，但它们是两个独立组，各自保持一个选中项。需要联动时，请把选项放进同一个容器。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>grouping scope</code></div>

                    <st-radio name="doc-shared">选项 A2</st-radio>
                  </div>
                  <div style="display: grid; gap: 10px; min-width: 220px; padding: 14px 16px; border: 1px dashed var(--md-sys-color-outline); border-radius: 12px;">
                    <span class="demo-label">容器 B</span>
                    <st-radio name="doc-shared" checked>选项 B1</st-radio>
                    <st-radio name="doc-shared">选项 B2</st-radio>
                  </div>
                  <span class="demo-note">A 与 B 互不影响；点 A2 只会取消 A1，B1 仍然选中。</span>

            <div class="doc-cols">
              <div class="doc-block">
                <h3>属性</h3>
                <table class="api">
                  <thead><tr><th>属性</th><th>类型</th><th>默认</th><th>说明</th></tr></thead>
                  <tbody>
                    <tr><td><code>name</code></td><td>string</td><td>无</td><td>分组键：选中时取消同一树作用域内同 name 的其他 st-radio</td></tr>
                    <tr><td><code>checked</code></td><td>boolean</td><td>无</td><td>选中态；页面里用 <code>attr:checked="expr"</code> 绑定</td></tr>
                    <tr><td><code>disabled</code></td><td>boolean</td><td>无</td><td>0.38 透明度、阻断点击与键盘</td></tr>
                    <tr><td><code>color</code></td><td>M3 角色名 / 自定义变量名</td><td>无</td><td>只影响选中态的圆环与圆点</td></tr>
                  </tbody>
                </table>
              </div>
              <div class="doc-block">
                <h3>插槽 / 事件 / 注意</h3>
                <ul class="api-list">
                  <li>插槽：默认插槽放标签文字；没有内容时标签区自动隐藏，可当作纯指示器。</li>
                  <li>事件：<code>change</code>（bubbles + composed），仅被点中的那一项派发；被取消的兄弟项不派发。</li>
                  <li>键盘：Tab 聚焦、Space / Enter 选中；焦点环画在圆圈外圈。</li>
                  <li>尺寸：圆环 <code>1.571em</code>、圆点 <code>0.714em</code>、标签间距 <code>0.857em</code>，改 <code>font-size</code> 全部等比缩放。</li>
                  <li>分组按树作用域：原生 radio 的 name 分组不跨 shadow root，组件在同一 document / o-page shadow root 内手动互斥（不再要求同父容器）。</li>
                </ul>
              </div>

      <script>
        export const parent = "./layout.html";

        export default async () => ({
          data: {
            plan: "pro",
            planLabel: "专业版",
            planChanges: 0,
            fruit: "apple",
            fruitLabel: "苹果",
            fruitChanges: 0,
            accent: "error",
            cardPlan: "team",
            cardLabel: "团队版",
            cardPrice: "¥25 / 人 / 月 · 无限项目",
            format: "png",

          },
          proto: {
            setPlan(value, label) {
              this.plan = value;
              this.planLabel = label;
              this.planChanges += 1;
            },
            setFruit(value, label) {
              this.fruit = value;
              this.fruitLabel = label;
              this.fruitChanges += 1;
            },
            pickCard(value, label, price) {
              this.cardPlan = value;
              this.cardLabel = label;
              this.cardPrice = price;
            },
            setFormat(value, hint) {
              this.format = value;
              this.formatHint = hint;
            },
          },
        });
      </script>
