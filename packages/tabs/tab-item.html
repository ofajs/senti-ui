<!--
  st-tab-item — Senti-UI 标签项组件（基于 ofa.js）
  语义属性：active / disabled；插槽 icon / 默认（文字）；click 事件冒泡到宿主，见 README.md
-->
<template component>
  <style>
    :host {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: var(--st-tab-height, 3.429em);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      z-index: 1;
    }

    /* M3 state layer：currentColor 半透明叠加 */
    .layer {
      position: absolute;
      inset: 0;
      border-radius: var(--st-tab-layer-radius, 0.571em);
      background: currentColor;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--st-motion-duration, 0.15s) ease;
    }
    :host(:hover) .layer { opacity: var(--st-state-hover, 0.08); }
    :host(:active) .layer { opacity: var(--st-state-press, 0.12); }

    .container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.571em;
      padding: 0 1.143em;
    }

    .icon {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.286em;
    }
    ::slotted([slot="icon"]) { display: inline-flex; }

    .label {
      font-size: 0.929em; /* 13px，M3 tab */
      font-weight: 500;
      white-space: nowrap;
      color: var(--md-sys-color-on-surface-variant);
      transition: color var(--st-motion-duration-base, 0.2s) ease;
    }
    :host([active]) .label,
    :host([active]:hover) .label {
      color: var(--md-sys-color-primary);
    }
    :host(:hover) .label { color: var(--md-sys-color-on-surface); }

    :host([disabled]) {
      cursor: not-allowed;
      opacity: var(--st-disabled-opacity, 0.38);
    }

    /* 内部透明原生 button：承载点击/键盘/焦点语义 */
    .native {
      all: unset;
      position: absolute;
      inset: 0;
      z-index: 2; /* 盖住 position:relative 的兄弟元素，保证点击/键盘都落在语义元素上 */
      cursor: pointer;
      border-radius: var(--st-tab-layer-radius, 0.571em);
    }
    .native:focus-visible ~ .layer {
      outline: var(--st-focus-ring-width, 2px) var(--st-focus-ring-style, solid)
        var(--st-focus-ring-color, var(--md-sys-color-on-surface));
      outline-offset: var(--st-focus-ring-offset, 2px);
    }

    l-m { display: none; }

    /* 减少动态效果：动画/过渡压到近零，同时保留 animationend 等事件语义 */
    @media (prefers-reduced-motion: reduce) {
      :host,
      :host * {
        animation-delay: 0s !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

  <l-m src="../ripple/ripple.html"></l-m>

  <button class="native" type="button" role="tab"></button>
  <span class="layer"></span>
  <div class="container">
    <div class="icon"><slot name="icon"></slot></div>
    <div class="label"><slot></slot></div>
  </div>
  <st-ripple></st-ripple>
<script>
  import "../color/st-color-init.js";
  import { syncAccessibleName } from "../a11y/a11y.js";
  export default async () => ({
    tag: "st-tab-item",
    attrs: {
      active: null,
      disabled: null,
    },
    watch: {
      disabled() { this.applyDisabled(); },
      active() { this.applyState?.(); },
    },
    ready() {
      const sr = this.ele.shadowRoot;
      const native = sr.querySelector(".native");
      // disabled 同步到内部原生 button：原生 disabled 天然阻断点击/键盘/焦点
      this.applyDisabled = () => {
        native.disabled = this.disabled !== null;
        native.setAttribute("aria-disabled", this.disabled !== null ? "true" : "false");
      };
      this.applyState = () => {
        native.setAttribute("aria-selected", this.active !== null ? "true" : "false");
      };
      this.applyDisabled();
      this.applyState();
      this._a11yCleanup = syncAccessibleName(this.ele, native, { fromSlot: true });
    },
    detached() {
      this._a11yCleanup?.();
    },
    proto: {},
  });
</script>
</template>
