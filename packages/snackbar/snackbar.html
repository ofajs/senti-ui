<!--
  st-snackbar — Senti-UI 消息条组件（基于 ofa.js）
  语义属性：open（显示）/ duration（毫秒，设置后自动关闭并派发 close）
  视觉在 :host 上（默认 secondary 次级色底，color 属性可换角色色），可直接用原生 CSS 属性覆盖，见 README.md
-->
<template component>
  <style>
    /* 坑 #20：默认隐藏 + 正向启用；显隐即时切换，组件不自带开合动画
       （需要动画的场景由外部包装元素提供，如 toast.js 的滑入滑出） */
    :host { display: none; }
    :host([open]) {
      display: inline-flex;
      align-items: center;
      box-sizing: border-box;
      min-width: 14.286em; /* 200px */
      max-width: 34.286em; /* 480px */
      /* 高度完全由内容决定；上下边距按内容分档（:has 感知插槽）：
         无按钮 8px 舒适；有按钮 4px（40px 按钮撑出 M3 的 48dp，按钮不再额外撑高） */
      padding: 0.571em 1em;
      border-radius: 0.286em; /* 4px */
      font-size: 14px;
      font-family: inherit;
      line-height: 1.4;
      background: var(--md-sys-color-secondary);
      color: var(--md-sys-color-on-secondary);
      box-shadow: 0 0.143em 0.571em rgba(0, 0, 0, 0.2);
    }
    /* 有操作按钮时上下边距收紧到 4px（has-action 由 slotchange 探测挂载——
       :host(:has()) 嵌套函数选择器在 ofa 样式作用域下不生效，坑 #20 同类） */
    :host([has-action]) {
      padding-block: 0.286em;
    }


    .content {
      flex: 1;
      min-width: 0;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 0.571em;
      margin-left: 1.43em;
      /* 操作区继承文字色（跟随默认底色或 color 属性自动配对） */
    }

    l-m { display: none; }
  </style>

  <span class="content"><slot></slot></span>
  <span class="actions"><slot name="action"></slot></span>

  <script>
    import "../color/st-color-init.js";
    export default async () => ({
      tag: "st-snackbar",
      attrs: {
        open: null,
        duration: null,
        color: null,
      },
      watch: {
        // watch 初始化也会以初始值触发一次（坑 #27），用 open !== null 判断真实打开
        open() {
          clearTimeout(this._hideTimer);
          if (this.open !== null && this.duration !== null) {
            const ms = Number(this.duration);
            if (ms > 0) {
              this._hideTimer = setTimeout(() => this.hide(), ms);
            }
          }
        },
        color() { this.applyColor(); },
      },
      attached() {},
      ready() {
        const ele = this.ele;
        // proto 方法挂在 ofa 实例上，原生元素不可见（坑 #24），桥接 hide 到宿主 property
        ele.hide = () => this.hide();
        // action 插槽有无内容 → has-action 属性 → 动态分档上下边距
        const actionSlot = ele.shadowRoot.querySelector('slot[name="action"]');
        const syncHasAction = () => {
          ele.toggleAttribute("has-action", actionSlot.assignedElements().length > 0);
        };
        actionSlot.addEventListener("slotchange", syncHasAction);
        syncHasAction();
        this.applyColor();
      },
      detached() {
        clearTimeout(this._hideTimer);
      },
      proto: {
        // color 接受 M3 角色名或 color 模块自定义变量名（如 color="error" → error 底 + on-error 字），
        // 未设置时用默认主题次级色（secondary / on-secondary）
        applyColor() {
          const s = this.ele.style;
          const name = this.color;
          if (!name) {
            s.background = "";
            s.color = "";
            return;
          }
          s.background = `var(--md-sys-color-${name}, var(--${name}, var(--md-sys-color-secondary)))`;
          s.color = `var(--md-sys-color-on-${name}, var(--on-${name}, var(--md-sys-color-on-secondary)))`;
        },
        // 关闭（自动或 JS 调用）并派发 close 事件；显隐即时切换（组件不自带动画）
        hide() {
          if (this.open === null) return;
          clearTimeout(this._hideTimer);
          this.ele.removeAttribute("open");
          this.ele.dispatchEvent(new Event("close", { bubbles: true, composed: true }));
        },
      },
    });
  </script>
</template>
