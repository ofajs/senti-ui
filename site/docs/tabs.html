              <h1>Tabs <code>st-tab-bar</code></h1>
              <p class="doc-lead">标签栏只负责外观与指示条动画：active 由外部逻辑切换，切换后内容面板由你自己的 data 决定。st-tab-item 支持 icon 插槽与 disabled，宽度与字号直接用原生 CSS 调整。</p>

                    <tr><td><code>style</code></td><td>原生 CSS</td><td>无</td><td>可写 <code>flex</code> 等分；st-tab-bar 上可写 font-size</td></tr>
                  </tbody>
                </table>

              <div class="doc-block">

                <ul class="api-list">
                  <li>st-tab-bar 无语义属性；item 插槽：<code>icon</code> / 默认文字。</li>
                  <li>事件：item 的 click 原生冒泡（composed）；disabled 项不派发。</li>
                  <li>active 由外部逻辑切换，组件不自动管理；切换后指示条 0.3s 跟随。</li>
                  <li>键盘：Tab 聚焦、Enter / Space 激活，focus-visible 有焦点环。</li>
                  <li>默认高度 48px、文字 13px；改 font-size 等比缩放。</li>
                  <li>bar 是 flex 容器，不会自动等分或滚动；等分写 <code>flex: 1</code>，项多时自行控制宽度。</li>
                </ul>
              </div>

            demo2Code: "<div style=\"width: 100%;\">\n                    <span class=\"demo-label\">带图标 · 4 项</span>\n                    <st-tab-bar style=\"width: 100%; margin-top: 6px;\">\n                      <st-tab-item attr:active=\"iconTab === 0\" on:click=\"iconTab = 0\"><iconify-icon slot=\"icon\" icon=\"mdi:home-outline\"></iconify-icon>首页</st-tab-item>\n                      <st-tab-item attr:active=\"iconTab === 1\" on:click=\"iconTab = 1\"><iconify-icon slot=\"icon\" icon=\"mdi:magnify\"></iconify-icon>发现</st-tab-item>\n                      <st-tab-item attr:active=\"iconTab === 2\" on:click=\"iconTab = 2\"><iconify-icon slot=\"icon\" icon=\"mdi:bell-outline\"></iconify-icon>通知</st-tab-item>\n                      <st-tab-item attr:active=\"iconTab === 3\" on:click=\"iconTab = 3\"><span slot=\"icon\">👤</span>我的</st-tab-item>\n                    </st-tab-bar>\n                    <span class=\"demo-note\" style=\"display: block;\">当前图标标签：{{iconName}}</span>\n                  </div>\n                  <div style=\"width: 100%;\">\n                    <span class=\"demo-label\">纯文字 · font-size: 12px</span>\n                    <st-tab-bar style=\"width: 100%; font-size: 12px; margin-top: 6px;\">\n                      <st-tab-item attr:active=\"textTab === 0\" on:click=\"textTab = 0\">概览</st-tab-item>\n                      <st-tab-item attr:active=\"textTab === 1\" on:click=\"textTab = 1\">活动</st-tab-item>\n                      <st-tab-item attr:active=\"textTab === 2\" on:click=\"textTab = 2\">设置</st-tab-item>\n                    </st-tab-bar>\n                    <span class=\"demo-note\" style=\"display: block;\">当前文字标签：{{textName}}</span>\n                  </div>",
            demo3Code: "<st-tab-bar style=\"width: 100%;\">\n                    <st-tab-item attr:active=\"guardTab === 0\" on:click=\"guardSelect(0)\"><iconify-icon slot=\"icon\" icon=\"mdi:inbox-arrow-down\"></iconify-icon>收件箱</st-tab-item>\n                    <st-tab-item attr:active=\"guardTab === 1\" on:click=\"guardSelect(1)\"><iconify-icon slot=\"icon\" icon=\"mdi:send\"></iconify-icon>已发送</st-tab-item>\n                    <st-tab-item disabled><iconify-icon slot=\"icon\" icon=\"mdi:message-text\"></iconify-icon>聊天</st-tab-item>\n                    <st-tab-item disabled><iconify-icon slot=\"icon\" icon=\"mdi:cog\"></iconify-icon>设置</st-tab-item>\n                  </st-tab-bar>\n                  <span class=\"demo-note\" style=\"display: block;\">当前：{{guardName}} · 可用项点击 {{guardClicks}} 次（点禁用项不增加）</span>",
            demo4Code: "<div style=\"width: 100%;\">\n                    <span class=\"demo-label\">flex: 1 等分 · 3 项</span>\n                    <st-tab-bar style=\"width: 100%; margin-top: 6px;\">\n                      <st-tab-item style=\"flex: 1;\" attr:active=\"eqTab === 0\" on:click=\"eqTab = 0\">日</st-tab-item>\n                      <st-tab-item style=\"flex: 1;\" attr:active=\"eqTab === 1\" on:click=\"eqTab = 1\">周</st-tab-item>\n                      <st-tab-item style=\"flex: 1;\" attr:active=\"eqTab === 2\" on:click=\"eqTab = 2\">月</st-tab-item>\n                    </st-tab-bar>\n                    <span class=\"demo-note\" style=\"display: block;\">当前周期：{{eqName}}</span>\n                  </div>\n                  <div style=\"width: 100%;\">\n                    <span class=\"demo-label\">font-size: 12px · 4 项按内容宽</span>\n                    <st-tab-bar style=\"width: 100%; font-size: 12px; margin-top: 6px;\">\n                      <st-tab-item attr:active=\"smallTab === 0\" on:click=\"smallTab = 0\">概览</st-tab-item>\n                      <st-tab-item attr:active=\"smallTab === 1\" on:click=\"smallTab = 1\">成员</st-tab-item>\n                      <st-tab-item attr:active=\"smallTab === 2\" on:click=\"smallTab = 2\">账单</st-tab-item>\n                      <st-tab-item attr:active=\"smallTab === 3\" on:click=\"smallTab = 3\">设置</st-tab-item>\n                    </st-tab-bar>\n                    <span class=\"demo-note\" style=\"display: block;\">当前：{{smallName}}</span>\n                  </div>",
            demo5Code: "<st-tab-bar style=\"width: 100%;\">\n                    <st-tab-item attr:active=\"progTab === 0\" on:click=\"progSelect(0)\"><iconify-icon slot=\"icon\" icon=\"mdi:contrast-circle\"></iconify-icon>概览</st-tab-item>\n                    <st-tab-item attr:active=\"progTab === 1\" on:click=\"progSelect(1)\"><span slot=\"icon\">◫</span>活动</st-tab-item>\n                    <st-tab-item attr:active=\"progTab === 2\" on:click=\"progSelect(2)\"><iconify-icon slot=\"icon\" icon=\"mdi:cog\"></iconify-icon>设置</st-tab-item>\n                  </st-tab-bar>\n                  <div class=\"row\">\n                    <st-button variant=\"outlined\" on:click=\"prevTab\">上一项</st-button>\n                    <st-button variant=\"outlined\" on:click=\"nextTab\">下一项</st-button>\n                    <st-button variant=\"text\" on:click=\"progSelect(2)\">跳到设置</st-button>\n                  </div>\n                  <span class=\"demo-note\" style=\"display: block;\">当前：{{progName}} · 最近操作：{{lastAction}}</span>",
            demo6Code: "<div class=\"demo-cell\">\n                    <span class=\"demo-label\">工作区</span>\n                    <st-tab-bar style=\"width: 100%;\">\n                      <st-tab-item attr:active=\"tabA === 0\" on:click=\"tabA = 0\">概览</st-tab-item>\n                      <st-tab-item attr:active=\"tabA === 1\" on:click=\"tabA = 1\">成员</st-tab-item>\n                      <st-tab-item attr:active=\"tabA === 2\" on:click=\"tabA = 2\">设置</st-tab-item>\n                    </st-tab-bar>\n                    <span class=\"demo-note\" style=\"display: block;\">当前：{{tabAName}}</span>\n                  </div>\n                  <div class=\"demo-cell\">\n                    <span class=\"demo-label\">报表周期</span>\n                    <st-tab-bar style=\"width: 100%;\">\n                      <st-tab-item attr:active=\"tabB === 0\" on:click=\"tabB = 0\">日</st-tab-item>\n                      <st-tab-item attr:active=\"tabB === 1\" on:click=\"tabB = 1\">周</st-tab-item>\n                      <st-tab-item attr:active=\"tabB === 2\" on:click=\"tabB = 2\">月</st-tab-item>\n                    </st-tab-bar>\n                    <span class=\"demo-note\" style=\"display: block;\">当前：{{tabBName}}</span>\n                  </div>",
            tab: 0,
            switchCount: 0,
            iconTab: 0,
            textTab: 0,
            guardTab: 0,
            guardClicks: 0,
            eqTab: 0,
            smallTab: 0,
            progTab: 0,
            lastAction: "（无）",
            tabA: 0,
            tabB: 0,
          },
          proto: {
            toggleCode(key) {
              this.codeView[key] = !this.codeView[key];
            },
            get tabName() {
              return ["邮件", "通话", "收藏"][this.tab] || "";
            },
            get iconName() {
              return ["首页", "发现", "通知", "我的"][this.iconTab] || "";
            },
            get textName() {
              return ["概览", "活动", "设置"][this.textTab] || "";
            },
            get guardName() {
              return ["收件箱", "已发送", "（禁用）", "（禁用）"][this.guardTab] || "";
            },
            get eqName() {
              return ["日", "周", "月"][this.eqTab] || "";
            },
            get smallName() {
              return ["概览", "成员", "账单", "设置"][this.smallTab] || "";
            },
            get progName() {
              return ["概览", "活动", "设置"][this.progTab] || "";
            },
            get tabAName() {
              return ["概览", "成员", "设置"][this.tabA] || "";
            },
            get tabBName() {
              return ["日", "周", "月"][this.tabB] || "";
            },
            select(i) {
              this.tab = i;
              this.switchCount += 1;
            },
            guardSelect(i) {
              this.guardTab = i;
              this.guardClicks += 1;
            },
            progSelect(i) {
              this.progTab = i;
              this.lastAction = "跳到第 " + (i + 1) + " 项";
            },
            prevTab() {
              this.progTab = (this.progTab + 2) % 3;
              this.lastAction = "上一项";
            },
            nextTab() {
              this.progTab = (this.progTab + 1) % 3;
              this.lastAction = "下一项";
            },
          },
        });
      </script>
    </template>
  </o-app>
