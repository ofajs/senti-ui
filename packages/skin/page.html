  <div class="toolbar">

      <span class="muted">M3：内嵌 2px 描边；Apple：外侧柔和光圈；Windows：2px 焦点矩形 + accent 底线；shadcn：外扩 2px ring</span>
    </div>

  <h3>浮层：菜单 / 对话框 / 选择器</h3>
  <div class="stage">
    <div class="row">
      <st-menu>
        <st-button slot="trigger" variant="outlined">打开菜单</st-button>
        <st-menu-item><span slot="prefix">✏</span>编辑</st-menu-item>
        <st-menu-item><span slot="prefix">⧉</span>复制</st-menu-item>
        <st-menu-item disabled><span slot="prefix">⌫</span>删除</st-menu-item>
      </st-menu>
      <st-button variant="outlined" on:click="dialogOpen = true">打开对话框</st-button>
      <st-select placeholder="选择城市">
        <option value="sh">上海</option>
        <option value="bj">北京</option>
      </st-select>
      <st-select variant="filled" placeholder="Filled select">
        <option value="a">选项 A</option>
        <option value="b">选项 B</option>
      </st-select>
    </div>
    <p class="note">
      所有浮层共用 <span class="code">--st-menu-*</span> / <span class="code">--st-dialog-*</span> /

  <div class="stage">
    <div class="row">

      <st-list style="width: 240px;">
        <st-list-item button>可点击列表项</st-list-item>
        <st-list-item>普通列表项</st-list-item>
        <st-list-item collapsible>折叠项</st-list-item>
      </st-list>
      <st-textarea placeholder="多行输入" rows="3" style="width: 240px;"></st-textarea>

  <h3>选择与反馈：check / switch / slider / progress</h3>
  <div class="stage">
    <div class="row">
      <st-checkbox checked>复选框</st-checkbox>
      <st-switch checked>开关</st-switch>
      <st-radio name="skin-radio" checked>单选</st-radio>
    </div>
    <div class="row">
      <st-slider default-value="60" style="width: 240px;"></st-slider>
      <st-progress value="60" style="width: 240px;"></st-progress>
      <st-progress circular value="60"></st-progress>

  <h3>导航 / 标签 / 气泡 / 消息</h3>
  <div class="stage">
    <div class="row">
      <st-tab-bar style="width: 320px;">
        <st-tab-item active>邮件</st-tab-item>
        <st-tab-item>通话</st-tab-item>
        <st-tab-item>设置</st-tab-item>
      </st-tab-bar>
      <st-nav-bar style="width: 320px;">
        <st-nav-item active><span slot="icon">★</span>首页</st-nav-item>
        <st-nav-item><span slot="icon">☆</span>我的</st-nav-item>
      </st-nav-bar>
    </div>
    <div class="row">
      <st-tooltip content="材质随皮肤切换">
        <st-button variant="outlined">悬停提示</st-button>
      </st-tooltip>
      <st-badges value="8"><st-icon-button aria-label="通知">🔔</st-icon-button></st-badges>
      <st-snackbar open>消息条</st-snackbar>
    </div>
  </div>

  <st-dialog sync:open="dialogOpen" auto-close>
    <h2 slot="headline">皮肤下的对话框</h2>
    <p>面板圆角、阴影、毛玻璃、边框和密度都由皮肤 token 决定；颜色仍来自 M3 角色。</p>
    <div slot="actions">
      <st-button variant="text" on:click="dialogOpen = false">关闭</st-button>
    </div>
  </st-dialog>

  <h3>怎么切换</h3>
  <pre><code>&lt;!-- 方式一：跑起来切换（持久化到 localStorage，同源全站跟随） --&gt;
&lt;script type="module"&gt;
  import { setSkin } from "/packages/skin/st-skin.js";
  setSkin("apple"); // "m3" | "apple" | "windows" | "shadcn" | "cyberpunk" | 自定义注册的皮肤
&lt;/script&gt;

&lt;!-- 方式二：静态写死，首帧就是目标皮肤（无闪切） --&gt;
&lt;html data-skin="apple"&gt;
&lt;link rel="stylesheet" href="/packages/skin/apple.css"&gt;
</code></pre>
  <p class="note">
    皮肤 CSS 的全部规则都在 <span class="code">[data-skin="名称"]</span> 作用域内，
    所以多套皮肤可以同时加载、互不污染；切换只改 <span class="code">&lt;html data-skin&gt;</span>。
    颜色与深浅色主题仍由 color 模块和 st-boot 管理，皮肤不参与配色。
  </p>

  <script>
    export default async () => ({
      data: {
        skin: "m3",
        dialogOpen: false,
        skins: [
          { id: "m3", label: "M3 材质" },
          { id: "apple", label: "Apple 毛玻璃" },
          { id: "windows", label: "Windows 11 风格" },
          { id: "shadcn", label: "shadcn 扁平" },
          { id: "cyberpunk", label: "Cyberpunk 霓虹" },
        ],
      },
      ready() {
        this.syncSkin();
        // 入口脚本是 module，可能晚于页面 ready 执行：轮询就绪后再同步一次
        if (!window.__stSkin) {
          const timer = setInterval(() => {
            if (window.__stSkin) {
              this.syncSkin();
              clearInterval(timer);
            }
          }, 50);
          setTimeout(() => clearInterval(timer), 3000);
        }
      },
      proto: {
        syncSkin() {
          this.skin =
            document.documentElement.dataset.skin ||
            localStorage.getItem("st-skin") ||
            "m3";
        },
        pick(id) {
          if (window.__stSkin) window.__stSkin.setSkin(id);
          this.skin = id;
        },
        focusDemo() {
          if (!this.shadow || !this.shadow.$) return;
          const input = this.shadow.$("#focus-input");
          if (input && input.focus) input.focus();
        },
      },
    });
  </script>
</template>
