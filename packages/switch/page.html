<!-- st-switch 验收页，由同目录 index.html 通过 <o-page> 加载 -->
<template page>
  <style>
    :host { display: grid; gap: 20px; padding: 40px; align-content: start; }
    section { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
    h3 { margin: 0; font-size: 14px; color: var(--md-sys-color-on-surface-variant); width: 100%; }
  </style>

  <section>
    <h3>基础</h3>
    <st-switch>Wi-Fi</st-switch>
    <st-switch checked>蓝牙（初始开启）</st-switch>
    <st-switch disabled>飞行模式（禁用）</st-switch>
    <st-switch disabled checked>勿扰（禁用+开启）</st-switch>
  </section>

  <section>
    <h3>color 属性</h3>
    <st-switch color="success" checked>成功色</st-switch>
    <st-switch color="error" checked>错误色</st-switch>
  </section>

  <section>
    <h3>等比缩放（宿主 font-size）</h3>
    <st-switch style="font-size: 12px;" checked>12px</st-switch>
    <st-switch checked>14px</st-switch>
    <st-switch style="font-size: 20px;" checked>20px</st-switch>
  </section>

  <section>
    <h3>change 事件计数：<span class="code" style="font-family: ui-monospace, monospace;">{{count}}</span></h3>
    <st-switch on:change="onCountChange">点我</st-switch>
  </section>

  <script>
    export default async () => ({
      data: { count: 0 },
      proto: {
        onCountChange() {
          this.count += 1;
        },
      },
    });
  </script>
</template>
