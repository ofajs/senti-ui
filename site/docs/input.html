          <article class="doc-page">
            <header class="doc-hero">
              <p class="doc-kicker">表单 · 2 / 23</p>
              <h1>Input <code>st-input</code></h1>
              <p class="doc-lead">单行输入框：outlined / filled 两种类型，前后缀插槽与原生 type。value 是运行时状态，初始值用 default-value；focus 描边与 caret 由 color 语义色控制。</p>
              <div class="doc-links">
                <a href="../index.html">组件目录</a>
                <a href="https://github.com/ofajs/senti-ui/blob/main/packages/input/README.md" target="_blank" rel="noreferrer">GitHub README <iconify-icon icon="mdi:open-in-new"></iconify-icon></a>
              </div>
            </header>

            <section class="doc-section">
              <h2>两种 variant</h2>
              <p class="doc-section-lead">outlined 有完整一圈描边，适合常规表单；filled 用容器底色加底边线，视觉更轻。两者共享同一套高度、内边距与 focus 动画，只切换材质。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>st-input</code></div>
                <div class="demo-stage grid">
                  <div class="demo-cell">
                    <span class="demo-label">outlined</span>
                    <st-input placeholder="you@example.com"><iconify-icon slot="prefix" icon="mdi:email-outline"></iconify-icon></st-input>
                  </div>
                  <div class="demo-cell">
                    <span class="demo-label">filled + 初始值</span>
                    <st-input variant="filled" default-value="已填充的内容"></st-input>
                  </div>
                  <div class="demo-cell">
                    <span class="demo-label">前后缀插槽</span>
                    <st-input placeholder="搜索组件"><iconify-icon slot="prefix" icon="mdi:magnify"></iconify-icon><iconify-icon slot="suffix" icon="mdi:keyboard-return"></iconify-icon></st-input>
                  </div>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码</summary>
                <pre><code>&lt;st-input placeholder="you@example.com"&gt;
  &lt;iconify-icon slot="prefix" icon="mdi:email-outline"&gt;&lt;/iconify-icon&gt;
&lt;/st-input&gt;

&lt;st-input variant="filled" default-value="已填充的内容"&gt;&lt;/st-input&gt;</code></pre>
              </details>
            </section>

            <section class="doc-section">
              <h2>尺寸、宽度与圆角</h2>
              <p class="doc-section-lead">尺寸类默认值都用 em：默认高 2.857em、最小宽 13.571em。只改 <code>font-size</code> 就能整体等比缩放，宽度和圆角直接用原生 CSS 覆写。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>font-size / width / border-radius</code></div>
                <div class="demo-stage grid">
                  <div class="demo-cell">
                    <span class="demo-label">12px</span>
                    <st-input style="font-size: 12px;" placeholder="小号 12px"></st-input>
                  </div>
                  <div class="demo-cell">
                    <span class="demo-label">14px（默认）</span>
                    <st-input placeholder="默认 14px"></st-input>
                  </div>
                  <div class="demo-cell">
                    <span class="demo-label">18px</span>
                    <st-input style="font-size: 18px;" placeholder="大号 18px"></st-input>
                  </div>
                  <div class="demo-cell">
                    <span class="demo-label">固定宽度</span>
                    <st-input style="width: 320px;" placeholder="width: 320px"></st-input>
                  </div>
                  <div class="demo-cell">
                    <span class="demo-label">pill 圆角</span>
                    <st-input variant="filled" style="border-radius: 999px; border: 1px solid var(--md-sys-color-outline); padding: 0 1.429em;" placeholder="pill filled"></st-input>
                  </div>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码</summary>
                <pre><code>&lt;st-input style="font-size: 12px;" placeholder="小号"&gt;&lt;/st-input&gt;
&lt;st-input style="width: 320px;" placeholder="固定宽度"&gt;&lt;/st-input&gt;
&lt;st-input variant="filled"
  style="border-radius: 999px; border: 1px solid var(--md-sys-color-outline);"
  placeholder="pill"&gt;&lt;/st-input&gt;</code></pre>
              </details>
            </section>

            <section class="doc-section">
              <h2>type 与前后缀操作</h2>
              <p class="doc-section-lead"><code>type</code> 原样转发给内部 input，密码、邮箱、数字等原生行为都可直接用。前后缀既能放图标，也能放可点击操作；密码可见切换由页面数据驱动 type，不经过组件内部状态。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>type / prefix / suffix</code></div>
                <div class="demo-stage grid">
                  <div class="demo-cell">
                    <span class="demo-label">email</span>
                    <st-input type="email" placeholder="you@example.com"><iconify-icon slot="prefix" icon="mdi:email-outline"></iconify-icon></st-input>
                  </div>
                  <div class="demo-cell">
                    <span class="demo-label">number</span>
                    <st-input type="number" default-value="42"><span slot="prefix">#</span></st-input>
                  </div>
                  <div class="demo-cell">
                    <span class="demo-label">password + 可见切换</span>
                    <st-input attr:type="showPwd ? 'text' : 'password'" default-value="senti-ui" placeholder="密码">
                      <span slot="suffix" on:click="showPwd = !showPwd" style="cursor: pointer; user-select: none;">{{showPwd ? '🙈' : '👁'}}</span>
                    </st-input>
                  </div>
                </div>
                <span class="demo-note" style="grid-column: 1 / -1;">密码当前为{{showPwd ? '明文' : '隐藏'}}状态 · number 保留原生步进与校验</span>
              </div>
              <details class="snippet">
                <summary>示例代码（密码可见切换）</summary>
                <pre><code>&lt;st-input attr:type="showPwd ? 'text' : 'password'" default-value="senti-ui"&gt;
  &lt;span slot="suffix" on:click="showPwd = !showPwd"&gt;显示 / 隐藏&lt;/span&gt;
&lt;/st-input&gt;</code></pre>
              </details>
            </section>

            <section class="doc-section">
              <h2>disabled 与 readonly</h2>
              <p class="doc-section-lead">disabled 降低到 0.38 透明度、阻断聚焦与输入；readonly 仍可聚焦、可选中复制，只是不可修改。布尔属性在 ofa 页面里用 <code>attr:</code> 绑定，静态场景直接写裸属性。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>disabled / readonly</code></div>
                <div class="demo-stage grid">
                  <div class="demo-cell">
                    <span class="demo-label">disabled</span>
                    <st-input default-value="不可编辑" disabled></st-input>
                  </div>
                  <div class="demo-cell">
                    <span class="demo-label">disabled + filled</span>
                    <st-input variant="filled" placeholder="禁用填充态" disabled></st-input>
                  </div>
                  <div class="demo-cell">
                    <span class="demo-label">readonly</span>
                    <st-input default-value="只读内容，可聚焦复制" readonly></st-input>
                  </div>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码</summary>
                <pre><code>&lt;st-input default-value="不可编辑" disabled&gt;&lt;/st-input&gt;
&lt;st-input variant="filled" placeholder="禁用填充态" disabled&gt;&lt;/st-input&gt;
&lt;st-input default-value="只读内容" readonly&gt;&lt;/st-input&gt;</code></pre>
              </details>
            </section>

            <section class="doc-section">
              <h2>color 语义色与校验态</h2>
              <p class="doc-section-lead"><code>color</code> 接受 M3 角色名（primary / error / success 等）或 color 工具里的自定义变量名，控制 caret 与 focus 描边。它只表达语义，不会改变未聚焦时的普通边框；校验时把结果写进 data 即可。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>color / 实时校验</code></div>
                <div class="demo-stage grid">
                  <div class="demo-cell">
                    <span class="demo-label">error</span>
                    <st-input color="error" default-value="必填项不能为空"></st-input>
                  </div>
                  <div class="demo-cell">
                    <span class="demo-label">success</span>
                    <st-input color="success" default-value="校验通过"></st-input>
                  </div>
                  <div class="demo-cell">
                    <span class="demo-label">实时邮箱校验</span>
                    <st-input attr:color="emailColor" on:input="checkEmail" placeholder="输入邮箱试试"></st-input>
                  </div>
                </div>
                <span class="demo-note" style="grid-column: 1 / -1;">{{emailHint}}</span>
              </div>
              <details class="snippet">
                <summary>示例代码（动态校验）</summary>
                <pre><code>&lt;st-input attr:color="emailColor" on:input="checkEmail"
  placeholder="输入邮箱"&gt;&lt;/st-input&gt;
&lt;span&gt;校验提示&lt;/span&gt;

&lt;script&gt;
  export default async () =&gt; ({
    data: { emailColor: "", emailHint: "输入邮箱开始校验" },
    proto: {
      checkEmail(e) {
        const ok = e.target.value.includes("@");
        this.emailColor = ok ? "success" : "error";
        this.emailHint = ok ? "格式有效" : "邮箱格式不正确";
      },
    },
  });
&lt;/script&gt;</code></pre>
              </details>
            </section>

            <section class="doc-section">
              <h2>受控值与 focus() / blur()</h2>
              <p class="doc-section-lead">页面里用 <code>sync:value</code> 把 data 与运行时值双向绑定；<code>focus()</code> / <code>blur()</code> 是组件方法，清空只需把 data 置空。这样值始终是唯一数据源，不需要直接碰内部原生 input。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>:value / on:input / methods</code></div>
                <div class="demo-stage block">
                  <div style="display: grid; gap: 10px; width: 100%; max-width: 420px;">
                    <st-input id="query-input" sync:value="query" placeholder="输入关键字，值会同步到下方"></st-input>
                    <div class="row" style="justify-content: flex-start;">
                      <st-button variant="outlined" on:click="focusQuery">focus()</st-button>
                      <st-button variant="outlined" on:click="blurQuery">blur()</st-button>
                      <st-button variant="text" on:click="clearQuery">清空</st-button>
                    </div>
                    <span class="demo-note" style="text-align: left;">value = {{query ? query : '（空）'}} · 状态：{{focusState}}</span>
                  </div>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码（受控 + 方法）</summary>
                <pre><code>&lt;st-input sync:value="query" placeholder="输入关键字"&gt;&lt;/st-input&gt;
&lt;st-button on:click="clearQuery"&gt;清空&lt;/st-button&gt;

&lt;script&gt;
  export default async () =&gt; ({
    data: { query: "" },
    proto: {
      clearQuery() { this.query = ""; },
    },
  });
&lt;/script&gt;</code></pre>
              </details>
            </section>

            <div class="doc-cols">
              <div class="doc-block">
                <h3>属性</h3>
                <table class="api">
                  <thead><tr><th>属性</th><th>类型</th><th>默认</th><th>说明</th></tr></thead>
                  <tbody>
                    <tr><td><code>variant</code></td><td>"outlined" | "filled"</td><td>"outlined"</td><td>M3 两种输入框类型</td></tr>
                    <tr><td><code>default-value</code></td><td>string</td><td>无</td><td>初始值；attached 时读取一次</td></tr>
                    <tr><td><code>placeholder</code></td><td>string</td><td>无</td><td>占位文本，转发内部 input</td></tr>
                    <tr><td><code>type</code></td><td>"text" | "password" | "email" | "number" | …</td><td>"text"</td><td>原生 input 类型</td></tr>
                    <tr><td><code>color</code></td><td>M3 角色名 / 自定义变量名</td><td>无</td><td>caret 与 focus 描边色</td></tr>
                    <tr><td><code>disabled</code></td><td>boolean</td><td>无</td><td>0.38 透明度，阻断聚焦与输入</td></tr>
                    <tr><td><code>readonly</code></td><td>boolean</td><td>无</td><td>可聚焦、不可修改</td></tr>
                  </tbody>
                </table>
              </div>
              <div class="doc-block">
                <h3>插槽 / 事件 / 注意</h3>
                <ul class="api-list">
                  <li>插槽：<code>prefix</code> / <code>suffix</code> 放图标或操作。</li>
                  <li>事件：<code>input</code> / <code>change</code>；change 已转发为 composed，可直接在宿主监听。</li>
                  <li>方法：<code>focus()</code> / <code>blur()</code>；焦点在内部透明原生 input 上。</li>
                  <li><code>value</code> 是运行时 property：ofa 页面用 <code>sync:value</code> 双向绑定，纯 JS 用 <code>el.value</code> 读写；<code>setAttribute("value")</code> 无效，初始值用 <code>default-value</code>。</li>
                  <li>默认高度 <code>2.857em</code>、最小宽 <code>13.571em</code>；改 <code>font-size</code> 等比缩放。</li>
                </ul>
              </div>
            </div>

      <script>
        export const parent = "./layout.html";

        export default async () => ({
          data: {
            showPwd: false,
            emailColor: "",
            emailHint: "输入邮箱开始校验",
            query: "",
            focusState: "未聚焦",
          },
          proto: {
            checkEmail(e) {
              const v = e.target.value.trim();
              if (!v) {
                this.emailColor = "";
                this.emailHint = "输入邮箱开始校验";
                return;
              }
              const at = v.indexOf("@");
              const ok = at > 0 && v.indexOf(".", at) > at + 1 && !v.includes(" ");
              this.emailColor = ok ? "success" : "error";
              this.emailHint = ok ? "格式有效" : "邮箱格式不正确";
            },
            focusQuery() {
              this.ele.shadowRoot.querySelector("#query-input").focus();
              this.focusState = "已聚焦";
            },
            blurQuery() {
              this.ele.shadowRoot.querySelector("#query-input").blur();
              this.focusState = "已失焦";
            },
            clearQuery() {
              this.query = "";
              this.focusState = "已清空";
            },
          },
        });
      </script>
    </template>
