<!--
  st-button — Senti-UI 按钮组件（基于 ofa.js）
  语义属性：variant(filled|outlined|text) / disabled / loading
  视觉全部在 :host 上，直接用原生 CSS 属性（style="height:32px; border-radius:8px; ..."）定制；
  材质（圆角/密度/描边/阴影/毛玻璃/动效）通过 --st-* 皮肤 token 消费，换肤见 packages/skin/README.md
-->
<template component>
  <style>
    :host {
      /* 视觉样式全部定义在 host 上，外部 style 可直接覆盖任何原生属性 */
      /* 尺寸类默认值用 em：改 font-size 即可整体等比缩放 */
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.571em;
      box-sizing: border-box;
      position: relative;
      height: var(--st-height, 2.857em);
      min-width: 3.429em;
      padding: var(--st-control-padding, 0 1.429em); /* = 圆角半径：文字刚好落在圆角转弯处 */
      border: var(--st-border-width, 1px) solid transparent;
      border-radius: var(--st-control-radius, 1.429em);
      font-size: var(--st-font-size, 14px);
      font-weight: 500;
      font-family: var(--st-font, inherit);
      letter-spacing: var(--st-letter-spacing, normal);
      line-height: 1;
      /* 颜色始终来自 M3 角色；--st-accent / --st-on-accent 由 color 属性或皮肤写入 */
      background-color: color-mix(
        in srgb,
        var(--st-accent, var(--md-sys-color-primary)) var(--st-fill-alpha, 100%),
        transparent
      );
      color: var(--st-on-accent, var(--md-sys-color-on-primary));
      /* 材质（皮肤）：默认 none = 与 M3 原样一致 */
      box-shadow: var(--st-shadow, none);
      background-image: var(--st-sheen, none);
      -webkit-backdrop-filter: var(--st-backdrop-filter, none);
      backdrop-filter: var(--st-backdrop-filter, none);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    :host([variant="outlined"]) {
      background-color: var(--st-outlined-bg, transparent);
      color: var(--st-accent, var(--md-sys-color-primary));
      border-color: var(--st-outlined-border, var(--md-sys-color-outline));
    }

    :host([variant="text"]) {
      background-color: transparent;
      background-image: none;
      color: var(--st-accent, var(--md-sys-color-primary));
      border-color: transparent;
      box-shadow: none;
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
    }

    /* M3 state layer：currentColor 半透明叠加，无需额外变量 */
    .layer {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background-color: currentColor;
      opacity: 0;
      pointer-events: none;
    }
    :host(:hover) .layer { opacity: var(--st-state-hover, 0.08); }
    :host(:active) .layer { opacity: var(--st-state-press, 0.12); }

    :host([disabled]) {
      opacity: var(--st-disabled-opacity, 0.38);
      cursor: not-allowed;
    }
    :host([disabled]) .layer { opacity: 0; }

    /* l-m 加载占位不是内容，不能参与 flex/gap 布局（否则左侧多一个 gap） */
    l-m { display: none; }

    /* 内部透明原生 button：只负责语义（点击/键盘/焦点/disabled），不承载视觉 */
    .native {
      all: unset;
      position: absolute;
      inset: 0;
      cursor: inherit;
      border-radius: inherit;
    }
    .native:focus-visible {
      /* 不用 currentColor：filled 按钮文字为白色时白圈画在浅色页面上不可见 */
      outline: var(--st-focus-ring-width, 2px) var(--st-focus-ring-style, solid)
        var(--st-focus-ring-color, var(--md-sys-color-on-surface));
      outline-offset: var(--st-focus-ring-offset, 2px);
    }

    ::slotted([slot="prefix"]),
    ::slotted([slot="suffix"]) {
      display: inline-flex;
    }

    /* loading spinner：尺寸随 font-size（1.2em），颜色随 currentColor */
    .loader {
      display: none;
      width: 1.2em;
      height: 1.2em;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: currentColor;
      border-right-color: currentColor;
      animation: st-btn-spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    :host([loading]) .loader { display: inline-flex; }
    @keyframes st-btn-spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <span class="layer" part="state-layer"></span>
  <l-m src="../ripple/ripple.html"></l-m>
  <st-ripple></st-ripple>
  <slot name="prefix"></slot>
  <span class="loader" part="loader"></span>
  <slot></slot>
  <slot name="suffix"></slot>
  <button class="native" part="control" attr:type="type" :disabled="disabled !== null || loading !== null"></button>

  <script>
    import "../color/st-color-init.js";
    import { syncAccessibleName } from "../a11y/a11y.js";
    export default async () => ({
      tag: "st-button",
      attrs: {
        variant: "filled",
        type: "button",
        color: null,
        disabled: null,
        loading: null,
      },
      watch: {
        color() { this.applyColor(); },
        variant() { this.applyColor(); },
        loading() { this.syncBusy?.(); },
      },
      ready() {
        const native = this.ele.shadowRoot.querySelector(".native");
        // 内部 button 与 slot 文字是兄弟节点，必须把文字/aria-label 同步成可访问名称
        this._a11yCleanup = syncAccessibleName(this.ele, native, { fromSlot: true });
        this.syncBusy = () => {
          native.setAttribute("aria-busy", this.loading !== null ? "true" : "false");
        };
        this.syncBusy();
        this.applyColor();
      },
      detached() {
        this._a11yCleanup?.();
      },
      proto: {
        // color 接受 M3 角色名（primary/secondary/tertiary/error…）或 color 模块的自定义变量名
        // （如 color="brand" → 消费 --brand / --on-brand，st-color-init 动态注入）。
        // 只写 CSS 变量、不直接写 background/color：这样皮肤仍能用自己的材质组合
        // （半透明、渐变、毛玻璃）消费同一个语义色，而 variant 分派继续交给 :host 规则。
        applyColor() {
          const s = this.ele.style;
          s.removeProperty("--st-accent");
          s.removeProperty("--st-on-accent");
          s.removeProperty("--st-outlined-border");
          const name = this.color;
          if (!name) return;
          const main = `var(--md-sys-color-${name}, var(--${name}, var(--md-sys-color-primary)))`;
          const on = `var(--md-sys-color-on-${name}, var(--on-${name}, var(--md-sys-color-on-primary)))`;
          s.setProperty("--st-accent", main);
          s.setProperty("--st-on-accent", on);
          // outlined 默认描边走 outline，color 语义色应同时作用于描边
          s.setProperty("--st-outlined-border", main);
        },
      },
    });
  </script>
</template>
