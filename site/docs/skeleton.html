<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skeleton — 组件文档 — Senti-UI</title>
  <meta name="description" content="Skeleton（st-skeleton）用法：加载占位：text / circle / rect 三形态，opacity 呼吸动画，prefers-reduced-motion 自动静止。" />
  <meta name="theme-color" content="#0061A4" />
  <link rel="canonical" href="https://senti.ofajs.com/site/docs/skeleton" />
  <meta property="og:url" content="https://senti.ofajs.com/site/docs/skeleton" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230061A4'/%3E%3Ccircle cx='32' cy='32' r='13' fill='white'/%3E%3C/svg%3E" />
  <script type="module">
    import "https://cdn.jsdelivr.net/gh/ofajs/ofa.js@refs/heads/v5/dist/ofa.min.mjs";
    import "https://cdn.jsdelivr.net/gh/ofajs/ofa.js@refs/heads/v5/packages/scsr/dist/scsr.min.mjs";
  </script>
  <script src="../../packages/boot/st-boot.js"></script>
  <link rel="stylesheet" href="../../packages/skin/m3.css" />
  <link rel="stylesheet" href="../../packages/skin/apple.css" />
  <link rel="stylesheet" href="../../packages/skin/shadcn.css" />
  <link rel="stylesheet" href="../../packages/skin/cyberpunk.css" />
  <link rel="stylesheet" href="../../packages/skin/windows.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); }
    body { font-family: "Inter", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
    .nojs { max-width: 720px; margin: 0 auto; padding: 12vh 24px; font-size: 15px; line-height: 1.7; }
    .nojs h1 { margin: 0 0 12px; font-size: 32px; }
    .nojs a { color: var(--md-sys-color-primary, #0061a4); }
  </style>
</head>
<body>
  <noscript>
    <div class="nojs">
      <h1>Skeleton</h1>
      <p>组件文档的示例与目录需要 JavaScript；也可以回到首页或查看 GitHub 源码。</p>
      <p><a href="../index.html">组件目录</a> · <a href="https://github.com/ofajs/senti-ui">GitHub</a></p>
    </div>
  </noscript>

  <o-app src="../app-config.js">
    <template page>
      <!-- 依赖放在 template 内：SCSR 切页时目标页 body 里的 <l-m> 不会执行 -->
      <l-m src="../../packages/skeleton/skeleton.html"></l-m>
      <l-m src="../../packages/button/button.html"></l-m>

      <link rel="stylesheet" href="../docs.css" />

          <article class="doc-page">
            <header class="doc-hero">
              <p class="doc-kicker">辅助 · 24 / 26</p>
              <h1>Skeleton <code>st-skeleton</code></h1>
              <p class="doc-lead">加载占位：内容到达前以灰块呼吸动画占位。text / circle / rect 三形态决定默认宽高与圆角；宽高一律原生 CSS 覆写，数据到达后用真实内容替换节点。</p>
              <div class="doc-links">
                <a href="../index.html">组件目录</a>
                <a href="https://github.com/ofajs/senti-ui/blob/main/packages/skeleton/README.md" target="_blank" rel="noreferrer">GitHub README <iconify-icon icon="mdi:open-in-new"></iconify-icon></a>
              </div>
            </header>

            <section class="doc-section">
              <h2>三种形态</h2>
              <p class="doc-section-lead"><code>shape</code>：text（默认整行 1em 高）/ circle（正圆 2.286em）/ rect（大块 4.286em 高）。宽度全部用 style 直接覆写。</p>
              <div class="demo">
                <div class="demo-top">
                  <span class="live"><i></i>{{codeView.demo1 ? 'CODE' : 'LIVE'}}</span>
                  <div class="demo-top-actions">
                    <code>shape</code>
                    <st-button class="demo-code-toggle" variant="text" on:click="toggleCode('demo1')">
                      <iconify-icon slot="prefix" attr:icon="codeView.demo1 ? 'mdi:eye-outline' : 'mdi:code-tags'"></iconify-icon>
                      {{codeView.demo1 ? '查看示例' : '查看代码'}}
                    </st-button>
                  </div>
                </div>
                <div class="demo-stage block" attr:hidden="codeView.demo1">
                  <st-skeleton></st-skeleton>
                  <st-skeleton style="width: 70%;"></st-skeleton>
                  <st-skeleton style="width: 45%;"></st-skeleton>
                  <div class="row">
                    <st-skeleton shape="circle"></st-skeleton>
                    <st-skeleton shape="rect" style="width: 180px;"></st-skeleton>
                  </div>
                </div>

                <st-code class="demo-code" attr:hidden="!codeView.demo1" lang="html" :code="demo1Code"></st-code>
              </div>
            </section>

            <section class="doc-section">
              <h2>组合成卡片骨架</h2>
              <p class="doc-section-lead">circle 头像 + 两行文字 + rect 块，自由拼出任意内容的占位形态；字号等比缩放。</p>
              <div class="demo">
                <div class="demo-top">
                  <span class="live"><i></i>{{codeView.demo2 ? 'CODE' : 'LIVE'}}</span>
                  <div class="demo-top-actions">
                    <code>组合</code>
                    <st-button class="demo-code-toggle" variant="text" on:click="toggleCode('demo2')">
                      <iconify-icon slot="prefix" attr:icon="codeView.demo2 ? 'mdi:eye-outline' : 'mdi:code-tags'"></iconify-icon>
                      {{codeView.demo2 ? '查看示例' : '查看代码'}}
                    </st-button>
                  </div>
                </div>
                <div class="demo-stage" attr:hidden="codeView.demo2">
                  <div style="width: 260px; padding: 16px; border-radius: 12px; background: var(--md-sys-color-surface-container-low); display: grid; gap: 10px;">
                    <div style="display: flex; gap: 12px; align-items: center;">
                      <st-skeleton shape="circle" style="width: 44px; height: 44px;"></st-skeleton>
                      <div style="flex: 1; display: grid; gap: 8px;">
                        <st-skeleton style="width: 45%; height: 0.857em;"></st-skeleton>
                        <st-skeleton style="width: 85%; height: 0.786em;"></st-skeleton>
                      </div>
                    </div>
                    <st-skeleton shape="rect"></st-skeleton>
                  </div>
                </div>

                <st-code class="demo-code" attr:hidden="!codeView.demo2" lang="html" :code="demo2Code"></st-code>
              </div>
            </section>

            <section class="doc-section">
              <h2>骨架 / 内容切换</h2>
              <p class="doc-section-lead">ofa 页面配合 <code>o-if</code> 与数据状态变量切换骨架与真实内容，不需要手动操作 DOM。</p>
              <div class="demo">
                <div class="demo-top">
                  <span class="live"><i></i>{{codeView.demo3 ? 'CODE' : 'LIVE'}}</span>
                  <div class="demo-top-actions">
                    <code>o-if</code>
                    <st-button class="demo-code-toggle" variant="text" on:click="toggleCode('demo3')">
                      <iconify-icon slot="prefix" attr:icon="codeView.demo3 ? 'mdi:eye-outline' : 'mdi:code-tags'"></iconify-icon>
                      {{codeView.demo3 ? '查看示例' : '查看代码'}}
                    </st-button>
                  </div>
                </div>
                <div class="demo-stage block" attr:hidden="codeView.demo3">
                  <div class="row">
                    <st-button variant="outlined" on:click="reload">重新加载</st-button>
                    <span class="demo-note" style="width: auto;">loading = {{loading}}</span>
                  </div>
                  <div style="min-width: 220px; display: grid; gap: 8px;">
                    <o-if :value="loading">
                      <st-skeleton style="width: 60%;"></st-skeleton>
                      <st-skeleton style="width: 90%;"></st-skeleton>
                    </o-if>
                    <o-if :value="!loading">
                      <span>加载完成的真实内容（共 {{lines}} 条）</span>
                    </o-if>
                  </div>
                </div>

                <st-code class="demo-code" attr:hidden="!codeView.demo3" lang="html" :code="demo3Code"></st-code>
              </div>
            </section>

            <div class="doc-cols">
              <div class="doc-block">
                <h3>属性</h3>
                <table class="api">
                  <thead><tr><th>属性</th><th>类型</th><th>默认</th><th>说明</th></tr></thead>
                  <tbody>
                    <tr><td><code>shape</code></td><td>text | circle | rect</td><td>text</td><td>text 整行 1em / circle 正圆 / rect 大块 60px</td></tr>
                  </tbody>
                </table>
              </div>
              <div class="doc-block">
                <h3>注意</h3>
                <ul class="api-list">
                  <li>纯展示：不可聚焦、无事件、无 color 属性，读屏透明。</li>
                  <li>呼吸动画 1.6s opacity 循环；<code>prefers-reduced-motion</code> 自动静止。</li>
                  <li>皮肤 token <code>--st-skeleton-color/duration/width/height/size/radius</code>。</li>
                  <li>无交互语义，无需 aria；数据到达后替换节点即可。</li>
                </ul>
              </div>
            </div>

            <nav class="doc-pager" aria-label="上下篇">
              <a class="pager-link" olink href="./ripple.html"><span>上一页</span><iconify-icon icon="mdi:arrow-left"></iconify-icon> Ripple</a><a class="pager-link pager-next" olink href="./tools.html"><span>下一页</span>Command tools <iconify-icon icon="mdi:arrow-right"></iconify-icon></a>
            </nav>
          </article>
      <script>
        export const parent = "./layout.html";

        export default async () => ({
          data: {
            codeView: { demo1: false, demo2: false, demo3: false },
            loading: true,
            lines: 3,
            demo1Code: "<st-skeleton></st-skeleton>\n<st-skeleton style=\"width: 70%;\"></st-skeleton>\n<st-skeleton shape=\"circle\"></st-skeleton>\n<st-skeleton shape=\"rect\" style=\"width: 180px;\"></st-skeleton>",
            demo2Code: "<div style=\"padding: 16px; border-radius: 12px; background: var(--md-sys-color-surface-container-low); display: grid; gap: 10px;\">\n  <div style=\"display: flex; gap: 12px; align-items: center;\">\n    <st-skeleton shape=\"circle\" style=\"width: 44px; height: 44px;\"></st-skeleton>\n    <div style=\"flex: 1; display: grid; gap: 8px;\">\n      <st-skeleton style=\"width: 45%;\"></st-skeleton>\n      <st-skeleton style=\"width: 85%;\"></st-skeleton>\n    </div>\n  </div>\n  <st-skeleton shape=\"rect\"></st-skeleton>\n</div>",
            demo3Code: "<o-if :value=\"loading\">\n  <st-skeleton style=\"width: 60%;\"></st-skeleton>\n  <st-skeleton style=\"width: 90%;\"></st-skeleton>\n</o-if>\n<o-if :value=\"!loading\">\n  <span>加载完成的真实内容</span>\n</o-if>\n\n<!-- 页面 script 里：reload() { this.loading = true; 1.2 秒后 this.loading = false } -->",
          },
          proto: {
            toggleCode(key) {
              this.codeView[key] = !this.codeView[key];
            },
            reload() {
              this.loading = true;
              setTimeout(() => { this.loading = false; }, 1200);
            },
          },
          ready() {
            setTimeout(() => { this.loading = false; }, 1200);
          },
        });
      </script>
    </template>
  </o-app>

  <script type="module">
    import { setThemeMode, getThemeMode } from "../../packages/color/st-theme-mode.js";
    import { setSkin, getSkin } from "../../packages/skin/st-skin.js";
    import alert from "../../packages/dialog/alert.js";
    import confirm from "../../packages/dialog/confirm.js";
    import prompt from "../../packages/dialog/prompt.js";
    import toast from "../../packages/snackbar/toast.js";
    import contextMenu from "../../packages/menu/context-menu.js";
    window.__site = Object.assign(window.__site || {}, { setThemeMode, getThemeMode, setSkin, getSkin, alert, confirm, prompt, toast, contextMenu });
    window.__siteReady = true;
  </script>
</body>
</html>
