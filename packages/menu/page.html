<template page>
  <style>
    :host { display: grid; gap: 24px; padding: 40px; align-content: start; }
    section { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
    h3 { margin: 0; font-size: 14px; color: var(--md-sys-color-on-surface-variant); width: 100%; }
  </style>

  <section>
    <h3>基础</h3>
    <st-menu on:open="onOpen" on:close="onClose">
      <st-button slot="trigger" variant="outlined">右对齐菜单 ▾</st-button>
      <st-menu-item><span slot="prefix">✏️</span>编辑<span slot="suffix">⌘E</span></st-menu-item>
      <st-menu-item><span slot="prefix">📋</span>复制<span slot="suffix">⌘C</span></st-menu-item>
      <st-menu-item disabled><span slot="prefix">🗑</span>删除（禁用）</st-menu-item>
      <hr>
      <st-menu-item on:click="onAbout">关于</st-menu-item>
    </st-menu>

    <st-menu align="left">
      <st-button slot="trigger" variant="text">左对齐菜单 ▾</st-button>
      <st-menu-item>选项 A</st-menu-item>
      <st-menu-item>选项 B</st-menu-item>
    </st-menu>
  </section>

  <section>
    <h3>sync:open 数据绑定（菜单开合状态回写）</h3>
    <st-menu sync:open="menuOpen">
      <st-button slot="trigger" variant="outlined">状态绑定菜单 ▾</st-button>

      <st-menu-item>选项二</st-menu-item>
    </st-menu>
    <span style="font-size:13px; color: var(--md-sys-color-on-surface-variant);">menuOpen 数据：<span class="code" style="font-family: ui-monospace, monospace;">{{menuOpen}}</span>（选中/点外部/Escape 关闭后自动回写 false）</span>
  </section>

  <section>
    <h3>多级子菜单（st-menu 直接嵌套，hover 展开，选中任意项整链关闭）</h3>
    <st-menu>
      <st-button slot="trigger" variant="outlined">多级菜单 ▾</st-button>
      <st-menu-item><span slot="prefix">📄</span>新建</st-menu-item>
      <st-menu>
        <st-menu-item slot="trigger"><span slot="prefix">🗂</span>导出为<span slot="suffix">▸</span></st-menu-item>
        <st-menu-item>PDF</st-menu-item>
        <st-menu-item>Markdown</st-menu-item>
        <st-menu>
          <st-menu-item slot="trigger">图片<span slot="suffix">▸</span></st-menu-item>
          <st-menu-item>PNG</st-menu-item>
          <st-menu-item>SVG</st-menu-item>
        </st-menu>

    </st-menu>

      <span class="code" style="font-family: ui-monospace, monospace;">Escape</span> 关闭、点击组件外部关闭；菜单项 <span class="code" style="font-family: ui-monospace, monospace;">Tab</span> 良好可达、<span class="code" style="font-family: ui-monospace, monospace;">Enter</span>/<span class="code" style="font-family: ui-monospace, monospace;">Space</span> 激活
    </p>

  </p>

  <script>
    export default async () => ({
      data: { lastPick: "（无）", openCount: 0, menuOpen: false },
      proto: {
        onOpen() {
          this.openCount += 1;
        },
        onClose() {
          this.openCount -= 1;
        },
        onAbout() {
          this.lastPick = "关于";
        },
      },
    });
  </script>
