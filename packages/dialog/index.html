<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>st-dialog Demo</title>
  <script src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js/dist/ofa.min.mjs" type="module"></script>
  <script src="../../packages/color/st-boot.js"></script>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
    }
  </style>
</head>
<body>
  <l-m src="./dialog.html"></l-m>
  <l-m src="../button/button.html"></l-m>
  <!-- 命令式工具预加载（坑 #6：页面模块内不能相对 import，须挂 window 供轮询） -->
  <script type="module">
    import alert from "./alert.js";
    import confirm from "./confirm.js";
    import prompt from "./prompt.js";
    window.alert = alert;
    window.confirm = confirm;
    window.prompt = prompt;
    window.__stDialogUtilsReady = true;
  </script>
  <o-page src="./page.html"></o-page>
</body>
</html>
