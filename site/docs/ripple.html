            <header class="doc-hero">
              <p class="doc-kicker">辅助 · 20 / 21</p>
              <h1>Ripple <code>st-ripple</code></h1>
              <p class="doc-lead">点击波纹组件：放进任意 position: relative 的父元素，点击该区域就会从指针处扩散一圈 currentColor。它不拦截交互、不改变布局，按钮与列表项已经内嵌，一般只在自定义容器里单独使用。</p>
              <div class="doc-links">
                <a href="../index.html">组件目录</a>
                <a href="https://github.com/ofajs/senti-ui/blob/main/packages/ripple/README.md" target="_blank" rel="noreferrer">GitHub README ↗</a>
              </div>
            </header>

            <section class="doc-section">
              <h2>基本用法：放进 relative 父元素</h2>
              <p class="doc-section-lead">唯一要求是父元素 position: relative（或 absolute）。st-ripple 自身绝对定位铺满父元素、pointer-events: none，不会挡住点击；波纹色取父元素文字色 currentColor，自动与任何配色协调。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>st-ripple</code></div>
                <div class="demo-stage" style="gap: 12px;">
                  <div on:click="basicClicks += 1" style="position: relative; width: 260px; height: 104px; display: grid; place-items: center; overflow: hidden; border-radius: 16px; cursor: pointer; background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); font-size: 13px; --st-ripple-opacity: 0.32;">
                    点我试试
                    <st-ripple></st-ripple>
                  </div>
                  <span class="demo-note">已点击 {{basicClicks}} 次 · 波纹从指针位置扩散，0.35s 后消失</span>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码</summary>
                <pre><code>&lt;div style="position: relative; width: 230px; height: 96px;
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);"&gt;
  点我试试
  &lt;st-ripple&gt;&lt;/st-ripple&gt;
&lt;/div&gt;</code></pre>
              </details>
            </section>

            <section class="doc-section">
              <h2>在自定义容器里：整行可点</h2>
              <p class="doc-section-lead">列表行、设置项、卡片都可以直接放 st-ripple。父元素负责圆角与 overflow，波纹会继承 border-radius 并自动裁剪；点击坐标相对父元素计算，行内文字与图标不干扰扩散。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>自定义行</code></div>
                <div class="demo-stage block">
                  <div style="width: 100%; max-width: 460px; overflow: hidden; border: 1px solid var(--md-sys-color-outline-variant); border-radius: 16px; background: var(--md-sys-color-surface-container-low); --st-ripple-opacity: 0.28;">
                    <div on:click="wifiOn = !wifiOn" style="position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; cursor: pointer;">
                      <span>Wi-Fi</span>
                      <span style="color: var(--md-sys-color-on-surface-variant); font-size: 12px;">{{wifiOn ? "已连接 ›" : "未连接 ›"}}</span>
                      <st-ripple></st-ripple>
                    </div>
                  </div>
                  <span class="demo-note">点击整行切换：{{wifiOn ? "已连接" : "未连接"}} · 波纹从点击位置扩散，父元素负责圆角与裁剪</span>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码（设置行）</summary>
                <pre><code>&lt;div on:click="openWifi()"
     style="position: relative; display: flex; justify-content: space-between;
            padding: 14px 16px; cursor: pointer;"&gt;
  &lt;span&gt;Wi-Fi&lt;/span&gt;
  &lt;span&gt;已连接 ›&lt;/span&gt;
  &lt;st-ripple&gt;&lt;/st-ripple&gt;
&lt;/div&gt;</code></pre>
              </details>
            </section>

            <section class="doc-section">
              <h2>键盘激活：从中心扩散</h2>
              <p class="doc-section-lead">键盘按 Enter / Space 产生的 click 没有坐标（detail 为 0），组件会改为从父元素中心扩散。用原生 button 或 st-button 承载焦点与键盘语义即可，st-ripple 本身不需要 tabindex。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>Enter / Space</code></div>
                <div class="demo-stage">
                  <button type="button" on:click="keyCount += 1" style="position: relative; width: 230px; height: 96px; overflow: hidden; border: 0; border-radius: 16px; cursor: pointer; background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); font: inherit; font-size: 13px; --st-ripple-opacity: 0.32;">
                    点我，或 Tab 后按 Enter / Space
                    <st-ripple></st-ripple>
                  </button>
                  <st-button style="--st-ripple-opacity: 0.32;" on:click="keyCount += 1">st-button 已内嵌波纹</st-button>
                  <span class="demo-note">激活 {{keyCount}} 次；按钮组件内的事件由 st-button 自己的 ripple 处理。</span>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码（可聚焦容器）</summary>
                <pre><code>&lt;button type="button" on:click="activate()"
        style="position: relative; overflow: hidden;"&gt;
  点我试试
  &lt;st-ripple&gt;&lt;/st-ripple&gt;
&lt;/button&gt;</code></pre>
              </details>
            </section>

            <section class="doc-section">
              <h2>颜色与透明度</h2>
              <p class="doc-section-lead">波纹没有 color 属性：颜色永远跟随父元素的 currentColor，组件里换 color 就换波纹色。透明度由皮肤 token --st-ripple-opacity 控制（默认 0.28），设为 0 就完全关闭；Apple 与 shadcn 皮肤默认关闭。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>currentColor / --st-ripple-opacity</code></div>
                <div class="demo-stage grid">
                  <div class="demo-cell">
                    <span class="demo-label">手动区域 · opacity 0.55</span>
                    <div on:click="colorPicks += 1" style="position: relative; height: 90px; display: grid; place-items: center; overflow: hidden; border-radius: 14px; cursor: pointer; background: var(--md-sys-color-surface-container-high); color: var(--md-sys-color-primary); font-size: 12.5px; --st-ripple-opacity: 0.55;">
                      强波纹
                      <st-ripple></st-ripple>
                    </div>
                  </div>
                  <div class="demo-cell">
                    <span class="demo-label">颜色跟随 currentColor</span>
                    <div class="row" style="justify-content: flex-start;">
                      <st-button color="primary" style="--st-ripple-opacity: 0.32;">Primary</st-button>
                      <st-button color="error" style="--st-ripple-opacity: 0.32;">Error</st-button>
                      <st-button color="success" style="--st-ripple-opacity: 0.32;">Success</st-button>
                    </div>
                  </div>
                  <div class="demo-cell">
                    <span class="demo-label">关闭 · --st-ripple-opacity: 0</span>
                    <div class="row" style="justify-content: flex-start;">
                      <st-button style="--st-ripple-opacity: 0;">无波纹</st-button>
                      <st-button variant="outlined" style="--st-ripple-opacity: 0;">无波纹</st-button>
                    </div>
                  </div>
                </div>
                <span class="demo-note" style="display: block; grid-column: 1 / -1;">手动区域点击 {{colorPicks}} 次；三个彩色按钮的波纹色来自各自的 color。关闭示例把变量设为 0，按钮仍在但不再产生波纹。</span>
              </div>
              <details class="snippet">
                <summary>示例代码</summary>
                <pre><code>&lt;div style="position: relative; color: var(--md-sys-color-primary);
            --st-ripple-opacity: 0.5;"&gt;
  文字色即波纹色
  &lt;st-ripple&gt;&lt;/st-ripple&gt;
&lt;/div&gt;

&lt;!-- 关闭波纹 --&gt;
&lt;div style="--st-ripple-opacity: 0;"&gt;...&lt;/div&gt;</code></pre>
              </details>
            </section>

            <section class="doc-section">
              <h2>嵌套组件：不会叠两层波纹</h2>
              <p class="doc-section-lead">父容器与内部组件都带波纹时，事件如果源自嵌套的自定义组件（st-button、st-list-item 等），外层的 st-ripple 会自动忽略，只保留内层组件自己的波纹，避免一次点击出现多层涟漪。</p>
              <div class="demo">
                <div class="demo-top"><span class="live"><i></i>LIVE</span><code>nested ripple</code></div>
                <div class="demo-stage block">
                  <div on:click="outerClicks += 1" style="position: relative; width: 100%; max-width: 460px; overflow: hidden; border: 1px solid var(--md-sys-color-outline-variant); border-radius: 18px; background: var(--md-sys-color-surface-container-low); padding: 16px; --st-ripple-opacity: 0.28;">
                    <p style="margin: 0 0 10px; color: var(--md-sys-color-on-surface-variant); font-size: 12px; line-height: 1.65;">这个外层容器也放了 st-ripple：点空白处出现外层波纹，点内部组件只有组件自己的波纹。</p>
                    <div class="row" style="justify-content: flex-start; margin-bottom: 12px;">
                      <st-button on:click="innerClicks += 1">内嵌按钮</st-button>
                      <st-button variant="outlined" on:click="innerClicks += 1">内嵌按钮</st-button>
                    </div>
                    <st-list style="width: 100%; max-width: 100%;">
                      <st-list-item button on:click="innerClicks += 1">
                        <span slot="prefix">🔔</span>通知<span slot="suffix">›</span>
                      </st-list-item>
                      <st-list-item button on:click="innerClicks += 1">
                        <span slot="prefix">🔒</span>隐私<span slot="suffix">›</span>
                      </st-list-item>
                    </st-list>
                    <st-ripple></st-ripple>
                  </div>
                  <span class="demo-note">内部组件点击 {{innerClicks}} 次 · 外层容器 click {{outerClicks}} 次（事件照常冒泡，但外层不再生成波纹）</span>
                </div>
              </div>
              <details class="snippet">
                <summary>示例代码</summary>
                <pre><code>&lt;div style="position: relative;"&gt;
  &lt;st-button&gt;内嵌按钮&lt;/st-button&gt;
  &lt;st-ripple&gt;&lt;/st-ripple&gt;
&lt;/div&gt;

&lt;!-- 点按钮：只有按钮的波纹；点空白：外层波纹 --&gt;</code></pre>
              </details>
            </section>

            <div class="doc-cols">
              <div class="doc-block">
                <h3>属性</h3>
                <table class="api">
                  <thead><tr><th>属性</th><th>类型</th><th>默认</th><th>说明</th></tr></thead>
                  <tbody>
                    <tr><td colspan="4">无语义属性：没有 disabled / color / variant，也没有事件或公开方法。</td></tr>
                    <tr><td><code>--st-ripple-opacity</code></td><td>number</td><td>0.28</td><td>CSS 变量 / 皮肤 token；0 关闭波纹</td></tr>
                  </tbody>
                </table>
              </div>
              <div class="doc-block">
                <h3>插槽 / 事件 / 注意</h3>
                <ul class="api-list">
                  <li>无插槽、无事件；波纹纯由父元素上的指针 / 键盘事件驱动，spawn 属于内部实现、不要依赖。</li>
                  <li>父元素必须 <code>position: relative</code>（或 absolute）；组件自身 <code>absolute; inset: 0; pointer-events: none</code>。</li>
                  <li>波纹色 = <code>currentColor</code>；默认透明度 0.28，可用 <code>--st-ripple-opacity</code> 调整或关闭。</li>
                  <li>鼠标/触摸从点击坐标扩散，直径覆盖到最远角，动画 0.35s 后移除。</li>
                  <li>键盘 Enter / Space 触发的 click 无坐标，从父元素中心扩散。</li>
                  <li>事件源自嵌套自定义组件时自动忽略，避免一次点击多层涟漪。</li>
                  <li>st-button / st-list-item / st-menu-item / st-tab-item / st-nav-item / st-split-button 已内嵌，通常不需要单独使用。</li>
                </ul>
              </div>
            </div>
