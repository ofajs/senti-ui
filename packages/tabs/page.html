<!-- st-tab-bar 验收页，由同目录 index.html 通过 <o-page> 加载 -->
<template page>
  <style>
    :host { display: grid; gap: 24px; padding: 40px; align-content: start; }
    h3 { margin: 0; font-size: 14px; color: var(--md-sys-color-on-surface-variant); }
    .panel { padding: 16px; color: var(--md-sys-color-on-surface-variant); }
  </style>

  <h3>点击切换（指示条动画跟随，禁用项不可选）</h3>
  <st-tab-bar id="bar">
    <st-tab-item active><span slot="icon">📧</span>邮件</st-tab-item>
    <st-tab-item><span slot="icon">📞</span>通话</st-tab-item>
    <st-tab-item><span slot="icon">⭐</span>收藏</st-tab-item>
    <st-tab-item disabled><span slot="icon">💬</span>聊天（禁用）</st-tab-item>
  </st-tab-bar>

  <div class="panel">当前页：{{current}}</div>

  <h3>等比缩放（font-size 12px）</h3>
  <st-tab-bar id="bar-sm" style="font-size: 12px;">
    <st-tab-item active>A</st-tab-item>
    <st-tab-item>B</st-tab-item>
    <st-tab-item>C</st-tab-item>
  </st-tab-bar>

  <script>
    export default async () => ({
      data: { current: "邮件" },
      ready() {
        const sr = this.ele.shadowRoot;
        sr.querySelectorAll("#bar st-tab-item").forEach((item) => {
          item.addEventListener("click", () => {
            if (item.hasAttribute("disabled")) return;
            sr.querySelectorAll("#bar st-tab-item").forEach((t) => t.removeAttribute("active"));
            item.setAttribute("active", "");
            this.current = item.textContent.trim();
          });
        });
      },
      proto: {},
    });
  </script>
</template>
