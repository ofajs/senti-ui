<!--
  st-menu — Senti-UI 下拉菜单组件（基于 ofa.js）
  语义属性：align（left|right，面板与触发器的对齐）；open 为运行时状态（el.open 读写/JS 控制）
  trigger 插槽为触发器；菜单项为 light DOM 的 st-menu-item；点击外部/Escape/选中后自动关闭，见 README.md
-->
<template component>
  <style>
    :host {
      position: relative;
      display: inline-flex;
      vertical-align: middle;
      font-size: 14px;
      line-height: 1.2;
      font-family: inherit;
      color: var(--md-sys-color-on-surface);
    }

    .trigger {
      display: flex;
    }

    /* 面板 fixed 定位（JS 计算位置，翻转避让视口），弹层不随滚动裁剪 */
    .panel {
      display: none;
      position: fixed;
      left: 0;
      top: 0;
      box-sizing: border-box;
      min-width: 8em; /* 112px */
      max-height: 80vh;
      overflow-y: auto;
      padding: 0.286em;
      border-radius: 0.857em; /* 12px */
      background: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface);
      box-shadow: 0 0.071em 0.143em rgba(0, 0, 0, 0.3), 0 0.143em 0.429em 0.143em rgba(0, 0, 0, 0.15);
      z-index: 1000;
      transform-origin: 50% 0;
      animation: st-menu-in 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    /* 关闭过渡 */
    .panel.closing {
      pointer-events: none;
      opacity: 0;
      transform: translateY(-0.429em) scale(0.98);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    @keyframes st-menu-in {
      from { opacity: 0; transform: translateY(-0.429em) scale(0.98); }
      to { opacity: 1; transform: none; }
    }

    ::slotted(hr) {
      display: block;
      width: 100%;
      margin: 0.286em 0;
      border: none;
      border-top: 1px solid var(--md-sys-color-outline-variant);
    }

    @media (prefers-reduced-motion: reduce) {
      .panel { animation: none; transition: none; }
    }

    l-m { display: none; }
  </style>

  <l-m src="./menu-item.html"></l-m>

  <div class="trigger"><slot name="trigger"></slot></div>
  <div class="panel"><slot></slot></div>

  <script>
    import "../color/st-init.js";
    export default async () => ({
      tag: "st-menu",
      attrs: {
        align: "right",
      },
      data: {
        open: false,
      },
      watch: {
        open(val) {
          // watch 初始化也会以初始值触发一次（坑 #27），首次调用只记录状态、不派发事件
          if (this._openInited === undefined) {
            this._openInited = true;
            return;
          }
          const panel = this.ele.shadowRoot.querySelector(".panel");
          if (val) {
            // 先渲染再定位，避免闪烁；重新打开时取消关闭过渡并重启进入动画
            clearTimeout(this._closeTimer);
            panel.classList.remove("closing");
            panel.style.display = "block";
            this.updatePosition();
            this.bindDocEvents();
            this.ele.dispatchEvent(new Event("open", { bubbles: true, composed: true }));
          } else {
            // 关闭：先做退出过渡，再隐藏
            panel.classList.add("closing");
            clearTimeout(this._closeTimer);
            this._closeTimer = setTimeout(() => {
              panel.style.display = "none";
              panel.classList.remove("closing");
            }, 180);
            this.unbindDocEvents();
            this.ele.dispatchEvent(new Event("close", { bubbles: true, composed: true }));
          }
        },
      },
      ready() {
        const ele = this.ele;
        const sr = ele.shadowRoot;

        // 点击触发器切换
        sr.querySelector(".trigger").addEventListener("click", () => {
          this.open = !this.open;
        });

        // 菜单内任意点击后自动关闭（不阻止冒泡，菜单项 click 正常传出）
        sr.querySelector(".panel").addEventListener("click", () => {
          if (this.open) this.open = false;
        });

        this._onDocPointerDown = (e) => {
          // 坑 #21：composed 事件必须用 composedPath 判断，contains 会误判
          if (e.composedPath().includes(ele)) return;
          this.open = false;
        };
        this._onDocKeydown = (e) => {
          if (e.key === "Escape" && this.open) this.open = false;
        };
        this._onReposition = () => this.updatePosition();
      },
      detached() {
        clearTimeout(this._closeTimer);
        this.unbindDocEvents();
      },
      proto: {
        updatePosition() {
          if (!this.open) return;
          const ele = this.ele;
          const panel = ele.shadowRoot.querySelector(".panel");
          const rect = ele.getBoundingClientRect();
          const panelW = panel.offsetWidth;
          const panelH = panel.offsetHeight;
          const vw = window.innerWidth;
          const vh = window.innerHeight;
          const margin = 8;
          const gap = 4;

          let left =
            (this.align || "right") === "left"
              ? rect.left
              : rect.right - panelW;
          left = Math.max(margin, Math.min(left, vw - panelW - margin));

          let top = rect.bottom + gap;
          if (top + panelH > vh - margin) {
            // 下方空间不足时翻转到上方
            const topAbove = rect.top - panelH - gap;
            top = topAbove >= margin ? topAbove : Math.max(margin, vh - panelH - margin);
          }

          panel.style.left = left + "px";
          panel.style.top = top + "px";
          panel.style.minWidth = Math.max(rect.width, 112) + "px";
        },
        bindDocEvents() {
          if (this._docBound) return;
          document.addEventListener("pointerdown", this._onDocPointerDown, true);
          document.addEventListener("keydown", this._onDocKeydown, true);
          window.addEventListener("resize", this._onReposition, true);
          document.addEventListener("scroll", this._onReposition, true);
          this._docBound = true;
        },
        unbindDocEvents() {
          if (!this._docBound) return;
          document.removeEventListener("pointerdown", this._onDocPointerDown, true);
          document.removeEventListener("keydown", this._onDocKeydown, true);
          window.removeEventListener("resize", this._onReposition, true);
          document.removeEventListener("scroll", this._onReposition, true);
          this._docBound = false;
        },
      },
    });
  </script>
</template>
