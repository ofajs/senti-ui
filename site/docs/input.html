              <h1>Input <code>st-input</code></h1>
              <p class="doc-lead">单行输入框：outlined / filled 两种类型，前后缀插槽与原生 type。value 是运行时状态，初始值用 default-value；focus 描边与 caret 由 color 语义色控制。</p>

            <section class="doc-section">

              <p class="doc-section-lead">outlined 有完整一圈描边，适合常规表单；filled 用容器底色加底边线，视觉更轻。两者共享同一套高度、内边距与 focus 动画，只切换材质。</p>

                      {{codeView.demo1 ? '查看示例' : '查看代码'}}
                    </st-button>
                  </div>

              <p class="doc-section-lead">页面里用 <code>sync:value</code> 把 data 与运行时值双向绑定；<code>focus()</code> / <code>blur()</code> 是组件方法，清空只需把 data 置空。这样值始终是唯一数据源，不需要直接碰内部原生 input。</p>

                <table class="api">
                  <thead><tr><th>属性</th><th>类型</th><th>默认</th><th>说明</th></tr></thead>
                  <tbody>
                    <tr><td><code>variant</code></td><td>"outlined" | "filled"</td><td>"outlined"</td><td>M3 两种输入框类型</td></tr>
                    <tr><td><code>default-value</code></td><td>string</td><td>无</td><td>初始值；attached 时读取一次</td></tr>
                    <tr><td><code>placeholder</code></td><td>string</td><td>无</td><td>占位文本，转发内部 input</td></tr>
                    <tr><td><code>type</code></td><td>"text" | "password" | "email" | "number" | …</td><td>"text"</td><td>原生 input 类型</td></tr>
                    <tr><td><code>color</code></td><td>M3 角色名 / 自定义变量名</td><td>无</td><td>caret 与 focus 描边色</td></tr>
                    <tr><td><code>disabled</code></td><td>boolean</td><td>无</td><td>0.38 透明度，阻断聚焦与输入</td></tr>
                    <tr><td><code>readonly</code></td><td>boolean</td><td>无</td><td>可聚焦、不可修改</td></tr>
                  </tbody>
                </table>
              </div>
              <div class="doc-block">
                <h3>插槽 / 事件 / 注意</h3>
                <ul class="api-list">
                  <li>插槽：<code>prefix</code> / <code>suffix</code> 放图标或操作。</li>
                  <li>事件：<code>input</code> / <code>change</code>；change 已转发为 composed，可直接在宿主监听。</li>
                  <li>方法：<code>focus()</code> / <code>blur()</code>；焦点在内部透明原生 input 上。</li>
                  <li><code>value</code> 是运行时 property：ofa 页面用 <code>sync:value</code> 双向绑定，纯 JS 用 <code>el.value</code> 读写；<code>setAttribute("value")</code> 无效，初始值用 <code>default-value</code>。</li>
                  <li>默认高度 <code>2.857em</code>、最小宽 <code>13.571em</code>；改 <code>font-size</code> 等比缩放。</li>
                </ul>
              </div>
            </div>

            demo4Code: "<div class=\"demo-cell\">\n                    <span class=\"demo-label\">disabled</span>\n                    <st-input default-value=\"不可编辑\" disabled></st-input>\n                  </div>\n                  <div class=\"demo-cell\">\n                    <span class=\"demo-label\">disabled + filled</span>\n                    <st-input variant=\"filled\" placeholder=\"禁用填充态\" disabled></st-input>\n                  </div>\n                  <div class=\"demo-cell\">\n                    <span class=\"demo-label\">readonly</span>\n                    <st-input default-value=\"只读内容，可聚焦复制\" readonly></st-input>\n                  </div>",
            demo5Code: "<div class=\"demo-cell\">\n                    <span class=\"demo-label\">error</span>\n                    <st-input color=\"error\" default-value=\"必填项不能为空\"></st-input>\n                  </div>\n                  <div class=\"demo-cell\">\n                    <span class=\"demo-label\">success</span>\n                    <st-input color=\"success\" default-value=\"校验通过\"></st-input>\n                  </div>\n                  <div class=\"demo-cell\">\n                    <span class=\"demo-label\">实时邮箱校验</span>\n                    <st-input attr:color=\"emailColor\" on:input=\"checkEmail\" placeholder=\"输入邮箱试试\"></st-input>\n                  </div>",
            demo6Code: "<div style=\"display: grid; gap: 10px; width: 100%; max-width: 420px;\">\n                    <st-input id=\"query-input\" sync:value=\"query\" placeholder=\"输入关键字，值会同步到下方\"></st-input>\n                    <div class=\"row\" style=\"justify-content: flex-start;\">\n                      <st-button variant=\"outlined\" on:click=\"focusQuery\">focus()</st-button>\n                      <st-button variant=\"outlined\" on:click=\"blurQuery\">blur()</st-button>\n                      <st-button variant=\"text\" on:click=\"clearQuery\">清空</st-button>\n                    </div>\n                    <span class=\"demo-note\" style=\"text-align: left;\">value = {{query ? query : '（空）'}} · 状态：{{focusState}}</span>\n                  </div>",
            showPwd: false,
            emailColor: "",
            emailHint: "输入邮箱开始校验",
            query: "",
            focusState: "未聚焦",
          },
          proto: {
            toggleCode(key) {
              this.codeView[key] = !this.codeView[key];
            },
            checkEmail(e) {
              const v = e.target.value.trim();
              if (!v) {
                this.emailColor = "";
                this.emailHint = "输入邮箱开始校验";
                return;
              }
              const at = v.indexOf("@");
              const ok = at > 0 && v.indexOf(".", at) > at + 1 && !v.includes(" ");
              this.emailColor = ok ? "success" : "error";
              this.emailHint = ok ? "格式有效" : "邮箱格式不正确";
            },
            focusQuery() {
              this.ele.shadowRoot.querySelector("#query-input").focus();
              this.focusState = "已聚焦";
            },
            blurQuery() {
              this.ele.shadowRoot.querySelector("#query-input").blur();
              this.focusState = "已失焦";
            },
            clearQuery() {
              this.query = "";
              this.focusState = "已清空";
            },
          },
        });
      </script>
    </template>
  </o-app>
