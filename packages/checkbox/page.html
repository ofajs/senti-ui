<!-- st-checkbox 验收页，由同目录 index.html 通过 <o-page> 加载 -->
<template page>
  <style>
    :host { display: grid; gap: 20px; padding: 40px; align-content: start; }
    section { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
    h3 { margin: 0; font-size: 14px; color: var(--md-sys-color-on-surface-variant); width: 100%; }
  </style>

  <section>
    <h3>基础</h3>
    <st-checkbox>苹果</st-checkbox>
    <st-checkbox checked>香蕉（初始选中）</st-checkbox>
    <st-checkbox disabled>樱桃（禁用）</st-checkbox>
    <st-checkbox disabled checked>西瓜（禁用+选中）</st-checkbox>
    <st-checkbox indeterminate>全选（不确定态）</st-checkbox>
    <st-checkbox></st-checkbox>
  </section>

  <section>
    <h3>color 属性</h3>
    <st-checkbox color="error" checked>错误色</st-checkbox>
    <st-checkbox color="success" checked>成功色</st-checkbox>
    <st-checkbox color="tertiary" checked>三级色</st-checkbox>
  </section>

  <section>
    <h3>等比缩放（宿主 font-size）</h3>
    <st-checkbox style="font-size: 12px;" checked>12px</st-checkbox>
    <st-checkbox checked>14px</st-checkbox>
    <st-checkbox style="font-size: 20px;" checked>20px</st-checkbox>
  </section>

  <section>
    <h3>数据绑定（attr:checked，页面数据驱动）</h3>
    <st-checkbox attr:checked="agree" on:change="agree = !agree">同意协议</st-checkbox>
    <span class="state">agree 数据：<span class="code" style="font-family: ui-monospace, monospace;">{{agree}}</span></span>
  </section>

  <section>
    <h3>JS 主动操作（setAttribute / removeAttribute）</h3>
    <st-checkbox id="js-cb">JS 控制</st-checkbox>
    <st-button variant="outlined" on:click="jsCheck">选中</st-button>
    <st-button variant="outlined" on:click="jsInd">设为不确定态</st-button>
    <st-button variant="text" on:click="jsClear">清空</st-button>
  </section>

  <section>
    <h3>聚焦与键盘</h3>
    <p style="margin:0; font-size:13px; color: var(--md-sys-color-on-surface-variant);">
      <span class="code" style="font-family: ui-monospace, monospace;">Tab</span> 聚焦（focus-visible 有焦圈）、<span class="code" style="font-family: ui-monospace, monospace;">Space</span> 切换；点文字同样可切换
    </p>
  </section>

  <section>
    <h3>change 事件计数：<span class="code" style="font-family: ui-monospace, monospace;">{{count}}</span></h3>
    <st-checkbox on:change="onCountChange">点我</st-checkbox>
  </section>

  <script>
    export default async () => ({
      data: { count: 0, agree: false },
      proto: {
        onCountChange() {
          this.count += 1;
        },
        jsCheck() { this.ele.shadowRoot.querySelector("#js-cb").setAttribute("checked", ""); },
        jsInd() { this.ele.shadowRoot.querySelector("#js-cb").setAttribute("indeterminate", ""); },
        jsClear() {
          const cb = this.ele.shadowRoot.querySelector("#js-cb");
          cb.removeAttribute("checked");
          cb.removeAttribute("indeterminate");
        },
      },
    });
  </script>
</template>
