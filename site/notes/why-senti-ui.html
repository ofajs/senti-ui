          <h1>为什么要开发 Senti-UI</h1>
          <p class="lead">
            过去，前端框架帮我们省下组件开发时间，也替我们决定了界面长什么样。
            AI 让重新开发变得划算之后，缺的是一套不会随风格漂移的组件使用方式。
          </p>
          <div class="note-meta">
            <span class="tag">设计理念</span>
            <span>2026-11-01</span>
            <span class="divider" aria-hidden="true"></span>
            <span>约 4 分钟</span>
          </div>
        </header>

        <div class="note-body">
          <p>
            过去开发一个应用，选一套开源前端框架，主要图省时间：按钮、表单、弹窗都是现成的，
            团队把精力放在业务上。代价是接受框架的设计语言。
          </p>

          <h2><span class="num">01</span>过去，用框架换时间</h2>
          <p>
            框架带来的不只是组件，还有一整套审美：圆角多大、间距多密、阴影多厚、
            交互反馈是什么节奏。当公司有明确的 VI，这套语言很容易显得格格不入。
          </p>
          <p>
            换主题通常只能改颜色，结构、密度和状态反馈仍然是框架的。要做真正贴合品牌的界面，
            最后还是得逐个组件改。
          </p>

          <h2><span class="num">02</span>AI 让“重新开发”第一次划算</h2>
          <p>
            AI 改变了成本结构。现在可以让 AI 从零写一套更贴合 VI 的界面，
            不必被困在第三方框架的视觉体系里。
          </p>
          <p>
            但能写出来，不等于写得一致。AI 实现组件时会参考不同的框架：按钮学一套，
            菜单学另一套，表单校验又是第三种。单页看没问题，项目一大，交互习惯就开始分裂。
          </p>

          <h2><span class="num">03</span>缺的不是组件，是统一的行为</h2>
          <p>
            组件可以长得不一样，行为必须一样：按钮怎么禁用、输入框怎么报错、菜单怎么关闭、
            弹窗打开后焦点怎么还。如果这些细节每次都由 AI 即兴决定，团队就要反复 review
            本应标准化的地方，AI 也会在不同项目里形成不同的“习惯”。
          </p>
          <p>风格可以定制，习惯不应该。</p>

          <blockquote>
            <p>行为是共用的，VI 是自己的。</p>
            <cite>Senti-UI 的基本假设</cite>
          </blockquote>

          <h2><span class="num">04</span>Senti-UI：行为统一，皮肤开放</h2>
          <p>
            所以 Senti-UI 只固定一件事：组件的使用方式。标签、属性、插槽、事件和状态在所有项目里
            保持一致，视觉则通过皮肤和原生 CSS 暴露给使用者。
          </p>
          <ul>
            <li><strong>一套 API</strong>：<code>st-*</code> 组件用 <code>variant</code> / <code>disabled</code> / <code>loading</code> / <code>color</code> 表达状态。</li>
            <li><strong>一套行为</strong>：键盘、焦点、校验、弹层位置和关闭逻辑都遵循同一份契约。</li>
            <li><strong>一套颜色角色</strong>：颜色只走 M3 角色，品牌色通过种子色映射进来。</li>
            <li><strong>一套材质入口</strong>：<code>data-skin</code> 与 <code>--st-*</code> token 承载 VI 差异，样式写在皮肤 CSS 里。</li>
          </ul>
          <p>换一套 VI，不需要重写组件，只需要换一层皮肤。</p>

          <h2><span class="num">05</span>更适合 AI 的前端框架</h2>
          <p>
            从 AI 的视角看，Senti-UI 不只是一套组件，而是一套更容易被正确使用的前端框架：
            API 面积小、文档自包含、定制边界清楚。AI 不用先猜项目用了哪套约定，
            也不必反复实现同一批基础行为。
          </p>
          <p>接入一套新 VI 时，流程可以变成：</p>
          <ol class="principles">
            <li>
              <b>01 / 定 VI</b>
              <span>先确定主色、字体、圆角、密度与材质倾向，而不是先选一个现成框架。</span>
            </li>
            <li>
              <b>02 / 写皮肤</b>
              <span>颜色映射到 M3 角色，圆角、密度、描边和模糊写进皮肤 token。</span>
            </li>
            <li>
              <b>03 / 用组件</b>
              <span>后续页面只使用 <code>st-*</code>，不再重复实现按钮、表单和弹窗。</span>
            </li>
          </ol>
          <p>
            风格差异被压缩到一份很小的皮肤代码里，使用习惯完全一致。之后新增页面，
            AI 不需要重新学习另一套组件，也不会因为换了页面就换一种交互方式。
          </p>
          <p>
            这也是为什么 Senti-UI 不追求固定的“一套好看设计”。它更像 AI 的组件底座：
            行为稳定，样式随 VI 变化。
          </p>
          <p>
            过去，框架替我们省下组件开发时间，也替我们决定了长什么样。现在，
            AI 可以把外观重新做对；Senti-UI 负责让行为不再重来一遍。
          </p>
          <p><strong>行为统一，VI 自由。</strong></p>
        </div>
